pbook.","d_vinculo":"los dos alumnos con dificultades clasifican triángulos con el tangram y leen la obra teatral en lectura fácil; el alumno con TDAH la ensaya por pasos, con una agenda visual; y la alumna de compensatoria aprende el vocabulario del museo con un glosario visual y busca las fotografías en el centro con su compañera tutora.","d_sda":"el alumno con TDAH, encargado del material, monta la maqueta por pasos; los alumnos con dificultades parten de un boceto modelo; y la alumna de compensatoria se apoya en imágenes del Centro Pompidou.","n_criterios":"catorce","e_inicial":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, el boceto, con escala del 3.1.a de Conocimiento del Medio; en la segunda, la maqueta terminada, con rúbrica del 3.1.a; y en la tercera, la presentación oral, con rúbrica del 9.1.a.","e_criterios":"con rúbrica, el festival, 4.3.a de Educación Artística; con escala de observación, la dramatización y el debate, 3.2.a y 10.2.a de Lengua; con lista de cotejo, el andaluz y los cuentos, 1.2.a y 8.3.a, y los polígonos, los problemas, el perímetro y la figura, 6.1.a, 3.2.a, 5.1.a y 4.1.a de Matemáticas; con el porfolio, el texto teatral, 5.1.a de Lengua, y el personaje, 7.2.a de Conocimiento del Medio; y con el anecdotario, la cooperación, 8.1.a.","e_coevaluacion":"cada equipo valora con una lista de cotejo su trabajo en la maqueta, y coevaluamos la dramatización de otro equipo.","e_diversidad":"si a un alumno le cuesta clasificar triángulos, la medida es manipularlos con el tangram junto a un compañero tutor; si ya lo hace con ayuda, la valoro con un 4.","producto_proyecto":"la decoración y presentación del lapbook del proyecto, que da nombre a esta unidad","conclusion_ud":"En definitiva, mi alumnado no solo dramatiza teatro o traza circunferencias con el compás: descubre las huellas del pasado y, con su maqueta, aprende a valorar y cuidar el patrimonio.","siguiente_ud":"cuarto de Primaria, donde estos equipos seguirán explorando la historia y el patrimonio de Andalucía","ods_corto":"el ODS 16"}}],"fichas":[{"numero":1,"titulo":"Somos un equipo","trimestre":1,"fechas":"Del 10 al 27 de septiembre","dias":14,"centroInteres":"El trabajo en equipo.","relevanciaSocial":"Beneficios del trabajo cooperativo para desarrollar habilidades sociales, la empatía la resolución pacífica de conflictos. Decreto 101/2023.","ods":["ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Somos un equipo","producto":"Cartel para definir las normas de colaboración."},"proyecto":{"nombre":"¡Sí, chef!","producto":"Entrevista a un familiar para el recetario andaluz."},"aps":{"nombre":"Opera prima","producto":"Informe sobre la técnica de animación de Stop Motion."}},"objetivosEtapa":["a","d","e","g","h","j","ñ"],"objetivosAprendizaje":["1. Conocer y producir textos literarios. Contar y escribir adivinanzas.","2. Utilizar los conocimientos básicos sobre la lengua: la letra, la sílaba, la palabra y la oración, el abecedario y el diccionario.","3. Descomponer, componer y redondear números de tres y cuatro cifras.","4. Identificar y nombrar los números ordinales para ordenar elementos en diferentes contextos.","5. Utilizar estrategias para realizar trabajos de forma individual y en equipo con mediación.","6. Conocer las manifestaciones artísticas más importantes de las distintas épocas, lugares y estilos."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-4), CD (1-2-5), CPSAA (1-2-3), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"1","texto":"Reconocer y valorar la diversidad lingüística del mundo como fuente de riqueza cultural."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"6","texto":"Buscar información procedente de dos o más fuentes para transformarla en conocimiento."},{"num":"7","texto":"Leer de manera autónoma para iniciar el gusto y la construcción de la identidad lectora."}],"criterios":[{"codigo":"1.3.a","texto":"Reconocer rasgos de la lingüística andaluza"},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"6.1.a","texto":"Localizar información para la investigación"},{"codigo":"7.1.a","texto":"Leer de manera autónoma o acompañada."}],"saberes":[{"codigo":"2.A.2","texto":"La diversidad lingüística andaluza."},{"codigo":"2.B.3.4","texto":"Comprensión lectora: ideas principales."},{"codigo":"2.B.3.5","texto":"Producción escrita."},{"codigo":"2.B.3.6","texto":"Alfabetización mediática: búsqueda guiada."},{"codigo":"2.C.1","texto":"Fragmentos de la literatura infantil y popular."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"1","texto":"Interpretar situaciones de la vida cotidiana para analizar la información más relevante."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"5","texto":"Reconocer y utilizar conexiones entre diferentes ideas matemáticas."},{"num":"6","texto":"Comunicar de forma individual y colectiva procedimientos y resultados matemáticos."},{"num":"7","texto":"Gestionar emociones al enfrentarse a retos matemáticos para disfrutar del aprendizaje."}],"criterios":[{"codigo":"1.1.a","texto":"Comprender problemas de la vida cotidiana"},{"codigo":"4.1.a","texto":"Utilizar el pensamiento computacional."},{"codigo":"5.1.a","texto":"Realizar conexiones matemáticas."},{"codigo":"6.2.a","texto":"Explicar procesos matemáticos sencillos."},{"codigo":"7.1.a","texto":"Identificar las emociones al abordar retos."}],"saberes":[{"codigo":"2.A.2.1","texto":"Orden de magnitud de los números."},{"codigo":"2.D.4.1","texto":"Interpretación de algoritmos sencillos."},{"codigo":"2.C.4.3","texto":"Relaciones geométricas matemáticas."},{"codigo":"2.A.2.3","texto":"Representación de la recta numérica."},{"codigo":"2.E.1.1","texto":"Tolerancia ante la frustración."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"1","texto":"Utilizar recursos digitales para buscar información de manera individual y en equipo."},{"num":"8","texto":"Reconocer la igualdad de género para contribuir al bienestar individual y colectivo."}],"criterios":[{"codigo":"1.1.a","texto":"Utilizar recursos digitales de forma segura."},{"codigo":"8.1.a","texto":"Valorar la diversidad cultural y la igualdad de género."}],"saberes":[{"codigo":"2.C.1.3","texto":"Dispositivos digitales."},{"codigo":"2.C.3.1","texto":"Normas para la vida en sociedad"}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"1","texto":"Descubrir propuestas artísticas de diferentes géneros, estilos, épocas."}],"criterios":[{"codigo":"1.1.a","texto":"identificar propuestas artísticas de diferentes géneros, estilos y culturas"}],"saberes":[{"codigo":"2.A.2","texto":"Recepción activa de propuestas artísticas."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho una conversación. La lengua oral y escrita. C.EV.1.3.a. (M) Leo un cuento. Los duendes y el zapatero. Antes de leer. Lee el título y observa la ilustración. Vocabulario. Comprendo la lectura. Piensa en otro final. (X) Capítulo del libro. Vocabulario. El abecedario. El diccionario. (J) Cuenta cuentos. Las adivinanzas. Inventa, crea y memoriza una adivinanza sobre una profesión. Competición por equipos. (V) Dramatizaciones. Textos tradicionales. Lee las estrofas de la canción tradicional la Tarara e inventa dos más. Leer y valorar.","MAT":"(L) Los números de tres cifras. Lectura de números. Escritura de números en cifras y en letras. (M) Problemas exprés. (X) Resolución de problemas. Contar hacia delante y hacia atrás. Contar más allá del número 999. Contar decenas y centenas. C.EV.1.1.a. (J) Identificar números con bloques base 10. Utiliza los bloques para representar los números. Identifica el valor de una cifra. Pasar de centenas a decenas y unidades. (V) Concurso de problemas. Por equipos, inventamos y resolvemos problemas.","CMN":"(J) Vídeo ¿Qué es el método científico? Realizamos un esquema con los pasos del método científico. (V) ¿Cómo podemos trabajar de forma cooperativa? División del grupo por equipos heterogéneos y asignación de roles. SdA. UD. Somos un equipo. Producto. Cartel para definir las normas de colaboración. C.EV. 1.1.a.","EAR":"(V) Los materiales de plástica. Crea a tu manera, las letras tridimensionales. C.EV.1.1.a"},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. La letra, la sílaba, la palabra y la oración. (M) Leo un cuento tradicional. C.EV.7.1.a. Preparamos un listado de los cuentos tradicionales. C.EV.5.1.a. (X) Capítulo del libro. Escribo un cuento siguiendo los pasos. (J) Cuenta cuentos. Clases de palabras según el número de sílabas. (V) Dramatizaciones de cuentos. Elaboración de un esquema sobre las clases de palabras. Jugar a palabras encadenadas.","MAT":"(L) Los números de cuatro cifras. El número mil. Lectura de números de cuatro cifras. Conteo de centenas. (M) Problemas exprés. (X) Resolución de problemas. Series de 10 en 10, de 100 en 100, de 1000 en 1000. Equivalencia entre unidades de millar, centenas, decenas y unidades. (J) Identificar números con bloques base 10. Identifica el valor de una cifra. Pasar de centenas a decenas y unidades. (V) Concurso de problemas. Cálculo mental. Sumar una cifra sin llevadas. C.EV.6.2.a.","CMN":"(J) ¿Conoces algún científico o científica? Explica a la clase quien es y lo que hace. Haz un dibujo de cómo te lo imaginas (V) SdA. UD. Somos un equipo. Producto. Cartel para definir las normas de colaboración. Escribe las normas, corrige, revisa y haz los cambios necesarios. C.EV.1.1.a.","EA e la naturaleza."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"2","texto":"Investigar diferentes manifestaciones artísticas para disfrutar de ellas."}],"criterios":[{"codigo":"2.1.a","texto":"Identificar estrategias para la búsqueda de información."}],"saberes":[{"codigo":"2.A.4","texto":"Vocabulario específico en las artes plásticas, visuales y audiovisuales."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho una exposición. La exposición oral. Esquema. (M) Leo un texto expositivo. El Ogro. Lee el texto. Observa las imágenes. Vocabulario. Comprendo la lectura. (X) Capítulo del libro. Vocabulario. En grupo, busca información sobre una ONG que luche contra el hambre. C.EV.6.1.a. Taller de escritura. Escribimos los pasos para hacer una exposición oral y exponer al grupo. (J) Cuenta cuentos. Vocabulario. Debate sobre cómo se podría acabar con el hambre en el mundo. Las siglas. Los puntos suspensivos. (V) Exposiciones orales. C.EV.2.1.a.","MAT":"(L) Sumar por descomposición. Suma de números de tres cifras con y sin llevadas. Utiliza los bloques para calcular. C.EV.4.2.a. (M) Problemas exprés. (X) Resolución de problemas. Sumo en vertical. Colocación de sumandos. Propiedades de la suma. Inventa una suma y resuélvela. (J) Propiedad conmutativa. Suma de tres sumandos. Coloca los sumandos y suma. (V) Concurso de problemas. Inventamos y resolvemos problemas. C.EV.2.1.a.","CMN":"(J) Lluvia de ideas sobre las plantas. Clasificamos seres vivos según sus características. Realizamos un esquema de las funciones vitales de los seres vivos. (V) SdA. UD. SdA. UD. Guía de las plantas que nos rodean. Elabora una ficha con cada planta que has recogido de tu barrio. Dibuja la planta, escribe las partes y describela. ¿Qué tipo de planta es? ¿Qué nos aporta? C.Ev.6.1.a.","EAR":"(V) Video. Crea a tu manera. Los dibujos esquemáticos."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Exposiciones orales. (M) Leo un cuento actual. Cambia el final del cuento. C.EV.8.3.a. Los cuentos en la actualidad. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribimos los pasos para hacer una exposición oral y exponer al grupo C.EV.5.1.a. (J) Cuenta cuentos. Las palabras derivadas. Los sufijos. (V) Dramatizaciones de cuentos. Los prefijos in- y des-. Busca palabras con prefijos y escribe una oración.","MAT":"(L) Las propiedades de la suma. La propiedad conmutativa y asociativa. Realiza las sumas. (M) Problemas exprés. (X) Resolución de problemas. Restas por descomposición. Resta sin llevadas y con llevadas. Utiliza los bloques para calcular. (J) Resto en vertical. Términos de la resta. Restas con y sin llevadas. Colocar la resta en forma vertical. Propiedad del minuendo. (V) Concurso de problemas. Cálculo mental. Sumar una cifra sin llevadas. C.EV.6.2.a","CMN":"(J) ¿Cómo son las plantas? Dibuja en tu cuaderno una planta con flor, escribe y aprende sus partes. (V) SdA. UD. Guía de las plantas que nos rodean. Elaboramos fichas de alimentos que obtengamos de las plantas, hacemos el dibujo, ¿Qué parte de la planta utilizamos? ¿Qué nos aporta? Hacemos la guí de las planta. C.Ev 5.1.a.","EAR":"(V) Velázquez. Audioguía de las meninas. Láminas para colorear, componer. C.EV.2.1.a."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Los párrafos. (M) Leo un texto. La mayúscula. Tipos de punto. Coloca la mayúscula en el texto. (X) Capítulo del libro. C.EV.4.1.a. En grupos, redacta un cuento actual. (J) Leo mi cuento. Elaboración de un esquema sobre las palabras derivadas. (V) Leo el texto. Dictado en parejas. Cada niño dictará un párrafo del texto. La otra persona deberá escribirlo. Intercambio de cuadernos para corregir.","MAT":"(L) Prueba de la resta. Relación suma y resta. C.EV.5.2.a. Calcula y comprueba las restas. (M) Problemas exprés. (X) Resolución de problemas. Las monedas y los billetes. Uso del dinero. Equivalencia de monedas y billetes de una cantidad. (J) ¡El precio justo! Organizad un mercadillo en clase con objetos que ya no uses. ¡Somos compradores y vendedores! (V) Concurso de problemas. Pienso paso a paso. Ordena las instrucciones de comprar una barra de pan. C.EV.8.1.a.","CMN":"(J) Investiga y explica la diferencia entre fotosíntesis y respiración. Realiza un esquema sobre la reproducción de las plantas. Estudia el esquema. (V) SdA. Proyecto. ¡Si chef! Producto. Presentación de una receta. Recetario andaluz. C.Ev. 2.2.a.","EAR":"APS. Opera prima Producto. Guión para el corto de animación. Resolución de conflictos."}],"complementaria":"SdA 16 de octubre. Día Mundial de la alimentación. Recogida de alimentos ONG.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias.","materiales":"Material fungible, prensa, textos cotidianos, policubos, monedas."},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo. Utilización del feedback."],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de re .EV.8.2.a.","CMN":"(J) ¿Qué aparatos del cuerpo humano expulsan sustancias de desecho al exterior? Explica las funciones vitales. Dibuja en el cuaderno nuestros aparatos para realizar la función de nutrición y muéstralo a los compañeros. C.Ev. 4.1.a. (V) SdA. UD. Cartel de una pirámide de hábitos de salud.","EAR":"(V) Velázquez. Las meninas. Con una plantilla, coloreamos el cuadro a nuestro gusto."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Contamos anécdotas. Por equipos, seleccionamos la más divertida. Elegimos la ganadora. (M) Leo un texto. Estudio y practico el esquema del nombre. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un relato según su estructura. Revisar y hacer un dibujo. C.EV.8.2.a. (J) Cuenta cuentos. Vocabulario. Los signos de interrogación y exclamación. Crea oraciones. (V) Dramatizaciones. Dictado. Repasamos ortografía. Lee, escucha y escribe. Revisa la ortografía. Intercambia el cuaderno para corregir. C.EV. 9.2.a.","MAT":"(L) Multiplico de diferentes formas. Contamos, sumamos y descomponemos. Resuelve las multiplicaciones. Uso de regletas. C.EV.5.2.a. (M) Problemas exprés. (X) Resolución de problemas. Multiplico en vertical. La multiplicación sin llevadas. Copia, calcula y resuelve las multiplicaciones. (J) La multiplicación con llevadas. Copia y resuelve sin olvidar las que te llevas. Uso de regletas. (V) Concurso de problemas. Concurso de tablas de multiplicar. C.EV.8.2.a.","CMN":"(J) ¿Qué son los sentidos? Dibuja en tu cuaderno un diagrama para representar la función de relación. Leemos y comentamos un texto sobre las etapas de la vida. C.Ev. 4.1.a. (V) SdA. Proyecto ¡Si chef! Producto. Refranes, canciones o dibujos. Recetario andaluz. C.Ev.1.2.a.","EAR":"PLA APS. Opera prima Producto. Cómic para el corto de animación. Resolución de conflictos"}],"complementaria":"16 de noviembre. Día del Flamenco. Visita de una bailaora flamenca: presentación y coreografía de pasos y ritmos flamenco .a","5.1.a","6.1.a"],"EAR":["2.B.1"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el 11/11/2025 es martes y el 29/11/2025 sábado; del 11 al 28/11 hay 14 días lectivos, no los 15 indicados. La semana 1 programa actividades (L) aunque empieza en martes.","A. complementaria el 16 de noviembre (domingo en 2025), Día del Flamenco: no cae en día lectivo.","El original escribe el proyecto como '¡Si chef!'; se normaliza a '¡Sí, chef!' en sda.proyecto.nombre (en las semanas se copia literal). ODS indicado como 'ODS 3-16'; se separa en dos entradas.","Evaluación: la tabla de criterios evaluados no coincide con los criterios de la UD: LCL 8.2.a (la UD tiene 8.1.a); MAT 4.1.a y 5.1.a (la UD tiene 4.2.a y 5.2.a); CMN 2.2.a y 5.1.a (la UD tiene 1.2.a y 4.1.a); EAR 2.B.1 es un saber, no un criterio (la UD tiene 4.1.a).","C.EV. de las semanas que no son criterios de la UD: LCL 8.2.a (semana 3); EAR 'C.EV.2.B.1' (semana 1, es un saber). LCL 2.1.a se evalúa dos veces (semanas 1 y 2) y MAT 8.2.a también (semanas 2 y 3); LCL 8.1.a, CMN 6.1.a y EAR 4.1.a no se evalúan en ninguna semana.","Saberes que no casan: MAT 2.C.4.3 'Relaciones geométricas matemáticas' y 2.B.1.2 'Clasificación y organización de datos' no se trabajan (UD de multiplicación); el código 2.C.4.3 se repite en CMN con otro texto ('Estilos de vida sostenible').","MAT semana 2: 'productos por 10,100 y 100' (debería ser 1000) y '(V) Resta de una cifra con llevadas' no encaja con la multiplicación. EAR semana 2 repite literalmente la actividad de Las meninas de la UD 3.","Erratas literales: 'CP(2)' sin espacio, objetivo 4 sin punto final, 'obras literarias adecuados', 'Opera prima' sin tilde, EAR  paisaje preferido. (J) Cuenta cuentos. Vocabulario. Las palabras antónimas. (V) Dramatizaciones. Poemas de Gloria Fuertes. ¿A qué te gustaría dedicarte cuando seas mayor? ¿Crees que es importante esforzarse para conseguir lo que deseas? C.EV.3.2.a.","MAT":"(L) Realizo repartos. Video. Repartos iguales con policubos. Expresamos repartos mediante división. (M) Problemas exprés. (X) Resolución de problemas. En grupos, calculamos la mitad, el tercio y el cuarto. Aprendo a dividir. Algoritmo de la división. Calcula las divisiones. (J) La división exacta e inexacta. Ejercicios prácticos. (V) Concurso de problemas. Inventamos problemas a partir de una división. C.Ev 2.1.a.","CMN":"(J) Vídeo ¿Qué es un ecosistema? ¿Pueden los seres vivos vivir aislados sin relacionarse con otros seres vivos? Escribe una cadena alimentaria con tres animales. ¿Por qué son importantes las rocas en un ecosistema? (V) SdA. UD. Mural con medidas para proteger el planeta.","EAR":"(V) Dibujo de la simetría de los copos de nieve"},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Describir lugares y objetos. Realizar descripciones orales de diferentes lugares del colegio. C.EV.7.1.a. (M) Leo una Descripción. Elige una imagen y describe el paisaje en tu cuaderno. Lee a los compañeros. (X) Capítulo del libro. Taller de escritura. ¡Qué bonita es Andalucía! Describe tu paisaje preferido. C.EV.5.1.a. (J) Cuenta cuentos. Describo personajes principales y secundarias. (V) Dramatizaciones. Jugar al “veo, veo” haciendo descripciones de objetos. C.EV.2.1.a.","MAT":"(L) Descomponer números para dividir. En grupo resolver divisiones con bloques base 10. C.EV.6.2.a. Resolvemos divisiones descomponiendo. Uso de regletas. (M) Problemas exprés. (X) Resolución de problemas. Video. Calcular divisiones en caja. Repartir decenas y unidades. Divisiones con cero en el cociente. J) Practicamos la división. Propiedad del resto. (V) Concurso de problemas. Inventamos problemas a partir de una división. Cálculo mental de sumas con llevadas. C.EV.3.2.a.","CMN":"(J) ¿Cómo son los ecosistemas andaluces? Busca fotografías y dibuja un ecosistema de Andalucía que hayas visitado y escribe una pequeña descripción de los animales o plantas que viste. C.Ev.5.2.a. (V) 6 de diciembre. Día de la Constitución. SdA. UD. Mural con medidas para proteger el planeta.","EAR":"(V) Velázquez. Las meninas. Mural con los dibujos del grupo. C.Ev.4.2.a."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) 16 de diciembre. Día de la lectura en Andalucía. Lectura sobre curiosidades de Andalucía. (M) Leo una ficha de personajes de un libro. El adjetivo. Escribe los adjetivos del texto. Esquema del adjetivo. (X) Capítulo del libro. Taller de escritura. ¡Qué bonita es Andalucía! Describe tu paisaje preferido. Lectura al grupo. C.EV.10.2.a. (J) Cuenta cuentos. Palabras con h. (V) Dramatizaciones. Jugar al “veo, veo” haciendo descripciones de objetos. Dictado. C.EV.9.1.a.","MAT":"(L) División errónea. Propiedad del resto. Prueba de la división. (M) Problemas exprés. (X) Resolución de problemas. En grupos, inventa problemas de divisiones. Repasa las tablas de multiplicar. Calcula divisiones aplicando la prueba. Expresa emociones. C.EV.7.1.a. (J) Calcula divisiones aplicando la prueba. (V) Concurso de problemas. Pienso paso a paso. Partes de un problema para preparar el desayuno. C.Ev 4.1.a.","CMN":"(J) ¿Qué daños estamos provocando a los ecosistemas y cómo podemos protegerlos? En grupos escribimos consejos para llevar un estilo de vida sostenible. Exponemos. C.Ev.6.1.a. (V) SdA. Proyecto ¡Si chef! Producto. Elaboración y degustación en el aula. Recetario andaluz. C.Ev. 3.1.a.","EAR":"APS. Opera prima Producto. Escenario para el corto Resolución de conflictos"}],"complementaria":"6 de diciembre. Día de la Constitución. Visionado de un vídeo sobre la Constitución Española para niños. https://www.youtube.com/watch?v=ofMR4HhaqBQ 16 de diciembre. Día de la lectura en Andalucía. Lectura sobre curiosidad  una reconstrucción. Productos: 'Mural, escenario'."]},{"numero":6,"titulo":"Cuidamos la ciudad","trimestre":2,"fechas":"Del 7 al 24 de enero","dias":14,"centroInteres":"Máquinas, transporte público, reciclado de materiales.","relevanciaSocial":"Cuidar la ciudad para el desarrollo de entornos seguros y saludables. Decreto 101/2023.","ods":["ODS 11. Ciudades y comunidades sostenibles","ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Cuidamos la ciudad","producto":"Informe sobre el uso de la bicicleta como medio de transporte."},"proyecto":{"nombre":"¿Buceamos?","producto":"Cómic. Galería de Arte sostenible."},"aps":{"nombre":"Opera prima","producto":"Fotografías para el corto animado. Resolución de conflictos."}},"objetivosEtapa":["b","e","g","h","j","n","ñ"],"objetivosAprendizaje":["1. Conocer y producir textos literarios. Escuchar y contar mitos y leyendas. Leer y escribir un cómic.","2. Utilizar los conocimientos básicos sobre la lengua: los determinantes, los artículos, demostrativos y palabras con m antes de b y p.","3. Leer, escribir, comparar y representar gráficamente fracciones.","4. Identificar los términos de una fracción, reconocer el numerador y el denominador.","5. Observar e identificar máquinas y aparatos y su utilidad para facilitar las actividades humanas.","6. Conocer las manifestaciones artísticas más importantes de las distintas épocas, lugares y estilos."],"competenciasClave":"CCL (1-2-3-4-5), CP (2), STEM (1-2-3-4-5), CD (1-2-3-5), CPSAA (1-2-3-5), CC (1-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"2","texto":"Comprender textos orales y multimodales para construir conocimiento."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"6","texto":"Buscar, seleccionar y contrastar información procedente de dos o más fuentes."},{"num":"8","texto":"Leer, interpretar y analizar de manera acompañada obras literarias adecuados a su desarrollo."}],"criterios":[{"codigo":"2.1.a","texto":"Comprender el sentido de textos orales."},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"6.1.a","texto":"Localizar información de distintas fuentes"},{"codigo":"8.3.a","texto":"Conocer textos de la literatura tradicional"}],"saberes":[{"codigo":"2.B.3.2","texto":"Interpretación del sentido global."},{"codigo":"2.B.3.5","texto":"Convenciones del código escrito, ortografía."},{"codigo":"2.B.3.6","texto":"Estrategias para la búsqueda de información."},{"codigo":"2.C.1","texto":"Lectura de obras la literatura infantil (cómic)."},{"codigo":"2.D.3","texto":"Procedimientos de adquisición de vocabulario."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"1","texto":"Interpretar situaciones de la vida cotidiana proporcionando estrategias para analizar la información."},{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"6","texto":"Comunicar y representar de forma individual y colectiva conceptos, procedimientos y resultados."},{"num":"8","texto":"Participar en equipos de trabajo heterogéneos con roles asignados para crear relaciones saludables."}],"criterios":[{"codigo":"1.2.a","texto":"Producir esquemas para la resolución."},{"codigo":"3.2.a","texto":"Ejemplificar situaciones problemas."},{"codigo":"4.1.a","texto":"Automatizar una rutina."},{"codigo":"6.1.a","texto":"Reconocer el vocabulario específico."},{"codigo":"8.1.a","texto":"Colaborar en el trabajo en equipo."}],"saberes":[{"codigo":"2.A.4.2","texto":"Fracciones: comparación y ordenación."},{"codigo":"2.D.2.2","texto":"Invención de problemas."},{"codigo":"2.D.4.1","texto":"Interpretación de algoritmos sencillos."},{"codigo":"2.A.2.4","texto":"Fracciones propias."},{"codigo":"2.F.2.2","texto":"Participación activa en el trabajo en equipo."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"1","texto":"Utilizar recursos digitales de forma responsable para buscar información y crear contenido digital."},{"num":"5","texto":"Identificar las características del medio natural y emprender acciones para un uso responsable."},{"num":"6","texto":"Identificar las causas y consecuencias de la intervención humana en el entorno."}],"criterios":[{"codigo":"1.1.a","texto":"Utilizar dispositivos y recursos digitales."},{"codigo":"5.1.a","texto":"Reconocer características de los elementos del medio."},{"codigo":"6.1.a","texto":"Identificar problemas ecosociales."}],"saberes":[{"codigo":"2.B.1.2","texto":"Estrategias de búsquedas guiadas"},{"codigo":"2.C.1.3","texto":"La materia."},{"codigo":"2.C.4.4","texto":"Estilos de vida sostenible."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"1","texto":"Descubrir propuestas artísticas de diferentes géneros, estilos, épocas ."}],"criterios":[{"codigo":"4.1.a","texto":"Identificar propuestas artísticas de diferentes géneros, estilos, épocas."}],"saberes":[{"codigo":"2.C.1","texto":"Cultura visual."},{"codigo":"2.C.8","texto":"El cine de animación."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho textos sobre mitos. Los mitos. (M) Salida. Bioparc de Fuengirola. Una aventura salvaje. C.EV.6.1.a. (X) Capítulo del libro. Vocabulario. Taller de escritura. En grupos, hacer una búsqueda guiada en internet sobre mitos griegos, elegir uno y explicarlo a la clase. C.EV.2.1.a. (J) Cuenta cuentos. Recomienda un cómic. Título, explicar el argumento y describir los personajes. (V) Dramatizaciones. Los refranes. Busca un refrán relacionado con una estación del año.","MAT":"(L) Aprendo fracciones. Concepto de fracción. División en partes iguales. Representar una fracción. C.EV.1.2.a. Nombrar fracciones. (M) Salida. Bioparc de Fuengirola. Una aventura salvaje. (X) Resolución de problemas. Términos de una fracción. Identificar el numerador y el denominador de las fracciones. C.EV.6.1.a. (J) Nombre de las fracciones. Dibuja un rectángulo y colorea la fracción que se indica. (V) Concurso de problemas. Inventa un problema con fracciones. C.Ev.3.2.a.","CMN":"(J) ¿Qué es la materia? Vídeo Los estados y los cambios de la materia. Busca información sobre un material artificial y escribe cómo se obtiene, sus propiedades y para qué se utiliza. Presentamos al grupo. C.Ev.1.1.a. (V). SdA. UD. Informe sobre el uso de la bicicleta como medio de transporte.","EAR":"(V) La geometría. Realizar un dibujo original utilizando figuras geométricas."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Las leyendas. Lee la leyenda y responde. (M) Leo un cómic. Vocabulario. En grupos, hacer una búsqueda guiada en internet sobre leyendas relacionadas con la naturaleza y el lugar donde vivís. Explicarlo a la clase. (X) Capítulo del libro. Vocabulario. C.EV.4.1.a. Taller de escritura. Escribo un cómic. SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible. Prepara un borrador. C.EV.5.1.a. (J) Cuenta cuentos. Recomienda un cómic. Título, explica el argumento y describe los personajes. (V) Dramatizaciones. Los determinantes. Los artículos. Escribimos oraciones y Clasificamos palabras. C.EV.3.2.a.","MAT":"(L) Medios, tercios y cuartos. Representación y lectura de las fracciones resultantes de dividir la unidad en 2, 3 o 4 partes. (M) Problemas exprés. (X) Resolución de problemas. (J) Representar fracciones con regletas. Equivalencias entre fracciones. C.EV.4.1.a. (V) Concurso de problemas. Cálculo mental. Suma de dos cifras con llevadas.","CMN":"(J) ¿De qué materiales están hechos los juguetes? Materiales naturales y artificiales. Propiedades de los materiales. Clasifica materiales. Hacemos un esquema de las propiedades de los materiales (V). SdA. UD. Informe sobre el uso de la bicicleta como medio de transporte. C.EV.6.1.a.","EAR":"(V) Vídeo. Biografía de Pablo Picasso. Descubriendo el cubismo guía de dibujo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Los demostrativos. Copia y completa el esquema sobre los determinantes. (M) Leo un cómic. Comprensión. Completar una tabla con los determinantes demostrativos. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un cómic. SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible. Prepara un borrador. (J) Cuenta cuentos. Palabras con m antes de b y p. Copia las oraciones y completa con mb o mp. (V) Dramatizaciones. Elaborar un esquema con las normas de ortografía estudiadas. Dictado. Lee, escucha, escribe y revisa. C.EV.8.3.a.","MAT":"(L) Comparo fracciones. Compara fracciones con el mismo denominador. (M) Problemas exprés. (X) Resolución de problemas. Encontrar fracciones mayores o menores que una dada. (J) Completa con los signos mayor que o menor que las fracciones. (V) Concurso de problemas. Pienso paso a paso. Dibuja un rectángulo. Divídelo por la mitad, una y otra vez, hasta que puedas. Colorea. C.Ev.8.1.a.","CMN":"(J) ¿Qué son las máquinas? Máquinas simples y compuestas. Elige una máquina y escribe sus características. ¿Qué es un invento? Busca información y escribe el nombre de dos inventos y para qué sirven. C.Ev.5.1.a. (V) SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible.","EAR":"(V) APS. Opera prima. Producto. Fotografías para el corto de animación C.Ev.2.C.1 / 2.C.8"}],"complementaria":"SdA. Salida. Bioparc de Fuengirola. Una aventura salvaje.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos" o":"Plano de mi barrio incluyendo centros sanitarios cercanos."},"proyecto":{"nombre":"¿Buceamos?","producto":"Máscara marina. Galería de Arte sostenible."},"aps":{"nombre":"Opera prima","producto":"Fotografías para el corto. Un día en el cole."}},"objetivosEtapa":["c","e","g","h","j","n","ñ"],"objetivosAprendizaje":["1. Escuchar y contar avisos e instrucciones. Leer y escribir normas, cartas y correos electrónicos.","2. Utilizar los conocimientos básicos sobre la lengua: los determinantes posesivos y numerales, las onomatopeyas y palabras con r y rr.","3. Reconocer el tiempo como una medida que se divide en horas, minutos, días, semanas, meses y años.","4. Utilizar relojes (analógicos y digitales) y calendarios para medir el tiempo y leer la hora correcta.","5. Conocer y utilizar diferentes tipos de representación de la Tierra.","6. Conocer las manifestaciones artísticas más importantes de las distintas épocas, lugares y estilos."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-4), CD (1-2-4-5), CPSAA (1-2), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"3","texto":"Producir textos orales y multimodales para expresar ideas y sentimientos."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"7","texto":"Leer de manera autónoma obras seleccionadas para fomentar el gusto por la lectura."},{"num":"9","texto":"Reflexionar sobre el lenguaje a partir de procesos de producción y comprensión de textos."}],"criterios":[{"codigo":"3.2.a","texto":"Participar en interacciones orales."},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"7.1.a","texto":"Leer de manera autónoma o acompañada."},{"codigo":"9.2.a","texto":"Revisar los textos propios y ajenos."}],"saberes":[{"codigo":"2.B.3.3","texto":"Planificación y producción de textos orales."},{"codigo":"2.B.3.4","texto":"Lectura compartida y entonada."},{"codigo":"2.B.3.5","texto":"Coherencia y cohesión textual."},{"codigo":"2.B.3.4","texto":"Estrategias antes, durante y después."},{"codigo":"2.D.3","texto":"Determinantes."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"2","texto":"Resolver situaciones problematizadas, aplicando técnicas, estrategias y formas de razonamiento."},{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"5","texto":"Reconocer y utilizar conexiones entre diferentes ideas matemáticas."},{"num":"7","texto":"Gestionar las emociones al enfrentarse a retos matemáticos para disfrutar del aprendizaje."}],"criterios":[{"codigo":"2.2.a","texto":"Obtener posibles soluciones."},{"codigo":"3.2.a","texto":"Ejemplificar situaciones problemas."},{"codigo":"4.1.a","texto":"Automatizar una rutina."},{"codigo":"5.2.a","texto":"Reconocer conexiones matemáticas."},{"codigo":"7.1.a","texto":"Identificar las emociones al abordar retos"}],"saberes":[{"codigo":"2.A.3.2","texto":"Explicación del proceso y resultado."},{"codigo":"2.D.2.2","texto":"Invención de problemas."},{"codigo":"2.B.2.2","texto":"Medición mediante reloj analógico y digital."},{"codigo":"2.B.1.3","texto":"Medida del tiempo (año, mes, semana, día...)."},{"codigo":"2.F.1.3","texto":"Autoconfianza en las propias posibilidades."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"2","texto":"Plantear y dar respuesta a cuestiones científicas sencillas, con técnicas del pensamiento científico."},{"num":"5","texto":"Identificar las características del medio natural y emprender acciones para un uso responsable."},{"num":"6","texto":"Identificar las causas y consecuencias de la intervención humana en el entorno."}],"criterios":[{"codigo":"2.2.a","texto":"Usar estrategias de selección de información."},{"codigo":"5.1.a","texto":"Reconocer características de los elementos del medio"},{"codigo":"6.1.a","texto":"Identificar problemas ecosociales."}],"saberes":[{"codigo":"2.A.1.3","texto":"Vocabulario científico."},{"codigo":"2.C.1.1","texto":"La Tierra: globo terráqueo, mapas"},{"codigo":"2.C.4.4","texto":"Los ecosistemas naturales."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"2","texto":"Investigar distintas manifestaciones artísticas para disfrutar de ellas."}],"criterios":[{"codigo":"2.2.a","texto":"Reconocer elementos del patrimonio de la cultura andaluza."}],"saberes":[{"codigo":"2.C.7","texto":"Estrategias y técnicas de uso de historias audiovisuales."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucha el aviso y responde. Escribe un aviso para informar que tu perro se ha perdido. (M) Leo un relato. Comprendo la lectura. Las onomatopeyas. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Por equipos, escribo normas de convivencia, en una biblioteca, una piscina pública, en un cine. Exponemos. C.EV.3.2.a. (J) Día de la NO-Violencia y la Paz. ¿por qué se celebra? Corto “Cadena de favores” Reflexión y Debate. (V) Dramatizaciones. Ruta por el colegio para buscar textos cotidianos: notas, normas, listas, etc. Realiza un registro. C.EV.8.3.a.","MAT":"(L) Estudio el calendario. ¿Qué meses tienen 30 días? ¿Y 31? ¿cuántos días tiene el mes de febrero? C.EV.2.2.a. (M) Problemas exprés. (X) Resolución de problemas. Unidades de tiempo: día, semana, mes año. Número de días en una semana. Número de días en un mes. Número de días y meses en un año. Año bisiesto. Escribe la fecha de dos formas diferentes. C.EV.5.2.a. J) Día de la NO-Violencia y la Paz. Puzle de la Paz. Escribe un mensaje y construye el puzle. (V) Concurso de problemas.","CMN":"(J) Vídeo ¿Cómo se mueve la Tierra? Representamos nuestro planeta. Haz un dibujo con los movimientos de la Tierra. Cuenta cuál es tu estación del año favorita y por qué. 30 de enero. Día de la No Violencia y la Paz. Marcha por la paz. C.Ev.2.2.a (V) SdA. UD. Plano de mi barrio incluyendo centros sanitarios cercanos.","EAR":"(V) Texturas visuales. Elaboración de un collage marino."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Partes de una carta. (M) Leo una carta. Comprendo la lectura C.EV.4.1.a. Los determinantes posesivos. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Escribo una carta a un compañero para felicitarle por su cumpleaños. C.EV.5.1.a. (J) Cuenta cuentos. Las instrucciones. Cuento unas instrucciones. Cómo elaborar una brocheta de fruta saludable C.EV.7.1.a. (V) Dramatizaciones. Los determinantes numerales. Copio y completo un esquema.","MAT":"(L) Vídeo. El día, la hora y los minutos. Horas en un día. Recuentos de horas. ¿Cuántas horas hay en 2 días? Calcula cuantas horas hay en una semana. (M) Problemas exprés. (X) Resolución de problemas. Minutos en una hora ¿Cuántos minutos son 3 horas? Media hora y cuarto de hora. ¿Cuántos minutos son tres cuartos de hora? (J) Las horas y los minutos. ¿Cuántas horas tienen 4 días? Calcula los minutos que hay. ¿Cuántos cuartos de hora son 60 minutos? (V) Concurso de problemas. Cálculo mental. Suma de dos cifras con llevadas en unidades. C.Ev.3.2.a.","CMN":"(J) ¿Cómo podemos representar la Tierra? Escribe la diferencia entre un globo terráqueo y un planisferio. Escribe los elementos de un planisferio. Busca tu país y localízalo en un globo terráqueo. C.Ev.5.1.1.a. (V) SdA. UD. Plano de mi barrio incluyendo centros sanitarios cercanos.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Partes de un correo electrónico. (M) Leo un correo electrónico. Vocabulario. Comprendo la lectura. Completo el esquema de los determinantes. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo una carta a un compañero para felicitarle por su cumpleaños. Lectura a los compañeros. (J) Cuenta cuentos. El sonido de la r suave y fuerte. (V) Dramatizaciones. Repasamos las reglas de ortografía. Dictado. Leo, escucho, escribo, reviso e intercambio de cuadernos. C.EV. 9.2.a.","MAT":"(L) Leo la hora de un reloj. Aguja corta y aguja larga. Dibuja en tu cuaderno relojes y relaciona la hora escrita. Escribe la hora de los relojes. C.EV.4.1.a. (M) Problemas exprés. (X) Resolución de problemas. Haz una redacción explicando qué haces al salir del cole e indica las horas de cada actividad. (J) El reloj digital. Leer la hora en reloj digital. Pasar de analógico a digital. (V) Concurso de problemas. Pienso paso a paso. Recordar los días de cada mes utilizando los nudillos. C.Ev.7.2.a.","CMN":"(J) ¿Cómo nos podemos orientar? ¿Para qué usamos los mapas? ¿Qué métodos usarías para orientarte en un bosque? Busca información sobre cómo funciona una brújula. (V) SdA. Proyecto. ¿Buceamos? Producto. Máscara marina. Galería de Arte sostenible. C.Ev. 6.1.a.","EAR":"(V) APS. Opera prima Producto. Fotografías para el corto de animación. C.Ev. 2.C.7."}],"complementaria":"SdA. 30 de enero. Día de la No Violencia y la Paz. Marcha por la paz.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos, reloj analógico"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los criterios de evaluación. Orden 30/5/23","procedimientos":"Observación sistemática, corrección de tareas.","evidencias":"Evidencias-Trazabilidad. Respuestas a preguntas, producto final de tareas y proyectos. Desempeños. Presentación oral, ...","productos":"Plano","autoevaluacion":"Autoevaluación-coevaluación","criteriosEvaluados":{"LCL":["3.2.a","4.1.a","5.1.a","7.1.a","9.2.a"],"MAT":["2.2.a","3.2.a","4.1.a","5.2.a","7.2.a"],"CMN":["2.2.a","5.1.a","6.1.a"],"EAR":["2.C.7"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el original indica 'Del 27 de enero al 14 de febrero de 2025'. En 2025 (lun 27/1 - vie 14/2) salen 15 días lectivos (coincide); en 2026 el 14/2 sería sábado. Año incoherente con UD fechadas en 2025-2026.","ODS indicado como 'ODS 14-16'; se es."}],"saberes":[{"codigo":"2.A.1.1","texto":"Experimentos."},{"codigo":"2.C.1.3","texto":"Paisajes de España y Andalucía."},{"codigo":"2.C.4.4","texto":"Los ecosistemas naturales."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"3","texto":"Comunicar de manera creativa ideas, sentimientos y emociones."}],"criterios":[{"codigo":"3.1.a","texto":"Producir obras propias, utilizando la imagen y los medios digitales."}],"saberes":[{"codigo":"2.C.12","texto":"Aproximación a las herramientas y las técnicas de animación."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho un texto periodístico. C.EV.2.1.a. Los medios de comunicación. (M) Leo un texto periodístico. Deportes olímpicos. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Elige un deporte olímpico que se juegue en equipo. Busca información, redacta y haz una presentación (J) Cuenta cuentos. C.EV.4.1.a. Los gentilicios. Averigua de qué país es cada deportista y su gentilicio. (V) 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno.","MAT":"(L) Análisis de datos en tabla. Recogida de datos en tabla. (M) Problemas exprés. (X) Resolución de problemas. La moda, dato que más se repite. Nos colocamos en fila en el patio y jugamos a lanzar tiros libres, dobles y triples en la cancha de baloncesto. Anotamos el resultado en una tabla de datos. C.EV.1.1.a. J) Encuesta a la clase de 3º. ¿Cuál es el último médico especialista que has visitado este año? Recoge los datos y completa la tabla. Cuenta a la clase tu última experiencia en el especialista. C.EV.3.1.a. (V) 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno.","CMN":"(J) Vídeo ¿Conoces paisajes de costa y de interior? ¿Qué elementos naturales y humanos tienen? ¿Qué es un paisaje? Realizamos un esquema. ¿Qué causas humanas y artificiales puede modificar un paisaje? Escribe en tu cuaderno. C.Ev.6.1.a. (V) SdA. UD. Cartel sobre el cuidado del medioambiente","EAR":"(V) El bodegón de frutas."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Debate. Comprendo la lectura. (M) Leo un texto periodístico. Deportes olímpicos. Vocabulario. Comprendo la lectura. C.EV.6.1.a. (X) Capítulo del libro. Vocabulario. Taller de escritura. Investiga sobre los juegos paralímpicos. Redacta y lee a los compañeros. C.EV.5.1.a. (J) Cuenta cuentos. La entrevista. Inventa y ensaya con tu compañero/a una entrevista que harías a un deportista en la radio. (V) Dramatizaciones. Dramatizamos la entrevista a los compañeros.","MAT":"(L) Gráfico de barras. ¿Cómo llega al colegio el alumnado de 3º? Recogida de datos, llegan en bici, coche, autobús o a pie. Representación gráfica y análisis. ¿Cuántos van caminando al colegio? (M) Problemas exprés. C.Ev.8.2.a. (X) Resolución de problemas. Recogida de datos, representación gráfica y análisis de lo que toma en el recreo el alumnado de 3º, fruta, bocadillo o galletas. (J) Recogida de datos, representación gráfica y análisis de las mascotas del alumnado de 3º, perro, gato, otros. (V) Concurso de problemas. Cálculo mental. Multiplica por la unidad seguida de ceros. C.Ev.4.2.a.","CMN":"(J) Los paisajes de costa. Dibuja dos paisajes uno de interior y otro de costa. Escribe los elementos. Busca fotografías de un paisaje y describe a la clase. (V) Experimento. Plástico ecológico. Método científico. C.Ev2.2.a. SdA. UD. Cartel sobre el cuidado del medioambiente.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo. Colorea como quieras."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Comprendo la lectura. Partes de una notica. Cambia el título y la entradilla. (M) Leo un texto periodístico. Los pronombres personales. El número y el género. Esquema. (X) Capítulo del libro. Taller de escritura. En grupos, escribimos una noticia sobre el deporte en equipo, siguiendo un esquema. Borrador, redactar, revisar la ortografía, pasar a limpio y hacer un dibujo. (J) Cuenta cuentos. C.EV.8.3.a. Palabras con c/q y c/z. (V) Dramatizaciones. Dictado. C.EV.9.2.a.","MAT":"(L) Representa un pictograma sobre el tipo de libro preferido del alumnado de 3º, animales, dinosaurios o cómic. Analiza los datos. C.EV.6.2.a. (M) Problemas exprés. (X) Resolución de problemas. Elabora un pictograma con los cumpleaños de cada mes. Analiza los datos. (J) Gráfico de líneas. Temperaturas máximas y mínimas. Busca información del tiempo atmosférico en tu localidad y anota la temperatura. (V) Concurso de problemas. Pienso paso a paso. ¿Qué cesto es el intruso?","CMN":"(J) Los paisajes de interior y de costa. Busca los sistemas montañosos de España y escribe sus nombres. Identifica las provincias que tienen un paisaje de costa. Dibuja un mapa de los archipiélagos españoles. C.Ev.5.1.a. (V) SdA. Proyecto. ¿Buceamos? Producto. Diorama marino.","EAR":"(V) APS. Opera prima. Producto. Fotografías para el corto de animación. C.EV.2.C.12."}],"complementaria":"SdA. 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno andaluz en el comedor del colegio. Carnaval. Pasacalles por la localidad con pachangas y disfraces.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"med ñ), g), h), j), k), ñ)' repite la ñ; se deja una sola vez.","ODS indicado como 'ODS 11-16'; se separa en ODS 11 y ODS 16. El título de sda.ud no aparece explícito: se usa el título de la UD. La tabla 6 de la programación dice 'Mural sobre tradiciones oficiales en España' (aquí 'de España').","SdA APS: producto 'Edición de fotografías para el corto animado. Un día en mi colegio.' en la justificación y 'fotografías para el corto de animación' en la semana 3.","LCL: erratas 'Responde a las presuntas' (preguntas), 'Grabarte' (sem. 1) y saber 2.C.1 'Lectura de obras la literatura infantil' (falta 'de'); texto del criterio 6.1.a sin punto final. La actividad de la receta de aprovechamiento se repite casi igual en (X) de semanas 1 y 2, y 'Creo un eslogan publicitario' en (J) de semanas 2 y 3; ambas encajan poco con el centro de interés (la localidad).","MAT: 'J)' y 'X)' sin paréntesis de apertura; 'Realiza un gráfic.' cortado (sem. 1); falta punto en 'que el metro Elabora' (sem. 2); 'transforma' en minúscula (sem. 3).","CMN: la evaluación indica 'CMN. 2.2.a. / 5.1.a. / 6.1.a.', que no coinciden con los criterios de la UD (3.2.a, 5.2.a, 8.1.a, que sí aparecen en las semanas); parece copiado de la UD 7. La competencia 5 alude al medio natural y la 8 a la igualdad de género, poco relacionadas con la organización de la localidad. La semana 1 no tiene C.EV. y el (V) de la semana 1 (Día Mundial del Agua) no trata la localidad.","CMN y MAT comparten el código de saber 2.B.2.1 con textos distintos (es correcto al ser áreas distintas, pero puede confundir).","EAR: el criterio es 4.2.a, pero en semana 3 y en la evaluación se usa el código del saber 2.B.4 como criterio; semanas 1 y 2 sin C.EV.","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción."]},{"numero":10,"titulo":"¿Qué edad tienes?","trimestre":3,"fechas":"Del 7 de abril al 7 de mayo","dias":17,"centroInteres":"La población.","relevanciaSocial":"Conocer la población para tomar decisiones que mejoren la calidad de vida de las personas. Decreto 101/2023.","ods":["ODS 11. Ciudades y comunidades","ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"¿Qué edad tienes?","producto":"Creación de una pirámide de población."},"proyecto":{"nombre":"Huellas del pasado","producto":"Investigar y diseñar la estructura Lapbook."},"aps":{"nombre":"Opera prima","producto":"Presentación del corto de animación. Un día en mi colegio."}},"objetivosEtapa":["b","e","g","h","j","k","o"],"objetivosAprendizaje":["1. Conocer y producir textos literarios: escuchar, cantar una canción y declamar una poesía. Leer y escribir un poema.","2. Utilizar los conocimientos de la lengua: el sujeto y el predicado, palabras con ll e y.","3. Identificar el litro como la unidad principal de medida de capacidad y relacionarlo con el medio litro y cuarto de litro.","4. Comparar el peso de diferentes objetos utilizando el kilogramo, medio kilo y cuarto de kilo.","5. Identificar y describir los principales problemas actuales de la población y realizar gráficas simples.","6. Conocer las manifestaciones artísticas más importantes de las distintas épocas, lugares y estilos."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-3-4), CD (1-2-3-5), CPSAA (1-2-3-4-5), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"2","texto":"Comprender textos orales y multimodales para construir conocimiento."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"7","texto":"Leer de manera autónoma obras diversas seleccionadas atendiendo a sus gustos e intereses."},{"num":"8","texto":"Leer, interpretar y analizar de manera acompañada obras literarias adecuados a su desarrollo."}],"criterios":[{"codigo":"2.1.a","texto":"Comprender el sentido de textos orales."},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"7.2.a","texto":"Leer de manera autónoma o acompañada."},{"codigo":"8.3.a","texto":"Conocer textos de la literatura."}],"saberes":[{"codigo":"2.B.3.2","texto":"Interpretación del sentido global."},{"codigo":"2.B.3.4","texto":"Lectura compartida y entonada."},{"codigo":"2.B.3.5","texto":"Ortografía reglada básica."},{"codigo":"2.C.9","texto":"Uso de la biblioteca de aula o de centro."},{"codigo":"2.D.3","texto":"Lectura expresiva de textos populares andaluces"}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"2","texto":"Resolver situaciones problematizadas, aplicando técnicas, estrategias y formas de razonamiento."},{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"5","texto":"Reconocer y utilizar conexiones entre diferentes ideas matemáticas."},{"num":"8","texto":"Desarrollar destrezas sociales, participando en equipos de trabajo heterogéneos con roles asignados."}],"criterios":[{"codigo":"2.1.a","texto":"Emplear estrategias resolver problemas."},{"codigo":"3.1.a","texto":"Realizar conjeturas matemáticas."},{"codigo":"4.1.a","texto":"Utilizar el pensamiento computacional."},{"codigo":"5.1.a","texto":"Realizar conexiones matemáticas."},{"codigo":"8.1.a","texto":"Colaborar en el trabajo en equipo."}],"saberes":[{"codigo":"2.A.3.5","texto":"Fases de resolución de problemas."},{"codigo":"2.E.3.1","texto":"Formulación de conjeturas a partir de datos."},{"codigo":"2.D.4.1","texto":"Interpretación de algoritmos sencillos."},{"codigo":"2.B.3.2","texto":"Estimación de medidas de masa y capacidad."},{"codigo":"2.F.2.4","texto":"Valoración de las matemáticas."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"1","texto":"Utilizar recursos digitales de forma responsable para buscar información."},{"num":"5","texto":"Identificar las características del medio natural y emprender acciones para un uso responsable."},{"num":"9","texto":"Participar en el entorno y vida social desde el respeto, derechos y principios democráticos."}],"criterios":[{"codigo":"1.1.a","texto":"Utilizar dispositivos y recursos digitales."},{"codigo":"5.1.a","texto":"Reconocer características de los elementos del medio."},{"codigo":"9.1.a","texto":"Participar empleando un lenguaje inclusivo."}],"saberes":[{"codigo":"2.B.1.2","texto":"Estrategias de búsquedas guiadas"},{"codigo":"2.C.1.5","texto":"Los sectores de producción"},{"codigo":"2.C.3.1","texto":"Normas para la vida en sociedad"}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"1","texto":"Descubrir propuestas artísticas de diferentes géneros, estilos, épocas."}],"criterios":[{"codigo":"1.2.a","texto":"Identificar manifestaciones artísticas propias de la cultura andaluza."}],"saberes":[{"codigo":"2.C.8","texto":"El cine de animación como género."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho una canción. C.EV.2.1.a. Vocabulario. La canción. (M) Leo poesía. Vocabulario. Comprendo la lectura. Clasificar los verbos según su conjugación. (X) Capítulo del libro. Taller de escritura. ¿Cómo es un poema? Escribir dos estrofas de cuatro versos para salvar el mar. (J) Cuenta cuentos. C.EV.4.1.a. En la biblioteca del centro, busca y lee poemas relacionados con el mar (V) Dramatizaciones. Declamar una poesía en grupos, siguiendo los pasos. Repartid los versos, memorizad y ensayad. Recitad los versos con entonación y al ritmo acompañando con gestos.","MAT":"(L) Las medidas de capacidad: litro y mililitro. Transformar L en mL, y viceversa. Estimar un litro. Elegir unidad de medida. Estimar la capacidad. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Expresiones complejas e incomplejas de medidas de capacidad. Paso de litros a mL. Paso de mL a litros. Equivalencia de unidades. 1L = 1000 mL. C.EV.2.1.a. (J) Suma y resta de medidas de capacidad. (V) Concurso de problemas. Inventa un problema. C.EV.8.1.a.","CMN":"(J) Vídeo La población. Dibuja en tu cuaderno los distintos tipos de zonas geográficas y escribe su nombre. Busca información sobre el padrón municipal y el censo de tu localidad. Calcula el crecimiento natural y real de España en el año 2020. C.Ev.1.1.a. (V) SdA. UD. Pirámide de población","EAR":"(V) Crea como quieras. Dibujo con texturas y color."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario y comprensión. La familia de palabras. (M) Leo poesía. Vocabulario. Comprendo la lectura. El sujeto y el predicado. (X) 23 de abril. Día Internacional del Libro. Taller de refranes. C.EV.8.3.a. Escribe y cambia algunas palabras conservando la rima y el ritmo. C.EV.5.1.a. (J) Cuenta cuentos. C.EV.7.2.a. En la biblioteca del centro, busca y recita un poema. (V) Dramatizaciones. Declamar una poesía en grupos, siguiendo los pasos. Repartid los versos, memorizad y ensayad. Recitad con entonación y al ritmo con gestos.","MAT":"(L) Sumar litros. Equivalencias. Ordenar de mayor a menor. Paso a mililitros. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Las medidas de masa: el kilogramo y el gramo. Transformar kilos en gramos y viceversa. Estimar un kilo. Elegir unidad de medida. C.EV.3.1.a. (J) Estimar la masa. Equivalencia de unidades 1 kg = 1000 g. Expresiones complejas e incomplejas de medidas de masa. Suma y resta de medidas de masa. (V) Concurso de problemas. Cálculo mental.","CMN":"(J) Describe las principales características de la población de España. Dibuja en tu cuaderno un mapa de España. Colorea las zonas poco pobladas en verde y las zonas densamente pobladas en rojo. Realiza un esquema de los Sectores económicos. C.Ev. 5.1.a. (V) SdA. UD. Pirámide de población","EAR":"(V) Video. Biografía de Murillo. Copia la obra: Niños comiendo melón y uvas."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Completa el esquema de la oración. (M) Leo poesía. Copia las oraciones y rodea el verbo y subraya el sujeto y el predicado. (X) Capítulo del libro. Taller de escritura. Búsqueda guiada de una canción. Escribe y cambia algunas palabras conservando la rima y el ritmo. (J) Cuenta cuentos. C.EV.4.1.a. Palabras con ll y con y. En equipos, escribir palabras que contengan ll, leer en voz alta y comprobar si son correctas. (V) Dramatizaciones. Dictado de palabras con ll y con y. Escribe una oración con las palabras que hayas escrito incorrectas.","MAT":"(L). Averigua la masa de objetos pequeños que tengas cerca. Mide la masa de cada uno con una báscula. ¿Has acertado? C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Medio kilo y cuarto de kilo. Equivalencias. Ordenar de mayor a menor. Paso a gramos. C.EV.8.1.a. (J) Suma y resta de medidas de masa. Ordena de menor a mayor. (V) Concurso de problemas. Pienso paso a paso. ¡Crea tu balanza!","CMN":"(J) Busca información y di en qué tres provincias andaluzas se concentra un mayor número de población. Escribe un anuncio para convencer a las personas a venir a vivir a Andalucía. (V) SdA. Proyecto. Huellas del pasado. Producto. Investigar y diseñar la estructura Lapbook.C.Ev. 9.1.a.","EAR":"(V) APS. Opera prima Post-producción. Presentación del corto C.EV. 2.C.8."}],"complementaria":"SdA. 23 de abril. Día Internacional del Libro. Taller de refranes.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los criterios de evaluación. Orden 30/5/23","procedimientos":"Observación sistemática, corrección de tareas.","evidencias":"Evidencias-Trazabilidad. Respuestas a preguntas, producto final de tareas y proyectos. Desempeños. Presentación oral","productos":"Lapbook","autoevaluacion":"Autoevaluación-coevaluación","criteriosEvaluados":{"LCL":["2.1.a","4.1.a","5.1.a","7.2.a","8.3.a"],"MAT":["1.2.a","3.1.a","4.1.a","5.1.a","8.1.a"],"CMN":["2.2.a","5.1.a","6.1.a"],"EAR":["2.C.8"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el original indica 'Del 7 de abril al 7 de mayo de 2025. (S. Santa).', 17 días lectivos (cuadra con Semana Santa del 14 al 18 de abril y el 1 de mayo festivo), pero la secuenciación solo recoge 3 semanas; el año 2025 no casa con un curso 2025-2026.","ODS indicado como 'ODS 11-16. Ciudades y comunidades. Paz, justicia...'; se separa en ODS 11 y ODS 16. El nombre oficial del ODS 11 es 'Ciudades y comunidades sostenibles'. El título de sda.ud no aparece explícito: se usa el título de la UD.","Producto de la evaluación: 'Lapbook' (producto del proyecto), no la pirámide de población (producto de la SdA de la UD).","LCL: las actividades de la semana 1 (estrofas 'para salvar el mar', poemas 'relacionados con el mar') parecen arrastradas de una UD anterior y no casan con el centro de interés (la población). 'Clasificar los verbos según su conjugación' y 'La familia de palabras' no figuran en los objetivos. El saber 2.D.3 (textos populares andaluces) no se trabaja explícitamente.","MAT: el objetivo 3 menciona medio litro y cuarto de litro, pero las semanas trabajan litro/mililitro. En la evaluación aparece el criterio 1.2.a, que no existe en la UD (el criterio de la competencia 2 es 2.1.a). 4.1.a no se evalúa en ninguna semana. Errata '(L).' en la semana 3.","CMN: la evaluación lista 2.2.a y 6.1.a, que no son criterios de esta UD, y omite 1.1.a y 9.1.a, que sí se usan en las semanas. La competencia 5 habla del 'medio natural', poco vinculada a la población. Falta espacio en 'Lapbook.C.Ev. 9.1.a.'.","EAR: el criterio es 1.2.a (cultura andaluza), pero en la semana 3 y en la evaluación se usa el código del saber 2.C.8 como criterio; semanas 1 y 2 sin C.EV. El saber (cine de animación) no casa con el criterio (Murillo sí).","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción."]},{"numero":11,"titulo":"¿En qué edad estamos?","trimestre":3,"fechas":"Del 8 al 30 de mayo","dias":17,"centroInteres":"La historia y el paso del tiempo.","relevanciaSocial":"Comprender la evolución de las sociedades a lo largo del tiempo. Decreto 101/2023.","ods":["ODS 4. Educación de calidad","ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"¿En qué edad estamos?","producto":"Línea del tiempo de nuestra vida."},"proyecto":{"nombre":"Huellas del pasado","producto":"Escribir el contenido del Lapbook."},"aps":{"nombre":"Opera prima","producto":"Diseño de un cartel para el evento de fin de curso."}},"objetivosEtapa":["c","e","f","g","h","j","o"],"objetivosAprendizaje":["1. Conocer y producir textos literarios: escuchar la tertulia y un debate, leer y escribir un diálogo.","2. Utilizar los conocimientos de la lengua: clases de oraciones, palabras terminadas en d y z, los neologismos y extranjerismos.","3. Reconocer rectas paralelas, secantes y perpendiculares, así como ángulos rectos, agudos y obtusos.","4. Comprender la relación entre ángulos y figuras geométricas en el plano.","5. Utilizar el siglo como unidad de medida y diferentes técnicas para situar acontecimientos históricos.","6. Desarrollar una sensibilidad propia en la investigación artística."],"competenciasClave":"CCL (1-2-3-4-5), CP (1-2-3), STEM (1-2-3-4), CD (1-2-4-5), CPSAA (1-2-3), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"3","texto":"Producir textos orales y multimodales para expresar ideas y sentimientos."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"6","texto":"Buscar, seleccionar y contrastar información procedente de dos o más fuentes."},{"num":"9","texto":"Reflexionar sobre el lenguaje a partir de procesos de producción y comprensión de textos."}],"criterios":[{"codigo":"3.2.a","texto":"Participar en interacciones orales."},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"6.1.a","texto":"Localizar información de distintas fuentes"},{"codigo":"9.1.a","texto":"Observar la relación entre sujeto y verbo."}],"saberes":[{"codigo":"2.B.3.1","texto":"Escucha empática."},{"codigo":"2.B.3.4","texto":"Identificación de ideas más relevantes."},{"codigo":"2.B.3.5","texto":"Coherencia y cohesión textual."},{"codigo":"2.C.1","texto":"Búsqueda guiada de información."},{"codigo":"2.D.3","texto":"Sonidos y letras, palabras, oraciones y textos."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"2","texto":"Resolver situaciones problematizadas, aplicando técnicas, estrategias y formas de razonamiento."},{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"5","texto":"Reconocer y utilizar conexiones entre diferentes ideas matemáticas."},{"num":"7","texto":"Identificar y gestionar emociones al enfrentarse a retos matemáticos para disfrutar en el aprendizaje."}],"criterios":[{"codigo":"2.1.a","texto":"Emplear estrategias resolver problemas."},{"codigo":"3.2.a","texto":"Ejemplificar situaciones problemas."},{"codigo":"4.1.a","texto":"Utilizar el pensamiento computacional"},{"codigo":"5.1.a","texto":"Reconocer conexiones matemáticas"},{"codigo":"7.1.a","texto":"identificar las emociones al abordar retos"}],"saberes":[{"codigo":"2.A.2.6","texto":"Explicación del proceso de resolución."},{"codigo":"2.B.1.1","texto":"Amplitud del ángulo."},{"codigo":"2.D.4.1","texto":"Interpretación de algoritmos sencillos."},{"codigo":"2.C.2.3","texto":"Interpretación de itinerarios en planos."},{"codigo":"2.E.1.1","texto":"Gráficos estadísticos cotidianos"}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"2","texto":"Plantear y dar respuesta a cuestiones científicas sencillas, con técnicas del pensamiento científico."},{"num":"7","texto":"Comprender cambios del medio social y cultural para explicar los diferentes elementos."},{"num":"9","texto":"Participar la vida social desde el respeto para generar interacciones positivas de dialogo."}],"criterios":[{"codigo":"2.2.a","texto":"Usar estrategias de selección de información."},{"codigo":"7.1.a","texto":"Identificar hechos del entorno de la historia."},{"codigo":"9.1.a","texto":"Emplear un lenguaje inclusivo y no violento."}],"saberes":[{"codigo":"2.A.1.4","texto":"Curiosidad en las investigaciones."},{"codigo":"2.C.1.3","texto":"El tiempo histórico."},{"codigo":"2.C.4.4","texto":"Normas para la vida en sociedad."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"3","texto":"Comunicar de manera creativa ideas para producir obras propias."}],"criterios":[{"codigo":"3.3.a","texto":"Valorar tanto las producciones propias como las ajenas."}],"saberes":[{"codigo":"2.B.11","texto":"Características del lenguaje audiovisual."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho una tertulia. Respondo a las preguntas. C.EV.3.2.a. (M) Leo un texto. ¿Cómo serán las ciudades del futuro? Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Redactar una descripción de la ciudad de futuro perfecta y dibujarla. (J) Cuenta cuentos. C.EV.4.1.a. Los neologismos y los extranjerismos. (V) Dramatizaciones. Participo en un debate Ventajas y desventajas de que en el futuro los robots hagan el trabajo que ahora hacen las personas.","MAT":"(L) Rectas secantes y restas paralelas. Nombra rectas y di su relación dos a dos. Identifica rectas paralelas y secantes. Dibuja rectas paralelas y secantes. Traza utilizando la regla. (M) Problemas exprés. (X) Resolución de problemas. Busca un plano donde aparezca vuestro colegio. ¿Qué calles son paralelas y secantes? Indica las rectas paralelas y secantes que ves a tu alrededor. C.EV.2.1.a. (J) Ángulos. Los ángulos y sus elementos. Identifica ángulos Los elementos de un ángulo. Piensa en objetos cotidianos en los que se pueda observar ángulos. C.EV.3.2.a. (V) Concurso de problemas. Inventa un problema.","CMN":"(J) La historia y el paso del tiempo. Las edades de la historia. Utiliza internet para investigar un acontecimiento importante de cada edad histórica. Represéntalos en una línea del tiempo. Elabora un cómic con una escena de la prehistoria. C.Ev 5.1.a. (V) SdA. UD. Línea del tiempo de nuestra vida.","EAR":"(V) Crea a tu manera un diseño con la técnica del esgrafiado."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. C.EV.2.1.a. Consejos para participar en un debate. (M) Leo un diálogo. Vocabulario. Comprendo la lectura. Uso de las rayas en el texto. (X) Capítulo del libro. Taller de escritura. Escribo un diálogo entre personajes de un cuento. C.EV.5.1.a. (J) Cuenta cuentos. C.EV.4.1.a. Busca en la biblioteca un cuento donde se reproduzca un diálogo y se utilicen rayas. Lee y escribe un resumen. C.EV.6.1.a. (V) Dramatizaciones. Improvisar una conversación telefónica. Ejemplo: llamar a tus padres al trabajo para pedirles que vayan a buscarte al colegio.","MAT":"(L) Dibuja un ángulo y marca sus partes. Rectas perpendiculares. Indica si las rectas son perpendiculares o no. Escribe una lista de objetos del aula que contengan ángulos rectos. (M) Problemas exprés. (X) Resolución de problemas. Dibuja tres ángulos rectos con la ayuda de la escuadra. Gira la escuadra para que los ángulos estén en diferentes posiciones. C.EV.2.1.a. (J) Calca el plano y completa el nombre de las calles, siguiendo las instrucciones. (V) Concurso de problemas. Cálculo mental. Doble de dos cifras sin llevadas. C.EV.7.1.a.","CMN":"(J) Investiga sobre los avances e inventos de la Edad moderna y realiza una ficha de uno de ellos, el que creas más importante. Ponla en común con el resto de la clase. (V) SdA. UD. Línea del tiempo de nuestra vida.","EAR":"(V) Murillo. Copia la obra. Niños comiendo melón y uvas."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. C.EV.2.1.a. Clases de oraciones. Copio y completo el esquema C.EV.9.1.a. (M) Salida al Centro Pompidou en Málaga. (X) Capítulo del libro. Taller de escritura. Escribo un diálogo entre personajes de un cuento. Lectura a los compañeros. (J) Cuenta cuentos. C.EV.4.1.a. Vocabulario. Palabras terminadas en d y z (V) Dramatizaciones. Repasamos la ortografía de la unidad. Inventamos un dictado en grupo. Por equipos, formamos oraciones, escribimos y entregamos al maestro/a. Escucha, escribe, revisa y corrige.","MAT":"(L) Esquema tipo de ángulos. En grupos, representa ángulos de diferente amplitud, con el cuerpo. (M) Salida al Centro Pompidou en Málaga. (X) Resolución de problemas. Situación en un plano. Dibuja el plano de tu clase. Fíjate en la forma de tu clase, donde están las puertas y las ventanas. Dibuja primero los objetos grandes y después el resto. C.EV.5.1.a. (J) Construimos un geoplano para conocer mejor las rectas los ángulos y el plano. (V) Concurso de problemas. Pienso paso a paso. Utiliza un muñequito para indicar los pasos a seguir para llegar hasta la casa en el plano. C.EV.4.1.a.","CMN":"(J) Investiga y escribe algunos avances de la Edad Contemporánea, comparte el resultado con el grupo. (V) SdA. Proyecto. Huellas del pasado. Producto. Escribir el contenido del Lapbook.","EAR":"(V) APS. Opera prima. Producto. Diseño de un cartel para el evento de fin de curso. C.EV.2.B.11"}],"complementaria":"Salida al Centro Pompidou en Málaga.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individua s, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el original indica 'Del 8 al 30 de mayo de 2025'. En 2025 el 8/5 es jueves y el 30/5 viernes: salen 17 días lectivos (coincide), pero son 3 semanas y media y la secuenciación solo tiene 3 semanas con (L)-(V).","ODS indicado como 'ODS 4-16'; se separa en ODS 4 y ODS 16. El título de sda.ud no aparece explícito: se usa el título de la UD.","LCL: en las semanas 2 y 3 se usa 'C.EV.2.1.a', criterio que no existe en LCL en esta UD (sí 3.2.a, 4.1.a, 5.1.a, 6.1.a, 9.1.a). La actividad (X) 'Escribo un diálogo entre personajes de un cuento' se repite en semanas 2 y 3. La semana 1 (ciudades del futuro, robots) casa poco con el centro de interés (la historia). Falta punto antes de '(V)' en semana 3 y tras 'Participo en un debate' en semana 1.","MAT: errata 'restas paralelas' (rectas) en semana 1; 'Identifica ángulos Los elementos' sin punto. El criterio 7.1.a empieza en minúscula. En la evaluación aparece 'MAT. 5.4.a', pero el criterio de la UD es 5.1.a. El saber 2.E.1.1 'Gráficos estadísticos cotidianos' no se trabaja en ninguna actividad.","CMN: en semana 1 se usa 'C.Ev 5.1.a.' y en la evaluación 'CMN. 2.2.a. / 5.1.a. / 6.1.a.', que no coinciden con los criterios de la UD (2.2.a, 7.1.a, 9.1.a); 5.1.a y 6.1.a parecen copiados de otra UD. Semanas 2 y 3 sin C.EV. Competencia 9: 'Participar la vida social' (falta 'en') y 'dialogo' sin tilde. La SdA UD 'Línea del tiempo de nuestra vida' figura en (V) de las semanas 1 y 2.","EAR: el criterio es 3.3.a, pero en semana 3 y en la evaluación se usa el código del saber 2.B.11 como criterio. El saber 'Características del lenguaje audiovisual' casa poco con esgrafiado, copia de Murillo y diseño de un cartel. En el original falta espacio en 'curso.C.EV.2.B.11'.","Complementaria: la salida al Centro Pompidou ocupa el (M) de la semana 3 en LCL y MAT.","Evaluación: la tabla de instrumentos/procedimiento
