          <h3>${esc(sec.titulo)}</h3>
          <p class="tenue num">Previsto: ${mmss(sec.iniMin * 60)}–${mmss(sec.finMin * 60)} · <span data-desfase></span></p>
          ${st.esquema ? `<ul class="esq-lista">${sec.esquema.map((e) => `<li>${htmlPartes(e)}</li>`).join('')}</ul>` : ''}
          ${st.guion && expo.guion ? `<div class="a5" style="width:100%;aspect-ratio:auto;font-size:1rem">${htmlPartes(expo.guion)}</div>` : ''}
        </div>
      </div>`;
    };
    const htmlFin = () => {
      const filas = st.cortes.map((c, i) => {
        const s = expo.secciones[i];
        const dur = c - (i ? st.cortes[i - 1] : 0);
        const prev = s.minutos * 60;
        const d = dur - prev;
        return `<tr><td>${i + 1}. ${esc(s.titulo)}</td><td class="n">${mmss(prev)}</td><td class="n">${mmss(dur)}</td><td class="n" style="color:${Math.abs(d) > 60 ? 'var(--critico)' : Math.abs(d) > 30 ? 'var(--aviso)' : 'var(--bueno)'}">${d >= 0 ? '+' : '−'}${mmss(Math.abs(d))}</td></tr>`;
      }).join('');
      const total = st.cortes.length ? st.cortes[st.cortes.length - 1] : st.t;
      return `
      <div class="tarjeta elevada pila">
        <div class="fila entre"><h3>Resultado del ensayo</h3><span class="chip ${total > LIMITE ? 'critico' : total > LIMITE - 60 ? 'aviso' : 'bueno'}">${mmss(total)} ${total > LIMITE ? '· te has pasado de 30:00' : ''}</span></div>
        <div class="desliza"><table class="tabla"><thead><tr><th>Sección</th><th class="n">Previsto</th><th class="n">Real</th><th class="n">Diferencia</th></tr></thead><tbody>${filas}</tbody></table></div>
        ${st.cobertura != null ? `<p class="${st.cobertura >= 80 ? 'info-caja' : 'aviso-caja'}">Palabras clave del discurso que se han oído: <b>${st.cobertura} %</b>.</p>` : ''}
        ${st.grabacion ? `<div class="pila" style="gap:6px"><b>Tu grabación</b><audio controls src="${st.grabacion}" style="width:100%"></audio><a class="btn mini" href="${st.grabacion}" download="ensayo-${esc(expo.id)}.webm">Descargar la grabación</a></div>` : ''}
        <div class="fila"><button class="btn primario" data-acc="otra">Otro ensayo</button><a class="btn" href="#${expo.id}-rubrica">Autoevaluarme con la rúbrica</a></div>
      </div>
      ${htmlHistorial()}`;
    };
    const pintar = () => {
      const r = $('[data-ensayo]', raizRef);
      r.innerHTML = st.fase === 'preparar' ? htmlPreparar() : st.fase === 'corriendo' ? htmlCorriendo() : htmlFin();
      tic();
    };
    const tic = () => {
      if (st.fase !== 'corriendo') return;
      const t = ahora();
      st.t = t;
      const c = $('[data-crono]', raizRef);
      if (!c) return;
      c.textContent = mmss(t);
      c.classList.toggle('aviso', t >= 25 * 60 && t < 29 * 60);
      c.classList.toggle('critico', t >= 29 * 60);
      $('[data-restante]', raizRef).textContent = t <= LIMITE ? `quedan ${mmss(LIMITE - t)}` : `+${mmss(t - LIMITE)} sobre 30:00`;
      const total = expo.secciones[expo.secciones.length - 1].finMin * 60 || LIMITE;
      $('[data-aguja]', raizRef).style.left = `${Math.min(100, (t / total) * 100)}%`;
      const d = t - objetivo(st.sec);
      const df = $('[data-desfase]', raizRef);
      if (df) df.innerHTML = d > 0 ? `<b style="color:var(--critico)">vas ${mmss(d)} retrasada respecto al final previsto de la sección</b>` : `te quedan ${mmss(-d)} para esta sección`;
      if (st.pitidos) {
        [[25 * 60, 660], [29 * 60, 880], [30 * 60, 1040]].forEach(([s, f]) => { if (t >= s && !st.avisados[s]) { st.avisados[s] = true; pitido(f, 0.35); } });
      }
    };
    const empezarGrabacion = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        media = new MediaRecorder(stream);
        st.trozos = [];
        media.ondataavailable = (e) => { if (e.data.size) st.trozos.push(e.data); };
        media.onstop = () => {
          const blob = new Blob(st.trozos, { type: media.mimeType || 'audio/webm' });
          st.grabacion = URL.createObjectURL(blob);
          if (st.fase === 'fin') pintar();
          if (stream) stream.getTracks().forEach((tr) => tr.stop());
        };
        media.start(1000);
      } catch (e) { st.grabar = false; Opo.aviso('No se ha podido usar el micrófono: el ensayo sigue sin grabar.'); }
    };
    const empezarTranscripcion = () => {
      try {
        rec = new RECONOCIMIENTO();
        rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = false;
        rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) st.textos.push(e.results[i][0].transcript); };
        rec.onerror = (e) => { if (e.error === 'not-allowed') { Opo.aviso('Sin permiso de micrófono: no se transcribirá.'); rec = null; } };
        rec.onend = () => { if (rec && st.fase === 'corriendo') { try { rec.start(); } catch (e) { /* nada */ } } };
        rec.start();
      } catch (e) { rec = null; }
    };
    const terminar = () => {
      if (st.fase !== 'corriendo') return;
      st.t = ahora();
      if (st.cortes.length < expo.secciones.length && (!st.cortes.length || st.cortes[st.cortes.length - 1] < st.t - 1)) st.cortes.push(st.t);
      st.fase = 'fin'; st.corriendo = false;
      clearInterval(timer);
      if (rec) { const r = rec; rec = null; try { r.stop(); } catch (e) { /* nada */ } }
      if (media && media.state !== 'inactive') media.stop();
      if (wake) { try { wake.release(); } catch (e) { /* nada */ } wake = null; }
      if (st.textos.length) {
        const dichas = new Set(palabrasClave(st.textos.join(' ')));
        const hasta = expo.secciones.slice(0, st.cortes.length).flatMap((s) => s.bloques.flatMap((b) => palabrasClave(b.texto)));
        st.cobertura = hasta.length ? Math.round((hasta.filter((w) => dichas.has(w)).length / hasta.length) * 100) : 0;
      }
      Progreso.guardarEnsayo({ expo: expo.id, fecha: Date.now(), total: Math.round(st.t), cortes: st.cortes.map((c) => Math.round(c)), cobertura: st.cobertura ?? null });
      pintar();
    };
    const siguiente = () => {
      if (st.fase !== 'corriendo') return;
      st.cortes.push(ahora());
      if (st.sec >= expo.secciones.length - 1) { terminar(); return; }
      st.sec++;
      pintar();
    };
    const tecla = (ev) => {
      if (st.fase !== 'corriendo' || ev.target.closest('input,select,textarea,button')) return;
      if (ev.code === 'Space' || ev.key === 'Enter') { ev.preventDefault(); siguiente(); }
    };
    return {
      html: '<div data-ensayo class="pila"></div>',
      montar(raiz) {
        raizRef = raiz;
        reproductor.pausa();
        pintar();
        document.addEventListener('keydown', tecla);
        raiz.addEventListener('click', async (ev) => {
          const b = ev.target.closest('[data-acc]');
          if (!b) return;
          const a = b.dataset.acc;
          if (a === 'empezar') {
            st.esquema = !!$('#en-esq', raiz)?.checked; st.guion = !!$('#en-guion', raiz)?.checked; st.pitidos = !!$('#en-pit', raiz)?.checked;
            st.grabar = !!$('#en-grab', raiz)?.checked; st.transcribir = !!$('#en-trans', raiz)?.checked;
            Object.assign(st, { fase: 'corriendo', acumulado: 0, inicio: performance.now(), corriendo: true, sec: 0, cortes: [], textos: [], avisados: {}, grabacion: null, cobertura: undefined });
            if (st.pitidos) pitido(520, 0.12);
            if (st.grabar) await empezarGrabacion();
            if (st.transcribir && RECONOCIMIENTO) empezarTranscripcion();
            try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }
            clearInterval(timer); timer = setInterval(tic, 250);
            pintar();
          } else if (a === 'siguiente') siguiente();
          else if (a === 'pausa') {
            if (st.corriendo) { st.acumulado = ahora(); st.corriendo = false; if (media && media.state === 'recording') media.pause(); }
            else { st.inicio = performance.now(); st.corriendo = true; if (media && media.state === 'paused') media.resume(); }
            pintar();
          } else if (a === 'terminar') terminar();
          else if (a === 'otra') { st.fase = 'preparar'; pintar(); }
        });
        const p = Opo.App.tomarPendiente();
        if (p && p.empezar) setTimeout(() => { const b = $('[data-acc=empezar]', raiz); if (b) { const g = $('#en-guion', raiz); if (g) g.checked = true; b.click(); } }, 50);
      },
      destruir() {
        clearInterval(timer);
        document.removeEventListener('keydown', tecla);
        if (rec) { const r = rec; rec = null; try { r.stop(); } catch (e) { /* nada */ } }
        if (media && media.state !== 'inactive') { try { media.stop(); } catch (e) { /* nada */ } }
        if (stream) stream.getTracks().forEach((tr) => tr.stop());
        if (wake) { try { wake.release(); } catch (e) { /* nada */ } }
      },
    };
  };

  // ---------------------------------------------------------------- guion A5
  Pest.guion = (expo) => {
    if (!expo.guion) return { html: '<p>Esta exposición no tiene guion.</p>' };
    const texto = textoDe(expo.guion);
    const n = contarPalabras(texto);
    const plantilla = Modelo.plantilla && Modelo.plantilla.guion ? Opo.partes(Modelo.plantilla.guion, null) : null;
    const html = `
      <div class="rejilla-2">
        <div class="pila">
          <div class="fila entre"><h3>Guion para el DIN A5</h3><span class="chip ${n <= 120 ? 'bueno' : 'critico'}">${n} / 120 palabras</span></div>
          <div class="a5" data-a5>${htmlPartes(expo.guion)}</div>
          <div class="fila"><button class="btn" data-acc="copiar">Copiar el guion</button></div>
        </div>
        <div class="pila">
          <div class="tarjeta pila" style="gap:8px">
            <h3>Normas del guion</h3>
            <ul class="esq-lista">
              <li>Una cara de un DIN A5 que te da el tribunal, en blanco.</li>
              <li>Máximo 120 palabras; si las supera, no te dejan usarlo.</li>
              <li>Lo escribes durante la hora de preparación y lo entregas al terminar.</li>
              <li>El material auxiliar no puede tener contenido curricular.</li>
            </ul>
          </div>
          ${plantilla ? `<div class="tarjeta pila" style="gap:8px"><h3>Estructura común (igual en las 12 UD)</h3><p class="suave" style="line-height:1.8">${htmlPartes(plantilla, { etiquetas: Modelo.etiquetasHuecos })}</p></div>` : ''}
        </div>
      </div>`;
    return {
      html,
      montar(raiz) { $('[data-acc=copiar]', raiz).addEventListener('click', () => Opo.copiar(texto, $('[data-a5]', raiz))); },
    };
  };

  // ---------------------------------------------------------------- ficha de la UD
  Pest.ficha = (expo) => {
    const f = expo.ficha;
    if (!f) return { html: '<p class="suave">No hay ficha extraída para esta unidad.</p>' };
    const t = (x) => esc(x || '—');
    const areas = (f.areas || []).map((a) => `
      <div class="tarjeta pila" style="gap:8px">
        <h3>${esc(a.area)}</h3>
        <div class="desliza"><table class="tabla"><thead><tr><th>Competencias específicas</th><th>Criterios de evaluación</th><th>Saberes básicos</th></tr></thead><tbody><tr>
          <td><ul class="lista-limpia">${(a.competencias || []).map((c) => `<li><b>${esc(c.num)}.</b> ${esc(c.texto)}</li>`).join('')}</ul></td>
          <td><ul class="lista-limpia">${(a.criterios || []).map((c) => `<li><b>${esc(c.codigo)}</b> ${esc(c.texto)}</li>`).join('')}</ul></td>
          <td><ul class="lista-limpia">${(a.saberes || []).map((c) => `<li><b>${esc(c.codigo)}</b> ${esc(c.texto)}</li>`).join('')}</ul></td>
        </tr></tbody></table></div>
      </div>`).join('');
    const semanas = (f.semanas || []).map((s) => `
      <div class="tarjeta"><h3>Semana ${esc(s.numero)} · ${esc(s.fase)}</h3>
        <dl style="margin-top:8px">${['LCL', 'MAT', 'CMN', 'EAR'].filter((k) => s[k]).map((k) => `<dt>${k}</dt><dd>${esc(s[k])}</dd>`).join('')}</dl></div>`).join('');
    const sda = f.sda || {};
    const html = `
      <div class="pila">
        <p class="tenue">Datos tal como aparecen en la programación, para consultar durante el estudio.</p>
        <div class="rejilla">
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Identificación</span>
            <p><b>${t(f.fechas)}</b> · ${t(f.dias)} días lectivos · trimestre ${t(f.trimestre)}</p>
            <p>Centro de interés: ${t(f.centroInteres)}</p>
            <p>Objetivos de etapa: ${esc((f.objetivosEtapa || []).join(', '))}</p></div>
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Justificación</span><p>${t(f.relevanciaSocial)}</p><p>${esc((f.ods || []).join(' · '))}</p></div>
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Situaciones de aprendizaje</span>
            <p><b>UD:</b> ${t(sda.ud && (sda.ud.producto || sda.ud.titulo))}</p>
            <p><b>Proyecto ${t(sda.proyecto && sda.proyecto.nombre)}:</b> ${t(sda.proyecto && sda.proyecto.producto)}</p>
            <p><b>APS ${t(sda.aps && sda.aps.nombre)}:</b> ${t(sda.aps && sda.aps.producto)}</p></div>
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Actividad complementaria</span><p>${t(f.complementaria)}</p></div>
        </div>
        <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Objetivos de aprendizaje</span><ul class="lista-limpia">${(f.objetivosAprendizaje || []).map((o) => `<li>${esc(o)}</li>`).join('')}</ul>
          <p class="tenue">Descriptores: ${t(f.competenciasClave)}</p></div>
        ${areas}
        <h3>Secuencia didáctica</h3>
        <div class="ficha-semanas">${semanas}</div>
        <div class="rejilla">
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Metodología</span><p>${t(f.metodologia)}</p><p>${t(f.agrupamientos)}</p><p class="tenue">${t(f.principiosPedagogicos)}</p></div>
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Recursos</span>${Object.entries(f.recursos || {}).map(([k, v]) => `<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Atención a la diversidad</span>${(f.diversidad && f.diversidad.dua || []).map((d) => `<p>${esc(d)}</p>`).join('')}<p>${t(f.diversidad && f.diversidad.medidasGenerales)}</p><p>${t(f.diversidad && f.diversidad.medidasEspecificas)}</p></div>
          <div class="tarjeta pila" style="gap:6px"><span class="eyebrow">Evaluación</span><p>${t(f.evaluacion && f.evaluacion.instrumentos)}</p><p>${t(f.evaluacion && f.evaluacion.procedimientos)}</p><p class="tenue">${t(f.evaluacion && f.evaluacion.productos)}</p></div>
        </div>
        ${(f.observaciones || []).length ? `<div class="aviso-caja"><b>Erratas o incoherencias detectadas en esta UD de la programación</b> (conviene tenerlas presentes para no repetirlas en la exposición):<ul>${f.observaciones.map((o) => `<li>${esc(o)}</li>`).join('')}</ul></div>` : ''}
      </div>`;
    return { html };
  };

  // ---------------------------------------------------------------- rúbrica / autoevaluación
  Pest.rubrica = (expo) => {
    const R = Modelo.rubricas && Modelo.rubricas[expo.tipo];
    if (!R) return { html: '<p>No hay rúbrica.</p>' };
    const notas = {};
    R.items.forEach((it) => { notas[it.id] = 5; });
    const ult = Progreso.autoevaluaciones().find((r) => r.expo === expo.id);
    if (ult) Object.assign(notas, ult.notas);
    const sumaPesos = R.items.reduce((a, it) => a + it.peso, 0);
    const total = () => R.items.reduce((a, it) => a + it.peso * notas[it.id], 0) / sumaPesos;
    const total2025 = R.items.reduce((a, it) => a + it.peso * it.media2025, 0) / sumaPesos;
    const html = `
      <div class="pila">
        <div class="tarjeta elevada fila entre">
          <div class="pila" style="gap:4px"><span class="eyebrow">Tu nota estimada (${expo.tipo === 'pd' ? 'defensa' : 'exposición'})</span><span class="rub-total num" data-total>0</span></div>
          <div class="pila" style="gap:4px;text-align:right"><span class="eyebrow">Media del tribunal en 2025</span><span class="num" style="font-size:1.6rem;font-weight:800">${coma(total2025, 2)}</span></div>
          <button class="btn primario" data-acc="guardar">Guardar autoevaluación</button>
        </div>
        <p class="tenue">${esc(R.nota)} ${esc(R.penalizacion)} Puntúa cada apartado tras un ensayo; los indicadores son los de la rúbrica oficial.</p>
        <div>${R.items.map((it) => `
          <div class="rub-item">
            <div><b>${esc(it.titulo)}</b> <span class="chip">${coma(it.peso, 1)} %</span> <span class="chip ${claseNota(it.media2025)}">2025: ${coma(it.media2025, 2)}</span>
              <ul>${it.indicadores.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>
            <div class="pila" style="gap:4px"><input type="range" min="0" max="10" step="0.25" value="${notas[it.id]}" data-item="${esc(it.id)}" aria-label="${esc(it.titulo)}"><span class="num tenue" data-val="${esc(it.id)}">${coma(notas[it.id], 2)}</span></div>
          </div>`).join('')}</div>
        <div data-hist></div>
      </div>`;
    const pintarHist = (raiz) => {
      const l = Progreso.autoevaluaciones().filter((r) => r.expo === expo.id).slice(0, 10);
      $('[data-hist]', raiz).innerHTML = l.length ? `<div class="tarjeta"><h3>Historial</h3><div class="desliza"><table class="tabla"><thead><tr><th>Fecha</th><th class="n">Nota</th></tr></thead><tbody>${l.map((r) => `<tr><td>${new Date(r.fecha).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })}</td><td class="n">${coma(r.total, 2)}</td></tr>`).join('')}</tbody></table></div></div>` : '';
    };
    return {
      html,
      montar(raiz) {
        const pt = () => { $('[data-total]', raiz).textContent = coma(total(), 2); };
        pt();
        pintarHist(raiz);
        raiz.addEventListener('input', (ev) => {
          const r = ev.target.closest('[data-item]');
          if (!r) return;
          notas[r.dataset.item] = Number(r.value);
          $(`[data-val="${r.dataset.item}"]`, raiz).textContent = coma(Number(r.value), 2);
          pt();
        });
        $('[data-acc=guardar]', raiz).addEventListener('click', () => {
          Progreso.guardarAutoevaluacion({ expo: expo.id, tipo: expo.tipo, fecha: Date.now(), notas: { ...notas }, total: total() });
          Opo.aviso('Autoevaluación guardada');
          pintarHist(raiz);
        });
      },
    };
  };

  // ================================================================ vista contenedora
  function vistaExpo(expoId, pestana) {
    const expo = Modelo.expo(expoId);
    if (!expo) return { html: '<div class="aviso-caja">Todavía no hay contenido para esta exposición.</div>' };
    const pests = PESTANAS.filter((p) => !p[2] || p[2] === expo.tipo);
    if (!pests.find((p) => p[0] === pestana)) pestana = 'esquema';
    const sub = (Pest[pestana] || Pest.esquema)(expo);
    const u = expo.ud;
    const numUD = u ? u.numero : 0;
    const vecinos = u ? `<div class="fila">${numUD > 1 ? `<a class="btn mini" href="#${Modelo.idUD(numUD - 1)}-${pestana}">← UD ${numUD - 1}</a>` : ''}${numUD < 12 && Modelo.expo(Modelo.idUD(numUD + 1)) ? `<a class="btn mini" href="#${Modelo.idUD(numUD + 1)}-${pestana}">UD ${numUD + 1} →</a>` : ''}</div>` : '';
    const sda = u && u.valores ? (u.valores.sda_producto || u.valores.producto_sda || '') : '';
    const html = `
      <div class="pila">
        <div class="cab-expo">
          <div class="titulo">
            <div class="migas"><a href="#inicio">Inicio</a> › ${expo.tipo === 'pd' ? 'Parte A · Programación' : '<a href="#uds">Parte B · Unidades didácticas</a>'}</div>
            <h1>${expo.tipo === 'pd' ? 'Defensa de la programación' : esc(expo.titulo)}</h1>
            <p class="suave">${expo.tipo === 'pd' ? '«Aprendemos juntos» · 3.º de Educación Primaria · máximo 30 minutos' : `${esc(u.fechas || '')} · ${u.dias ? esc(u.dias) + ' días lectivos · ' : ''}${esc(['', 'primer', 'segundo', 'tercer'][u.trimestre] || '')} trimestre${sda ? ` · SdA: ${esc(sda)}` : ''}`}</p>
          </div>
          <div class="pila" style="gap:6px;align-items:flex-end">
            <div class="fila"><span class="chip num" title="Duración del texto a 130 palabras por minuto">≈ ${coma(expo.minutosTexto)} min</span><span class="chip ${expo.audio ? 'bueno' : ''}">${expo.audio ? 'Audio grabado' : 'Voz del navegador'}</span></div>
            ${puntosDominio(expo)}
            ${vecinos}
          </div>
        </div>
        <nav class="pestanas" aria-label="Apartados">${pests.map(([k, t]) => `<a href="#${expo.id}-${k}" ${k === pestana ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>
        <div data-sub>${sub.html}</div>
      </div>`;
    return {
      html,
      titulo: `${expo.corto} · ${pests.find((p) => p[0] === pestana)[1]}`,
      montar(raiz) { if (sub.montar) sub.montar($('[data-sub]', raiz)); },
      destruir() { if (sub.destruir) sub.destruir(); },
    };
  }

  // ================================================================ pizarra a pantalla completa
  Opo.pantallaPizarra = (expo) => {
    const capa = document.createElement('div');
    capa.className = 'pz-pantalla';
    capa.setAttribute('role', 'dialog');
    capa.setAttribute('aria-label', 'Pizarra a pantalla completa');
    capa.innerHTML = `<div data-pz></div><div class="controles">
      <button class="btn redondo" data-a="ant" aria-label="Sección anterior">${ICONOS.atras}</button>
      <button class="btn grande" data-a="play" aria-label="Reproducir o pausar">${ICONOS.play}</button>
      <button class="btn redondo" data-a="sig" aria-label="Sección siguiente">${ICONOS.adelante}</button>
      <button class="btn" data-a="cerrar">${ICONOS.cerrar} Cerrar</button></div>`;
    document.body.appendChild(capa);
    reproductor.cargar(expo);
    const pz = new Opo.VistaPizarra($('[data-pz]', capa), expo);
    const sincro = (e) => {
      if (e.expo && e.expo.id === expo.id) pz.mostrarHasta(e.frase, e.seccion);
      $('[data-a=play]', capa).innerHTML = e.reproduciendo ? ICONOS.pausa : ICONOS.play;
    };
    const quitar = reproductor.suscribir(sincro);
    sincro(reproductor.estado());
    const cerrar = () => {
      quitar(); pz.destruir(); capa.remove(); document.removeEventListener('keydown', tecla);
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    };
    const tecla = (ev) => {
      if (ev.key === 'Escape') cerrar();
      else if (ev.key === ' ') { ev.preventDefault(); reproductor.alternar(); }
      else if (ev.key === 'ArrowRight') reproductor.seccionRelativa(1);
      else if (ev.key === 'ArrowLeft') reproductor.seccionRelativa(-1);
    };
    document.addEventListener('keydown', tecla);
    capa.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'cerrar') cerrar();
      else if (a === 'play') reproductor.alternar();
      else if (a === 'ant') reproductor.seccionRelativa(-1);
      else if (a === 'sig') reproductor.seccionRelativa(1);
    });
    try { if (capa.requestFullscreen) capa.requestFullscreen().catch(() => {}); } catch (e) { /* opcional */ }
    setTimeout(() => pz.reescalar(), 200);
  };

  Opo.Vistas = Object.assign(Opo.Vistas || {}, { expo: vistaExpo, itemRubrica, claseNota, htmlBloque, normalizar });
})();

</script>
<script>
/* Vistas generales: inicio, unidades, plantilla común, diferencias, sorteo y ajustes. */
(function () {
  'use strict';
  const Opo = window.Opo;
  const { esc, $, $$, mmss, coma, htmlPartes, partes, partesPorFrase, Modelo, Progreso, reproductor, Almacen } = Opo;
  const V = Opo.Vistas;

  const TRIM = ['', 'Primer trimestre', 'Segundo trimestre', 'Tercer trimestre'];
  const sdaDe = (u) => {
    const f = Modelo.fichas[u.numero];
    return (f && f.sda && f.sda.ud && (f.sda.ud.producto || f.sda.ud.titulo)) || '';
  };
  const dominioHtml = (expo) => {
    if (!expo) return '';
    const s = Progreso.srs()[expo.id] || {};
    return `<span class="dominio" aria-label="Dominio ${Math.round(Progreso.dominio(expo) * 100)} %">${expo.secciones.map((sec) => `<i class="n${(s[sec.id] && s[sec.id].n) || 0}"></i>`).join('')}</span>`;
  };

  // ================================================================ INICIO
  function barrasPerdidas(tipo, max = 8) {
    const R = Modelo.rubricas && Modelo.rubricas[tipo];
    if (!R) return '';
    const items = R.items.map((it) => ({ ...it, perdidos: (it.peso * (10 - it.media2025)) / 100 })).sort((a, b) => b.perdidos - a.perdidos).slice(0, max);
    const tope = Math.max(...items.map((i) => i.perdidos), 0.01);
    return `<div class="barras" role="list">${items.map((it) => `
      <div class="barra-fila" role="listitem" title="${esc(it.titulo)} · peso ${coma(it.peso, 1)} % · media 2025: ${coma(it.media2025, 2)} · puntos perdidos: ${coma(it.perdidos, 2)}">
        <span class="et"><b>${esc(it.titulo.replace(/:.*/, ''))}</b> · peso ${coma(it.peso, 1)} % · media ${coma(it.media2025, 2)}</span>
        <span class="val">−${coma(it.perdidos, 2)}</span>
        <span class="pista"><span class="relleno" style="width:${(it.perdidos / tope) * 100}%"></span></span>
      </div>`).join('')}</div>`;
  }

  function vistaInicio() {
    const pd = Modelo.expo('pd');
    const R = Modelo.rubricas;
    const media = (l) => (l && l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0);
    const pend = Progreso.pendientes().slice(0, 6);
    const ens = Progreso.ensayos().slice(0, 5);
    const nombre = (eid) => { const e = Modelo.expo(eid); return e ? e.corto : eid; };
    const secNombre = (eid, sid) => { const e = Modelo.expo(eid); const s = e && e.secciones.find((x) => x.id === sid); return s ? s.titulo : sid; };
    const udsHtml = Modelo.uds.map((u) => {
      const e = Modelo.expo(Modelo.idUD(u.numero));
      const d = Progreso.dominio(e);
      const n = d >= 0.75 ? 4 : d >= 0.5 ? 3 : d >= 0.25 ? 2 : d > 0 ? 1 : 0;
      return `<a class="chip ${['', 'critico', 'aviso', 'acento', 'bueno'][n]}" href="#${Modelo.idUD(u.numero)}-esquema" title="${esc(u.titulo)} · dominio ${Math.round(d * 100)} %">${u.numero}</a>`;
    }).join('');
    const html = `
      <div class="pila" style="gap:24px">
        <section class="hero">
          <div class="tarjeta elevada pila">
            <span class="eyebrow">Maestros · Educación Primaria · Andalucía</span>
            <h1>Segunda prueba: <span>dos exposiciones de 30 minutos</span></h1>
            <p class="suave">Programación «Aprendemos juntos» (3.º de Primaria) y sus 12 unidades didácticas. Cada exposición tiene su esquema, el discurso completo, el audio sincronizado con la pizarra y herramientas para memorizarla y ensayarla con cronómetro.</p>
            <div class="fila"><a class="btn primario" href="#pd-esquema">Empezar por la programación</a><a class="btn" href="#sorteo">Sortear una unidad</a></div>
          </div>
          <div class="tarjeta linea-prueba">
            <span class="eyebrow">Cómo es la prueba</span>
            <div class="reloj-prueba">
              <div class="a"><b>30'</b>Parte A · defensa de la programación<br><span class="tenue">30 % de la nota</span></div>
              <div class="b"><b>30'</b>Parte B · unidad didáctica<br><span class="tenue">70 % de la nota</span></div>
            </div>
            <ul class="esq-lista tenue">${(R ? R.prueba : []).map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
          </div>
        </section>

        <section class="rejilla-2">
          <a class="tarjeta acceso" href="#pd-esquema">
            <span class="eyebrow">Parte A</span>
            <h2>Defensa de la programación</h2>
            ${pd ? `<p class="suave">${pd.secciones.length} secciones · ${pd.palabras} palabras · ≈ ${coma(pd.minutosTexto)} min · ${pd.audio ? 'audio grabado' : 'voz del navegador'}</p>${dominioHtml(pd)}` : '<p class="suave">Contenido pendiente.</p>'}
          </a>
          <a class="tarjeta acceso" href="#uds">
            <span class="eyebrow">Parte B</span>
            <h2>Unidades didácticas</h2>
            <p class="suave">Un discurso común para las 12: memorízalo una vez y después solo lo propio de cada unidad.</p>
            <div class="fila" style="gap:6px">${udsHtml}</div>
          </a>
        </section>

        ${R ? `<section class="pila">
          <div><h2>Dónde se perdieron puntos en 2025</h2><p class="suave">Puntos perdidos en cada apartado = peso × (10 − media del tribunal). Lo de arriba es lo que más nota puede subir. Medias 2025: parte A ${coma(media(R.pd.totales2025), 2)} · parte B ${coma(media(R.ud.totales2025), 2)}.</p></div>
          <div class="rejilla-2">
            <div class="tarjeta pila"><h3>Parte B · unidad didáctica</h3>${barrasPerdidas('ud')}</div>
            <div class="tarjeta pila"><h3>Parte A · defensa de la programación</h3>${barrasPerdidas('pd')}</div>
          </div>
          <p class="nota-pie">Los discursos de esta app están escritos para nombrar en voz alta cada indicador de la rúbrica, con más tiempo para la secuencia didáctica, la metodología y la evaluación, y con más de tres citas normativas y bibliográficas.</p>
        </section>` : ''}

        <section class="rejilla-2">
          <div class="tarjeta pila">
            <h3>Repasos pendientes</h3>
            ${pend.length ? `<ul class="lista-limpia">${pend.map((p) => `<li><a href="#${p.expo}-memorizar" data-pend-sec="${esc(p.seccion)}" data-pend-expo="${esc(p.expo)}">${esc(nombre(p.expo))} · ${esc(secNombre(p.expo, p.seccion))}</a></li>`).join('')}</ul>` : '<p class="suave">Nada pendiente. Cuando califiques secciones en «Memorizar», aquí aparecerá lo que toca repasar cada día.</p>'}
          </div>
          <div class="tarjeta pila">
            <h3>Últimos ensayos</h3>
            ${ens.length ? `<div class="desliza"><table class="tabla"><tbody>${ens.map((e) => `<tr><td>${esc(nombre(e.expo))}</td><td>${new Date(e.fecha).toLocaleDateString('es-ES')}</td><td class="n">${mmss(e.total)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="suave">Aún no has hecho ningún ensayo cronometrado.</p>'}
          </div>
        </section>

        <section class="tarjeta pila">
          <h2>Método de estudio</h2>
          <ol class="esq-lista">
            <li><b>Esquema.</b> Aprende primero el orden de las secciones y sus minutos.</li>
            <li><b>Escuchar con la pizarra.</b> Oye el discurso mientras ves cómo se escribe la pizarra; a velocidad 0,9 al principio.</li>
            <li><b>Memorizar por secciones.</b> Leer → huecos al 25-50-75-100 % → iniciales → recitar con el esquema. Califícate y la app te dirá cuándo repasar.</li>
            <li><b>Unidades didácticas.</b> Primero la plantilla común (igual en las 12) y después «Lo propio» de cada unidad y las tarjetas de diferencias.</li>
            <li><b>Ensayo de 30 minutos</b> en voz alta, con cronómetro por secciones, y <b>autoevaluación</b> con la rúbrica oficial.</li>
            <li><b>Sorteo.</b> Simula el examen: tres bolas, eliges una, una hora de preparación y 30 minutos de exposición.</li>
          </ol>
        </section>
      </div>`;
    return {
      html, titulo: 'Inicio',
      montar(raiz) {
        raiz.addEventListener('click', (ev) => {
          const a = ev.target.closest('[data-pend-sec]');
          if (!a) return;
          const e = Modelo.expo(a.dataset.pendExpo);
          const i = e ? e.secciones.findIndex((s) => s.id === a.dataset.pendSec) : -1;
          if (i >= 0) Opo.App.pendiente = { seccion: i };
        });
      },
    };
  }

  // ================================================================ UNIDADES
  function vistaUDs() {
    const porTrim = [1, 2, 3].map((t) => ({ t, uds: Modelo.uds.filter((u) => Number(u.trimestre) === t) }));
    const sinTrim = Modelo.uds.filter((u) => ![1, 2, 3].includes(Number(u.trimestre)));
    const tarjeta = (u) => {
      const e = Modelo.expo(Modelo.idUD(u.numero));
      return `<a class="tarjeta ud-tarjeta" href="#${Modelo.idUD(u.numero)}-esquema">
        <span class="ud-num">UD ${u.numero}</span>
        <h3>${esc(u.titulo)}</h3>
        <span class="tenue">${esc(u.fechas || '')}${u.dias ? ` · ${esc(u.dias)} días` : ''}</span>
        ${sdaDe(u) ? `<span class="sda">SdA: ${esc(sdaDe(u))}</span>` : ''}
        ${dominioHtml(e)}
      </a>`;
    };
    const html = `
      <div class="pila" style="gap:22px">
        <div class="pila" style="gap:8px">
          <div class="migas"><a href="#inicio">Inicio</a> › Parte B</div>
          <h1>Unidades didácticas</h1>
          <p class="suave" style="max-width:70ch">Las 12 exposiciones comparten el mismo discurso. Solo cambian los datos propios de cada unidad (título, fechas, situación de aprendizaje, criterios, actividades de cada semana…), que aparecen <span class="propio">resaltados</span>. Memoriza la plantilla común una vez y después repasa lo propio de cada UD.</p>
        </div>
        <div class="rejilla">
          <a class="tarjeta acceso" href="#plantilla"><span class="eyebrow">Paso 1</span><h3>Plantilla común</h3><p class="suave">El discurso con los huecos marcados: lo que dirás igual en cualquier unidad.</p></a>
          <a class="tarjeta acceso" href="#diferencias"><span class="eyebrow">Paso 2</span><h3>Diferencias y tarjetas</h3><p class="suave">Tabla comparativa de las 12 UD y tarjetas para memorizar lo propio de cada una.</p></a>
          <a class="tarjeta acceso" href="#sorteo"><span class="eyebrow">Paso 3</span><h3>Sorteo y simulacro</h3><p class="suave">Tres bolas al azar, eliges una, una hora de preparación y 30 minutos de exposición.</p></a>
        </div>
        ${porTrim.filter((g) => g.uds.length).map((g) => `<section class="ud-trimestre"><h2>${TRIM[g.t]}</h2><div class="rejilla">${g.uds.map(tarjeta).join('')}</div></section>`).join('')}
        ${sinTrim.length ? `<section class="ud-trimestre"><div class="rejilla">${sinTrim.map(tarjeta).join('')}</div></section>` : ''}
        ${Modelo.uds.length ? '' : '<div class="aviso-caja">Todavía no hay unidades cargadas.</div>'}
      </div>`;
    return { html, titulo: 'Unidades didácticas' };
  }

  // ================================================================ PLANTILLA COMÚN
  function vistaPlantilla() {
    const pl = Modelo.plantilla;
    if (!pl) return { html: '<div class="aviso-caja">La plantilla aún no está disponible.</div>' };
    const st = { ud: 0 };
    const huecosTabla = `<div class="desliza"><table class="tabla"><thead><tr><th>Hueco</th><th>Qué va</th><th>Ejemplo (UD 1)</th></tr></thead><tbody>
      ${(pl.huecos || []).map((h) => `<tr><td><b>${esc(Modelo.etiquetasHuecos[h.id])}</b></td><td>${esc(h.descripcion)}</td><td class="tenue">${esc(h.ejemplo)}</td></tr>`).join('')}</tbody></table></div>`;
    const cuerpo = () => {
      const u = st.ud ? Modelo.uds.find((x) => x.numero === st.ud) : null;
      const val = u ? u.valores : null;
      return (pl.secciones || []).map((s, i) => `
        <section><h3>${i + 1}. ${esc(Opo.textoDe(partes(s.titulo, val || {})))} <span class="min">${coma(s.minutos)} min</span></h3>
          ${s.bloques.map((b) => `<p>${htmlPartes(partes(b.texto, val), val ? {} : { etiquetas: Modelo.etiquetasHuecos })}</p>`).join('')}</section>`).join('');
    };
    const html = `
      <div class="pila">
        <div class="migas"><a href="#inicio">Inicio</a> › <a href="#uds">Parte B</a> › Plantilla común</div>
        <h1>Plantilla común de las unidades didácticas</h1>
        <p class="suave" style="max-width:70ch">Este es el discurso que se repite en las 12 unidades. Los huecos ⟨así⟩ se rellenan con los datos de la unidad que salga en el sorteo. Aprende primero el texto común; los huecos los trabajarás en «Lo propio» y en las tarjetas.</p>
        <div class="fila"><label class="campo" style="flex-direction:row;align-items:center;gap:8px">Ver con los datos de
          <select data-ud><option value="0">ninguna UD (huecos)</option>${Modelo.uds.map((u) => `<option value="${u.numero}">UD ${u.numero}. ${esc(u.titulo)}</option>`).join('')}</select></label></div>
        <div class="tarjeta"><div class="discurso" data-cuerpo>${cuerpo()}</div></div>
        <details class="tarjeta"><summary><b>Los ${(pl.huecos || []).length} huecos de la plantilla</b></summary><div style="margin-top:10px">${huecosTabla}</div></details>
      </div>`;
    return {
      html, titulo: 'Plantilla común',
      montar(raiz) { $('[data-ud]', raiz).addEventListener('change', (ev) => { st.ud = Number(ev.target.value); $('[data-cuerpo]', raiz).innerHTML = cuerpo(); }); },
    };
  }

  // ================================================================ DIFERENCIAS Y TARJETAS
  function contextoHueco(expo, huecoId) {
    for (const bl of expo.bloques) {
      const ip = bl.partes.findIndex((p) => p.h === huecoId);
      if (ip < 0) continue;
      let off = 0;
      for (let i = 0; i < ip; i++) off += bl.partes[i].t.length;
      const corte = bl.cortes.find(([a, b]) => off >= a && off < b) || [0, bl.texto.length];
      const trozo = partesPorFrase(bl.partes, [corte]).find((t) => t.frase === 0);
      if (!trozo) continue;
      let puesto = false;
      return trozo.trozos.map((t) => {
        if (t.h === huecoId) { if (puesto) return ''; puesto = true; return '<span class="hueco-vacio">¿…?</span>'; }
        return t.h ? `<span class="propio">${esc(t.t)}</span>` : esc(t.t);
      }).join('');
    }
    return null;
  }

  function vistaDiferencias() {
    const pl = Modelo.plantilla;
    if (!pl || !Modelo.uds.length) return { html: '<div class="aviso-caja">Faltan las unidades.</div>' };
    const huecos = (pl.huecos || []).map((h) => h.id);
    const st = { modo: 'tarjetas', ud: 0, hueco: '', actual: null, mostrado: false, aciertos: 0, fallos: 0 };
    const tabla = () => `<div class="matriz-cont"><table class="matriz"><thead><tr><th>Hueco</th>${Modelo.uds.map((u) => `<th>UD ${u.numero}. ${esc(u.titulo)}</th>`).join('')}</tr></thead><tbody>
      ${huecos.map((h) => `<tr><th>${esc(Modelo.etiquetasHuecos[h])}</th>${Modelo.uds.map((u) => `<td>${esc((u.valores || {})[h] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const elegir = () => {
      const t = Progreso.tarjetas();
      const candidatos = [];
      Modelo.uds.forEach((u) => {
        if (st.ud && u.numero !== st.ud) return;
        huecos.forEach((h) => {
          if (st.hueco && h !== st.hueco) return;
          const v = t[`${u.numero}:${h}`] || { ok: 0, ko: 0 };
          const peso = 1 + v.ko * 2 - Math.min(v.ok, 4) * 0.2;
          candidatos.push({ n: u.numero, h, peso: Math.max(0.2, peso) });
        });
      });
      const total = candidatos.reduce((a, c) => a + c.peso, 0);
      let r = Math.random() * total;
      for (const c of candidatos) { r -= c.peso; if (r <= 0) return c; }
      return candidatos[candidatos.length - 1];
    };
    const htmlTarjeta = () => {
      if (!st.actual) st.actual = elegir();
      const { n, h } = st.actual;
      const u = Modelo.uds.find((x) => x.numero === n);
      const e = Modelo.expo(Modelo.idUD(n));
      const ctx = e ? contextoHueco(e, h) : null;
      return `<div class="tarjeta elevada pila">
        <div class="fila entre"><span class="eyebrow">UD ${n} · ${esc(u.titulo)}</span><span class="chip">${esc(Modelo.etiquetasHuecos[h])}</span></div>
        <p class="contexto-hueco">${ctx || `¿Qué va en «${esc(Modelo.etiquetasHuecos[h])}»?`}</p>
        ${st.mostrado ? `<div class="info-caja"><b>${esc((u.valores || {})[h] || '')}</b></div>
          <div class="fila"><button class="btn" data-acc="mal">No me lo sabía</button><button class="btn primario" data-acc="bien">Me lo sabía</button></div>`
        : '<div class="fila"><button class="btn primario" data-acc="mostrar">Mostrar la respuesta</button><button class="btn" data-acc="saltar">Otra tarjeta</button></div>'}
        <p class="tenue">Esta sesión: ${st.aciertos} aciertos · ${st.fallos} fallos</p>
      </div>`;
    };
    const html = `
      <div class="pila">
        <div class="migas"><a href="#inicio">Inicio</a> › <a href="#uds">Parte B</a> › Diferencias</div>
        <h1>Lo propio de cada unidad</h1>
        <div class="fila entre">
          <div class="fila" role="group" aria-label="Vista"><button class="chip" data-modo="tarjetas" aria-pressed="true">Tarjetas</button><button class="chip" data-modo="tabla" aria-pressed="false">Tabla comparativa</button></div>
          <div class="fila" data-filtros>
            <label class="campo" style="flex-direction:row;align-items:center;gap:6px">UD <select data-f="ud"><option value="0">todas</option>${Modelo.uds.map((u) => `<option value="${u.numero}">${u.numero}. ${esc(u.titulo)}</option>`).join('')}</select></label>
            <label class="campo" style="flex-direction:row;align-items:center;gap:6px">Dato <select data-f="hueco"><option value="">todos</option>${huecos.map((h) => `<option value="${esc(h)}">${esc(Modelo.etiquetasHuecos[h])}</option>`).join('')}</select></label>
          </div>
        </div>
        <div data-cuerpo></div>
      </div>`;
    return {
      html, titulo: 'Diferencias entre UD',
      montar(raiz) {
        const pintar = () => {
          $$('[data-modo]', raiz).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.modo === st.modo)));
          $('[data-filtros]', raiz).hidden = st.modo !== 'tarjetas';
          $('[data-cuerpo]', raiz).innerHTML = st.modo === 'tabla' ? tabla() : htmlTarjeta();
        };
        pintar();
        raiz.addEventListener('click', (ev) => {
          const m = ev.target.closest('[data-modo]');
          if (m) { st.modo = m.dataset.modo; pintar(); return; }
          const b = ev.target.closest('[data-acc]');
          if (!b) return;
          const a = b.dataset.acc;
          if (a === 'mostrar') st.mostrado = true;
          else if (a === 'saltar') { st.actual = null; st.mostrado = false; }
          else if (a === 'bien' || a === 'mal') {
            Progreso.marcarTarjeta(`${st.actual.n}:${st.actual.h}`, a === 'bien');
            if (a === 'bien') st.aciertos++; else st.fallos++;
            st.actual = null; st.mostrado = false;
          }
          pintar();
        });
        $$('[data-f]', raiz).forEach((s) => s.addEventListener('change', () => {
          st.ud = Number($('[data-f=ud]', raiz).value);
          st.hueco = $('[data-f=hueco]', raiz).value;
          st.actual = null; st.mostrado = false; pintar();
        }));
      },
    };
  }

  // ================================================================ SORTEO
  function vistaSorteo() {
    const st = { bolas: [], fase: 'bombo', elegida: 0, prepInicio: 0, prepAcum: 0, prepCorriendo: false };
    let timer = null;
    const nums = Modelo.uds.map((u) => u.numero);
    const pintar = (raiz) => {
      const c = $('[data-cuerpo]', raiz);
      if (st.fase === 'preparacion') {
        const u = Modelo.uds.find((x) => x.numero === st.elegida);
        const id = Modelo.idUD(st.elegida);
        c.innerHTML = `<div class="ensayo-panel">
          <div class="tarjeta elevada pila">
            <span class="eyebrow">Preparación · UD ${u.numero}. ${esc(u.titulo)}</span>
            <div class="cronometro" data-prep>60:00</div>
            <p class="suave">Una hora sin dispositivos: escribe el guion A5 (máx. 120 palabras) y repasa el esquema. Aquí puedes consultarlo todo.</p>
            <div class="fila"><button class="btn" data-acc="prep-pausa">${st.prepCorriendo ? 'Pausa' : 'Seguir'}</button><button class="btn primario" data-acc="exponer">Empezar la exposición (30:00)</button></div>
          </div>
          <div class="tarjeta pila">
            <h3>Material de la unidad</h3>
            <div class="fila"><a class="btn" href="#${id}-guion">Guion A5</a><a class="btn" href="#${id}-esquema">Esquema</a><a class="btn" href="#${id}-memorizar">Lo propio</a><a class="btn" href="#${id}-ficha">Ficha</a><a class="btn" href="#${id}-pizarra">Pizarra</a></div>
            <p class="tenue">Al volver a esta pestaña, el cronómetro de preparación sigue contando.</p>
          </div>
        </div>`;
        ticPrep(raiz);
        return;
      }
      c.innerHTML = `
        <div class="tarjeta elevada pila">
          <div class="bombo" aria-label="Bolas">${nums.map((n) => `<span class="bola ${st.bolas.includes(n) ? 'sale' : st.bolas.length === 3 ? 'apagada' : ''}">${n}</span>`).join('')}</div>
          <div class="fila">
            <button class="btn primario" data-acc="sacar" ${st.fase === 'sacando' ? 'disabled' : ''}>${st.bolas.length ? 'Volver a sortear' : 'Sacar tres bolas'}</button>
            <label class="interruptor"><input type="checkbox" id="so-peso" ${Almacen.leer('sorteoPonderado', false) ? 'checked' : ''}> Más probabilidad para las UD que menos dominas</label>
          </div>
        </div>
        ${st.bolas.length === 3 && st.fase === 'elegir' ? `<h2>Elige una</h2><div class="elegir-ud">${st.bolas.map((n) => {
          const u = Modelo.uds.find((x) => x.numero === n);
          const e = Modelo.expo(Modelo.idUD(n));
          return `<div class="tarjeta pila"><span class="ud-num">UD ${n}</span><h3>${esc(u.titulo)}</h3><span class="tenue">${esc(u.fechas || '')}</span>${sdaDe(u) ? `<span class="suave">SdA: ${esc(sdaDe(u))}</span>` : ''}${dominioHtml(e)}<button class="btn primario" data-elegir="${n}">Elegir esta unidad</button></div>`;
        }).join('')}</div>` : ''}
        ${historial()}`;
    };
    const historial = () => {
      const l = Progreso.sorteos().slice(0, 10);
      if (!l.length) return '';
      return `<div class="tarjeta"><h3>Sorteos anteriores</h3><div class="desliza"><table class="tabla"><tbody>${l.map((s) => `<tr><td>${new Date(s.fecha).toLocaleDateString('es-ES')}</td><td>Bolas ${s.bolas.join(' · ')}</td><td>${s.elegida ? `Elegida: UD ${s.elegida}` : '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
    };
    const ticPrep = (raiz) => {
      const el = $('[data-prep]', raiz);
      if (!el) return;
      const t = st.prepAcum + (st.prepCorriendo ? (performance.now() - st.prepInicio) / 1000 : 0);
      const resto = 3600 - t;
      el.textContent = resto >= 0 ? mmss(resto) : `+${mmss(-resto)}`;
      el.classList.toggle('critico', resto < 300);
    };
    const sacar = (raiz) => {
      const ponderado = $('#so-peso', raiz) && $('#so-peso', raiz).checked;
      Almacen.escribir('sorteoPonderado', !!ponderado);
      const bolsa = nums.map((n) => ({ n, peso: ponderado ? 1.6 - Progreso.dominio(Modelo.expo(Modelo.idUD(n))) : 1 }));
      const salen = [];
      while (salen.length < Math.min(3, bolsa.length)) {
        const quedan = bolsa.filter((b) => !salen.includes(b.n));
        const tot = quedan.reduce((a, b) => a + b.peso, 0);
        let r = Math.random() * tot;
        let pick = quedan[quedan.length - 1].n;
        for (const b of quedan) { r -= b.peso; if (r <= 0) { pick = b.n; break; } }
        salen.push(pick);
      }
      st.bolas = []; st.fase = 'sacando'; pintar(raiz);
      salen.forEach((n, i) => setTimeout(() => {
        st.bolas.push(n);
        if (st.bolas.length === salen.length) { st.fase = 'elegir'; Progreso.guardarSorteo({ fecha: Date.now(), bolas: salen.slice(), elegida: 0 }); }
        pintar(raiz);
      }, 650 * (i + 1)));
    };
    const html = `
      <div class="pila">
        <div class="migas"><a href="#inicio">Inicio</a> › <a href="#uds">Parte B</a> › Sorteo</div>
        <h1>Sorteo de la unidad didáctica</h1>
        <p class="suave" style="max-width:70ch">Como en el examen: salen tres unidades de tu programación, eliges una, tienes una hora para prepararla y la expones en 30 minutos como máximo.</p>
        <div data-cuerpo class="pila"></div>
      </div>`;
    return {
      html, titulo: 'Sorteo',
      montar(raiz) {
        const prev = Almacen.leer('prepActual', null);
        if (prev && prev.elegida && Date.now() - prev.desde < 3 * 3600 * 1000) {
          Object.assign(st, { fase: 'preparacion', elegida: prev.elegida, prepAcum: (Date.now() - prev.desde) / 1000, prepInicio: performance.now(), prepCorriendo: false });
          st.prepAcum = prev.pausado ? prev.acum : (Date.now() - prev.desde) / 1000;
          st.prepCorriendo = !prev.pausado;
          st.prepInicio = performance.now();
        }
        pintar(raiz);
        timer = setInterval(() => ticPrep(raiz), 500);
        raiz.addEventListener('click', (ev) => {
          const b = ev.target.closest('[data-acc],[data-elegir]');
          if (!b) return;
          if (b.dataset.elegir) {
            st.elegida = Number(b.dataset.elegir);
            const l = Progreso.sorteos(); if (l[0]) { l[0].elegida = st.elegida; Almacen.escribir('sorteos', l); }
            Object.assign(st, { fase: 'preparacion', prepAcum: 0, prepInicio: performance.now(), prepCorriendo: true });
            Almacen.escribir('prepActual', { elegida: st.elegida, desde: Date.now(), pausado: false, acum: 0 });
            pintar(raiz);
            return;
          }
          const a = b.dataset.acc;
          if (a === 'sacar') sacar(raiz);
          else if (a === 'prep-pausa') {
            if (st.prepCorriendo) { st.prepAcum += (performance.now() - st.prepInicio) / 1000; st.prepCorriendo = false; Almacen.escribir('prepActual', { elegida: st.elegida, desde: Date.now() - st.prepAcum * 1000, pausado: true, acum: st.prepAcum }); }
            else { st.prepInicio = performance.now(); st.prepCorriendo = true; Almacen.escribir('prepActual', { elegida: st.elegida, desde: Date.now() - st.prepAcum * 1000, pausado: false, acum: st.prepAcum }); }
            pintar(raiz);
          } else if (a === 'exponer') {
            Almacen.escribir('prepActual', null);
            Opo.App.pendiente = { empezar: true };
            Opo.App.ir(`${Modelo.idUD(st.elegida)}-ensayo`);
          }
        });
      },
      destruir() { clearInterval(timer); },
    };
  }

  // ================================================================ AJUSTES
  function vistaAjustes() {
    const aj = Opo.Ajustes.leer();
    const voces = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices().filter((v) => /^es/i.test(v.lang)) : [];
    const html = `
      <div class="pila">
        <h1>Ajustes</h1>
        <div class="rejilla-2">
          <div class="tarjeta pila">
            <h3>Pantalla</h3>
            <label class="campo">Tema<select id="aj-tema"><option value="sistema">Según el sistema</option><option value="claro">Claro (pizarra blanca)</option><option value="oscuro">Oscuro (pizarra verde)</option></select></label>
            <label class="campo">Tamaño del texto del discurso<input type="range" id="aj-tam" min="0.9" max="1.6" step="0.04" value="${aj.tamTexto}"></label>
          </div>
          <div class="tarjeta pila">
            <h3>Audio</h3>
            <label class="campo">Fuente<select id="aj-fuente"><option value="auto">Audio grabado si existe (recomendado)</option><option value="voz">Siempre la voz del navegador</option></select></label>
            <label class="campo">Voz del navegador<select id="aj-voz"><option value="">Automática</option>${voces.map((v) => `<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></label>
            <div class="fila"><button class="btn" data-acc="probar">Probar la voz</button></div>
            ${voces.length ? '' : '<p class="tenue">Este navegador no ofrece voces en español (o aún no las ha cargado).</p>'}
          </div>
        </div>
        <div class="tarjeta pila">
          <h3>Tu progreso</h3>
          <p class="suave">El progreso (repasos, ensayos, autoevaluaciones y tarjetas) se guarda solo en este navegador. Para pasarlo a otro dispositivo, copia el texto y pégalo allí.</p>
          <textarea id="aj-datos" aria-label="Datos de progreso" spellcheck="false"></textarea>
          <div class="fila"><button class="btn" data-acc="exportar">Copiar mi progreso</button><button class="btn" data-acc="importar">Cargar el texto pegado</button><button class="btn peligro" data-acc="borrar">Borrar todo el progreso</button></div>
          <div data-confirmar></div>
        </div>
        <p class="nota-pie">Contenidos elaborados a partir de la programación didáctica «Aprendemos juntos», de los criterios de actuación de los tribunales (Cuerpo 597, Andalucía 2025) y de la actilla de calificación de la segunda prueba. Revisa siempre la normativa vigente de tu convocatoria.</p>
      </div>`;
    return {
      html, titulo: 'Ajustes',
      montar(raiz) {
        $('#aj-tema', raiz).value = aj.tema;
        $('#aj-fuente', raiz).value = aj.fuente;
        $('#aj-voz', raiz).value = aj.voz;
        $('#aj-tema', raiz).addEventListener('change', (e) => Opo.Ajustes.poner('tema', e.target.value));
        $('#aj-tam', raiz).addEventListener('input', (e) => Opo.Ajustes.poner('tamTexto', Number(e.target.value)));
        $('#aj-fuente', raiz).addEventListener('change', (e) => { Opo.Ajustes.poner('fuente', e.target.value); reproductor.cambiarFuente(); });
        $('#aj-voz', raiz).addEventListener('change', (e) => Opo.Ajustes.poner('voz', e.target.value));
        raiz.addEventListener('click', (ev) => {
          const b = ev.target.closest('[data-acc]');
          if (!b) return;
          const a = b.dataset.acc;
          const ta = $('#aj-datos', raiz);
          if (a === 'probar' && 'speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance('Buenos días, miembros del tribunal. Paso a exponer la unidad didáctica.');
            const v = Opo.vozPreferida(); if (v) u.voice = v; u.lang = (v && v.lang) || 'es-ES';
            window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
          } else if (a === 'exportar') { ta.value = JSON.stringify(Almacen.exportar()); Opo.copiar(ta.value, ta); }
          else if (a === 'importar') {
            try { Almacen.importar(JSON.parse(ta.value)); Opo.Ajustes.aplicar(); Opo.aviso('Progreso cargado'); } catch (e) { Opo.aviso('El texto pegado no es un progreso válido.'); }
          } else if (a === 'borrar') {
            $('[data-confirmar]', raiz).innerHTML = '<div class="aviso-caja fila entre"><span>¿Seguro? Se borrarán repasos, ensayos, autoevaluaciones y ajustes de este navegador.</span><span class="fila"><button class="btn peligro" data-acc="borrar-si">Sí, borrar</button><button class="btn" data-acc="borrar-no">Cancelar</button></span></div>';
          } else if (a === 'borrar-si') { Almacen.borrarTodo(); Opo.Ajustes.aplicar(); $('[data-confirmar]', raiz).innerHTML = ''; Opo.aviso('Progreso borrado'); }
          else if (a === 'borrar-no') $('[data-confirmar]', raiz).innerHTML = '';
        });
      },
    };
  }

  Object.assign(Opo.Vistas, { inicio: vistaInicio, uds: vistaUDs, plantilla: vistaPlantilla, diferencias: vistaDiferencias, sorteo: vistaSorteo, ajustes: vistaAjustes });
})();

</script>
<script>
/* Arranque: enrutado por #ancla, barra superior y mini-reproductor. */
(function () {
  'use strict';
  const Opo = window.Opo;
  const { esc, $, mmss, ICONOS, Modelo, reproductor } = Opo;

  Opo.Ajustes.aplicar();

  const NAV = [['inicio', 'Inicio'], ['pd-esquema', 'Programación'], ['uds', 'Unidades'], ['sorteo', 'Sorteo'], ['ajustes', 'Ajustes']];
  let actual = null;
  let rutaActual = '';

  const App = {
    pendiente: null,
    tomarPendiente() { const p = this.pendiente; this.pendiente = null; return p; },
    ir(r) { if (location.hash === '#' + r) pintar(); else location.hash = r; },
  };
  Opo.App = App;

  function resolver(ruta) {
    const V = Opo.Vistas;
    let m;
    if (!ruta || ruta === 'inicio') return { v: V.inicio(), nav: 'inicio' };
    if (ruta === 'pd') return { v: V.expo('pd', 'esquema'), nav: 'pd-esquema' };
    if ((m = ruta.match(/^pd-([a-z]+)$/))) return { v: V.expo('pd', m[1]), nav: 'pd-esquema', expo: 'pd', pest: m[1] };
    if ((m = ruta.match(/^(ud\d\d)(?:-([a-z]+))?$/))) return { v: V.expo(m[1], m[2] || 'esquema'), nav: 'uds', expo: m[1], pest: m[2] || 'esquema' };
    if (ruta === 'uds') return { v: V.uds(), nav: 'uds' };
    if (ruta === 'plantilla') return { v: V.plantilla(), nav: 'uds' };
    if (ruta === 'diferencias') return { v: V.diferencias(), nav: 'uds' };
    if (ruta === 'sorteo') return { v: V.sorteo(), nav: 'sorteo' };
    if (ruta === 'ajustes') return { v: V.ajustes(), nav: 'ajustes' };
    return { v: V.inicio(), nav: 'inicio' };
  }

  function pintar() {
    const ruta = decodeURIComponent((location.hash || '#inicio').slice(1));
    const main = $('#principal');
    if (actual && actual.v.destruir) { try { actual.v.destruir(); } catch (e) { console.error(e); } }
    let r;
    try { r = resolver(ruta); } catch (e) {
      console.error(e);
      main.innerHTML = `<div class="aviso-caja">No se ha podido mostrar esta página: ${esc(e.message)}</div>`;
      return;
    }
    actual = r;
    main.innerHTML = r.v.html;
    try { if (r.v.montar) r.v.montar(main); } catch (e) { console.error(e); }
    document.title = `${r.v.titulo || 'Inicio'} · Oposiciones 2.ª prueba`;
    document.querySelectorAll('.nav a').forEach((a) => {
      if (a.getAttribute('href') === '#' + r.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    const mismaPagina = rutaActual.split('-')[0] === ruta.split('-')[0] && rutaActual !== '' && ruta.includes('-');
    if (!mismaPagina) window.scrollTo(0, 0);
    rutaActual = ruta;
    pintarMini(reproductor.estado());
  }

  // ---------------------------------------------------------------- mini-reproductor
  function pintarMini(e) {
    const mini = $('#mini');
    const r = actual || {};
    const visibleAqui = e.expo && r.expo === e.expo.id && (r.pest === 'escuchar' || r.pest === 'pizarra');
    const mostrar = e.expo && (e.reproduciendo || e.tiempo > 1) && !visibleAqui;
    mini.hidden = !mostrar;
    document.body.style.paddingBottom = mostrar ? '72px' : '';
    if (!mostrar) return;
    const sec = e.expo.secciones[e.seccion];
    $('[data-mini-play]', mini).innerHTML = e.reproduciendo ? ICONOS.pausa : ICONOS.play;
    $('[data-mini-play]', mini).setAttribute('aria-label', e.reproduciendo ? 'Pausa' : 'Reproducir');
    $('[data-mini-tit]', mini).textContent = e.expo.titulo;
    $('[data-mini-sec]', mini).textContent = `${sec ? `${e.seccion + 1}. ${sec.titulo}` : ''} · ${mmss(e.tiempo)} / ${mmss(e.duracion)}`;
    $('[data-mini-abrir]', mini).setAttribute('href', `#${e.expo.id}-escuchar`);
    $('.mini-barra i', mini).style.width = `${e.duracion ? Math.min(100, (e.tiempo / e.duracion) * 100) : 0}%`;
  }

  function montarShell() {
    document.body.insertAdjacentHTML('afterbegin', `
      <header class="barra"><div class="barra-in">
        <a class="marca-app" href="#inicio"><b>Exposición oral</b><span>Maestros · Primaria · 2.ª prueba</span></a>
        <nav class="nav" aria-label="Principal">${NAV.map(([h, t]) => `<a href="#${h}">${t}</a>`).join('')}</nav>
      </div></header>
      <main id="principal" tabindex="-1"></main>
      <div class="mini" id="mini" hidden>
        <div class="mini-barra"><i></i></div>
        <div class="mini-in">
          <button class="btn redondo primario" data-mini-play aria-label="Reproducir">${ICONOS.play}</button>
          <div class="info"><b data-mini-tit></b><span data-mini-sec></span></div>
          <a class="btn mini" data-mini-abrir href="#inicio">Abrir</a>
          <button class="btn redondo" data-mini-cerrar aria-label="Detener">${ICONOS.cerrar}</button>
        </div>
      </div>`);
    $('[data-mini-play]').addEventListener('click', () => reproductor.alternar());
    $('[data-mini-cerrar]').addEventListener('click', () => { reproductor.detener(); reproductor.irAFrase(0, { reproducir: false }); pintarMini({}); });
    reproductor.suscribir(pintarMini);
    document.addEventListener('keydown', (ev) => {
      if (ev.target.closest('input,select,textarea,button,a,[contenteditable]')) return;
      const r = actual || {};
      if (ev.code === 'Space' && r.expo && ['escuchar', 'discurso', 'pizarra'].includes(r.pest)) {
        ev.preventDefault();
        reproductor.cargar(Modelo.expo(r.expo));
        reproductor.alternar();
      }
    });
    window.addEventListener('hashchange', pintar);
  }

  function arrancar() {
    montarShell();
    if (!Modelo.expos.pd && !Modelo.uds.length) {
      $('#principal').innerHTML = '<div class="aviso-caja">No se han encontrado los datos (datos/contenido.js). Genera los contenidos con <code>node herramientas/construir.mjs</code>.</div>';
      return;
    }
    pintar();
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.addEventListener('voiceschanged', () => reproductor.emitir()); } catch (e) { /* nada */ }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
})();

</script>
