ograma en CMN (V). El 16 de diciembre (martes) se programa en LCL (L) de la semana 3.","El original escribe el proyecto como '¡Si chef!'; se normaliza a '¡Sí, chef!' en sda.proyecto.nombre (en las semanas se copia literal). ODS indicado como 'ODS 15-16'; se separa en dos entradas.","LCL: el código de saber 2.B.3.4 se repite con dos textos distintos ('Estrategias de comprensión lectora' y 'Lectura compartida y entonada').","LCL semana 2 (V) con C.EV.2.1.a, que no es criterio de LCL en esta UD (es de MAT); LCL 3.2.a sí se evalúa en semana 1.","Evaluación: la tabla de criterios evaluados no coincide con los de la UD en CMN (2.2.a y 5.1.a; la UD tiene 3.1.a y 5.2.a) ni en EAR (4.1.a; la UD tiene 4.2.a). LCL y MAT sí coinciden.","MAT semana 2: marca 'J)' sin paréntesis de apertura y '(V) ... Cálculo mental de sumas con llevadas' no encaja con la división.","Erratas literales: 'resolver problema' (sin s) en MAT 2.1.a, 'personajes principales y secundarias', 'Leo una Descripción', 'Opera prima' sin tilde; EAR semana 1 sin C.EV. y EAR semana 3 sin marca de día ni C.EV.; la escala usa descriptores breves ('Con dificultad', 'Con ayuda'...).","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción. Productos: 'Mural, escenario'."]},{"numero":6,"titulo":"Cuidamos la ciudad","trimestre":2,"fechas":"Del 7 al 24 de enero","dias":14,"centroInteres":"Máquinas, transporte público, reciclado de materiales.","relevanciaSocial":"Cuidar la ciudad para el desarrollo de entornos seguros y saludables. Decreto 101/2023.","ods":["ODS 11. Ciudades y comunidades sostenibles","ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Cuidamos la ciudad","producto":"Informe sobre el uso de la bicicleta como medio de transporte."},"proyecto":{"nombre":"¿Buceamos?","producto":"Cómic. Galería de Arte sostenible."},"aps":{"nombre":"Opera prima","producto":"Fotografías para el corto animado. Resolución de conflictos."}},"objetivosEtapa":["b","e","g","h","j","n","ñ"],"objetivosAprendizaje":["1. Conocer y producir textos literarios. Escuchar y contar mitos y leyendas. Leer y escribir un cómic.","2. Utilizar los conocimientos básicos sobre la lengua: los determinantes, los artículos, demostrativos y palabras con m antes de b y p.","3. Leer, escribir, comparar y representar gráficamente fracciones.","4. Identificar los términos de una fracción, reconocer el numerador y el denominador.","5. Observar e identificar máquinas y aparatos y su utilidad para facilitar las actividades humanas.","6. Conocer las manifestaciones artísticas más importantes de las distintas épocas, lugares y estilos."],"competenciasClave":"CCL (1-2-3-4-5), CP (2), STEM (1-2-3-4-5), CD (1-2-3-5), CPSAA (1-2-3-5), CC (1-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"2","texto":"Comprender textos orales y multimodales para construir conocimiento."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"6","texto":"Buscar, seleccionar y contrastar información procedente de dos o más fuentes."},{"num":"8","texto":"Leer, interpretar y analizar de manera acompañada obras literarias adecuados a su desarrollo."}],"criterios":[{"codigo":"2.1.a","texto":"Comprender el sentido de textos orales."},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"6.1.a","texto":"Localizar información de distintas fuentes"},{"codigo":"8.3.a","texto":"Conocer textos de la literatura tradicional"}],"saberes":[{"codigo":"2.B.3.2","texto":"Interpretación del sentido global."},{"codigo":"2.B.3.5","texto":"Convenciones del código escrito, ortografía."},{"codigo":"2.B.3.6","texto":"Estrategias para la búsqueda de información."},{"codigo":"2.C.1","texto":"Lectura de obras la literatura infantil (cómic)."},{"codigo":"2.D.3","texto":"Procedimientos de adquisición de vocabulario."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"1","texto":"Interpretar situaciones de la vida cotidiana proporcionando estrategias para analizar la información."},{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"6","texto":"Comunicar y representar de forma individual y colectiva conceptos, procedimientos y resultados."},{"num":"8","texto":"Participar en equipos de trabajo heterogéneos con roles asignados para crear relaciones saludables."}],"criterios":[{"codigo":"1.2.a","texto":"Producir esquemas para la resolución."},{"codigo":"3.2.a","texto":"Ejemplificar situaciones problemas."},{"codigo":"4.1.a","texto":"Automatizar una rutina."},{"codigo":"6.1.a","texto":"Reconocer el vocabulario específico."},{"codigo":"8.1.a","texto":"Colaborar en el trabajo en equipo."}],"saberes":[{"codigo":"2.A.4.2","texto":"Fracciones: comparación y ordenación."},{"codigo":"2.D.2.2","texto":"Invención de problemas."},{"codigo":"2.D.4.1","texto":"Interpretación de algoritmos sencillos."},{"codigo":"2.A.2.4","texto":"Fracciones propias."},{"codigo":"2.F.2.2","texto":"Participación activa en el trabajo en equipo."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"1","texto":"Utilizar recursos digitales de forma responsable para buscar información y crear contenido digital."},{"num":"5","texto":"Identificar las características del medio natural y emprender acciones para un uso responsable."},{"num":"6","texto":"Identificar las causas y consecuencias de la intervención humana en el entorno."}],"criterios":[{"codigo":"1.1.a","texto":"Utilizar dispositivos y recursos digitales."},{"codigo":"5.1.a","texto":"Reconocer características de los elementos del medio."},{"codigo":"6.1.a","texto":"Identificar problemas ecosociales."}],"saberes":[{"codigo":"2.B.1.2","texto":"Estrategias de búsquedas guiadas"},{"codigo":"2.C.1.3","texto":"La materia."},{"codigo":"2.C.4.4","texto":"Estilos de vida sostenible."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"1","texto":"Descubrir propuestas artísticas de diferentes géneros, estilos, épocas ."}],"criterios":[{"codigo":"4.1.a","texto":"Identificar propuestas artísticas de diferentes géneros, estilos, épocas."}],"saberes":[{"codigo":"2.C.1","texto":"Cultura visual."},{"codigo":"2.C.8","texto":"El cine de animación."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho textos sobre mitos. Los mitos. (M) Salida. Bioparc de Fuengirola. Una aventura salvaje. C.EV.6.1.a. (X) Capítulo del libro. Vocabulario. Taller de escritura. En grupos, hacer una búsqueda guiada en internet sobre mitos griegos, elegir uno y explicarlo a la clase. C.EV.2.1.a. (J) Cuenta cuentos. Recomienda un cómic. Título, explicar el argumento y describir los personajes. (V) Dramatizaciones. Los refranes. Busca un refrán relacionado con una estación del año.","MAT":"(L) Aprendo fracciones. Concepto de fracción. División en partes iguales. Representar una fracción. C.EV.1.2.a. Nombrar fracciones. (M) Salida. Bioparc de Fuengirola. Una aventura salvaje. (X) Resolución de problemas. Términos de una fracción. Identificar el numerador y el denominador de las fracciones. C.EV.6.1.a. (J) Nombre de las fracciones. Dibuja un rectángulo y colorea la fracción que se indica. (V) Concurso de problemas. Inventa un problema con fracciones. C.Ev.3.2.a.","CMN":"(J) ¿Qué es la materia? Vídeo Los estados y los cambios de la materia. Busca información sobre un material artificial y escribe cómo se obtiene, sus propiedades y para qué se utiliza. Presentamos al grupo. C.Ev.1.1.a. (V). SdA. UD. Informe sobre el uso de la bicicleta como medio de transporte.","EAR":"(V) La geometría. Realizar un dibujo original utilizando figuras geométricas."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Las leyendas. Lee la leyenda y responde. (M) Leo un cómic. Vocabulario. En grupos, hacer una búsqueda guiada en internet sobre leyendas relacionadas con la naturaleza y el lugar donde vivís. Explicarlo a la clase. (X) Capítulo del libro. Vocabulario. C.EV.4.1.a. Taller de escritura. Escribo un cómic. SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible. Prepara un borrador. C.EV.5.1.a. (J) Cuenta cuentos. Recomienda un cómic. Título, explica el argumento y describe los personajes. (V) Dramatizaciones. Los determinantes. Los artículos. Escribimos oraciones y Clasificamos palabras. C.EV.3.2.a.","MAT":"(L) Medios, tercios y cuartos. Representación y lectura de las fracciones resultantes de dividir la unidad en 2, 3 o 4 partes. (M) Problemas exprés. (X) Resolución de problemas. (J) Representar fracciones con regletas. Equivalencias entre fracciones. C.EV.4.1.a. (V) Concurso de problemas. Cálculo mental. Suma de dos cifras con llevadas.","CMN":"(J) ¿De qué materiales están hechos los juguetes? Materiales naturales y artificiales. Propiedades de los materiales. Clasifica materiales. Hacemos un esquema de las propiedades de los materiales (V). SdA. UD. Informe sobre el uso de la bicicleta como medio de transporte. C.EV.6.1.a.","EAR":"(V) Vídeo. Biografía de Pablo Picasso. Descubriendo el cubismo guía de dibujo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Los demostrativos. Copia y completa el esquema sobre los determinantes. (M) Leo un cómic. Comprensión. Completar una tabla con los determinantes demostrativos. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un cómic. SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible. Prepara un borrador. (J) Cuenta cuentos. Palabras con m antes de b y p. Copia las oraciones y completa con mb o mp. (V) Dramatizaciones. Elaborar un esquema con las normas de ortografía estudiadas. Dictado. Lee, escucha, escribe y revisa. C.EV.8.3.a.","MAT":"(L) Comparo fracciones. Compara fracciones con el mismo denominador. (M) Problemas exprés. (X) Resolución de problemas. Encontrar fracciones mayores o menores que una dada. (J) Completa con los signos mayor que o menor que las fracciones. (V) Concurso de problemas. Pienso paso a paso. Dibuja un rectángulo. Divídelo por la mitad, una y otra vez, hasta que puedas. Colorea. C.Ev.8.1.a.","CMN":"(J) ¿Qué son las máquinas? Máquinas simples y compuestas. Elige una máquina y escribe sus características. ¿Qué es un invento? Busca información y escribe el nombre de dos inventos y para qué sirven. C.Ev.5.1.a. (V) SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible.","EAR":"(V) APS. Opera prima. Producto. Fotografías para el corto de animación C.Ev.2.C.1 / 2.C.8"}],"complementaria":"SdA. Salida. Bioparc de Fuengirola. Una aventura salvaje.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecifica atrimonio de la cultura andaluza."}],"saberes":[{"codigo":"2.C.7","texto":"Estrategias y técnicas de uso de historias audiovisuales."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucha el aviso y responde. Escribe un aviso para informar que tu perro se ha perdido. (M) Leo un relato. Comprendo la lectura. Las onomatopeyas. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Por equipos, escribo normas de convivencia, en una biblioteca, una piscina pública, en un cine. Exponemos. C.EV.3.2.a. (J) Día de la NO-Violencia y la Paz. ¿por qué se celebra? Corto “Cadena de favores” Reflexión y Debate. (V) Dramatizaciones. Ruta por el colegio para buscar textos cotidianos: notas, normas, listas, etc. Realiza un registro. C.EV.8.3.a.","MAT":"(L) Estudio el calendario. ¿Qué meses tienen 30 días? ¿Y 31? ¿cuántos días tiene el mes de febrero? C.EV.2.2.a. (M) Problemas exprés. (X) Resolución de problemas. Unidades de tiempo: día, semana, mes año. Número de días en una semana. Número de días en un mes. Número de días y meses en un año. Año bisiesto. Escribe la fecha de dos formas diferentes. C.EV.5.2.a. J) Día de la NO-Violencia y la Paz. Puzle de la Paz. Escribe un mensaje y construye el puzle. (V) Concurso de problemas.","CMN":"(J) Vídeo ¿Cómo se mueve la Tierra? Representamos nuestro planeta. Haz un dibujo con los movimientos de la Tierra. Cuenta cuál es tu estación del año favorita y por qué. 30 de enero. Día de la No Violencia y la Paz. Marcha por la paz. C.Ev.2.2.a (V) SdA. UD. Plano de mi barrio incluyendo centros sanitarios cercanos.","EAR":"(V) Texturas visuales. Elaboración de un collage marino."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Partes de una carta. (M) Leo una carta. Comprendo la lectura C.EV.4.1.a. Los determinantes posesivos. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Escribo una carta a un compañero para felicitarle por su cumpleaños. C.EV.5.1.a. (J) Cuenta cuentos. Las instrucciones. Cuento unas instrucciones. Cómo elaborar una brocheta de fruta saludable C.EV.7.1.a. (V) Dramatizaciones. Los determinantes numerales. Copio y completo un esquema.","MAT":"(L) Vídeo. El día, la hora y los minutos. Horas en un día. Recuentos de horas. ¿Cuántas horas hay en 2 días? Calcula cuantas horas hay en una semana. (M) Problemas exprés. (X) Resolución de problemas. Minutos en una hora ¿Cuántos minutos son 3 horas? Media hora y cuarto de hora. ¿Cuántos minutos son tres cuartos de hora? (J) Las horas y los minutos. ¿Cuántas horas tienen 4 días? Calcula los minutos que hay. ¿Cuántos cuartos de hora son 60 minutos? (V) Concurso de problemas. Cálculo mental. Suma de dos cifras con llevadas en unidades. C.Ev.3.2.a.","CMN":"(J) ¿Cómo podemos representar la Tierra? Escribe la diferencia entre un globo terráqueo y un planisferio. Escribe los elementos de un planisferio. Busca tu país y localízalo en un globo terráqueo. C.Ev.5.1.1.a. (V) SdA. UD. Plano de mi barrio incluyendo centros sanitarios cercanos.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Partes de un correo electrónico. (M) Leo un correo electrónico. Vocabulario. Comprendo la lectura. Completo el esquema de los determinantes. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo una carta a un compañero para felicitarle por su cumpleaños. Lectura a los compañeros. (J) Cuenta cuentos. El sonido de la r suave y fuerte. (V) Dramatizaciones. Repasamos las reglas de ortografía. Dictado. Leo, escucho, escribo, reviso e intercambio de cuadernos. C.EV. 9.2.a.","MAT":"(L) Leo la hora de un reloj. Aguja corta y aguja larga. Dibuja en tu cuaderno relojes y relaciona la hora escrita. Escribe la hora de los relojes. C.EV.4.1.a. (M) Problemas exprés. (X) Resolución de problemas. Haz una redacción explicando qué haces al salir del cole e indica las horas de cada actividad. (J) El reloj digital. Leer la hora en reloj digital. Pasar de analógico a digital. (V) Concurso de problemas. Pienso paso a paso. Recordar los días de cada mes utilizando los nudillos. C.Ev.7.2.a.","CMN":"(J) ¿Cómo nos podemos orientar? ¿Para qué usamos los mapas? ¿Qué métodos usarías para orientarte en un bosque? Busca información sobre cómo funciona una brújula. (V) SdA. Proyecto. ¿Buceamos? Producto. Máscara marina. Galería de Arte sostenible. C.Ev. 6.1.a.","EAR":"(V) APS. Opera prima Producto. Fotografías para el corto de animación. C.Ev. 2.C.7."}],"complementaria":"SdA. 30 de enero. Día de la No Violencia y la Paz. Marcha por la paz.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos, reloj analógico"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación de tico. Deportes olímpicos. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Elige un deporte olímpico que se juegue en equipo. Busca información, redacta y haz una presentación (J) Cuenta cuentos. C.EV.4.1.a. Los gentilicios. Averigua de qué país es cada deportista y su gentilicio. (V) 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno.","MAT":"(L) Análisis de datos en tabla. Recogida de datos en tabla. (M) Problemas exprés. (X) Resolución de problemas. La moda, dato que más se repite. Nos colocamos en fila en el patio y jugamos a lanzar tiros libres, dobles y triples en la cancha de baloncesto. Anotamos el resultado en una tabla de datos. C.EV.1.1.a. J) Encuesta a la clase de 3º. ¿Cuál es el último médico especialista que has visitado este año? Recoge los datos y completa la tabla. Cuenta a la clase tu última experiencia en el especialista. C.EV.3.1.a. (V) 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno.","CMN":"(J) Vídeo ¿Conoces paisajes de costa y de interior? ¿Qué elementos naturales y humanos tienen? ¿Qué es un paisaje? Realizamos un esquema. ¿Qué causas humanas y artificiales puede modificar un paisaje? Escribe en tu cuaderno. C.Ev.6.1.a. (V) SdA. UD. Cartel sobre el cuidado del medioambiente","EAR":"(V) El bodegón de frutas."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Debate. Comprendo la lectura. (M) Leo un texto periodístico. Deportes olímpicos. Vocabulario. Comprendo la lectura. C.EV.6.1.a. (X) Capítulo del libro. Vocabulario. Taller de escritura. Investiga sobre los juegos paralímpicos. Redacta y lee a los compañeros. C.EV.5.1.a. (J) Cuenta cuentos. La entrevista. Inventa y ensaya con tu compañero/a una entrevista que harías a un deportista en la radio. (V) Dramatizaciones. Dramatizamos la entrevista a los compañeros.","MAT":"(L) Gráfico de barras. ¿Cómo llega al colegio el alumnado de 3º? Recogida de datos, llegan en bici, coche, autobús o a pie. Representación gráfica y análisis. ¿Cuántos van caminando al colegio? (M) Problemas exprés. C.Ev.8.2.a. (X) Resolución de problemas. Recogida de datos, representación gráfica y análisis de lo que toma en el recreo el alumnado de 3º, fruta, bocadillo o galletas. (J) Recogida de datos, representación gráfica y análisis de las mascotas del alumnado de 3º, perro, gato, otros. (V) Concurso de problemas. Cálculo mental. Multiplica por la unidad seguida de ceros. C.Ev.4.2.a.","CMN":"(J) Los paisajes de costa. Dibuja dos paisajes uno de interior y otro de costa. Escribe los elementos. Busca fotografías de un paisaje y describe a la clase. (V) Experimento. Plástico ecológico. Método científico. C.Ev2.2.a. SdA. UD. Cartel sobre el cuidado del medioambiente.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo. Colorea como quieras."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Comprendo la lectura. Partes de una notica. Cambia el título y la entradilla. (M) Leo un texto periodístico. Los pronombres personales. El número y el género. Esquema. (X) Capítulo del libro. Taller de escritura. En grupos, escribimos una noticia sobre el deporte en equipo, siguiendo un esquema. Borrador, redactar, revisar la ortografía, pasar a limpio y hacer un dibujo. (J) Cuenta cuentos. C.EV.8.3.a. Palabras con c/q y c/z. (V) Dramatizaciones. Dictado. C.EV.9.2.a.","MAT":"(L) Representa un pictograma sobre el tipo de libro preferido del alumnado de 3º, animales, dinosaurios o cómic. Analiza los datos. C.EV.6.2.a. (M) Problemas exprés. (X) Resolución de problemas. Elabora un pictograma con los cumpleaños de cada mes. Analiza los datos. (J) Gráfico de líneas. Temperaturas máximas y mínimas. Busca información del tiempo atmosférico en tu localidad y anota la temperatura. (V) Concurso de problemas. Pienso paso a paso. ¿Qué cesto es el intruso?","CMN":"(J) Los paisajes de interior y de costa. Busca los sistemas montañosos de España y escribe sus nombres. Identifica las provincias que tienen un paisaje de costa. Dibuja un mapa de los archipiélagos españoles. C.Ev.5.1.a. (V) SdA. Proyecto. ¿Buceamos? Producto. Diorama marino.","EAR":"(V) APS. Opera prima. Producto. Fotografías para el corto de animación. C.EV.2.C.12."}],"complementaria":"SdA. 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno andaluz en el comedor del colegio. Carnaval. Pasacalles por la localidad con pachangas y disfraces.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los crit semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho un anuncio. Responde a las presuntas. La publicidad. (M) Leo un texto informativo. La receta. Busco información sobre recetas de aprovechamiento. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Redacta una receta en la que se aproveche restos de alimentos. Grabarte en vídeo imitando un programa de cocina. (J) Cuenta cuentos. C.EV.4.1.a. Recicla y reutiliza. Preparamos un amigo o amiga invisible. Organizamos el sorteo y fabricamos un regalo con materiales que ya no utilicemos. (V) Dramatizaciones. Representa un anuncio que conozcas.","MAT":"(L) Mide con clips y anota los resultados. Mide con palmos el largo de tu mesa y con pasos el ancho de la puerta de tu clase y anota en tu cuaderno. Dibuja las unidades de medida corporales. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Mide el ancho de tu clase con tus pies y con tus pasos. Compara el resultado con tus compañeros. C.EV.7.1.a. J) Recoge en una tabla de datos las medidas en pasos o palmos de tres objetos de la clase. Realiza un gráfic. (V) Concurso de problemas.","CMN":"(J) Vídeo ¿Qué es una localidad? Los barrios y las calles de la localidad. Escribe tres características de un municipio. Describe tres diferencias entre pueblo y ciudad. Describe el barrio de tu colegio. (V) 22 de marzo. Día Mundial del Agua. Mural sobre el uso responsable del agua.","EAR":"(V) Las formas de los animales. Construcción de animales de papel en 3D."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Las frases hechas. ¿Qué significa, dejar volar la imaginación? Debate. C.EV.3.2.a. (M) Leo un texto informativo. Las partes de un anuncio. (X) Capítulo del libro. Taller de escritura. Redactar una receta en la que se aproveche restos de alimentos. Grabarse en vídeo imitando el formato de un programa de cocina. C.EV.5.1.a. (J) Cuenta cuentos. C.EV.4.1.a. Creo un eslogan publicitario. (V) Dramatizaciones. Grabamos el eslogan de un anuncio.","MAT":"(L) El metro. Utiliza la cinta métrica. Indica y comprueba si estas longitudes son mayores o menores que el metro Elabora una lista con longitudes que miden más de un metro. Medir la clase. (M) Problemas exprés. C.EV.1.1.a. X) Resolución de problemas. Mide tu cuerpo con una cinta métrica y compara con tu pareja. J) El centímetro. Paso de metros a centímetros. Paso de centímetros a metros. Equivalencia de unidades 1m = 100 cm. Dividir entre 10, 100 o 1000. C.EV.6.1.a. (V) Concurso de problemas. Cálculo mental. Completa decenas.","CMN":"(J) ¿Qué normas pondrías en tu localidad? Esquema y dibujos de los tipos de señales de tráfico. Si fueras alcalde o alcaldesa ¿qué mejorarías de tu localidad? Investiga el nombre del alcalde o alcaldesa de tu localidad C.Ev.5.2.a. (V) SdA. UD. Mural sobre tradiciones oficiales de España C.Ev.8.1.a.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo. Colorea como quieras. Mural aula."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Utilizo recursos literarios: la comparación. Diseña y crea una nota decorada con comparaciones, decora con un dibujo. (M) Leo una nota literaria. El verbo y los tiempos verbales. Hacemos un esquema. C.EV.9.1.a. (X) Capítulo del libro. Vocabulario. Taller de escritura. Visualizado de recetas grabadas en vídeo como un programa de cocina. (J) Cuenta cuentos. Palabras con g y j. La diéresis. C.EV.4.1.a. Creo un eslogan publicitario. (V) Dramatizaciones. Repasamos la ortografía. Dictado. Escucha, escribe, revisa y lee en voz alta al resto de la clase.","MAT":"(L) Mido con regla objetos del aula. Anoto los resultados. Mido con la regla la línea más larga. La longitud de las regletas. (M) Problemas exprés. (X) Resolución de problemas. El kilómetro. El símbolo del Km. Equivalencia de unidades 1 km = 1000 m. Expresa las longitudes en metros. C.EV.1.1.a. J) Qué unidades utilizarías para medir estas longitudes: el metro, el centímetro o el kilómetro. transforma las longitudes. (V) Concurso de problemas. Pienso paso a paso. C.EV.4.1.a.","CMN":"(J) La organización del territorio. Busca información y escribe en orden alfabético las provincias que tiene tu comunidad autónoma. ¿Cuántos países pertenecen a Europa? ¿Qué moneda se utilizaba en España antes del euro? (V) SdA. Proyecto. Producto. Galería de Arte sostenible. C.Ev.3.2.a.","EAR":"(V) APS. Opera prima Producto: fotografías para el corto de animación C.Ev. 2.B.4."}],"complementaria":"22 de marzo. Día Mundial del Agua. Mural sobre el uso responsable del agua","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos, regla."},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medida "(L) Leo una noticia. Vocabulario y comprensión. La familia de palabras. (M) Leo poesía. Vocabulario. Comprendo la lectura. El sujeto y el predicado. (X) 23 de abril. Día Internacional del Libro. Taller de refranes. C.EV.8.3.a. Escribe y cambia algunas palabras conservando la rima y el ritmo. C.EV.5.1.a. (J) Cuenta cuentos. C.EV.7.2.a. En la biblioteca del centro, busca y recita un poema. (V) Dramatizaciones. Declamar una poesía en grupos, siguiendo los pasos. Repartid los versos, memorizad y ensayad. Recitad con entonación y al ritmo con gestos.","MAT":"(L) Sumar litros. Equivalencias. Ordenar de mayor a menor. Paso a mililitros. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Las medidas de masa: el kilogramo y el gramo. Transformar kilos en gramos y viceversa. Estimar un kilo. Elegir unidad de medida. C.EV.3.1.a. (J) Estimar la masa. Equivalencia de unidades 1 kg = 1000 g. Expresiones complejas e incomplejas de medidas de masa. Suma y resta de medidas de masa. (V) Concurso de problemas. Cálculo mental.","CMN":"(J) Describe las principales características de la población de España. Dibuja en tu cuaderno un mapa de España. Colorea las zonas poco pobladas en verde y las zonas densamente pobladas en rojo. Realiza un esquema de los Sectores económicos. C.Ev. 5.1.a. (V) SdA. UD. Pirámide de población","EAR":"(V) Video. Biografía de Murillo. Copia la obra: Niños comiendo melón y uvas."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Completa el esquema de la oración. (M) Leo poesía. Copia las oraciones y rodea el verbo y subraya el sujeto y el predicado. (X) Capítulo del libro. Taller de escritura. Búsqueda guiada de una canción. Escribe y cambia algunas palabras conservando la rima y el ritmo. (J) Cuenta cuentos. C.EV.4.1.a. Palabras con ll y con y. En equipos, escribir palabras que contengan ll, leer en voz alta y comprobar si son correctas. (V) Dramatizaciones. Dictado de palabras con ll y con y. Escribe una oración con las palabras que hayas escrito incorrectas.","MAT":"(L). Averigua la masa de objetos pequeños que tengas cerca. Mide la masa de cada uno con una báscula. ¿Has acertado? C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Medio kilo y cuarto de kilo. Equivalencias. Ordenar de mayor a menor. Paso a gramos. C.EV.8.1.a. (J) Suma y resta de medidas de masa. Ordena de menor a mayor. (V) Concurso de problemas. Pienso paso a paso. ¡Crea tu balanza!","CMN":"(J) Busca información y di en qué tres provincias andaluzas se concentra un mayor número de población. Escribe un anuncio para convencer a las personas a venir a vivir a Andalucía. (V) SdA. Proyecto. Huellas del pasado. Producto. Investigar y diseñar la estructura Lapbook.C.Ev. 9.1.a.","EAR":"(V) APS. Opera prima Post-producción. Presentación del corto C.EV. 2.C.8."}],"complementaria":"SdA. 23 de abril. Día Internacional del Libro. Taller de refranes.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valora digo":"2.C.1.3","texto":"El tiempo histórico."},{"codigo":"2.C.4.4","texto":"Normas para la vida en sociedad."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"3","texto":"Comunicar de manera creativa ideas para producir obras propias."}],"criterios":[{"codigo":"3.3.a","texto":"Valorar tanto las producciones propias como las ajenas."}],"saberes":[{"codigo":"2.B.11","texto":"Características del lenguaje audiovisual."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho una tertulia. Respondo a las preguntas. C.EV.3.2.a. (M) Leo un texto. ¿Cómo serán las ciudades del futuro? Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Redactar una descripción de la ciudad de futuro perfecta y dibujarla. (J) Cuenta cuentos. C.EV.4.1.a. Los neologismos y los extranjerismos. (V) Dramatizaciones. Participo en un debate Ventajas y desventajas de que en el futuro los robots hagan el trabajo que ahora hacen las personas.","MAT":"(L) Rectas secantes y restas paralelas. Nombra rectas y di su relación dos a dos. Identifica rectas paralelas y secantes. Dibuja rectas paralelas y secantes. Traza utilizando la regla. (M) Problemas exprés. (X) Resolución de problemas. Busca un plano donde aparezca vuestro colegio. ¿Qué calles son paralelas y secantes? Indica las rectas paralelas y secantes que ves a tu alrededor. C.EV.2.1.a. (J) Ángulos. Los ángulos y sus elementos. Identifica ángulos Los elementos de un ángulo. Piensa en objetos cotidianos en los que se pueda observar ángulos. C.EV.3.2.a. (V) Concurso de problemas. Inventa un problema.","CMN":"(J) La historia y el paso del tiempo. Las edades de la historia. Utiliza internet para investigar un acontecimiento importante de cada edad histórica. Represéntalos en una línea del tiempo. Elabora un cómic con una escena de la prehistoria. C.Ev 5.1.a. (V) SdA. UD. Línea del tiempo de nuestra vida.","EAR":"(V) Crea a tu manera un diseño con la técnica del esgrafiado."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. C.EV.2.1.a. Consejos para participar en un debate. (M) Leo un diálogo. Vocabulario. Comprendo la lectura. Uso de las rayas en el texto. (X) Capítulo del libro. Taller de escritura. Escribo un diálogo entre personajes de un cuento. C.EV.5.1.a. (J) Cuenta cuentos. C.EV.4.1.a. Busca en la biblioteca un cuento donde se reproduzca un diálogo y se utilicen rayas. Lee y escribe un resumen. C.EV.6.1.a. (V) Dramatizaciones. Improvisar una conversación telefónica. Ejemplo: llamar a tus padres al trabajo para pedirles que vayan a buscarte al colegio.","MAT":"(L) Dibuja un ángulo y marca sus partes. Rectas perpendiculares. Indica si las rectas son perpendiculares o no. Escribe una lista de objetos del aula que contengan ángulos rectos. (M) Problemas exprés. (X) Resolución de problemas. Dibuja tres ángulos rectos con la ayuda de la escuadra. Gira la escuadra para que los ángulos estén en diferentes posiciones. C.EV.2.1.a. (J) Calca el plano y completa el nombre de las calles, siguiendo las instrucciones. (V) Concurso de problemas. Cálculo mental. Doble de dos cifras sin llevadas. C.EV.7.1.a.","CMN":"(J) Investiga sobre los avances e inventos de la Edad moderna y realiza una ficha de uno de ellos, el que creas más importante. Ponla en común con el resto de la clase. (V) SdA. UD. Línea del tiempo de nuestra vida.","EAR":"(V) Murillo. Copia la obra. Niños comiendo melón y uvas."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. C.EV.2.1.a. Clases de oraciones. Copio y completo el esquema C.EV.9.1.a. (M) Salida al Centro Pompidou en Málaga. (X) Capítulo del libro. Taller de escritura. Escribo un diálogo entre personajes de un cuento. Lectura a los compañeros. (J) Cuenta cuentos. C.EV.4.1.a. Vocabulario. Palabras terminadas en d y z (V) Dramatizaciones. Repasamos la ortografía de la unidad. Inventamos un dictado en grupo. Por equipos, formamos oraciones, escribimos y entregamos al maestro/a. Escucha, escribe, revisa y corrige.","MAT":"(L) Esquema tipo de ángulos. En grupos, representa ángulos de diferente amplitud, con el cuerpo. (M) Salida al Centro Pompidou en Málaga. (X) Resolución de problemas. Situación en un plano. Dibuja el plano de tu clase. Fíjate en la forma de tu clase, donde están las puertas y las ventanas. Dibuja primero los objetos grandes y después el resto. C.EV.5.1.a. (J) Construimos un geoplano para conocer mejor las rectas los ángulos y el plano. (V) Concurso de problemas. Pienso paso a paso. Utiliza un muñequito para indicar los pasos a seguir para llegar hasta la casa en el plano. C.EV.4.1.a.","CMN":"(J) Investiga y escribe algunos avances de la Edad Contemporánea, comparte el resultado con el grupo. (V) SdA. Proyecto. Huellas del pasado. Producto. Escribir el contenido del Lapbook.","EAR":"(V) APS. Opera prima. Producto. Diseño de un cartel para el evento de fin de curso. C.EV.2.B.11"}],"complementaria":"Salida al Centro Pompidou en Málaga.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos."},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MA "o"],"objetivosAprendizaje":["1. Conocer y producir textos literarios: escuchar y dramatizar una obra de teatro y leer y escribir un texto teatral.","2. Utilizar los conocimientos de la lengua: las lenguas de España, palabras con bl y br.","3. Identificar y clasificar los triángulos según sus lados y sus ángulos y los cuadriláteros en paralelogramos y no paralelogramos.","4. Aprender a dibujar una circunferencia con el compás y sus elementos: centro, radio y diámetro.","5. Identificar el patrimonio cultural como algo que hay que cuidar y valorar los museos.","6. Producir obras propias tanto de forma individual como colectiva."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-4), CD (1-2-3-4-5), CPSAA (1-2-3), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"1","texto":"Reconocer la diversidad lingüística para valorarla como fuente de riqueza cultural."},{"num":"3","texto":"Producir textos orales y multimodales para expresar ideas y sentimientos."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"8","texto":"Leer, interpretar y analizar de manera acompañada obras literarias adecuados a su desarrollo."},{"num":"10","texto":"Poner las prácticas comunicativas al servicio de la convivencia democrática."}],"criterios":[{"codigo":"1.2.a","texto":"Identificar la pluralidad lingüística."},{"codigo":"3.2.a","texto":"Participar en interacciones orales."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"8.3.a","texto":"Conocer textos de la literatura tradicional."},{"codigo":"10.2.a","texto":"Iniciar la gestión dialogada de conflictos."}],"saberes":[{"codigo":"2.A.2","texto":"La diversidad lingüística andaluza."},{"codigo":"2.B.3.2","texto":"Comprensión oral. Sentido global."},{"codigo":"2.B.3.5","texto":"Producción escrita. Ortografía reglada."},{"codigo":"2.C.1","texto":"Lectura de obras de la liter 2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Respondo a las preguntas. Las lenguas de España. C.EV.1.2.a. (M) Leo un texto. Vocabulario. C.EV.8.3.a. Comprendo la lectura. El andaluz. (X) Capítulo del libro. Taller de escritura. Escribo un texto teatral. En grupos, decidís argumento, personajes y lugar. Como empieza y acaba la historia. Los diálogos, la vestimenta, el decorado y como se va a llamar vuestra obra. (J) Cuenta cuentos. Copio y completo el esquema de las lenguas de España. (V) Dramatizo una obra de teatro.","MAT":"(L) El perímetro. Calcula el perímetro de los polígonos dados. Dibuja un cuadrilátero que tenga todos sus lados iguales y cuyo perímetro mida 12 cm. Calcula el perímetro en centímetros de tu mesa. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Clases de triángulos. Esquema. Clasifica según sus lados. (J) Clase de triángulos según sus ángulos. Esquema. Clasifica los triángulos que hay en el tangram. Recorta un cuadrado y divídelo en dos triángulos iguales. C.EV.3.2.a. (V) Concurso de problemas. Cálculo mental. Mitad de cifras pares. C.EV.8.1.a.","CMN":"(J) ¿Qué son los museos? ¿Has visitado alguno? Redacta y expón al grupo normas sobre cómo comportarse en un museo. 14 de junio. Día de la Memoria Histórica. Exposición de dibujos contra la guerra C.Ev.9.1.a. (V) SdA. UD. Maqueta del Centro Pompidou","EAR":"(V) Murillo. Copia la obra Niños comiendo melón y uvas. Mural de las obras del grupo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Respondo a las preguntas. Participo en un debate. ¿Qué pasaría si tuvieras que irte a vivir a otro país? C.EV.10.1.a (M) Leo un texto. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Escribo un texto teatral. En grupos, decidís argumento, personajes y lugar. Como empieza y acaba la historia. Los diálogos, la vestimenta, el decorado y como se va a llamar vuestra obra. (J) Cuenta cuentos. C.EV.5.1.a Palabras con bl y br. (V) Dramatizo una obra de teatro. Dictado.","MAT":"(L) Clases de cuadriláteros. Esquema. Características. Describir cuadriláteros. (M) Problemas exprés. (X) Resolución de problemas. Juega con los bloques geométricos para formar figuras. Describe las figuras con vocabulario geométrico. Dibuja un robot utilizando cuadriláteros. (J) Circunferencia y círculo. Identifica objetos con forma de círculo. Dibuja un círculo y una circunferencia y señala el centro, radio y diámetro. Aprende a dibujar una circunferencia con el compás. C.EV.3.2.a. (V) Concurso de problemas. Pienso paso a paso. Encuentra la figura geométrica a través de su descripción. C.EV.4.1.a.","CMN":"(J) Busca fotografías antiguas que muestren lugares de tu localidad en el pasado. Busca algún personaje histórico de Andalucía e investiga sobre su vida, a qué se dedicaba y por qué era importante. C.Ev. 7.2.a. (V) SdA. Proyecto. Huellas del pasado. Producto F. Decorar y presentar el Lapbook.","EAR":"APS. Opera prima. Producto. Festival de cine fin de curso C.Ev. 2.C.1."}],"complementaria":"14 de junio. Día de la Memoria Histórica. Exposición de dibujos contra la guerra.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos, reglas, compás"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje nal').","LCL: las actividades de la semana 1 (cartel publicitario sobre un medio de transporte, campo semántico 'deportes') no casan con el centro de interés. La semana 3 evalúa 'C.EV.10.1.a', pero el criterio de la UD es 10.2.a. El criterio 8.3.a (literatura tradicional) se empareja con el saber 2.C.1 (literatura infantil).","MAT: el saber '2C.1.4' carece de punto (2.C.1.4). Los saberes 2.B.1.1 (amplitud del ángulo) y 2.F.2.4 (conjeturas a partir de datos) apenas casan con las actividades (polígonos, perímetro, triángulos, cuadriláteros, circunferencia). El objetivo 3 menciona paralelogramos y no paralelogramos, que no aparecen explícitamente en las semanas.","CMN: la evaluación lista 2.2.a, 5.1.a y 6.1.a, que no son criterios de esta UD, y omite 3.1.a, 7.2.a y 9.1.a, que sí se usan en las semanas. El criterio 7.2.a ('características de las personas') casa mal con el saber 2.A.1.5 (avances en el pasado).","EAR: el criterio es 4.3.a, pero en la semana 3 y en la evaluación se usa el código del saber 2.C.1 como criterio; semanas 1 y 2 sin C.EV. La entrada EAR de la semana 3 no lleva marca de día.","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción. Producto de la evaluación: 'Maqueta' (producto de la SdA de la UD)."]}],"rubricas":{"fuente":"Criterios de actuación de los tribunales, Cuerpo 597 (Andalucía 2025) y actilla de calificación de la segunda prueba (24/07/2025).","pd":{"titulo":"Defensa de la programación didáctica (Parte A)","nota":"Pesos sobre la parte A. El documento escrito suma el 30 % restante (en 2025 obtuvo ~9).","totales2025":[6.5606,6.1694,5.7073,6.0803,5.9221],"items":[{"id":"intro","titulo":"Introducción y justificación","peso":2.1,"notas2025":[5.1,5.15,4,5,5.1],"media2025":4.87,"indicadores":["Presenta la programación detallando aspectos significativos","Justifica normativa, curricular y epistemológicamente su importancia y relevancia","Cita autores y l <script>
/* Utilidades generales. Todo cuelga de window.Opo para funcionar abriendo index.html sin servidor. */
(function () {
  'use strict';
  const Opo = (window.Opo = window.Opo || {});

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const $ = (sel, raiz = document) => raiz.querySelector(sel);
  const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));

  // ---------------------------------------------------------------- almacenamiento local (puede fallar)
  const PREFIJO = 'opos597:';
  const Almacen = {
    leer(clave, defecto) {
      try {
        const v = window.localStorage.getItem(PREFIJO + clave);
        return v == null ? defecto : JSON.parse(v);
      } catch (e) { return defecto; }
    },
    escribir(clave, valor) {
      try { window.localStorage.setItem(PREFIJO + clave, JSON.stringify(valor)); return true; } catch (e) { return false; }
    },
    borrarTodo() {
      try {
        Object.keys(window.localStorage).filter((k) => k.startsWith(PREFIJO)).forEach((k) => window.localStorage.removeItem(k));
      } catch (e) { /* sin almacenamiento */ }
    },
    exportar() {
      const out = {};
      try {
        Object.keys(window.localStorage).filter((k) => k.startsWith(PREFIJO)).forEach((k) => { out[k.slice(PREFIJO.length)] = JSON.parse(window.localStorage.getItem(k)); });
      } catch (e) { /* nada */ }
      return out;
    },
    importar(obj) {
      Object.entries(obj || {}).forEach(([k, v]) => Almacen.escribir(k, v));
    },
  };

  // ---------------------------------------------------------------- tiempo y números
  const mmss = (seg) => {
    seg = Math.max(0, Math.round(seg || 0));
    const m = Math.floor(seg / 60);
    const s = seg % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  };
  const coma = (n, dec = 1) => Number(n).toFixed(dec).replace('.', ',');
  const contarPalabras = (t) => { const s = String(t || '').trim(); return s ? s.split(/\s+/).length : 0; };
  const PPM = 130;

  // ---------------------------------------------------------------- huecos {{id}}
  const HUECO_RE = /\{\{\s*([a-z0-9_]+)\s*\}\}/g;
  /** Divide un texto con huecos en partes [{t, h}] (h = id de hueco o null). */
  function partes(texto, valores) {
    const out = [];
    let ultimo = 0;
    const s = String(texto || '');
    HUECO_RE.lastIndex = 0;
    let m;
    while ((m = HUECO_RE.exec(s))) {
      if (m.index > ultimo) out.push({ t: s.slice(ultimo, m.index), h: null });
      const v = valores ? (Object.prototype.hasOwnProperty.call(valores, m[1]) ? String(valores[m[1]]) : '') : null;
      out.push({ t: v == null ? m[0] : v, h: m[1] });
      ultimo = m.index + m[0].length;
    }
    if (ultimo < s.length) out.push({ t: s.slice(ultimo), h: null });
    return out;
  }
  const textoDe = (ps) => ps.map((p) => p.t).join('');
  function htmlPartes(ps, { etiquetas = null } = {}) {
    return ps.map((p) => {
      if (!p.h) return esc(p.t);
      const contenido = etiquetas ? `⟨${esc(etiquetas[p.h] || p.h)}⟩` : esc(p.t);
      return `<span class="propio" data-hueco="${esc(p.h)}">${contenido}</span>`;
    }).join('');
  }

  // ---------------------------------------------------------------- frases (mismo criterio que herramientas/audio/generar_audio.py)
  const FIN_FRASE = /[.!?…:;]["»”)]*\s+(?=[¿¡«"“(]?[A-ZÁÉÍÓÚÑ0-9])/g;
  function frases(texto) {
    const res = [];
    let inicio = 0;
    FIN_FRASE.lastIndex = 0;
    let m;
    while ((m = FIN_FRASE.exec(texto))) {
      const corte = m.index + 1;
      const trozo = texto.slice(inicio, corte).trim();
      const previo = texto.slice(Math.max(0, corte - 6), corte);
      if (/\b(art|Sr|Sra|núm|pág|etc|p\. ej|ej)\.$/.test(previo) || trozo.length < 12) continue;
      res.push([inicio, corte]);
      inicio = m.index + m[0].length;
    }
    if (texto.slice(inicio).trim()) res.push([inicio, texto.length]);
    return res.map(([a, b]) => {
      while (a < b && /\s/.test(texto[a])) a++;
      while (b > a && /\s/.test(texto[b - 1])) b--;
      return [a, b];
    });
  }

  /** Corta las partes (con huecos) en trozos por frase: [{frase, trozos:[{t,h}]}] y "entre" (huecos de texto sueltos). */
  function partesPorFrase(ps, cortes) {
    const texto = textoDe(ps);
    // posiciones de partes
    const segs = [];
    let pos = 0;
    ps.forEach((p) => { segs.push({ a: pos, b: pos + p.t.length, h: p.h }); pos += p.t.length; });
    const res = [];
    let cursor = 0;
    const tomar = (a, b, frase) => {
      if (b <= a) return;
      const trozos = [];
      segs.forEach((s) => {
        const x = Math.max(a, s.a);
        const y = Math.min(b, s.b);
        if (y > x) trozos.push({ t: texto.slice(x, y), h: s.h });
      });
      res.push({ frase, trozos });
    };
    cortes.forEach(([a, b], i) => {
      tomar(cursor, a, null);
      tomar(a, b, i);
      cursor = b;
    });
    tomar(cursor, texto.length, null);
    return res;
  }

  // ---------------------------------------------------------------- aleatorio con semilla
  function aleatorio(semilla) {
    let s = semilla >>> 0 || 1;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashTexto(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---------------------------------------------------------------- texto para la voz del navegador
  const SIGLAS = {
    TDAH: 'te de a hache', ODS: 'o de ese', STEAM: 'estim', ABP: 'a be pe', APS: 'a pe ese', PT: 'pe te', AL: 'a ele',
    LCL: 'Lengua Castellana y Literatura', MAT: 'Matemáticas', CMN: 'Conocimiento del Medio', EAR: 'Educación Artística',
    UD: 'unidad didáctica', SdA: 'situación de aprendizaje', NEAE: 'neáe', DUA: 'dúa', ETCP: 'e te ce pe',
  };
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const DESCRIPTORES = { CCL: 'ce ce ele', CP: 'ce pe', STEM: 'estem', CD: 'ce de', CPSAA: 'ce pe ese a a', CC: 'ce ce', CE: 'ce e', CCEC: 'ce ce e ce' };
  function paraVoz(t) {
    return String(t)
      .replace(/\b(CCL|CPSAA|CCEC|STEM|CP|CD|CC|CE)(\d)\b/g, (m, a, n) => `${DESCRIPTORES[a]} ${n}`)
      .replace(/[«»“”"]/g, '')
      .replace(/\s*[—–]\s*/g, ', ')
      .replace(/y\/o/g, 'y o')
      .replace(/(\d+)\/(\d+)\/(\d{4})/g, (m, d, mes, a) => (MESES[+mes - 1] ? `${d} de ${MESES[+mes - 1]} de ${a}` : m))
      .replace(/(\d+)\/(\d{4})/g, '$1 de $2')
      .replace(/\b(\d)\.º/g, (m, d) => ({ 1: 'primero', 2: 'segundo', 3: 'tercero', 4: 'cuarto', 5: 'quinto', 6: 'sexto' }[d] || d))
      .replace(/\b\d+(?:\.[0-9A-Za-z]+)+\b/g, (m) => m.split('.').map((p, i, arr) => (i === 0 ? p : (/^\d+$/.test(p) ? ' punto ' + p : (i === arr.length - 1 && p.length === 1 ? ' ' + p : ' punto ' + p)))).join(''))
      .replace(/(\d+)\s*%/g, '$1 por ciento')
      .replace(/\b[A-Za-z]{2,5}\b/g, (w) => SIGLAS[w] || w);
  }

  // ---------------------------------------------------------------- avisos y portapapeles
  let toastTimer = null;
  function aviso(msg) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  async function copiar(texto, nodoSeleccion) {
    try { await navigator.clipboard.writeText(texto); aviso('Copiado'); return true; } catch (e) {
      if (nodoSeleccion) {
        const r = document.createRange(); r.selectNodeContents(nodoSeleccion);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        aviso('Texto seleccionado: cópialo con Ctrl+C');
      }
      return false;
    }
  }

  // ---------------------------------------------------------------- iconos
  const ICONOS = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    pausa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
    atras: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>',
    adelante: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 6h2v12h-2zM14.5 12 6 18V6z"/></svg>',
    menos10: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">10</text></svg>',
    mas10: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">10</text></svg>',
    pantalla: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    cerrar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>',
    micro: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 11.5a6 6 0 0 0 12 0M12 17.5V21"/></svg>',
  };

  Object.assign(Opo, { esc, $, $$, Almacen, mmss, coma, contarPalabras, PPM, partes, textoDe, htmlPartes, frases, partesPorFrase, aleatorio, hashTexto, paraVoz, aviso, copiar, ICONOS, HUECO_RE });
})();
