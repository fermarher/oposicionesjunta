roe en Canva. Yo lo valoro con una rúbrica.","pz_s3":"receta ¡Sí, chef! + presentación","nombre_proyecto":"¡Sí, chef!","s3_lcl_ej":"corregimos el dictado intercambiando cuadernos, con el criterio 9.2.a","s3_lcl_act":"cada niño y cada niña lee en voz alta su fábula, con el criterio 4.1.a, y las recopilamos para la biblioteca de aula, con el 8.2.a","s3_rel_lcl":"esa lectura entrena a los portavoces que presentarán los superhéroes","s3_mat_ej":"memorizamos las tablas jugando con policubos y aprendemos del error, con el criterio 7.2.a","s3_mat_act":"asociamos números con productos, con el criterio 5.1.a, y en el concurso inventamos un ritmo corporal y lo codificamos con dibujos, con el 4.1.a","s3_rel_mat":"secuenciar el ritmo nos enseña a ordenar los pasos de la receta de «¡Sí, chef!»","s3_cmn":"el jueves buscamos información sobre un vertebrado, escribimos su ficha y la exponemos, con el criterio 5.1.a","s3_rel_cmn":"ese guion, a qué grupo pertenece, dónde vive y qué come, sirve para presentar el superhéroe","pz_f3":"Lectura · ritmo · vertebrado · story board","s3_ear":"dentro de «Opera prima», creamos el story board, con el criterio 3.2.a","s3_rel_ear":"el superhéroe del equipo protagoniza esas viñetas, que cuentan cómo se resuelve un conflicto","s3_tarea":"el viernes, en una sesión por equipos, primero cada portavoz presenta su superhéroe terminado y explica qué adaptación inspira cada superpoder. Después damos el paso de «¡Sí, chef!»: cada equipo escribe una receta para el recetario andaluz, ordenando sus pasos como en el concurso y revisándola como la fábula, con el criterio 5.1.a de Lengua; el secretario la redacta y el coordinador revisa los pasos. Yo guío y valoro la receta con una rúbrica.","pz_compl":"Salida a Aventura Amazonia","transferencia":"en casa, multiplicamos las cantidades de la receta para la familia; en la situación de aprendizaje de la salida a Aventura Amazonia, calculamos con las tablas los turnos de tirolina; y en Mijas, en la playa, clasificamos los animales que vemos.","contexto_digital":"situamos en Google Maps el hábitat del animal de cada superhéroe","contexto_bilingue":"aprendemos a nombrar animales y sus partes, como «wings», «legs» o «tail»","situacion_nueva":"cuando en el patio alguien va a pisar un insecto, los compañeros lo impiden, explican que es un invertebrado que merece respeto y lo devuelven a su hábitat.","publico_real":"cada portavoz presenta su superhéroe a una clase de primero, y los publicamos todos en el blog del centro para las familias.","uso_real":"los superhéroes quedan expuestos en el pasillo y recuerdan a todo el centro cómo cuidar a los animales del entorno.","reparto_dias":"de cinco, cuatro y cinco días, por el festivo de Todos los Santos; y la situación de aprendizaje ocupa dos sesiones y termina en la fase dos.","progresion":"en Matemáticas pasamos de la suma repetida a las tablas memorizadas; en Lengua, de resumir fábulas a escribirlas y leerlas en voz alta; y el superhéroe, del boceto al diseño terminado.","ajuste_realidad":"llega con los equipos ya formados y aprovecha la salida a Aventura Amazonia; y, en una localidad costera como Mijas, se apoya en los animales que el alumnado conoce.","m_lectura":"la fábula «La cigarra y la hormiga», que anticipamos, leemos con entonación y resumimos oralmente","m_tic":"Canva y Classroom para el superhéroe, Google Maps para su hábitat y vídeos de insectos y simetría","m_emocional":"la valoración del error al memorizar las tablas, con el criterio 7.2.a de Matemáticas","m_conflictos":"el story board de «Opera prima», que cuenta cómo se resuelve un conflicto","m_sostenible":"el ODS 15, que cada superhéroe defiende en su misión contra un problema ecosocial","m_andalucia":"los animales de la costa de Mijas, el sevillano Velázquez y el recetario andaluz de «¡Sí, chef!»","producto_aps":"un story board para el corto de animación","m_agrupamientos":"el gran grupo para clasificar animales; los equipos heterogéneos para el superhéroe; las parejas para corregir el dictado; y el trabajo individual para la ficha del vertebrado.","recursos_ud":"la biblioteca de aula, para las fábulas; el parque Aventura Amazonia, en la salida; la prensa, en las noticias; los policubos, para las tablas; y las familias, en la receta","m_previos":"la asamblea sobre la pregunta del inicio, donde el alumnado cuenta qué animales conoce","dua_ejemplos":"Con múltiples formas de representación, presento los insectos con vídeo y esquema, y la multiplicación con policubos y sumas repetidas. Con múltiples formas de acción y expresión, resumen la fábula oralmente, por escrito o dramatizándola. Y con múltiples formas de implicación, eligen su animal y se dan retroalimentación.","d_multinivel":"el concurso de problemas: el refuerzo multiplica con policubos usando la tabla del 2, y la profundización inventa problemas que combinan varias tablas.","d_profundizacion":"investiga cómo se adapta un animal andaluz y propone a su equipo un superpoder inspirado en él.","d_vinculo":"los dos alumnos con dificultades construyen las tablas con policubos y escriben la fábula con un modelo de lectura fácil; el alumno con TDAH hace la ficha del vertebrado con una agenda visual; y la alumna de compensatoria usa un glosario visual de animales y, si lo necesita, prepara la receta con su compañera tutora.","d_sda":"el alumno con TDAH es el cronometrador del equipo y recibe la tarea fragmentada en pasos; y los alumnos con dificultades y la alumna de compensatoria parten de un superhéroe modelo.","n_criterios":"catorce","e_inicial":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, el boceto, con escala del 2.4.a de Conocimiento del Medio; en la segunda, el superhéroe, con rúbrica del 6.1.a; y en la tercera, la receta, con rúbrica del 5.1.a de Lengua.","e_criterios":"con rúbrica de fluidez, la lectura oral, 4.1.a de Lengua; con escala de observación, el resumen, 3.2.a, y los problemas exprés, el ritmo e","dias":"15","contexto_significativo":"avanza el primer trimestre y los equipos ya están consolidados; el programa CIMA de hábitos de vida saludable da sentido a la pirámide, y el Plan de cultura de Paz, al cómic de «Opera prima».","enlace_ud":"sigue a «¿Cómo son los animales?» y pasa del estudio de los animales al del cuerpo humano.","pz_lcl":"LCL 2·4·5·8·9 → 2.1.a·4.1.a·5.1.a·8.1.a·9.2.a","pz_mat":"MAT 1·4·5·6·8 → 1.2.a·4.2.a·5.2.a·6.2.a·8.2.a","pz_cmn_ear":"CMN 1·4·6 → 1.2.a·4.1.a·6.1.a · EAR 4 → 4.1.a","objetivos_aprendizaje":"en Lengua, anécdotas, chistes, relato, sinónimos y el nombre; en Matemáticas, tablas y multiplicación en vertical; hábitos saludables; y obras artísticas propias.","pz_obj_etapa":"e·g·h·i·j·k·ñ","cc_principales":"la competencia en comunicación lingüística y la personal, social y de aprender a aprender","curriculo_lcl":"la 2, comprender textos orales, con CCL2 y CP2, criterio 2.1.a y el sentido global; la 4, leer textos, con CCL2 y CCL5, criterio 4.1.a y las estrategias de lectura; la 5, escribir textos, con CCL1 y CCL3, criterio 5.1.a y la ortografía básica; la 8, leer literatura, con CCL4 y CCEC1, criterio 8.1.a y la literatura infantil; y la 9, reflexionar sobre la lengua, con CCL2 y CPSAA5, criterio 9.2.a y el uso del diccionario.","curriculo_mat":"la 1, interpretar situaciones cotidianas, con STEM1 y CE1, criterio 1.2.a y la multiplicación; la 4, el pensamiento computacional, con STEM2 y CE3, criterio 4.2.a y la organización de datos; la 5, conectar ideas, con STEM1 y CC4, criterio 5.2.a y la multiplicación como suma repetida; la 6, comunicar procesos, con CCL1 y STEM4, criterio 6.2.a y las operaciones simples; y la 8, trabajar en equipo, con CCL5 y CC3, criterio 8.2.a y el trabajo cooperativo.","curriculo_cmn_ear":"En Conocimiento del Medio, la 1, usar recursos digitales, con CD1 y CD2, criterio 1.2.a y los dispositivos digitales; la 4, el propio cuerpo, con CPSAA2 y CC3, criterio 4.1.a y el cuerpo humano; y la 6, la intervención humana, con CC4 y CE1, criterio 6.1.a y la vida sostenible. Y en Educación Artística, la 4, crear en equipo, con CCEC3 y CCEC4, criterio 4.1.a y el proceso creativo.","pz_s1":"lista de hábitos","sda_reto":"descubrir qué hábitos cuidan nuestra salud","s1_lcl_ej":"trabajamos el vocabulario y las palabras sinónimas","s1_lcl_act":"escuchamos una anécdota y dibujamos su secuencia, con el criterio 2.1.a, y el viernes contamos chistes con entonación en un concurso por equipos","s1_rel_lcl":"así se entrena el portavoz que presentará la pirámide de su equipo","s1_mat_ej":"construimos las tablas del 3, del 6 y del 9 y calculamos sus productos","s1_mat_act":"resolvemos problemas exprés con esquemas, con el criterio 1.2.a, y explicamos cómo se relacionan las tablas del 3 y del 6, con el 6.2.a","s1_rel_mat":"ordenar datos en un esquema nos prepara para ordenar los hábitos en la pirámide","s1_cmn":"el jueves buscamos en internet qué tipo de animales somos, con el criterio 1.2.a","s1_rel_cmn":"compararnos con otros animales por lo que comemos abre la lista de la pirámide","pz_f1":"Anécdota · esquemas · primates · figura humana","s1_ear":"representamos el esquema corporal dibujando la figura humana","s1_rel_ear":"con esa figura ilustramos el cartel de la pirámide","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión por equipos, cada miembro aporta los hábitos de cada día; el secretario los anota y el equipo separa los saludables de los que dañan la salud, con el criterio 6.1.a de Conocimiento del Medio. Yo guío y registro cada lista en una escala.","pz_s2":"pirámide terminada en Canva","s2_lcl_ej":"clasificamos los nombres por clase, género y número","s2_lcl_act":"leemos el capítulo, con el criterio 4.1.a, y redactamos un relato en tres partes, con el 5.1.a","s2_rel_lcl":"ordenar las ideas y escribir con corrección nos sirve para redactar los hábitos del cartel","s2_mat_ej":"construimos la tabla del 7 y multiplicamos por 10, por 100 y por 1000","s2_mat_act":"memorizamos las tablas jugando con regletas, con el criterio 4.2.a, y el viernes calculamos mentalmente en el concurso","s2_rel_mat":"multiplicar por 7 nos dice cuántas veces por semana repetimos cada hábito diario","s2_cmn":"el jueves dibujamos los aparatos de la nutrición y explicamos su función, con el criterio 4.1.a","s2_rel_cmn":"saber cómo nos nutrimos justifica los hábitos de alimentación del cartel","pz_f2":"Relato · regletas · nutrición · Meninas","s2_ear":"coloreamos a nuestro gusto «Las meninas» de Velázquez con una plantilla","s2_rel_ear":"probamos combinaciones de color para el cartel de la pirámide","s2_tarea":"el viernes, en una sesión por equipos, ordenamos los hábitos en la pirámide, de los diarios a los ocasionales, e incluimos el bienestar emocional, con el criterio 4.1.a de Conocimiento del Medio. El secretario la maqueta en Canva y queda terminado el cartel. Yo lo valoro con una rúbrica.","pz_s3":"presentación + refranes para el recetario","nombre_proyecto":"¡Sí, chef!","s3_lcl_ej":"practicamos los signos de interrogación y exclamación creando oraciones","s3_lcl_act":"en el cuentacuentos escuchamos textos variados, con el criterio 8.1.a, y revisamos nuestro relato y corregimos el dictado intercambiando cuadernos, con el 9.2.a","s3_rel_lcl":"revisar entre iguales nos sirve para corregir los refranes del recetario","s3_mat_ej":"multiplicamos en vertical, sin llevadas y con llevadas","s3_mat_act":"comparamos formas de multiplicar, contando, sumando o descomponiendo, con el criterio 5.2.a, y en el concurso de tablas cada uno cumple su tarea, con el 8.2.a","s3_rel_mat":"cada equipo presenta su pirámide con el mismo reparto de tareas","s3_cmn":"el jueves hacemos un diagrama de los sentidos y comentamos las etapas de la vida, con el criterio 4.1.a","s3_rel_cmn":"al presentar la pirámide, explicamos que cuidarnos importa en cada etapa de la vida","pz_f3":"Revisión · multiplicación · sentidos · cómic","s3_ear":"dentro de «Opera prima», creamos en equipo el cómic, con el criterio 4.1.a","s3_rel_ear":"cada equipo resuelve sus desacuerdos dialogando, con los mismos roles que en la pirámide","s3_tarea":"el viernes, en una sesión por equipos, primero cada portavoz presenta la pirámide terminada; después, como ya sabemos qué alimentos nos cuidan, para «¡Sí, chef!» cada equipo elige refranes, canciones o dibujos sobre la comida andaluza, y el secretario los maqueta en Canva para el recetario andaluz, con el criterio 1.2.a de Conocimiento del Medio. Yo guío y registro su trabajo en una lista de cotejo.","pz_compl":"Día del Flamenco","transferencia":"en casa, revisamos con la familia qué hábitos de la pirámide cumplimos; en el Día del Flamenco, reconocemos el baile como ejercicio saludable; y en los comercios de Mijas, multiplicamos para saber cuánto cuestan varias piezas de fruta.","contexto_digital":"compartimos la pirámide en Google Classroom, y cada familia la consulta desde casa","contexto_bilingue":"aprendemos las partes del cuerpo y los hábitos saludables, como «head», «sleep» o «healthy food»","situacion_nueva":"cuando elige qué llevar de desayuno al recreo, el alumnado recurre por sí mismo a la pirámide, distingue lo diario de lo ocasional y lo explica a sus compañeros.","publico_real":"el portavoz de cada equipo explica su pirámide a una clase de primero, y las publicamos en el blog del centro.","uso_real":"los carteles quedan en el pasillo del comedor, y todo el centro los consulta para recordar sus hábitos de salud.","reparto_dias":"de cinco días cada una, en tres semanas completas; y la situación de aprendizaje ocupa los tres viernes, con el cartel terminado en la fase dos.","progresion":"en Matemáticas, de construir las tablas a multiplicar en vertical; en Lengua, de la anécdota oral al relato revisado; y el cartel, de la lista de hábitos a la pirámide y a su presentación.","ajuste_realidad":"continúa con los equipos ya formados, aprovecha el Día del Flamenco y se apoya en los hábitos reales del alumnado de Mijas Costa, una localidad costera que invita al deporte.","m_lectura":"el capítulo del libro, leído en voz alta con estrategias de antes, durante y después","m_tic":"Canva para la pirámide y los refranes, Classroom para compartirla e internet para buscar qué tipo de animales somos","m_emocional":"el bienestar emocional de la pirámide, con el criterio 4.1.a de Conocimiento del Medio","m_conflictos":"el diálogo que usa cada equipo para acordar el cómic de «Opera prima»","m_sostenible":"el ODS 3, que vivimos eligiendo hábitos saludables para la pirámide","m_andalucia":"la visita de la bailaora flamenca, los refranes del recetario andaluz de «¡Sí, chef!» y el sevillano Velázquez","producto_aps":"el cómic para el corto de animación","m_agrupamientos":"el gran grupo para la pregunta del inicio; los equipos heterogéneos para la pirámide y los chistes; las parejas para el dictado; y el trabajo individual para las tablas.","recursos_ud":"la biblioteca, para el cuentacuentos; el patio, para la coreografía flamenca; las regletas, en las tablas; la prensa, en las noticias; y las familias, al revisar sus hábitos","m_previos":"la pregunta del inicio, donde el alumnado cuenta lo que sabe de sí mismo","dua_ejemplos":"Con múltiples formas de representación, presento los aparatos del cuerpo con imágenes y vídeos, y las tablas con regletas. Con múltiples formas de acción y expresión, cuentan sus anécdotas oralmente, por escrito o dibujando su secuencia. Y con múltiples formas de implicación, trabajan en equipo y se dan retroalimentación.","d_multinivel":"el concurso de problemas: el refuerzo resuelve multiplicaciones sin llevadas con regletas, y la profundización inventa problemas de multiplicar por 10, 100 y 1000.","d_profundizacion":"investiga cómo cambian los hábitos saludables con la edad y lo explica al presentar la pirámide.","d_vinculo":"los dos alumnos con dificultades construyen las tablas con regletas y leen el capítulo en lectura fácil; el alumno con TDAH escribe su relato por partes, con autoinstrucciones y una agenda visual; y la alumna de compensatoria aprende el vocabulario del cuerpo humano con un glosario visual.","d_sda":"el alumno con TDAH, encargado del material, sigue la tarea por pasos; los alumnos con dificultades parten de una pirámide modelo; y la alumna de compensatoria clasifica los hábitos con imágenes.","n_criterios":"catorce","e_inicial":"el diálogo sobre la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, la lista de hábitos, con escala del 6.1.a de Conocimiento del Medio; en la segunda, la pirámide, con rúbrica del 4.1.a; y en la tercera, los refranes, con lista de cotejo del 1.2.a.","e_criterios":"con rúbrica de fluidez, la lectura del capítulo, 4.1.a de Lengua; con escala de observación, la anécdota y el cuentacuentos, 2.1.a y 8.1.a, las regletas y las tablas, 4.2.a y 6.2.a, y el cómic, 4.1.a de Educación Artística; con lista de cotejo, los esquemas y las formas de multiplicar, 1.2.a y 5.2.a de Matemáticas; con el porfolio, el relato y su revisión, 5.1.a y 9.2.a; y con el anecdotario, el concurso de tablas, 8.2.a.","e_coevaluacion":"corregimos el dictado intercambiando los cuadernos, y cada equipo valora con una lista de cotejo su trabajo en la pirámide.","e_diversidad":"si a un alumno le cuesta memorizar la tabla del 7, la medida son las regletas con un compañero tutor; si ya la dice con ayuda, la valoro con un 4.","producto_proyecto":"refranes, canciones o dibujos para el recetario andaluz","conclusion_ud":"En definitiva, mi alumnado no solo multiplica o escribe relatos: descubre cómo funciona su cuerpo y ordena en una pirámide los hábitos que lo cuidan, porque lo que importa es la salud.","siguiente_ud":"la unidad 5, «Cuidamos los ecosistemas», donde pasamos del cuidado de nuestro cuerpo al del planeta","ods_corto":"los ODS 3 y 16"}},{"numero":5,"titulo":"Cuidamos los ecosistemas","trimestre":1,"fechas":"Del 2 al 20 de diciembre","dias":13,"valores":{"ti y el adjetivo; y la 10, convivir dialogando, con CP3 y CC1, criterio 10.2.a y el acto comunicativo.","curriculo_mat":"la 2, resolver problemas, con STEM1 y STEM2, criterio 2.1.a y la división; la 3, plantear problemas, con CCL1 y CE3, criterio 3.2.a y la invención de problemas; la 4, el pensamiento computacional, con STEM2 y CD1, criterio 4.1.a y los algoritmos sencillos; la 6, comunicar procesos, con CCL3 y STEM4, criterio 6.2.a y la numeración decimal; y la 7, gestionar emociones, con CPSAA1 y CE2, criterio 7.1.a y la tolerancia a la frustración.","curriculo_cmn_ear":"En Conocimiento del Medio, la 3, los proyectos de diseño, con CPSAA3 y CE3, criterio 3.1.a y sus fases; la 5, el medio natural, con STEM1 y CC4, criterio 5.2.a y los ecosistemas; y la 6, la intervención humana, con CC3 y CE1, criterio 6.1.a y la conservación de la naturaleza. Y en Educación Artística, la 4, crear producciones colectivas, con CC2 y CCEC3, criterio 4.2.a y las profesiones artísticas.","pz_s1":"boceto del mural por equipos","sda_reto":"descubrir qué daña los ecosistemas y cómo protegerlos","s1_lcl_ej":"escuchamos una descripción y aprendemos palabras antónimas","s1_lcl_act":"leemos en voz alta un poema de Gloria Fuertes, con el criterio 7.1.a, y empezamos a describir nuestro paisaje andaluz preferido","s1_rel_lcl":"ese paisaje inspira el ecosistema que cada equipo elegirá para el mural","s1_mat_ej":"hacemos repartos iguales con policubos y los expresamos con una división","s1_mat_act":"en grupos calculamos la mitad, el tercio y el cuarto al resolver problemas, con el criterio 2.1.a, y aprendemos el algoritmo de la división","s1_rel_mat":"con esos repartos, cada equipo divide en partes el espacio de su mural","s1_cmn":"el jueves, tras un vídeo sobre los ecosistemas, escribimos una cadena alimentaria","s1_rel_cmn":"con esa cadena, el boceto del mural muestra cómo se relacionan sus seres vivos","pz_f1":"Poema · repartos · cadena alimentaria · copos","s1_ear":"dibujamos la simetría de los copos de nieve","s1_rel_ear":"con esa simetría dibujaremos los seres vivos del mural","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión, cada equipo heterogéneo elige un ecosistema andaluz y hace el boceto del mural; el secretario anota cómo lo usan las personas y qué lo daña, con el criterio 5.2.a de Conocimiento del Medio. Yo guío y registro cada boceto en una escala.","pz_s2":"mural terminado con medidas","s2_lcl_ej":"describimos oralmente lugares del colegio, con el criterio 3.2.a","s2_lcl_act":"en el taller «¡Qué bonita es Andalucía!» escribimos la descripción de nuestro paisaje preferido, con el criterio 5.1.a","s2_rel_lcl":"escribir con corrección nos permite redactar sin faltas las medidas del mural","s2_mat_ej":"calculamos divisiones en caja, también con cero en el cociente","s2_mat_act":"en grupo dividimos con bloques de base 10 y explicamos el proceso, con el criterio 6.2.a","s2_rel_mat":"con esas divisiones repartimos entre los equipos el material para terminar el mural","s2_cmn":"el jueves dibujamos un ecosistema andaluz visitado y describimos sus seres vivos, con el criterio 5.2.a","s2_rel_cmn":"esas descripciones muestran en el mural qué seres vivos protege cada medida","pz_f2":"Paisaje · bloques · ecosistema visitado · Meninas","s2_ear":"conocemos «Las meninas», de Velázquez, y dibujamos en grupo, con el criterio 4.2.a","s2_rel_ear":"esos dibujos ilustran los seres vivos del mural","s2_tarea":"el viernes, en una sesión por equipos, cada miembro propone una medida contra un daño de su ecosistema; el secretario la escribe junto a ese daño y el equipo deja terminado el mural, con el criterio 6.1.a de Conocimiento del Medio. Yo guío y lo valoro con una rúbrica.","pz_s3":"receta ¡Sí, chef! + presentación","nombre_proyecto":"¡Sí, chef!","s3_lcl_ej":"revisamos el dictado de palabras con h, con el criterio 9.1.a","s3_lcl_act":"buscamos los adjetivos de un texto y, en el taller, leemos al grupo nuestra descripción y resolvemos dialogando los desacuerdos, con el criterio 10.2.a","s3_rel_lcl":"los adjetivos enriquecen la presentación del mural que harán los portavoces","s3_mat_ej":"corregimos divisiones erróneas con la prueba y expresamos emociones, con el criterio 7.1.a","s3_mat_act":"en grupos inventamos problemas de divisiones, con el criterio 3.2.a, y en el concurso pensamos paso a paso cómo preparar el desayuno, con el 4.1.a","s3_rel_mat":"ordenar esos pasos nos sirve para seguir la receta de «¡Sí, chef!»","s3_cmn":"el jueves escribimos en grupo consejos para un estilo de vida sostenible y los exponemos, con el criterio 6.1.a","s3_rel_cmn":"esos consejos llevan a casa las medidas del mural y entrenan a los portavoces","pz_f3":"Adjetivos · desayuno · consejos sostenibles · escenario","s3_ear":"dentro de «Opera prima», construimos el escenario del corto de animación","s3_rel_ear":"cada equipo se reparte las tareas como hizo con el mural","s3_tarea":"el viernes, en una sesión por equipos, primero cada portavoz presenta el mural terminado y explica qué daño evita cada medida. Después damos el paso de «¡Sí, chef!», donde aplicamos esos consejos sostenibles a lo que comemos: cada equipo elabora y degusta en el aula una receta andaluza, ordenando sus pasos como en el concurso, con el criterio 3.1.a de Conocimiento del Medio; el secretario la redacta para el recetario. Yo guío y la valoro con una rúbrica.","pz_compl":"Día de la Constitución","transferencia":"en casa, dividimos la merienda en partes iguales; en el Día de la lectura en Andalucía, describimos con adjetivos las curiosidades que leemos; y en Mijas, en la sierra o la playa, aplicamos las medidas del mural.","contexto_digital":"localizamos en Google Maps el ecosistema andaluz que cada uno ha visitado","contexto_bilingue":"aprendemos el vocabulario de los ecosistemas, como «forest», «sea» o «food chain»","situacion_nueva":"cuando en el patio ven residuos junto a los árboles, los recogen, explican a los compañeros qué daño causan al ecosistema y proponen una medida en la asamblea.","publico_real":"los portavoces lo presentan a una clase de segundo, y lo publicamos en el blog del centro para las familias.","uso_real":"el mural queda colgado en el pasillo y recuerda a todo el centro cómo proteger el planeta cada día.","reparto_dias":"de cuatro, cuatro y cinco días, por los festivos de la Constitución y la Inmaculada; y la situación de aprendizaje, de dos sesiones, acaba en la segunda.","progresion":"en Matemáticas pasamos del reparto con policubos a la división con su prueba; en Lengua, de escuchar descripciones a escribirlas y enriquecerlas con adjetivos; y el mural, del boceto a su presentación.","ajuste_realidad":"cierra el trimestre y aprovecha los días de la Constitución y de la lectura en Andalucía; y, en Mijas, entre sierra y mar, se apoya en ecosistemas cercanos al alumnado.","m_lectura":"el poema de Gloria Fuertes que buscamos, leemos en voz alta y dramatizamos","m_tic":"Google Maps para los ecosistemas visitados, Canva y Classroom para el mural y vídeos de ecosistemas y división","m_emocional":"la expresión de emociones ante una división errónea, con el criterio 7.1.a de Matemáticas","m_conflictos":"el diálogo del taller de escritura y el debate del Día de la Constitución","m_sostenible":"el ODS 15, que el mural y los consejos ecológicos llevan al aula","m_andalucia":"los ecosistemas de la sierra y la costa de Mijas, las curiosidades de Andalucía y el sevillano Velázquez","producto_aps":"un escenario para el corto de animación","m_agrupamientos":"el gran grupo para el vídeo inicial; los equipos heterogéneos para el mural; las parejas para revisar el dictado; y el trabajo individual para la descripción del paisaje.","recursos_ud":"la biblioteca, para las curiosidades de Andalucía; el patio, para describir lugares del colegio; los policubos y las regletas, en los repartos; y las familias, en el recetario","m_previos":"la asamblea sobre la pregunta del inicio, donde el alumnado cuenta qué ecosistemas conoce","dua_ejemplos":"Con múltiples formas de representación, presento los ecosistemas con vídeo y fotografías, y la división con policubos y regletas. Con múltiples formas de acción y expresión, describen un paisaje oralmente, por escrito o dibujándolo. Y con múltiples formas de implicación, eligen su ecosistema y se dan retroalimentación.","d_multinivel":"el concurso de problemas: el refuerzo resuelve con policubos divisiones exactas, y la profundización inventa problemas de divisiones con resto.","d_profundizacion":"investiga qué especies protegidas viven en un ecosistema andaluz y propone al mural una medida para protegerlas.","d_vinculo":"los dos alumnos con dificultades reparten con policubos antes de dividir y escriben la descripción con un modelo de lectura fácil; el alumno con TDAH sigue la división en caja con autoinstrucciones; y la alumna de compensatoria usa un glosario visual y, si no ha visitado ningún ecosistema, dibuja uno a partir de fotografías.","d_sda":"el alumno con TDAH, encargado del material, se mueve con sentido y sigue la tarea por pasos; y los alumnos con dificultades y la alumna de compensatoria parten de un mural modelo.","n_criterios":"catorce","e_inicial":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, el boceto, con escala del 5.2.a de Conocimiento del Medio; en la segunda, el mural terminado, con rúbrica del 6.1.a; y en la tercera, la receta, con rúbrica del 3.1.a.","e_criterios":"con rúbrica de fluidez, el poema, 7.1.a de Lengua; con escala de observación, las descripciones orales, 3.2.a, la división con bloques, 6.2.a de Matemáticas, y los dibujos, 4.2.a de Educación Artística; con lista de cotejo, el dictado, 9.1.a, y los repartos y el desayuno, 2.1.a y 4.1.a de Matemáticas; con el porfolio, la descripción, 5.1.a, y los problemas inventados, 3.2.a de Matemáticas; y en el anecdotario, el diálogo, 10.2.a, y las emociones, 7.1.a de Matemáticas.","e_coevaluacion":"cada equipo comprueba si su mural une cada daño con una medida, y corregimos el dictado intercambiando los cuadernos.","e_diversidad":"si a un alumno le cuesta dividir, la medida son los repartos con policubos junto a un compañero tutor; si ya reparte con poca ayuda, la valoro con un 4.","producto_proyecto":"una receta elaborada en el aula para el recetario andaluz","conclusion_ud":"En definitiva, mi alumnado no solo divide o describe paisajes: descubre que los seres vivos dependen de su ecosistema, aprende a cuidarlo y lo defiende con su propio mural.","siguiente_ud":"la unidad 6, «Cuidamos la ciudad», donde el cuidado del planeta llega al reciclado y al transporte","ods_corto":"los ODS 15 y 16"}},{"numero":6,"titulo":"Cuidamos la ciudad","trimestre":2,"fechas":"Del 7 al 24 de enero","dias":14,"valores":{"titulo":"Cuidamos la ciudad","trimestre_letra":"segundo","centro_interes":"las máquinas, el transporte y el reciclado","pz_producto":"Informe: la bicicleta como transporte","pz_ods":"ODS 11 y 16","pregunta_motriz":"¿Cómo podemos movernos cuidando la ciudad?","numero":"6","producto_sda":"un informe sobre la bicicleta como medio de transporte","justif_normativa":"el saber «Estilos de vida sostenible» de Conocimiento del Medio, del anexo II de la Orden","justif_curricular":"abre el segundo trimestre e introduce las fracciones, que continúan la división","justif_epistemologica":"la geografía urbana muestra que de ellos depende una ciudad sostenible, y la lengua y las matemáticas sirven para explicarlo","relevancia":"cuidar la ciudad nos ayuda a vivir en entornos más seguros y saludables","ods":"los ODS 11, ciudades y comunidades sostenibles, y 16","fechas":"del 7 al 24 de enero","dias":"14","contexto_significativo":"empieza el segundo trimestre, tras las vacaciones de Navidad; el programa CIMA, con ALDEA y STEAM, da sentido al reciclado y a las máquinas, y el de hábitos de vida saludable, a la bicicleta.","enlace_ud":"sigue a «Cuidamos los ecosistemas» y pasa del cuidado de la naturaleza al de la ciudad.","pz_lcl":"LCL 2·4·5·6·8 → 2.1.a·4.1.a·5.1.a·6.1.a·8.3.a","pz_mat":"MAT 1·3·4·6·8 → 1.2.a·3.2.a·4.1.a·6.1.a·8.1.a","pz_cmn_ear":"CMN 1·5·6 → 1.1.a·5.1.a·6.1.a · EAR 4 → 4.1.a","objetivos_aprendizaje":"en Lengua, mitos, leyendas, cómic, determinantes y ortografía; en Matemáticas, fracciones y sus términos; máquinas y su utilidad; y arte de distintas épocas.","pz_obj_etapa":"b·e·g·h·j·n·ñ","cc_principales":"la competencia matemática y en ciencia, tecnología e ingeniería y la ciudadana","curriculo_lcl":"la 2, comprender textos orales, con CCL2 y CP2, criterio 2.1.a y el sentido global; la 4, leer textos, con CCL2 y CD1, criterio 4.1.a y el vocabulario; la 5, escribir textos, con CCL3 y CCL5, criterio 5.1.a y la ortografía; la 6, buscar información, con CD1 y CE3, criterio 6.1.a y la búsqueda guiada; y la 8, leer literatura, con CCL4 y CCEC1, criterio 8.3.a y la literatura infantil.","curriculo_mat":"la 1, interpretar situaciones cotidianas, con STEM1 y STEM2, criterio 1.2.a y la comparación de fracciones; la 3, plantear problemas, con CCL1 y STEM2, criterio 3.2.a y la invención de problemas; la 4, el pensamiento computacional, con STEM3 y CE3, criterio 4.1.a y los algoritmos sencillos; la 6, comunicar procesos, con CCL1 y STEM4, criterio 6.1.a y las fracciones propias; y la 8, trabajar en equipo, con CCL5 y CC3, criterio 8.1.a y la participación activa.","curriculo_cmn_ear":"En Conocimiento del Medio, la 1, usar recursos digitales, con CD1 y CD2, criterio 1.1.a y las búsquedas guiadas; la 5, los elementos del medio, con STEM2 y CC4, criterio 5.1.a y la materia; y la 6, la intervención humana, con CC1 y CE1, criterio 6.1.a y la vida sostenible. Y en Educación Artística, la 4, las producciones artísticas, con CCEC3 y CCEC4, criterio 4.1.a y la cultura visual.","pz_s1":"recorridos en bici con Google Maps","sda_reto":"descubrir por qué la bicicleta cuida la ciudad","s1_lcl_ej":"leemos una noticia y aprendemos su vocabulario","s1_lcl_act":"escuchamos textos sobre mitos, con el criterio 2.1.a, y cada equipo busca un mito griego en internet y lo explica, con el 6.1.a","s1_rel_lcl":"buscar de forma guiada y explicar lo encontrado son los pasos que seguiremos con el informe","s1_mat_ej":"nombramos fracciones e identificamos el numerador y el denominador, con el criterio 6.1.a","s1_mat_act":"representamos fracciones dividiendo en partes iguales, con el criterio 1.2.a, y el viernes cada equipo inventa un problema con fracciones, con el 3.2.a","s1_rel_mat":"repartir en partes iguales nos prepara para expresar en fracciones los datos del informe","s1_cmn":"el jueves investigamos en internet un material artificial, con el criterio 1.1.a","s1_rel_cmn":"esa práctica prepara a cada equipo para trazar en Google Maps el recorrido del informe","pz_f1":"Mitos · fracciones · materia · geometría","s1_ear":"hacemos un dibujo original con figuras geométricas","s1_rel_ear":"con círculos y triángulos dibujamos la bicicleta del informe","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión por equipos, cada miembro cuenta cómo llega al colegio y el secretario lo anota; el coordinador traza en Google Maps cómo sería ese recorrido en bicicleta, con el criterio 1.1.a de Conocimiento del Medio. Yo guío y registro cada recorrido en una escala.","pz_s2":"informe terminado en Canva","s2_lcl_ej":"escribimos oraciones con determinantes y clasificamos palabras","s2_lcl_act":"leemos una leyenda, con el criterio 8.3.a, y preparamos el borrador de un cómic, con el 5.1.a","s2_rel_lcl":"planificar y revisar un borrador es el proceso con el que redactamos el informe","s2_mat_ej":"leemos y representamos medios, tercios y cuartos dividiendo la unidad","s2_mat_act":"representamos fracciones con regletas y buscamos fracciones equivalentes, con el criterio 4.1.a","s2_rel_mat":"con tercios y cuartos, el informe expresa qué parte del equipo viene en bicicleta","s2_cmn":"el jueves clasificamos materiales naturales y artificiales y esquematizamos sus propiedades, con el criterio 5.1.a","s2_rel_cmn":"con ese esquema, el informe explica de qué materiales está hecha una bicicleta","pz_f2":"Leyenda · regletas · materiales · Picasso","s2_ear":"conocemos a Picasso con un vídeo e identificamos el cubismo, con el criterio 4.1.a","s2_rel_ear":"sus figuras geométricas nos dan un estilo para las viñetas del cómic","s2_tarea":"el viernes, en una sesión por equipos, cada miembro redacta un apartado sobre un problema del tráfico y cómo lo mejora la bicicleta, con el criterio 6.1.a de Conocimiento del Medio. El secretario une los apartados en Canva y queda terminado el informe. Yo lo valoro con una rúbrica.","pz_s3":"informe presentado + cómic","nombre_proyecto":"¿Buceamos?","s3_lcl_ej":"repasamos los determinantes y completamos oraciones con mb y mp","s3_lcl_act":"leemos en voz alta un cómic y el capítulo del libro, con el criterio 4.1.a, y revisamos nuestro borrador","s3_rel_lcl":"el cómic leído nos da el modelo de viñetas y bocadillos para «¿Buceamos?»","s3_mat_ej":"comparamos fracciones con el mismo denominador usando los signos mayor que y menor que","s3_mat_act":"en el concurso pensamos paso a paso en equipo y dividimos un rectángulo por la mitad una y otra vez, con el criterio 8.1.a","s3_rel_mat":"comparar fracciones permite al portavoz explicar si en su equipo vienen más en coche o en bicicleta","s3_cmn":"el jueves distinguimos máquinas simples y compuestas y buscamos información sobre dos inventos, con el criterio 5.1.a","s3_rel_cmn":"al presentar el informe, explicamos que la bicicleta es una máquina compuesta","pz_f3":"Lectura · comparación · máquinas · fotografías","s3_ear":"dentro de «Opera prima», hacemos las fotografías para el corto de animación","s3_rel_ear":"cada equipo se reparte las tomas con los mismos roles del informe","s3_tarea":"el viernes, en una sesión por equipos, primero el portavoz presenta el informe terminado y explica sus fracciones; después, en el paso de «¿Buceamos?», cada equipo termina su cómic para la galería de arte sostenible y revisa sus textos con la misma pauta que usó en el informe, con el criterio 5.1.a de Lengua. El secretario pasa a limpio los bocadillos y el coordinador ordena las viñetas. Yo guío y valoro el cómic con una rúbrica.","pz_compl":"Salida al Bioparc Fuengirola","transferencia":"en casa, repartimos con la familia una pizza y nombramos las fracciones; en la situación de aprendizaje de la salida al Bioparc, localizamos información en sus paneles; y en las calles de Mijas, reconocemos las máquinas y el transporte público.","contexto_digital":"trazamos los recorridos en Google Maps y compartimos el informe en Google Classroom","contexto_bilingue":"aprendemos los medios de transporte y las máquinas, como «bike», «bus» o «machine»","situacion_nueva":"cuando planea con su familia una salida por Mijas, el alumnado propone por sí mismo ir a pie, en bicicleta o en autobús y explica cómo eso cuida la ciudad.","publico_real":"el portavoz de cada equipo lo expone ante una clase de cuarto, y lo publicamos en el blog del centro para las familias.","uso_real":"los informes quedan en la biblioteca del centro, y otras clases los consultan cuando estudian el transporte y la ciudad.","reparto_dias":"de cuatro, cinco y cinco días, porque la primera empieza tras Reyes; y la situación de aprendizaje ocupa tres viernes: dos de elaboración y uno de presentación.","progresion":"en Matemáticas, del concepto de fracción a compararlas; en Lengua, de los mitos escuchados al cómic escrito; y el informe, de los recorridos a la redacción y a su presentación.","ajuste_realidad":"retoma el curso tras la Navidad, aprovecha la salida al Bioparc de Fuengirola y se apoya en cómo llega el alumnado al colegio en una localidad turística como Mijas Costa.","m_lectura":"el capítulo del libro y un cómic, en voz alta, con estrategias de antes, durante y después","m_tic":"Google Maps para los recorridos, Canva para el ades parten de un informe modelo; y la alumna de compensatoria redacta su apartado con imágenes.","n_criterios":"catorce","e_inicial":"el diálogo sobre la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, el recorrido, con escala del 1.1.a de Conocimiento del Medio; en la segunda, el informe, con rúbrica del 6.1.a; y en la tercera, el cómic, con rúbrica del 5.1.a de Lengua.","e_criterios":"con rúbrica de fluidez, la lectura del capítulo, 4.1.a de Lengua; con escala de observación, los mitos, 2.1.a y 6.1.a de Lengua, las regletas, 4.1.a de Matemáticas, y el cubismo, 4.1.a de Educación Artística; con lista de cotejo, las fracciones, 1.2.a y 6.1.a de Matemáticas, y las máquinas, 5.1.a de Conocimiento del Medio; con el porfolio, la leyenda, 8.3.a de Lengua, y el problema inventado, 3.2.a de Matemáticas; y con el anecdotario, el concurso, 8.1.a.","e_coevaluacion":"cada equipo valora con una lista de cotejo su trabajo en el informe, y corregimos el dictado intercambiando los cuadernos.","e_diversidad":"si a un alumno le cuesta representar fracciones, la medida son las regletas con un compañero tutor; si ya las representa con ayuda, la valoro con un 4.","producto_proyecto":"un cómic para la galería de arte sostenible","conclusion_ud":"En definitiva, mi alumnado no solo compara fracciones o escribe un cómic: descubre cómo las máquinas cambian su entorno y defiende en un informe la bicicleta como forma de cuidar la ciudad.","siguiente_ud":"la unidad 7, «¿Cómo llego a un lugar?», donde estos recorridos darán paso al plano del barrio","ods_corto":"los ODS 11 y 16"}},{"numero":7,"titulo":"¿Cómo llego a un lugar?","trimestre":2,"fechas":"Del 27 de enero al 14 de febrero","dias":15,"valores":{"titulo":"¿Cómo llego a un lugar?","trimestre_letra":"segundo","centro_interes":"la representación de nuestro planeta","pz_producto":"Plano del barrio con centros sanitarios","pz_ods":"ODS 14 y 16","pregunta_motriz":"¿Cómo llegamos al centro de salu el barrio; el secretario elige los más cercanos y el portavoz los sitúa en el boceto del plano, con el criterio 2.2.a de Conocimiento del Medio. Yo guío y lo registro en una escala.","pz_s2":"plano terminado con leyenda","s2_lcl_ej":"reconocemos los determinantes posesivos y numerales en un esquema","s2_lcl_act":"leemos una carta, con el criterio 4.1.a, y escribimos otra para felicitar a un compañero, con el 5.1.a","s2_rel_lcl":"con los posesivos rotulamos el plano, como «nuestro colegio» o «mi calle»","s2_mat_ej":"pasamos de días a horas y de horas a minutos","s2_mat_act":"en el concurso, cada equipo plantea problemas con medias horas y cuartos de hora, con el criterio 3.2.a","s2_rel_mat":"con esos problemas calculamos cuánto se tarda en llegar a cada centro sanitario del plano","s2_cmn":"el jueves distinguimos globo terráqueo y planisferio y localizamos nuestro país","s2_rel_cmn":"el plano lleva, como el planisferio, un título y una leyenda","pz_f2":"Carta · horas · planisferio · Picasso","s2_ear":"conocemos al malagueño Pablo Picasso y dibujamos con una guía cubista, con el criterio 2.2.a","s2_rel_ear":"con sus formas geométricas simplificamos los edificios que dibujamos en el plano","s2_tarea":"el viernes, en una sesión por equipos, cada miembro dibuja una parte del barrio, el secretario rotula calles y centros sanitarios, y el equipo diseña la leyenda en Canva. Queda terminado el plano, con el criterio 5.1.a de Conocimiento del Medio. Yo guío y lo valoro con una rúbrica.","pz_s3":"presentación del plano + máscara marina","nombre_proyecto":"¿Buceamos?","s3_lcl_ej":"revisamos un dictado de r y rr, con el criterio 9.2.a","s3_lcl_act":"leemos con autonomía el capítulo del libro, con el criterio 7.1.a, y cada niño y cada niña lee su carta a los compañeros","s3_rel_lcl":"hacerlo ante el grupo entrena a los portavoces que presentarán el plano","s3_mat_ej":"leemos la hora en relojes analógicos y digitales, con el criterio 4.1.a","s3_mat_act":"redactamos qué hacemos al resentar el mundo, del planeta a su barrio, y con su plano ya sabe llegar a un lugar.","siguiente_ud":"la unidad 8, «Centinelas del mar», donde pasamos de representar la Tierra a conocer los paisajes andaluces","ods_corto":"los ODS 14 y 16"}},{"numero":8,"titulo":"Centinelas del mar","trimestre":2,"fechas":"Del 17 de febrero al 14 de marzo","dias":15,"valores":{"titulo":"Centinelas del mar","trimestre_letra":"segundo","centro_interes":"el paisaje andaluz","pz_producto":"Cartel sobre el cuidado del medioambiente","pz_ods":"ODS 14 y 16","pregunta_motriz":"¿Cómo cambiamos los humanos un paisaje?","numero":"8","producto_sda":"un cartel sobre el cuidado del medioambiente","justif_normativa":"el saber «Paisajes de España y Andalucía» de Conocimiento del Medio, del anexo II de la Orden","justif_curricular":"introduce los gráficos estadísticos en Matemáticas y prepara el estudio de la localidad","justif_epistemologica":"la geografía explica cómo la naturaleza y el ser humano lo modelan; la lengua y las matemáticas ayudan a describirlo","relevancia":"conocer nuestros paisajes refuerza la identidad cultural andaluza y nos enseña a conservar el medioambiente","ods":"los ODS 14, vida submarina, y 16","fechas":"del 17 de febrero al 14 de marzo","dias":"15","contexto_significativo":"llegan el Día de Andalucía y la semana blanca; el programa CIMA ALDEA da sentido al cuidado del mar, y el de hábitos de vida saludable, al desayuno andaluz.","enlace_ud":"sigue a «¿Cómo llego a un lugar?» y pasa de representar la Tierra a conocer sus paisajes.","pz_lcl":"LCL 2·4·5·8·9 → 2.1.a·4.1.a·5.1.a·8.3.a·9.2.a","pz_mat":"MAT 1·3·4·6·8 → 1.1.a·3.1.a·4.2.a·6.2.a·8.2.a","pz_cmn_ear":"CMN 2·5·6 → 2.2.a·5.1.a·6.1.a · EAR 3 → 3.1.a","objetivos_aprendizaje":"en Lengua, textos literarios, noticias, entrevistas y pronombres; en Matemáticas, gráficos de líneas y de barras; medidas para conservar el medioambiente; y sensibilidad artística.","pz_obj_etapa":"e·g·h·i·j·m·ñ","cc_principales":"la competencia matemática y en ciencia, tecnología e ingeniería y la ciudadana","curriculo_lcl":"la 2, comprender textos orales, con CCL2 y CP2, criterio 2.1.a y el sentido global; la 4, leer textos, con CCL2 y CD1, criterio 4.1.a y la lectura compartida; la 5, escribir textos, con CCL3 y CCL5, criterio 5.1.a y la coherencia textual; la 8, leer literatura, con CCL4 y CCEC1, criterio 8.3.a y la literatura popular andaluza; y la 9, reflexionar sobre la lengua, con CCL1 y CCL2, criterio 9.2.a y los signos de puntuación.","curriculo_mat":"la 1, interpretar situaciones cotidianas, con STEM1 y STEM2, criterio 1.1.a y las representaciones matemáticas; la 3, plantear problemas, con CCL1 y STEM2, criterio 3.1.a y los datos recogidos; la 4, el pensamiento computacional, con STEM2 y CD1, criterio 4.2.a y la multiplicación; la 6, comunicar procesos, con CCL1 y STEM4, criterio 6.2.a y los gráficos estadísticos; y la 8, trabajar en equipo, con CCL5 y CC3, criterio 8.2.a y el trabajo cooperativo.","curriculo_cmn_ear":"En Conocimiento del Medio, la 2, el pensamiento científico, con STEM2 y STEM4, criterio 2.2.a y los experimentos; la 5, los elementos del medio, con STEM5 y CC4, criterio 5.1.a y los paisajes andaluces; y la 6, la intervención humana, con CC1 y CE1, criterio 6.1.a y los ecosistemas naturales. Y en Educación Artística, la 3, crear obras propias, con CD2 y CCEC3, criterio 3.1.a y las técnicas de animación.","pz_s1":"votación del problema del cartel","sda_reto":"descubrir qué daña nuestros paisajes y cómo evitarlo","s1_lcl_ej":"averiguamos de qué país es cada deportista y su gentilicio","s1_lcl_act":"escuchamos un texto periodístico, con el criterio 2.1.a, y cada equipo investiga un deporte olímpico colectivo y lo presenta","s1_rel_lcl":"exponer lo investigado entrena al portavoz para explicar el problema del cartel","s1_mat_ej":"analizamos datos y buscamos la moda, el dato más repetido","s1_mat_act":"lanzamos tiros libres, dobles y triples en la cancha del patio y anotamos los puntos en una tabla, con el criterio 1.1.a","s1_rel_mat":"anotar en una tabla y hallar la moda permitirá elegir el problema del cartel","s1_cmn":"el jueves anotamos qué acciones humanas modifican un paisaje, con el criterio 6.1.a","s1_rel_cmn":"esas acciones son los problemas entre los que cada equipo elige el de su cartel","pz_f1":"Periodismo · tabla · paisaje · bodegón","s1_ear":"pintamos un bodegón de frutas","s1_rel_ear":"componer un bodegón es ensayar la ilustración del cartel","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión por equipos, cada miembro propone una acción humana dañina; el secretario anota los votos en una tabla, y la moda decide el problema del cartel, con el criterio 6.1.a de Conocimiento del Medio. Registro en una escala cómo lo explica el portavoz.","pz_s2":"experimento y cartel terminado","s2_lcl_ej":"trabajamos el vocabulario de un texto sobre deportes olímpicos","s2_lcl_act":"leemos una noticia, con el criterio 4.1.a, y escribimos sobre los juegos paralímpicos, con el 5.1.a","s2_rel_lcl":"escribir con corrección prepara al secretario para redactar las medidas del cartel","s2_mat_ej":"multiplicamos mentalmente por la unidad seguida de ceros, con el criterio 4.2.a","s2_mat_act":"conjeturamos y comprobamos con un gráfico de barras cuántos venimos andando al colegio, con el criterio 3.1.a","s2_rel_mat":"caminar no contamina, y esa es una medida que el equipo puede llevar al cartel","s2_cmn":"el jueves dibujamos un paisaje de interior y otro de costa y escribimos sus elementos","s2_rel_cmn":"así sabemos qué debe proteger el cartel en la costa","pz_f2":"Paralímpicos · gráfico · paisajes · Picasso","s2_ear":"conocemos a Picasso y el cubismo con una guía de dibujo","s2_rel_ear":"con ese estilo, el encargado del material ilustrará el cartel","s2_tarea":"el viernes, en una sesión por equipos, hacemos el experimento del plástico ecológico; con lo observado, cada equipo selecciona sus medidas, con el criterio 2.2.a de Conocimiento del Medio; el secretario las redacta en Canva y el encargado del material las ilustra. Queda terminado el cartel; lo valoro con rúbrica.","pz_s3":"cartel presentado + diorama marino","nombre_proyecto":"¿Buceamos?","s3_lcl_ej":"hacemos un dictado de palabras con c, q y z","s3_lcl_act":"en el cuentacuentos escuchamos un cuento popular andaluz, con el criterio 8.3.a, y cada equipo escribe una noticia deportiva y revisa su ortografía, con el 9.2.a","s3_rel_lcl":"revisar la ortografía nos permite valorar después el cartel de otro equipo","s3_mat_ej":"anotamos en un gráfico de líneas las temperaturas máximas y mínimas de Mijas","s3_mat_act":"elaboramos y explicamos un pictograma del libro preferido de la clase, con el criterio 6.2.a, y en el concurso nos repartimos las tareas, con el 8.2.a","s3_rel_mat":"ese mismo reparto es el que cada equipo sigue al montar el diorama","s3_cmn":"el jueves buscamos en Google Maps las provincias con costa y los sistemas montañosos, con el criterio 5.1.a","s3_rel_cmn":"así reconocemos la costa que cada equipo representa en el diorama","pz_f3":"Noticia · pictograma · mapa · fotografías","s3_ear":"dentro de «Opera prima», hacemos las fotografías del corto, con el criterio 3.1.a","s3_rel_ear":"cada equipo se reparte las tomas con los mismos roles que en el cartel","s3_tarea":"el viernes, en una sesión por equipos, primero el portavoz presenta el cartel terminado y señala los elementos de la costa que hay que proteger; después damos el paso de «¿Buceamos?», y cada equipo representa esos elementos en un diorama marino para la galería de arte sostenible, con el criterio 5.1.a de Conocimiento del Medio. El coordinador reparte las tareas y el secretario rotula cada elemento. Yo guío y valoro el diorama con una rúbrica.","pz_compl":"Desayuno del Día de Andalucía","transferencia":"con la familia, anotamos en una tabla los envases que reciclamos; en la situación de aprendizaje del desayuno del Día de Andalucía, buscamos la moda de lo que se desayuna; y en Mijas, distinguimos los elementos naturales y humanos del paisaje.","contexto_digital":"buscamos en internet la temperatura de Mijas y compartimos el gráfico en Google Classroom","contexto_bilingue":"aprendemos los elementos del paisaje y del mar, como «beach», «mountain» o «sea»","situacion_nueva":"cuando lee en la prensa una noticia sobre el mar, el alumnado identifica por sí mismo el problema ecosocial y propone una medida como las del cartel.","publico_real":"el portavoz de cada equipo lo presenta ante las otras clases de tercero, y lo publicamos en el blog del centro para las familias.","uso_real":"los carteles quedan en los pasillos del centro y recuerdan a toda la comunidad cómo cuidar el medioambiente.","reparto_dias":"de cinco días cada una, sin la semana blanca ni el 28 de febrero; y la situación de aprendizaje, de dos sesiones, acaba en la segunda.","progresion":"en Matemáticas, de la tabla a los gráficos de barras y de líneas; en Lengua, de leer noticias a escribirlas en equipo; y el cartel, del problema a las medidas y a su presentación.","ajuste_realidad":"aprovecha el desayuno del Día de Andalucía y se apoya en los paisajes que el alumnado conoce en Mijas Costa, entre el mar y la sierra.","m_lectura":"el texto periodístico sobre los deportes olímpicos, con estrategias de antes, durante y después de leer","m_tic":"Canva para el cartel, Google Maps para las provincias costeras, Classroom para los gráficos y un vídeo sobre paisajes","m_emocional":"la empatía al escribir sobre los juegos paralímpicos, con el criterio 5.1.a de Lengua","m_conflictos":"el debate de la noticia y la votación del problema del cartel","m_sostenible":"el ODS 14, que hacemos real con el experimento del plástico ecológico","m_andalucia":"los cuentos populares andaluces, el malagueño Picasso, el desayuno del Día de Andalucía y la costa de Mijas","producto_aps":"las fotografías para el corto «Un día en el cole»","m_agrupamientos":"el gran grupo para la pregunta del inicio; los equipos heterogéneos para el cartel y el diorama; las parejas para la entrevista; y el trabajo individual para los gráficos.","recursos_ud":"la biblioteca, para el cuentacuentos; el patio, para el baloncesto; el comedor, para el desayuno andaluz; la prensa, para las noticias; y las familias, en la tabla de reciclaje","m_previos":"la asamblea sobre la pregunta del inicio, donde el alumnado cuenta qué paisajes conoce","dua_ejemplos":"Con múltiples formas de representación, presento los paisajes con vídeos e imágenes, y los datos con tablas y gráficos. Con múltiples formas de acción y expresión, presentan lo investigado oralmente, por escrito o dramatizando una entrevista. Y con múltiples formas de implicación, trabajan en equipo y se dan retroalimentación.","d_multinivel":"el gráfico de barras de cómo llegamos al colegio: el refuerzo lo completa con una tabla dada, y la profundización plantea preguntas sobre los datos.","d_profundizacion":"investiga cómo afecta el plástico a la vida submarina y propone una medida más para el cartel.","d_vinculo":"los dos alumnos con dificultades leen el texto periodístico en lectura fácil y completan las tablas de datos con material manipulativo; el alumno con TDAH hace la noticia por pasos, con autoinstrucciones y una agenda visual; y la alumna de compensatoria aprende el vocabulario del paisaje con un glosario visual.","d_sda":"el alumno con TDAH, encargado del material, sigue el experimento por pasos; los alumnos con dificultades parten de un cartel modelo; y la alumna de compensatoria apoya sus medidas con imágenes.","n_criterios":"catorce","e_inicial":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, la tabla con el problema elegido, con escala del 6.1.a de Conocimiento del Medio; en la segunda, el cartel, con rúbrica del 2.2.a; y en la tercera, el diorama, con rúbrica del 5.1.a.","e_criterios":"con rúbrica de fluidez, la noticia leída, 4.1.a de Lengua; con escala de observación, el texto periodístico y el cuento, 2.1.a y 8.3.a, y la conjetura y el pictograma, 3.1.a y 6.2.a de Matemáticas; con lista de cotejo, los tiros y el cálculo, 1.1.a y 4.2.a; con el porfolio, la redacción y la noticia escrita, 5.1.a y 9.2.a de Lengua, y las fotografías, 3.1.a de Educación Artística; y con el anecdotario, el concurso, 8.2.a de Matemáticas.","e_coevaluacion":"cada equipo revisa con una lista de cotejo el cartel de otro equipo, y corregimos el dictado intercambiando los cuadernos.","e_diversidad":"si a un alumno le cuesta leer un gráfico, la medida es una tabla de recuento con un compañero tutor; si ya lo lee con ayuda, la valoro con un 4.","producto_proyecto":"un diorama marino para la galería de arte sostenible","conclusion_ud":"En definitiva, mi alumnado no solo lee noticias o interpreta gráficos: descubre cómo los humanos cambiamos los paisajes y, con su cartel, se convierte en centinela del mar.","siguiente_ud":"la unidad 9, «Somos ciudadanos», donde pasamos de los paisajes a la localidad y su organización","ods_corto":"los ODS 14 y 16"}},{"numero":9,"titulo":"Somos ciudadanos","trimestre":2,"fechas":"Del 17 de marzo al 4 de abril","dias":15,"valores":{"titulo":"Somos ciudadanos","trimestre_letra":"segundo","centro_interes":"la localidad y su organización","pz_producto":"Mural sobre tradiciones oficiales de España","pz_ods":"ODS 11 y 16","pregunta_motriz":"¿Qué es la localidad donde vivimos?","numero":"9","producto_sda":"un mural sobre tradiciones oficiales de España","justif_normativa":"el saber «La organización del territorio» de Conocimiento del Medio, del anexo II de la Orden","justif_curricular":"introduce las medidas de longitud y prepara el estudio de la población","justif_epistemologica":"las ciencias sociales estudian cómo se gobierna un territorio, y la lengua y las matemáticas lo describen y lo miden","relevancia":"comprender el entorno que nos rodea ayuda al alumnado a desenvolverse en la vida cotidiana","ods":"los ODS 11, ciudades y comunidades sostenibles, y 16","fechas":"del 17 de marzo al 4 de abril","dias":"15","contexto_significativo":"el trimestre se cierra con «¿Buceamos?»; el programa CIMA ALDEA da sentido al Día Mundial del Agua, el Plan de igualdad al mural y el de cultura de Paz a las normas de la localidad.","enlace_ud":"sigue a «Centinelas del mar» y pasa de los paisajes andaluces a cómo se organiza nuestra localidad.","pz_lcl":"LCL 3·4·5·6·9 → 3.2.a·4.1.a·5.1.a·6.1.a·9.1.a","pz_mat":"MAT 1·4·5·6·7 → 1.1.a·4.1.a·5.1.a·6.1.a·7.1.a","pz_cmn_ear":"CMN 3·5·8 → 3.2.a·5.2.a·8.1.a · EAR 4 → 4.2.a","objetivos_aprendizaje":"en Lengua, anuncios, comparaciones, el verbo, la g y la j; en Matemáticas, medidas de longitud con regla; instituciones locales y autonómicas; y obras propias.","pz_obj_etapa":"a·e·g·h·j·k·ñ","cc_principales":"la competencia ciudadana y la matemática y en ciencia, tecnología e ingeniería","curriculo_lcl":"la 3, expresarse oralmente, con CCL1 y CC2, criterio 3.2.a y la literatura infantil; la 4, comprender textos escritos, con CCL2 y CD1, criterio 4.1.a y la comprensión lectora; la 5, escribir con corrección, con CCL3 y CCL5, criterio 5.1.a y la ortografía; la 6, buscar información, con CD1 y CE3, criterio 6.1.a y las estrategias de búsqueda; y la 9, reflexionar sobre la lengua, con CCL2 y CP2, criterio 9.1.a y las relaciones entre palabras.","curriculo_mat":"la 1, interpretar situaciones cotidianas, con STEM1 y STEM2, criterio 1.1.a y la representación de problemas; la 4, el pensamiento computacional, con STEM2 y CD1, criterio 4.1.a y los algoritmos sencillos; la 5, conectar ideas, con STEM1 y CC4, criterio 5.1.a y la medición con instrumentos; la 6, comunicar resultados, con CCL1 y STEM4, criterio 6.1.a y las relaciones de igualdad; y la 7, gestionar emociones, con CPSAA1 y CE2, criterio 7.1.a y la autoconfianza.","curriculo_cmn_ear":"En Conocimiento del Medio, la 3, diseñar proyectos, con CPSAA3 y CE1, criterio 3.2.a y sus fases; la 5, reconocer el medio, con STEM1 y CC4, criterio 5.2.a y la organización del territorio; y la 8, valorar la diversidad, con CP3 y CC1, criterio 8.1.a y las costumbres y tradiciones. Y en Educación Artística, la 4, elaborar producciones colectivas, con CCEC3 y CCEC4, criterio 4.2.a y los materiales plásticos.","pz_s1":"mural del Día del Agua","sda_reto":"descubrir qué tradiciones compartimos como ciudadanos","s1_lcl_ej":"leemos una noticia, escuchamos un anuncio y respondemos a preguntas","s1_lcl_act":"buscamos en varias fuentes recetas de aprovechamiento, con el criterio 6.1.a","s1_rel_lcl":"contrastar fuentes es el paso con el que documentaremos cada tradición del mural","s1_mat_ej":"medimos con clips y con palmos y anotamos los resultados, con el criterio 5.1.a","s1_mat_act":"medimos el ancho de la clase con pies y pasos y, al comparar los resultados, identificamos nuestras emociones, con el criterio 7.1.a","s1_rel_mat":"como las medidas no coinciden, el papel del mural lo mediremos con una unidad común","s1_cmn":"el jueves, tras un vídeo sobre la localidad, describimos el barrio del colegio","s1_rel_cmn":"del barrio y la localidad pasamos después a las tradiciones de España del mural","pz_f1":"Recetas · palmos · localidad · animales","s1_ear":"construimos animales de papel en tres dimensiones","s1_rel_ear":"practicamos con el papel que usaremos en los murales","s1_tarea":"el viernes celebramos el Día Mundial del Agua. En una sesión, cada equipo elabora un mural sobre el uso responsable del agua; el secretario anota las ideas y el portavoz lo explica, con el criterio 5.2.a de Conocimiento del Medio. Yo guío y lo registro en una escala; la situación de aprendizaje arranca en la fase dos.","pz_s2":"mural de tradiciones terminado","s2_lcl_ej":"reconocemos las partes de un anuncio","s2_lcl_act":"debatimos qué significa «dejar volar la imaginación», con el criterio 3.2.a, y creamos un eslogan, con el 5.1.a","s2_rel_lcl":"cada equipo aprende a resumir una idea en una frase, el lema de su tradición","s2_mat_ej":"pasamos de metros a centímetros y de centímetros a metros, con el criterio 6.1.a","s2_mat_act":"con la cinta métrica medimos la clase y nuestro cuerpo, y resolvemos problemas exprés, con el criterio 1.1.a","s2_rel_mat":"así, el encargado del material mide en metros el papel del mural","s2_cmn":"el jueves proponemos normas para nuestra localidad e investigamos quién la gobierna, con el criterio 5.2.a","s2_rel_cmn":"ser ciudadanos es compartir normas y también tradiciones, las que recoge el mural","pz_f2":"Eslogan · cinta métrica · alcalde · Picasso","s2_ear":"descubrimos el cubismo de Pablo Picasso con una guía de dibujo y coloreamos libremente","s2_rel_ear":"con sus formas geométricas ilustramos las tradiciones del mural","s2_tarea":"el viernes, en una sesión, cada equipo elige una tradición; el secretario la documenta, el portavoz escribe su lema y todos la ilustran con mujeres y hombres que la celebran. Queda terminado el mural, con el criterio 8.1.a de Conocimiento del Medio. Yo guío y lo valoro con una rúbrica.","pz_s3":"presentación del mural + galería","nombre_proyecto":"¿Buceamos?","s3_lcl_ej":"repasamos la g, la j y la diéresis con un dictado","s3_lcl_act":"hacemos un esquema del verbo y sus tiempos, con el criterio 9.1.a, y cada niño y cada niña lee su dictado en voz alta, con el 4.1.a","s3_rel_lcl":"leer ante la clase nos prepara para presentar nuestra parte del mural","s3_mat_ej":"medimos con regla objetos del aula y anotamos los resultados","s3_mat_act":"descubrimos el kilómetro y elegimos la unidad adecuada para cada longitud, y en el concurso pensamos paso a paso, con el criterio 4.1.a","s3_rel_mat":"pensar paso a paso ordena el guion de la presentación del mural","s3_cmn":"el jueves buscamos las provincias de nuestra comunidad autónoma y las ordenamos alfabéticamente","s3_rel_cmn":"así, al presentar el mural, cada equipo sitúa su tradición en su comunidad y su provincia","pz_f3":"Verbo · kilómetro · provincias · fotografías","s3_ear":"dentro de «Opera prima», editamos las fotografías del corto, con el criterio 4.2.a","s3_rel_ear":"los roles que funcionaron en el mural reparten ahora la edición","s3_tarea":"el viernes, en una sesión, primero cada equipo presenta su tradición del mural con ayuda de un guion, y cada miembro explica una parte, con el criterio 3.2.a de Conocimiento del Medio. Después, ese guion nos sirve para «¿Buceamos?»: montamos la galería de arte sostenible con las obras del trimestre, y cada portavoz presenta las de su equipo. Yo guío y valoro las presentaciones con una rúbrica.","pz_compl":"Día Mundial del Agua","transferencia":"en casa, anotamos en centímetros lo que miden los muebles; en el patio, medimos la pista en pasos y en metros; y en Mijas, reconocemos las señales de tráfico de nuestras calles y expresamos en kilómetros la distancia a la playa.","contexto_digital":"con Google Maps recorremos desde casa los barrios de Mijas y localizamos el ayuntamiento","contexto_bilingue":"nombramos los lugares de la localidad y las medidas, como «town hall», «street» o «metre»","situacion_nueva":"cuando llega un compañero de otra comunidad, el alumnado le explica cómo se organiza Mijas, quién la gobierna y qué tradiciones compartimos, y se interesa por las de su tierra.","publico_real":"los portavoces lo presentan a otra clase de tercero, y lo publicamos en el blog del centro para las familias.","uso_real":"el mural queda en el pasillo, y lo consultamos cuando se acerca una de sus tradiciones para recordar su sentido.","reparto_dias":"de cinco días cada una, con el Día Mundial del Agua en la primera; y la situación de aprendizaje, de dos sesiones, arranca en la segunda.","progresion":"en Matemáticas pasamos del palmo y el paso al metro y al kilómetro; en Lengua, del anuncio al eslogan y al verbo; y el mural, de su elaboración a su presentación.","ajuste_realidad":"aprovecha el Día Mundial del Agua y el cierre del trimestre; y, en una localidad turística como Mijas Costa, urso · vídeo · texturas","s1_ear":"creamos un dibujo con texturas y color","s1_rel_ear":"esos colores distinguirán en la pirámide ambos sexos","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión por equipos, cada miembro busca un grupo de edad en el padrón de Mijas, con el criterio 1.1.a de Conocimiento del Medio, y el secretario anota en una tabla de Classroom cuántos hombres y mujeres hay. Yo guío y la registro en una escala.","pz_s2":"conjetura y pirámide terminada","s2_lcl_ej":"formamos familias de palabras a partir de una noticia","s2_lcl_act":"leemos refranes en el Día del Libro, con el criterio 8.3.a, y recitamos un poema, con el 7.2.a","s2_rel_lcl":"recitar con entonación prepara al portavoz para presentar la pirámide en la fase tres","s2_mat_ej":"transformamos kilos en gramos y sumamos y restamos medidas de masa","s2_mat_act":"estimamos la masa de distintos objetos y conjeturamos cuáles pesan un kilo, con el criterio 3.1.a","s2_rel_mat":"conjeturar y luego comprobar es lo que hará cada equipo con la pirámide","s2_cmn":"el jueves coloreamos las zonas poco y muy pobladas de España y esquematizamos los sectores económicos","s2_rel_cmn":"el mapa muestra dónde vive la población; la pirámide, cómo se reparte por edades","pz_f2":"Refranes · masa · mapa · Murillo","s2_ear":"copiamos «Niños comiendo melón y uvas», del sevillano Murillo, con el criterio 1.2.a","s2_rel_ear":"copiar figuras nos prepara para ilustrar las edades de la pirámide","s2_tarea":"el viernes, en una sesión por equipos, conjeturamos y comprobamos si hay más niños o mayores; el secretario traza las barras de hombres y mujeres y el encargado del material las ilustra, con el criterio 5.1.a de Conocimiento del Medio. Queda terminada la pirámide, y la valoro con una rúbrica.","pz_s3":"pirámide presentada + lapbook","nombre_proyecto":"Huellas del pasado","s3_lcl_ej":"rodeamos el verbo y subrayamos el sujeto y el predicado","s3_lcl_act":"cada equipo escribe y lee en  nuestras familias","dua_ejemplos":"Con múltiples formas de representación, presento la población con vídeos, mapas y la pirámide, y las medidas con recipientes y báscula. Con múltiples formas de acción y expresión, declaman, escriben o dibujan lo aprendido. Y con múltiples formas de implicación, trabajan en equipo y se dan retroalimentación.","d_multinivel":"el concurso de problemas: el refuerzo resuelve problemas de litros con recipientes reales, y la profundización inventa problemas con medio kilo y cuarto de kilo.","d_profundizacion":"investiga cómo ha crecido la población de Mijas y lo explica al presentar la pirámide.","d_vinculo":"los dos alumnos con dificultades estiman la capacidad con recipientes reales y leen la noticia en lectura fácil; el alumno con TDAH prepara la declamación por pasos, con una agenda visual y autoinstrucciones; y la alumna de compensatoria aprende el vocabulario de la población con un glosario visual y una compañera tutora.","d_sda":"el alumno con TDAH, encargado del material, ilustra la pirámide por pasos; los alumnos con dificultades parten de una pirámide modelo; y la alumna de compensatoria se apoya en imágenes.","n_criterios":"catorce","e_inicial":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, la tabla del padrón, con escala del 1.1.a de Conocimiento del Medio; en la segunda, la pirámide, con rúbrica del 5.1.a; y en la tercera, la presentación oral, con rúbrica del 9.1.a.","e_criterios":"con rúbrica de fluidez, los poemas, 4.1.a de Lengua; con escala de observación, la canción y los refranes, 2.1.a y 8.3.a, y la conjetura y la balanza, 3.1.a y 4.1.a de Matemáticas; con lista de cotejo, los problemas y la báscula, 2.1.a y 5.1.a de Matemáticas, y Murillo, 1.2.a de Educación Artística; con el porfolio, el dictado, 5.1.a; y con el anecdotario, el poema recitado y el concurso, 7.2.a de Lengua y 8.1.a de Matemáticas.","e_coevaluacion":"cada equipo valora con una lista de cotejo la declamación de otro, y corregimos el dictado intercambiando los cuadernos.","e_diversidad":"si a un alumno le cuesta pasar de litros a mililitros, la medida es usar recipientes reales con un compañero tutor; si ya lo hace con ayuda, la valoro con un 4.","producto_proyecto":"el diseño de la estructura del lapbook","conclusion_ud":"En definitiva, mi alumnado no solo mide litros y kilos o declama poesía: descubre quién vive en su localidad y, con su pirámide, muestra qué edad tienen sus vecinos y vecinas.","siguiente_ud":"la unidad 11, «¿En qué edad estamos?», donde pasamos de nuestra edad a la historia","ods_corto":"los ODS 11 y 16"}},{"numero":11,"titulo":"¿En qué edad estamos?","trimestre":3,"fechas":"Del 8 al 30 de mayo","dias":17,"valores":{"titulo":"¿En qué edad estamos?","trimestre_letra":"tercer","centro_interes":"el paso del tiempo histórico","pz_producto":"Línea del tiempo de nuestra vida","pz_ods":"ODS 4 y 16","pregunta_motriz":"¿Cómo situamos los hechos en el tiempo?","numero":"11","producto_sda":"una línea del tiempo de la propia vida","justif_normativa":"el saber «El tiempo histórico» de Conocimiento del Medio, del anexo II de la Orden","justif_curricular":"abre el estudio de la historia y los ángulos, que culminan en junio","justif_epistemologica":"la historia ordena los hechos en edades y siglos, y la lengua y las matemáticas sirven para narrarlos y medirlos","relevancia":"comprender cómo evolucionan las sociedades con el tiempo ayuda al alumnado a entender su presente","ods":"los ODS 4, educación de calidad, y 16","fechas":"del 8 al 30 de mayo","dias":"17","contexto_significativo":"el curso llega a su final y «Huellas del pasado» recibe el contenido del lapbook; el Plan de igualdad da sentido al lenguaje inclusivo, el de cultura de Paz al debate y CIMA STEAM al geoplano.","enlace_ud":"sigue a «¿Qué edad tienes?» y pasa de la edad de las personas a las edades históricas.","pz_lcl":"LCL 3·4·5·6·9 → 3.2.a·4.1.a·5.1.a·6.1.a·9.1.a","pz_mat":"MAT o 3.2.a","s1_rel_lcl":"argumentar y respetar turnos nos prepara para acordar qué hechos entran en la línea del tiempo","s1_mat_ej":"trazamos con la regla rectas paralelas y secantes","s1_mat_act":"buscamos en Google Maps calles paralelas y secantes cerca del colegio, con el criterio 2.1.a, e identificamos ángulos en objetos cotidianos, con el 3.2.a","s1_rel_mat":"el eje de la línea del tiempo es una recta, y la trazaremos con la regla","s1_cmn":"el jueves buscamos en internet un hecho de cada edad, con el criterio 2.2.a","s1_rel_cmn":"situarlos en una línea del tiempo nos sirve de ensayo para la nuestra","pz_f1":"Debate · Google Maps · edades · esgrafiado","s1_ear":"creamos un diseño libre con esgrafiado","s1_rel_ear":"así decoraremos el título de la línea del tiempo","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión por equipos, cada miembro aporta los hechos de su vida; el secretario los ordena por años y el encargado del material traza el eje con la regla, con el criterio 7.1.a de Conocimiento del Medio. Yo guío y registro cada borrador en una escala.","pz_s2":"línea del tiempo terminada","s2_lcl_ej":"practicamos el uso de la raya en los diálogos","s2_lcl_act":"buscamos en la biblioteca un cuento con diálogos y escribimos su resumen, con el criterio 6.1.a","s2_rel_lcl":"resumir nos enseña a explicar cada hecho de la línea del tiempo con una frase","s2_mat_ej":"calculamos mentalmente dobles de dos cifras e identificamos nuestras emociones, con el criterio 7.1.a","s2_mat_act":"reconocemos rectas perpendiculares y dibujamos ángulos rectos con la escuadra en distintas posiciones, con el criterio 2.1.a","s2_rel_mat":"con la escuadra, cada año se marca perpendicular a la línea del tiempo","s2_cmn":"el jueves hacemos la ficha de un invento de la Edad Moderna, con el criterio 7.1.a","s2_rel_cmn":"fecharlo nos entrena para situar en su año cada hecho de la línea del tiempo","pz_f2":"Resumen · escuadra · inventos · Murillo","s2_ear": o redacta en Classroom y el coordinador lo revisa. Yo guío y lo valoro con rúbrica.","pz_compl":"Salida al Centro Pompidou","transferencia":"en casa, ordenamos en una línea del tiempo los hechos de la familia; en la salida al Centro Pompidou, reconocemos rectas y ángulos en el edificio y las obras; y en Mijas, distinguimos calles paralelas y perpendiculares.","contexto_digital":"con Google Maps localizamos el Centro Pompidou y trazamos el itinerario desde el colegio","contexto_bilingue":"nombramos las edades de la historia y el tiempo, como «Prehistory», «century» o «timeline»","situacion_nueva":"cuando el alumnado ve en Mijas una fecha en una fachada o una placa, calcula cuántos años han pasado, la sitúa en su siglo y dice a qué edad pertenece.","publico_real":"los portavoces presentan la línea del tiempo a una clase de segundo, y la publicamos en el blog del centro para las familias.","uso_real":"la línea del tiempo queda expuesta en el aula, y en la última unidad la comparamos con fotografías antiguas de Mijas.","reparto_dias":"de siete, cinco y cinco días, porque la primera incluye el arranque; y la situación de aprendizaje ocupa dos viernes y termina en la fase dos.","progresion":"en Matemáticas pasamos de las rectas a los ángulos y al plano; en Lengua, del debate al diálogo escrito y leído; y la línea del tiempo, del borrador a su presentación.","ajuste_realidad":"aprovecha el final del curso y la salida al Centro Pompidou de Málaga, y se apoya en la propia vida del alumnado y en las calles de Mijas Costa.","m_lectura":"el texto «¿Cómo serán las ciudades del futuro?», con estrategias de antes, durante y después de leer","m_tic":"Google Maps para las calles, internet para las edades, Classroom para el lapbook y Canva para el cartel","m_emocional":"las emociones del concurso de cálculo mental, con el criterio 7.1.a de Matemáticas","m_conflictos":"el debate sobre los robots, con turnos y un lenguaje no violento","m_sostenible":"el ODS 16, que hacemos real con el écnicas cooperativas; la 7, comprender cambios sociales, con CC1 y CCEC1, criterio 7.2.a y los avances del pasado; y la 9, convivir con respeto, con CC2 y CC3, criterio 9.1.a y las normas sociales. Y en Educación Artística, la 4, difundir producciones, con CE1 y CCEC3, criterio 4.3.a y los materiales plásticos.","pz_s1":"boceto de la maqueta","sda_reto":"dar a conocer un museo de nuestra provincia","s1_lcl_ej":"leemos una obra de teatro y trabajamos su vocabulario","s1_lcl_act":"escuchamos un ensayo teatral y respondemos a sus preguntas, con el criterio 3.2.a, y el viernes dramatizamos una obra de teatro","s1_rel_lcl":"así nos entrenamos para presentar la maqueta en voz alta en la fase tres","s1_mat_ej":"clasificamos los polígonos según su número de lados y los dibujamos","s1_mat_act":"buscamos polígonos a nuestro alrededor y los nombramos, con el criterio 6.1.a, y en el concurso del viernes inventamos problemas, con el 3.2.a","s1_rel_mat":"las caras de la maqueta serán polígonos que ya sabemos identificar y trazar","s1_cmn":"el jueves conocemos las fuentes históricas y buscamos una noticia histórica de Mijas","s1_rel_cmn":"esa consulta guiada en internet nos prepara para localizar el museo de la maqueta","pz_f1":"Teatro · polígonos · fuentes · invitación","s1_ear":"diseñamos libremente la invitación de fin de curso","s1_rel_ear":"en ella probamos los materiales plásticos de la maqueta","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión por equipos, situamos en Google Maps el Pompidou y cada equipo diseña su boceto; el coordinador reparte las partes y el secretario anota los materiales, con el criterio 3.1.a de Conocimiento del Medio. Yo guío y registro los bocetos en una escala.","pz_s2":"maqueta terminada","s2_lcl_ej":"completamos el esquema de las lenguas de España","s2_lcl_act":"reconocemos el andaluz, con el criterio 1.2.a, y escribimos en grupo un texto teatral, con el 5.1.a","s2_rel_lcl":"el secretario aplica esa escritura cuidada a los rótulos de la maqueta","s2_mat_ej":"clasificamos los triángulos según sus lados y sus ángulos","s2_mat_act":"calculamos el perímetro de la mesa, con el criterio 5.1.a, y hallamos mitades en equipo, con el 8.1.a","s2_rel_mat":"el perímetro nos sirve para medir el contorno de la base de la maqueta","s2_cmn":"el jueves redactamos y exponemos normas para comportarnos en un museo, con el criterio 9.1.a","s2_rel_cmn":"ya sabemos qué es un museo, y la maqueta representa uno de Málaga","pz_f2":"Texto teatral · perímetro · museos · Murillo","s2_ear":"copiamos «Niños comiendo melón y uvas», del sevillano Murillo, y montamos un mural","s2_rel_ear":"así vemos qué obras guarda un museo, como el de nuestra maqueta","s2_tarea":"el viernes, en una sesión por equipos, construimos la maqueta; el encargado del material reparte las reglas, cada miembro recorta y monta polígonos y el secretario escribe los rótulos, con el criterio 3.1.a de Conocimiento del Medio. Yo guío; la maqueta queda terminada, y la valoro con una rúbrica.","pz_s3":"maqueta presentada + lapbook","nombre_proyecto":"Huellas del pasado","s3_lcl_ej":"practicamos palabras con bl y br en un dictado","s3_lcl_act":"conocemos cuentos tradicionales en el cuentacuentos, con el criterio 8.3.a, y debatimos qué pasaría si tuviéramos que irnos a vivir a otro país, con el 10.2.a","s3_rel_lcl":"con ese diálogo, cada equipo acuerda sin conflictos cómo decorar el lapbook","s3_mat_ej":"dibujamos una circunferencia con el compás y señalamos su centro, radio y diámetro","s3_mat_act":"describimos cuadriláteros con vocabulario geométrico y, en el concurso, encontramos una figura por su descripción pensando paso a paso, con el criterio 4.1.a","s3_rel_mat":"describir figuras con precisión ayuda al portavoz a explicar cómo construimos la maqueta","s3_cmn":"el jueves buscamos fotografías antiguas de Mijas e investigamos un personaje histórico de Andalucía, con el criterio 7.2.a","s3_rel_cmn":"esas fotografías decoran el lapbook, y el personaje enriquece su presentación","pz_f3":"Debate · figuras · personaje · festival","s3_ear":"dentro de «Opera prima», organizamos el festival de cine, con el criterio 4.3.a","s3_rel_ear":"cada equipo mantiene los roles con que construyó la maqueta","s3_tarea":"el viernes, en una sesión por equipos, primero el portavoz presenta la maqueta y explica cómo la ha construido su equipo, empleando un lenguaje inclusivo y no violento, con el criterio 9.1.a de Conocimiento del Medio. Esa presentación sirve de ensayo para el paso final de «Huellas del pasado»: cada equipo decora su lapbook con las fotografías antiguas de Mijas y lo presenta, y el coordinador reparte los turnos. Yo guío y valoro las presentaciones con una rúbrica.","pz_compl":"Día de la Memoria Histórica","transferencia":"con la familia, calculamos el perímetro de una habitación de casa; en la exposición del Día de la Memoria Histórica, aplicamos las normas de comportamiento de un museo; y en Mijas, ante sus monumentos, reconocemos triángulos, cuadriláteros y círculos.","contexto_digital":"buscamos en internet noticias históricas de Mijas y las compartimos en Google Classroom","contexto_bilingue":"aprendemos vocabulario del museo y de la historia, como «museum», «past» o «painting»","situacion_nueva":"cuando en verano visita un museo o un monumento, el alumnado busca por sí mismo fuentes sobre él, como fotografías antiguas, y explica qué huella del pasado conserva.","publico_real":"las maquetas se exponen en la biblioteca del centro para todo el alumnado, y el blog las muestra a las familias.","uso_real":"el curso siguiente, otros grupos las usan para preparar su visita al Centro Pompidou.","reparto_dias":"de cinco días cada una, en tres semanas completas sin festivos; y la situación de aprendizaje, de dos sesiones, termina en la fase dos.","progresion":"en Matemáticas, de los polígonos a los triángulos, los cuadriláteros y la circunferencia; en Lengua, de escuchar y dramatizar teatro a escribirlo
