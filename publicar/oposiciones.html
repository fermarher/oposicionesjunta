ero, como ejercicio,»: empieza en minúscula por un VERBO en presente, sin punto final (sigue «;»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"redondeamos números en la recta numérica gestionando el error, con el criterio 7.1.a","palabras":[4,14],"etiqueta":"Fase 3 · Matemáticas: ejercicio"},{"id":"s3_mat_act","descripcion":"ACTIVIDAD de MATEMÁTICAS de la fase 3 (ficha: semanas[2].MAT): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada niño y cada niña» / «cada equipo» (evita «cada alumno»), y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Va tras «y después, como actividad,»: empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"en el concurso pensamos paso a paso cómo preparar la mochila, con el criterio 4.1.a, y conectamos ideas en los problemas exprés, con el 5.1.a","palabras":[8,26],"etiqueta":"Fase 3 · Matemáticas: actividad"},{"id":"s3_rel_mat","descripcion":"RELACIÓN de lo que hace MATEMÁTICAS en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"el concurso se juega con roles, y el secretario anota en una tabla si se cumplen las normas","palabras":[8,19],"etiqueta":"Fase 3 · Matemáticas: relación con el producto"},{"id":"s3_cmn","descripcion":"Actividad de CONOCIMIENTO DEL MEDIO de la fase 3 que NO es la tarea (ficha: semanas[2].CMN, el jueves), en primera persona del plural y con su criterio si lo tiene. Empieza en minúscula (va tras «En Conocimiento del Medio,»), SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"el jueves redactamos en equipo una entrevista sobre lo que comemos en casa, para hacérsela a un familiar","palabras":[6,19],"etiqueta":"Fase 3 · Conocimiento del Medio: actividad"},{"id":"s3_rel_cmn","descripcion":"RELACIÓN de lo que hace CONOCIMIENTO DEL MEDIO en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"redactarla en equipo pone a prueba las normas, y es nuestra aportación a «¡Sí, chef!»","palabras":[8,16],"etiqueta":"Fase 3 · Conocimiento del Medio: relación con el producto"},{"id":"pz_f3","descripcion":"PIZARRA. Caja «6. Fase 3»: las aportaciones de las áreas en esta fase, en 3-7 palabras separadas por «·», en el orden Lengua · Matemáticas · Medio · Artística, sin siglas de área (p. ej. «Receta · medidas · huerto · bodegón»). Solo actividades de ESTA fase.","ejemplo":"Dictado · mochila · entrevista · stop motion","palabras":[3,8],"etiqueta":"Pizarra: caja de la fase 3"},{"id":"s3_ear","descripcion":"Actividad de EDUCACIÓN ARTÍSTICA de la fase 3 (ficha: semanas[2].EAR); si es el APS, nombra «Opera prima». Empieza en minúscula (va tras «Y en Educación Artística,») y SIN punto final (sigue «:» y la relación). El criterio de Educación Artística debe ir con la actividad cuyo SIGNIFICADO encaja (identificar o conocer una obra o un artista → criterio de identificar propuestas; crear → criterio de producción), aunque la ficha lo ponga en otra semana; debe aparecer en al menos una fase.","ejemplo":"dentro de «Opera prima», elaboramos un informe sobre la animación stop motion","palabras":[4,13],"etiqueta":"Fase 3 · Educación Artística: actividad"},{"id":"s3_rel_ear","descripcion":"RELACIÓN de lo que hace EDUCACIÓN ARTÍSTICA en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"cada miembro redacta una parte según su rol, respetando la norma de los turnos","palabras":[6,15],"etiqueta":"Fase 3 · Educación Artística: relación con el producto"},{"id":"s3_tarea","descripcion":"TAREA FINAL de la fase 3 (ficha: semanas[2].CMN, el viernes). En la UD 1 se cierra el método científico anunciado en la fase 1, se leen las entrevistas de «¡Sí, chef!» y se elabora el cartel. En las UD 2-12 es el paso del proyecto de diseño (nómbralo: «¡Sí, chef!», «¿Buceamos?», «Huellas del pasado») con su criterio; añade cómo se presenta o se usa el producto de la SdA, ya terminado, sin inventar actividades nuevas. Si se juntan dos cosas, ARTICÚLALAS («primero…; después…», y por qué una sirve a la otra). El público de fuera del aula va en publico_real, no aquí. Desarróllala con CUATRO datos: agrupamiento, duración («en una sesión», sin inventar minutos), pasos (qué hace cada miembro o rol) y evidencia o instrumento con que se recoge; di también qué hace la maestra («Yo guío… y registro…»). SIEMPRE con su criterio y el ÁREA del criterio («con el criterio 1.1.a de Conocimiento del Medio»), y que el producto muestre de forma visible lo que pide el criterio (si es de igualdad o diversidad, di qué parte del producto lo evidencia; si es de recursos digitales, hazla con un recurso digital de la UD: Canva, Google Classroom o Google Maps). Dos o tres oraciones; empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el viernes, en una sesión por equipos, cerramos el método científico, y con la tabla del secretario comprobamos la hipótesis y corregimos la norma que falla. Después, cada equipo lee sus entrevistas para «¡Sí, chef!» respetando los turnos y elabora su cartel definitivo, con una norma de igualdad, que los roles roten entre niñas y niños, y otra de respeto a todas las familias, con el criterio 8.1.a de Conocimiento del Medio. Yo lo valoro con la rúbrica.","palabras":[45,82],"etiqueta":"Fase 3 · tarea de la SdA"},{"id":"pz_compl","descripcion":"GUION. Actividad complementaria o salida de la UD (Tabla 7) en 2-5 palabras («Bioparc Fuengirola», «Día de Andalucía»).","ejemplo":"Jornada gastronómica andaluza","palabras":[2,5],"etiqueta":"Guion: actividad complementaria"},{"id":"transferencia","descripcion":"TRANSFERENCIA: TRES usos de lo APRENDIDO en esta UD (contenidos concretos: números, ortografía, medidas, vocabulario, normas…) en tres contextos distintos del aula y en este orden: la FAMILIA; el CENTRO (patio, comedor, la actividad complementaria de la Tabla 7; si la ficha la marca «SdA», dila como situación de aprendizaje); y la LOCALIDAD de Mijas o Andalucía (calle, parque, playa, comercios, servicios del barrio, patrimonio). Cada uso con su contexto y lo que se aplica. No pongas actitudes como uso ni inventes salidas que no estén en la ficha. El digital y el bilingüe van aparte. Empieza en minúscula (va tras dos puntos), separa con punto y coma y termina en punto.","ejemplo":"en la entrevista, el alumnado escribe con cuatro cifras el año de nacimiento del familiar; en la jornada gastronómica andaluza, escribimos con tilde los platos; y en Mijas, en el parque o la playa, reconocemos normas como las nuestras.","palabras":[32,41],"etiqueta":"Transferencia: familia, centro y Mijas"},{"id":"contexto_digital","descripcion":"Uso de lo aprendido en el contexto DIGITAL con un recurso de la ficha (Google Classroom, Canva, Google Maps, vídeos, búsquedas guiadas): qué se hace y para qué. Va tras «En el contexto digital,»: empieza en minúscula, SIN punto final (sigue «; y, como somos un centro bilingüe…»).","ejemplo":"escribimos el borrador en Google Classroom, y cada equipo lo revisa desde casa","palabras":[8,14],"etiqueta":"Contexto digital"},{"id":"contexto_bilingue","descripcion":"Qué se trabaja en inglés con la maestra de inglés en esta UD, CONCRETO (vocabulario del centro de interés o del producto, con dos o tres palabras en inglés entre «»). Va tras «con la maestra de inglés»: empieza por un verbo en primera persona del plural, SIN punto final. Nada ambiguo como «su vocabulario».","ejemplo":"aprendemos a nombrar los roles y las normas, como «listen», «help» o «take turns»","palabras":[6,15],"etiqueta":"Contexto bilingüe (inglés)"},{"id":"situacion_nueva","descripcion":"SITUACIÓN NUEVA, fuera de las tareas de la SdA, en la que el alumnado aplica POR SÍ MISMO lo aprendido, sin pautas de la maestra: qué ocurre, qué hace el alumnado y qué aprendizaje de la UD usa. Coherente con la ficha y la programación (un problema real del centro, de la familia o del barrio, la UD siguiente, la actividad complementaria…); no repitas lo de transferencia. Va tras «por propia iniciativa en una situación nueva:»: empieza en minúscula y termina en punto.","ejemplo":"cuando surge un conflicto en el patio o en el comedor, los implicados consultan el cartel, proponen una solución con la mediación aprendida y la cuentan en la asamblea.","palabras":[20,30],"etiqueta":"Situación nueva"},{"id":"publico_real","descripcion":"PÚBLICO REAL del producto de la SdA más allá de la propia clase (otra clase de tercero o de otro curso, las familias, el blog o la web del centro, el comedor, el pasillo, la comunidad): quién lo recibe y cómo. Va tras «fuera de nuestra clase:»: empieza en minúscula, con el producto como «lo/la» si hace falta, y termina en punto.","ejemplo":"el portavoz de cada equipo lo expone ante otra clase de tercero, y lo publicamos en el blog del centro para las familias.","palabras":[14,24],"etiqueta":"Público real del producto"},{"id":"uso_real","descripcion":"Uso real y efectivo del producto de la SdA DESPUÉS de la unidad (dónde queda, quién lo usa, para qué). Oración que empieza en minúscula (va tras «Y un uso real:») y termina en punto. Coherente con la ficha; sin repetir publico_real.","ejemplo":"el cartel queda colgado en el aula, y lo consultamos todo el curso cuando un equipo necesita ponerse de acuerdo.","palabras":[10,21],"etiqueta":"Uso real del producto"},{"id":"reparto_dias","descripcion":"Reparto REAL de los días lectivos entre las tres fases (va tras «{{dias}} días lectivos en tres fases»): «de cuatro, cinco y cinco días;» + el porqué de la fase distinta (semana de inicio, festivos como la Inmaculada, el 28 de febrero o el 1 de mayo, Semana Blanca, Semana Santa, salidas) + cuántas sesiones ocupa la situación de aprendizaje (y, si termina en la fase dos, dilo). La suma debe dar {{dias}}. Sin decir el día de la semana de una fecha. Empieza en minúscula y termina en punto.","ejemplo":"de cuatro, cinco y cinco días, porque la primera coincide con el inicio del curso; y la situación de aprendizaje ocupa tres sesiones, una cada viernes.","palabras":[14,27],"etiqueta":"Reparto de los días"},{"id":"progresion","descripcion":"Por qué la secuencia es coherente: de qué a qué se progresa en Lengua y en Matemáticas y cómo avanza el producto (va tras «La progresión es coherente:»). Empieza en minúscula y termina en punto.","ejemplo":"en Matemáticas pasamos de tres a cuatro cifras y a redondear; en Lengua, de la sílaba a la tilde; y el cartel, de los roles al borrador y a la versión final.","palabras":[20,34],"etiqueta":"Progresión de la secuencia"},{"id":"ajuste_realidad","descripcion":"Por qué la secuencia de ESTA UD se ajusta a la realidad del grupo y del ENTORNO REAL: momento del curso, festividades o salidas de la UD, vivencias del alumnado y, al menos, un rasgo concreto de Mijas Costa o de Málaga (localidad turística, costa, patrimonio, servicios del barrio). Empieza en minúscula con verbos en tercera persona cuyo sujeto es «la secuencia» («abre…», «aprovecha…», «se apoya en…»; no «parte de», que ya está en el texto común) y termina en punto.","ejemplo":"abre el curso formando los equipos del año y aprovecha la jornada gastronómica andaluza; y, en una localidad turística como Mijas Costa, la entrevista admite recetas de otros países.","palabras":[15,30],"etiqueta":"Ajuste a la realidad"},{"id":"m_lectura","descripcion":"Un texto concreto que se lee en la UD y cómo se lee, como sintagma nominal en minúscula con artículo, sin punto y SIN empezar por «la lectura» (va tras «La lectura la trabajo, según las Instrucciones de 21 de junio de 2023, con»; sigue «;»).","ejemplo":"el cuento «Los duendes y el zapatero», con estrategias de antes, durante y después de leer","palabras":[8,17],"etiqueta":"Metodología: lectura"},{"id":"m_tic","descripcion":"Recursos digitales de ESTA UD, cada uno con la actividad en que se usa: Canva, Google Classroom y Google Maps (están en todas las fichas) y los vídeos o búsquedas de la ficha. Sintagma en minúscula sin punto (va tras «las TIC, con»; sigue «;»). No nombres herramientas que la UD no use.","ejemplo":"Canva para la tarjeta de roles, Classroom para el borrador y vídeos sobre el método científico y Velázquez","palabras":[8,19],"etiqueta":"Metodología: TIC"},{"id":"m_emocional","descripcion":"Principio de INTELIGENCIA EMOCIONAL aplicado a una actividad concreta de la UD (gestión de emociones, frustración, empatía, autoestima), con su criterio si lo hay. Sintagma en minúscula con artículo, sin punto (va tras «se educa, con»; sin punto, sigue «;»).","ejemplo":"la gestión de la frustración al redondear, con el criterio 7.1.a de Matemáticas","palabras":[6,14],"etiqueta":"Metodología: inteligencia emocional"},{"id":"m_conflictos","descripcion":"Principio de RESOLUCIÓN PACÍFICA DE CONFLICTOS aplicado a esta UD (normas del equipo, mediación, asamblea, debate, acuerdos en la SdA). Sintagma en minúscula con artículo, sin punto (va tras «la resolución pacífica de conflictos, con»).","ejemplo":"el cartel y la mediación, con los que los equipos resuelven sus desacuerdos","palabras":[6,14],"etiqueta":"Metodología: resolución de conflictos"},{"id":"m_sostenible","descripcion":"Principio de DESARROLLO SOSTENIBLE en esta UD: el ODS de la ficha y una actividad o actitud concreta que lo hace real (reciclar, ahorrar agua, cuidar el entorno, convivir en paz). Sintagma en minúscula, sin punto (va tras «el desarrollo sostenible, con»).","ejemplo":"el ODS 16, que las normas acordadas llevan a la vida del aula","palabras":[6,14],"etiqueta":"Metodología: desarrollo sostenible"},{"id":"m_andalucia","descripcion":"Dos o tres elementos de la UD que conectan con las realidades sociales y culturales de Andalucía, como enumeración en minúscula con artículos, sin punto (va tras «a través de»): textos, autores, fiestas, paisajes, gastronomía y, cuando la UD lo permita, el HABLA ANDALUZA (si hay criterio de diversidad lingüística) y el ENTORNO DE MIJAS o de Málaga. No te quedes solo en el folclore.","ejemplo":"nuestra habla andaluza en «La Tarara», el sevillano Velázquez y la jornada gastronómica con recetas de Mijas","palabras":[10,18],"etiqueta":"Metodología: Andalucía"},{"id":"producto_aps","descripcion":"Producto del aprendizaje-servicio «Opera prima» en esta UD (ficha: sda.aps.producto) como sintagma nominal en minúscula, sin punto, con el artículo que pida el sentido; nominaliza los infinitivos. Va tras «con» («con el festival de cine de fin de curso»).","ejemplo":"un informe sobre la técnica de animación stop motion","palabras":[3,10],"etiqueta":"Aportación a «Opera prima»"},{"id":"m_agrupamientos","descripcion":"Los cuatro agrupamientos, cada uno ligado a una actividad CONCRETA de la UD, en este orden: «el gran grupo para …; los equipos heterogéneos para …; las parejas para …; y el trabajo individual para ….». Empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el gran grupo para la pregunta inicial; los equipos heterogéneos para las adivinanzas y el cartel; las parejas para el dictado; y el trabajo individual para los números.","palabras":[20,29],"etiqueta":"Agrupamientos"},{"id":"recursos_ud","descripcion":"Espacios y recursos de la UD (ficha: recursos), CADA UNO LIGADO A SU ACTIVIDAD: «la biblioteca, para …; el patio, …; los policubos y el tangram, en …; las familias, en …». Primero los espacios (aula, biblioteca, patio y, si la hay, la salida de la Tabla 7), después el material manipulativo y los recursos personales. Sin herramientas digitales (van en m_tic). Empieza en minúscula (va tras «Y cada espacio y recurso, también:») y SIN punto final.","ejemplo":"la biblioteca, para los cuentos tradicionales; el patio, para aplicar las normas; los bloques de base 10 y el tangram, en los problemas; y las familias, en la entrevista","palabras":[15,30],"etiqueta":"Espacios y recursos"},{"id":"m_previos","descripcion":"Actividad inicial de la fase 1 que activa los conocimientos previos (asamblea, pregunta, vídeo, diálogo) como sintagma nominal en minúscula con artículo, sin punto. Va tras «la unidad parte de». Si es la pregunta_motriz, no la repitas: «la asamblea sobre la pregunta del inicio…».","ejemplo":"la asamblea sobre la pregunta del inicio, donde el alumnado cuenta sus experiencias","palabras":[8,14],"etiqueta":"Conocimientos previos"},{"id":"dua_ejemplos","descripcion":"Los tres principios DUA aplicados a actividades CONCRETAS de la UD, en tres oraciones con este arranque fijo: «Con múltiples formas de representación, …. Con múltiples formas de acción y expresión, …. Y con múltiples formas de implicación, ….». Empieza en mayúscula y termina en punto.","ejemplo":"Con múltiples formas de representación, presento el método científico con vídeo y esquema, y las cifras con bloques de base 10. Con múltiples formas de acción y expresión, cuentan, escriben o dramatizan sus adivinanzas. Y con múltiples formas de implicación, trabajan en equipo y se dan retroalimentación.","palabras":[40,49],"etiqueta":"DUA: ejemplos"},{"id":"d_multinivel","descripcion":"Una actividad CONCRETA de la UD planteada como multinivel: «[actividad]: el refuerzo …, y la profundización …». Empieza en minúscula con artículo (va tras «y actividades multinivel, como») y termina en punto.","ejemplo":"el concurso de problemas: el refuerzo resuelve problemas de tres cifras con bloques de base 10, y la profundización inventa problemas de dos pasos.","palabras":[15,25],"etiqueta":"Actividad multinivel"},{"id":"d_profundizacion","descripcion":"Actividad CONCRETA del PROGRAMA DE PROFUNDIZACIÓN (art. 28 de la Orden) para el alumnado más motivado: enriquece un saber de la UD con una pequeña investigación o tarea creativa ligada a una actividad de la ficha y, si puede, al producto. El sujeto es «el más motivado» (ya dicho): empieza en minúscula por un verbo en tercera persona del singular y termina en punto. Distinta de la profundización de d_multinivel.","ejemplo":"investiga cómo trabajan en equipo los científicos presentados y propone al cartel una norma inspirada en ellos.","palabras":[14,18],"etiqueta":"Programa de profundización"},{"id":"d_vinculo","descripcion":"Vinculación de las medidas con actividades CONCRETAS de esta UD (no las tareas de la SdA, que van en d_sda), en este orden: «los dos alumnos con dificultades …; el alumno con TDAH …; y la alumna de compensatoria …». Coherente con la programación: dificultades → material manipulativo, lectura fácil, tareas graduadas; TDAH → cerca de la maestra, tareas fragmentadas, agenda visual, autoinstrucciones, responsabilidades; compensatoria → glosario visual o imágenes del vocabulario, préstamo de material, compañera tutora y, si la actividad depende de la familia, una alternativa en el centro (no digas que desconoce el idioma). Empieza en minúscula (va tras «Las vinculo con las actividades:») y termina en punto.","ejemplo":"los dos alumnos con dificultades leen números con bloques de base 10 y preparan el dictado con lectura fácil; el alumno con TDAH sigue la adivinanza con una agenda visual; y la alumna de compensatoria prepara la entrevista con un glosario visual y, si lo necesita, entrevista a la cocinera del comedor.","palabras":[36,55],"etiqueta":"Medidas vinculadas a actividades"},{"id":"d_sda","descripcion":"Las medidas aplicadas a las TAREAS DE LA SITUACIÓN DE APRENDIZAJE: rol asignado al alumno con TDAH (encargado del material, cronometrador…), tarea fragmentada, apoyo visual o modelo del producto para los alumnos con dificultades o la alumna de compensatoria. Va tras «Y con las tareas de la situación de aprendizaje:»: empieza en minúscula y termina en punto.","ejemplo":"el alumno con TDAH es el encargado del material, un rol que le permite moverse, y sigue la tarea por pasos; y los alumnos con dificultades parten de una norma modelo.","palabras":[18,33],"etiqueta":"Medidas en las tareas de la SdA"},{"id":"n_criterios","descripcion":"Número total de criterios de evaluación de la UD (suma de areas[].criterios de la ficha, normalmente «trece» o «catorce»), en letra y en minúscula.","ejemplo":"trece","palabras":[1,1],"etiqueta":"Número de criterios"},{"id":"e_inicial","descripcion":"La actividad CONCRETA de evaluación inicial de la UD (la de m_previos u otra de la fase 1) y dónde se registra (anecdotario, escala de observación). Sintagma que empieza en minúscula con artículo (va tras «La evaluación inicial es») y termina en punto.","ejemplo":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","palabras":[8,14],"etiqueta":"Evaluación inicial"},{"id":"e_fases","descripcion":"EVIDENCIA que deja cada FASE de la SdA y su instrumento, con el criterio y el área la primera vez: «en la primera, …; en la segunda, …; y en la tercera, …». La evidencia es el resultado de la tarea de esa fase (la del producto, con rúbrica). Coherente con s1_tarea, s2_tarea y s3_tarea. Empieza en minúscula (va tras «cada fase deja su evidencia:») y termina en punto.","ejemplo":"en la primera, la tarjeta de roles, con escala de observación del 1.1.a de Medio; en la segunda, el borrador, en el anecdotario; y en la tercera, el cartel, con una rúbrica del 8.1.a.","palabras":[30,36],"etiqueta":"Evidencias de cada fase"},{"id":"e_criterios","descripcion":"TODOS los criterios de la UD que NO estén ya en e_fases, AGRUPADOS POR INSTRUMENTO, cada uno con su evidencia (la actividad de la secuencia en que se recoge, en 1-4 palabras), su código y su área: «con una rúbrica de …, X, N.N.a de Lengua; con escala de observación, …; con lista de cotejo, …; con el porfolio, …; y con el registro anecdótico, …». Instrumento ADECUADO: lectura en voz alta → rúbrica de fluidez lectora; producciones escritas → porfolio o rúbrica; procesos y explicaciones → escala de observación; pasos o comprobaciones → lista de cotejo; actitudes y emociones → registro anecdótico. Ningún criterio sin instrumento. Empieza en minúscula (va tras «tiene también la suya:») y termina en punto.","ejemplo":"con rúbrica de fluidez, la lectura en voz alta, 4.1.a de Lengua; con escala de observación, «La Tarara», 1.3.a, y la mochila y el cálculo, 4.1.a y 6.2.a de Matemáticas; con lista de cotejo, el diccionario, 6.1.a, los problemas, 1.1.a y 5.1.a de Matemáticas, y «Las meninas», 1.1.a de Artística; con el porfolio, el cuento, 5.1.a; y con el registro anecdótico, la lectura autónoma y la frustración, ambos 7.1.a.","palabras":[55,76],"etiqueta":"Instrumentos de los demás criterios"},{"id":"e_coevaluacion","descripcion":"Una o dos actividades concretas de autoevaluación o coevaluación de la UD (intercambio de cuadernos, valoración del trabajo en equipo, revisión del producto), en primera persona del plural o con «cada equipo» o «cada niño y cada niña» como sujeto. Empieza en minúscula (va tras «el alumnado reflexiona sobre cómo aprende:») y termina en punto.","ejemplo":"cada equipo valora con una lista de cotejo si ha cumplido sus normas, y corregimos el dictado intercambiando los cuadernos.","palabras":[12,21],"etiqueta":"Autoevaluación y coevaluación"},{"id":"e_diversidad","descripcion":"Ejemplo del anexo VI aplicado a una medida de ESTA UD: dificultad, medida y cómo se valora en la escala 1-5. Empieza en minúscula (va tras «Por ejemplo,») y termina en punto.","ejemplo":"si cuesta leer números de cuatro cifras, la medida son los bloques de base 10 con un compañero tutor; si ya los leen con ayuda, la valoro con un 4.","palabras":[18,32],"etiqueta":"Evaluación de una medida de diversidad"},{"id":"producto_proyecto","descripcion":"Lo que aporta esta UD al proyecto de diseño (ficha: sda.proyecto.producto) como sintagma nominal en minúscula, sin punto, con el artículo que pida el sentido; nominaliza los infinitivos («la decoración y la presentación del lapbook»). Va tras «con», en la conclusión. En la UD 12, añade «, que da nombre a esta unidad» para no confundir la SdA y el proyecto.","ejemplo":"una entrevista a un familiar para el recetario andaluz","palabras":[3,10],"etiqueta":"Aportación al proyecto de diseño"},{"id":"conclusion_ud","descripcion":"Síntesis propia de la UD: qué aprende el alumnado (dos o tres contenidos clave de distintas áreas) y qué significa el producto final, vinculado al título o al centro de interés. Empieza por «En definitiva,» y termina en punto.","ejemplo":"En definitiva, mi alumnado no solo lee números de cuatro cifras o crea adivinanzas: aprende a ser un equipo, y lo deja escrito en un cartel para todo el curso.","palabras":[25,32],"etiqueta":"Conclusión propia"},{"id":"siguiente_ud","descripcion":"Unidad siguiente y qué retoma de esta, como sintagma en minúscula sin punto (va tras «es el punto de partida de»): «la unidad N, «Título», en la que …». En la UD 12: «cuarto de Primaria, donde …».","ejemplo":"la unidad 2, «¿Cómo son las plantas?», donde estos equipos elaborarán una guía de las plantas","palabras":[6,17],"etiqueta":"Siguiente UD"}],"secciones":[{"id":"u1","titulo":"Presentación, introducción y justificación","rubrica":["Presentación, introducción y justificación","Bibliografía","Uso adecuado de la pizarra","Expresión oral"],"minutos":2,"esquema":["Saludo · pregunta que abre la UD → «{{titulo}}» · {{trimestre_letra}} trimestre · {{centro_interes}}","Una SdA con el mismo título → {{pz_producto}} · y avanzan los dos proyectos","Once puntos en la pizarra: de la presentación a la conclusión, núcleo en tres fases","Normativa: RD 157/2022 · D. 101/2023 · Orden 30/05/2023 → el saber del anexo II que la sostiene","Curricular: Coll (2013) + por qué en 3.º","Epistemológica: gira en torno a {{centro_interes}} · Ausubel (2009): parto de lo que saben","Relevancia social → {{pz_ods}}"],"bloques":[{"id":"u1b1","texto":"Buenos días a la presidencia y a los miembros del tribunal. «{{pregunta_motriz}}» Con esta pregunta empieza mi alumnado la unidad didáctica que he elegido, la número {{numero}} de mi programación «Aprendemos juntos», «{{titulo}}». Se desarrolla en el {{trimestre_letra}} trimestre de tercero y se centra en {{centro_interes}}. Su situación de aprendizaje, con el mismo título, tiene como producto {{producto_sda}}, y la unidad hace avanzar los dos proyectos del curso. Seguiré once puntos, que escribo en la pizarra, de la presentación a la conclusión, con la secuencia en tres fases como núcleo.","pizarra":[{"zona":"cabecera","texto":"UD {{numero}} «{{titulo}}» · 3.º EP"},{"zona":"cabecera","texto":"SdA → {{pz_producto}}"},{"zona":"indice","texto":"1. Presentación"},{"zona":"indice","texto":"2. Contexto"},{"zona":"indice","texto":"3. Concreción"},{"zona":"indice","texto":"4. Fase 1"},{"zona":"indice","texto":"5. Fase 2"},{"zona":"indice","texto":"6. Fase 3"},{"zona":"indice","texto":"7. Contextos y tiempo"},{"zona":"indice","texto":"8. Metodología"},{"zona":"indice","texto":"9. Diversidad"},{"zona":"indice","texto":"10. Evaluación"},{"zona":"indice","texto":"11. Conclusión"}]},{"id":"u1b2","texto":"Justifico su importancia y su relevancia en tres planos. Normativamente, concreta el currículo del Real Decreto 157/2022, del Decreto 101/2023 y de la Orden de 30 de mayo de 2023; en concreto, desarrolla {{justif_normativa}}. Curricularmente, según Coll (2013), es el tercer nivel de concreción, y es relevante en tercero porque {{justif_curricular}}. Epistemológicamente, se articula sobre {{centro_interes}}: {{justif_epistemologica}}; y, como defiende Ausubel (2009), parto de lo que el alumnado ya sabe. Su relevancia social es clara: {{relevancia}}. Por eso la vinculo con {{ods}}.","pizarra":[{"zona":"centro","texto":"Normativa · curricular · epistemológica → {{pz_ods}}","caja":"1. Justificación"},{"zona":"normativa","texto":"RD 157/2022 · D. 101/2023 · Orden 30/05/2023"},{"zona":"normativa","texto":"Coll 2013 · Ausubel 2009"}]}]},{"id":"u2","titulo":"Contextualización","rubrica":["Contextualización","Bibliografía"],"minutos":1.5,"esquema":["CEIP bilingüe de Mijas Costa (Málaga), localidad turística, tres líneas","22 alumnos y alumnas de 8-9 años: Piaget e Inhelder (2022), hechos concretos","NEAE: 2 con dificultades en Lengua y Matemáticas · TDAH · compensatoria","Lo significativo para esta UD: momento del curso + planes (Paz, igualdad, CIMA…)","{{fechas}} · {{trimestre_letra}} trimestre · {{dias}} días (D. 301/2009)","Lugar en el curso respecto a la UD anterior","Cuatro áreas con su nombre completo"],"bloques":[{"id":"u2b1","texto":"Paso al punto dos: la contextualización. Desarrollo la unidad en un colegio público bilingüe de Infantil y Primaria de Mijas Costa, en Málaga, una localidad turística, con tres líneas por nivel. Mi grupo de tercero tiene veintidós alumnos y alumnas de ocho y nueve años que, como explican Piaget e Inhelder (2022), razonan sobre hechos concretos. Entre ellos hay dos alumnos con dificultades en Lengua y Matemáticas, un alumno con TDAH y una alumna de compensatoria. Para esta unidad, lo más significativo del contexto es esto: {{contexto_significativo}}","pizarra":[{"zona":"centro","texto":"Mijas Costa bilingüe · 22 · 4 NEAE","caja":"2. Contexto"},{"zona":"normativa","texto":"Piaget e Inhelder 2022 · D. 301/2009"}]},{"id":"u2b2","texto":"Ubico la unidad en el tiempo: se desarrolla {{fechas}}, en el {{trimestre_letra}} trimestre, con {{dias}} días lectivos según el calendario del Decreto 301/2009. En la secuencia del curso, {{enlace_ud}} Y va dirigida a las cuatro áreas de mi programación: Lengua Castellana y Literatura, Matemáticas, Conocimiento del Medio Natural, Social y Cultural y Educación Artística.","pizarra":[]}]},{"id":"u3","titulo":"Concreción curricular","rubrica":["Concreción curricular y vinculación con los aprendizajes","Bibliografía"],"minutos":2.8,"esquema":["Escamilla (2018): encadenar los elementos del currículo","Siete objetivos de etapa (D. 101/2023), letras en la pizarra → seis objetivos de aprendizaje","8 competencias clave (RD 157/2022) · sobre todo, las de esta UD","Anexo II de la Orden: de qué trata + 2 descriptores (sigla = competencia clave) + criterio + saber","{{pz_lcl}}","{{pz_mat}}","{{pz_cmn_ear}}"],"bloques":[{"id":"u3b1","texto":"Paso al punto tres: la concreción curricular y la vinculación con los aprendizajes. Siguiendo a Escamilla (2018), encadeno los elementos del currículo. La unidad contribuye a siete objetivos de etapa del Decreto 101/2023, cuyas letras escribo en la pizarra, y los concreto en seis objetivos de aprendizaje: {{objetivos_aprendizaje}}","pizarra":[{"zona":"centro","texto":"Objetivos de etapa: {{pz_obj_etapa}}","caja":"3. Concreción"},{"zona":"normativa","texto":"Escamilla 2018"}]},{"id":"u3b2","texto":"Estos objetivos desarrollan las ocho competencias clave del Real Decreto 157/2022 y, sobre todo, {{cc_principales}}. Concreto cada competencia específica según el anexo II de la Orden, siempre en el mismo orden: de qué trata, sus descriptores operativos, cuya sigla es la de su competencia clave, su criterio y su saber básico. Empiezo por Lengua: {{curriculo_lcl}}","pizarra":[{"zona":"centro","texto":"{{pz_lcl}}","caja":"3. Concreción"}]},{"id":"u3b3","texto":"Sigo con Matemáticas: {{curriculo_mat}} Y termino con las otras dos áreas. {{curriculo_cmn_ear}} Así, cada criterio tiene su actividad en la secuencia y su instrumento en la evaluación.","pizarra":[{"zona":"centro","texto":"{{pz_mat}}","caja":"3. Concreción"},{"zona":"centro","texto":"{{pz_cmn_ear}}","caja":"3. Concreción"}]}]},{"id":"u4","titulo":"Secuencia y SdA: fase 1, motivar y activar","rubrica":["Secuencia didáctica 1: actividades y relación entre ellas","Bibliografía","Uso adecuado de la pizarra"],"minutos":2.95,"esquema":["SdA: actividades articuladas en un contexto (art. 7 D. 101/2023)","Reto real → {{pz_producto}}","Tres fases de Baena (2019) · enfoque globalizador (Zabala 2012)","Ejercicio de aplicación (consolida) → actividad (relaciona) → tarea (integra)","Fase 1: cada área PREPARA el producto (Lengua, Matemáticas, Medio, Artística)","«Todo esto prepara la tarea…»: {{pz_s1}} (agrupamiento, sesión, pasos, evidencia)"],"bloques":[{"id":"u4b1","texto":"Paso al punto cuatro, el núcleo de mi exposición: la secuencia didáctica y su situación de aprendizaje. Según el artículo 7 del Decreto 101/2023, una situación de aprendizaje es un conjunto de actividades articuladas en un contexto determinado. La de esta unidad plantea un reto real, {{sda_reto}}, y su producto es {{producto_sda}}. Se organiza en las tres fases del aprendizaje experiencial de Baena (2019), con el enfoque globalizador que defiende Zabala (2012). En cada fase distingo ejercicios de aplicación, que consolidan; actividades, que relacionan; y una tarea, que integra. Así avanzamos de lo sencillo a lo complejo.","pizarra":[{"zona":"centro","texto":"Ejercicio → actividad → tarea","caja":"4. Fase 1 · Motivar"},{"zona":"normativa","texto":"Art. 7 D. 101/2023 · Baena 2019 · Zabala 2012"}]},{"id":"u4b2","texto":"Primera fase: motivar y activar los conocimientos previos sobre el centro de interés. Cada área prepara el producto. En Lengua, como ejercicio de aplicación, {{s1_lcl_ej}}; y como actividad, {{s1_lcl_act}}: {{s1_rel_lcl}}.","pizarra":[]},{"id":"u4b3","texto":"Son ejercicios que parten de lo concreto y lo manipulativo. En Matemáticas, como ejercicio, {{s1_mat_ej}}; y como actividad, {{s1_mat_act}}: {{s1_rel_mat}}. En Conocimiento del Medio, {{s1_cmn}}: {{s1_rel_cmn}}.","pizarra":[{"zona":"centro","texto":"{{pz_f1}}","caja":"4. Fase 1 · Motivar"}]},{"id":"u4b4","texto":"Y en Educación Artística, {{s1_ear}}: {{s1_rel_ear}}. Todo esto prepara la tarea de la fase, en la que se integran los ejercicios y las actividades de las cuatro áreas: {{s1_tarea}}","pizarra":[{"zona":"centro","texto":"Tarea: {{pz_s1}}","caja":"4. Fase 1 · Motivar"}]}]},{"id":"u5","titulo":"Secuencia y SdA: fase 2, explorar y estructurar","rubrica":["Secuencia didáctica 1: actividades y relación entre ellas"],"minutos":2.05,"esquema":["Explorar y estructurar: investigar, comparar, organizar","«Gracias a lo anterior…» cada área APORTA contenido al producto","Lengua y Matemáticas: para consolidar + para relacionar (con criterio) + relación","Pasos heurísticos comunes en los problemas","Medio + Artística: actividad + relación","«Gracias a todo ello…» tarea: {{pz_s2}}"],"bloques":[{"id":"u5b1","texto":"Paso al punto cinco: la segunda fase, explorar y estructurar. Gracias a lo anterior, el alumnado ya investiga, compara y organiza, y cada área aporta contenido al producto. En Lengua, para consolidar, {{s2_lcl_ej}}; y, para relacionar, {{s2_lcl_act}}: {{s2_rel_lcl}}.","pizarra":[]},{"id":"u5b2","texto":"En Matemáticas, para consolidar, {{s2_mat_ej}}; y, para relacionar, {{s2_mat_act}}: {{s2_rel_mat}}. Y todos los problemas siguen los mismos pasos: comprender, planificar, resolver y comprobar. En Conocimiento del Medio, {{s2_cmn}}: {{s2_rel_cmn}}.","pizarra":[{"zona":"centro","texto":"{{pz_f2}}","caja":"5. Fase 2 · Explorar"}]},{"id":"u5b3","texto":"Y en Educación Artística, {{s2_ear}}: {{s2_rel_ear}}. Gracias a todo ello, llegamos a la tarea de esta fase, que integra lo que han aportado las cuatro áreas: {{s2_tarea}}","pizarra":[{"zona":"centro","texto":"Tarea: {{pz_s2}}","caja":"5. Fase 2 · Explorar"}]}]},{"id":"u6","titulo":"Secuencia y SdA: fase 3, aplicar y concluir","rubrica":["Secuencia didáctica 1: actividades y relación entre ellas"],"minutos":2.85,"esquema":["Aplicar y concluir: situaciones nuevas, productos y reflexión","«Todo culmina…»: cada área CULMINA su aportación (primero ejercicio, después actividad)","Medio (jueves) + Artística («Opera prima»): actividad + relación","Tarea final del viernes: {{pz_s3}} · «{{nombre_proyecto}}»","Integrador, interdisciplinar y holístico: cada área, una pieza"],"bloques":[{"id":"u6b1","texto":"Paso al punto seis: la tercera fase, aplicar y concluir. Ahora todo culmina: el alumnado aplica lo aprendido a situaciones nuevas, termina sus productos y reflexiona. En Lengua, primero, como ejercicio, {{s3_lcl_ej}}; y después, como actividad, {{s3_lcl_act}}: {{s3_rel_lcl}}.","pizarra":[]},{"id":"u6b2","texto":"En Matemáticas, primero, como ejercicio, {{s3_mat_ej}}; y después, como actividad, {{s3_mat_act}}: {{s3_rel_mat}}. En esta fase, el alumnado ya explica cómo lo ha resuelto. En Conocimiento del Medio, {{s3_cmn}}: {{s3_rel_cmn}}.","pizarra":[{"zona":"centro","texto":"{{pz_f3}}","caja":"6. Fase 3 · Aplicar"}]},{"id":"u6b3","texto":"Y en Educación Artística, {{s3_ear}}: {{s3_rel_ear}}. Y todo desemboca en la tarea final de la unidad, que reúne el trabajo de las tres fases: {{s3_tarea}}","pizarra":[{"zona":"centro","texto":"Tarea final: {{pz_s3}}","caja":"6. Fase 3 · Aplicar"}]},{"id":"u6b4","texto":"Por eso la secuencia tiene un enfoque integrador, interdisciplinar y holístico: las cuatro áreas no se aprenden por separado, sino que cada una aporta una pieza a tareas reales: el producto de la situación de aprendizaje, el paso del proyecto «{{nombre_proyecto}}» y la aportación a «Opera prima».","pizarra":[{"zona":"centro","texto":"Integrador · interdisciplinar · holístico","caja":"6. Fase 3 · Aplicar"}]}]},{"id":"u7","titulo":"Contextos, temporalización y ajuste a la realidad","rubrica":["Secuencia didáctica 2: integración en diferentes situaciones y contextos","Secuencia didáctica 3: secuenciación y temporalización","Secuencia didáctica 4: ajuste a la realidad y al alumnado","Bibliografía"],"minutos":3.95,"esquema":["SD2: lo aprendido sale del cuaderno: familia · centro · Mijas","Digital (recurso de la UD) · bilingüe (palabras en inglés con la maestra de inglés)","Situación nueva sin mi guía → «ha hecho suyo el aprendizaje» · público real · uso real","SD3: {{dias}} días · tres fases · reparto real · sesiones de la SdA · progresión","Horario: lectura diaria · razonamiento M-X-V · refuerzo 30 + 30 en la franja de autonomía","SD4: evaluación inicial · {{pz_compl}} · seis equipos (4 × 4 + 2 × 3) · tutores · TDAH cerca · familias","Pizarra: si falta sitio, borro las cajas 1-3"],"bloques":[{"id":"u7b1","texto":"Paso al punto siete: cómo integro los aprendizajes y los utilizo de manera efectiva en diferentes situaciones y contextos. Lo que se aprende en la unidad sale del cuaderno: {{transferencia}}","pizarra":[{"zona":"centro","texto":"Familia · centro · Mijas · digital · inglés","caja":"7. Contextos y tiempo"}]},{"id":"u7b2","texto":"En el contexto digital, {{contexto_digital}}; y, como somos un centro bilingüe, con la maestra de inglés {{contexto_bilingue}}. Pero integrar es, sobre todo, aplicar lo aprendido por propia iniciativa en una situación nueva: {{situacion_nueva}} Resolverla sin mi guía demuestra que el aprendizaje ya es suyo.","pizarra":[{"zona":"centro","texto":"Situación nueva · público real · uso real","caja":"7. Contextos y tiempo"}]},{"id":"u7b3","texto":"Además, el producto tiene un público real, fuera de nuestra clase: {{publico_real}} Y un uso real: {{uso_real}} Así, lo aprendido funciona en la familia, en el centro, en Mijas, en el mundo digital y en inglés: eso es integrarlo y utilizarlo de manera efectiva.","pizarra":[]},{"id":"u7b4","texto":"En cuanto a la secuenciación y la temporalización, la unidad es completa y coherente a lo largo de su periodo: {{dias}} días lectivos en tres fases {{reparto_dias}} La progresión es coherente: {{progresion}}","pizarra":[{"zona":"centro","texto":"{{dias}} días · 3 fases · horario","caja":"7. Contextos y tiempo"}]},{"id":"u7b5","texto":"Lengua y Matemáticas son diarias; Conocimiento del Medio, jueves y viernes; y Plástica, el viernes. Cada día empieza con media hora de lectura, según las Instrucciones de 21 de junio de 2023; martes, miércoles y viernes hay treinta minutos de razonamiento matemático, según las de 18 de junio de 2024; y el refuerzo suma treinta minutos de Lengua y treinta de Matemáticas en la franja de autonomía del centro.","pizarra":[{"zona":"normativa","texto":"Instr. 21/06/2023 · Instr. 18/06/2024"}]},{"id":"u7b6","texto":"Por último, la secuencia se ajusta a la realidad y se adecúa al contexto y al alumnado al que va dirigida. Parte de la evaluación inicial y, además, {{ajuste_realidad}} Y se ajusta al grupo: formo seis equipos heterogéneos, cuatro de cuatro y dos de tres, con un compañero tutor para cada niño o niña con NEAE; el alumno con TDAH se sienta cerca de mí; y, si una familia no puede colaborar, otro miembro de la comunidad educativa ocupa su lugar.","pizarra":[{"zona":"centro","texto":"Ajuste: Mijas · 6 equipos · NEAE","caja":"7. Contextos y tiempo"}]}]},{"id":"u8","titulo":"Metodología","rubrica":["Metodología","Bibliografía"],"minutos":3.4,"esquema":["Art. 6 D. 101/2023 → actividad: lectura · problemas (Instr. 18/06/2024) · TIC · competencias clave","Inteligencia emocional (Bisquerra, Pérez y García 2015) · conflictos · sostenible · DUA · Andalucía (habla, Mijas)","Cooperativo (Pujolás y Lago 2023) con roles y perspectiva de género · tutoría entre iguales","Proyectos (Cooper y Murphy 2024) · aprendizaje-servicio: «Opera prima» → festival de cine","Mi papel: guía, modelo, mediadora de lectura (Instr. 21/06/2023) · AICLE","Agrupamientos, espacios y recursos, cada uno con su actividad","Implicación y conocimientos previos (Bueno 2019)"],"bloques":[{"id":"u8b1","texto":"Paso al punto ocho: la metodología. Vinculo cada principio pedagógico del artículo 6 del Decreto 101/2023 que recoge mi programación con una actividad de esta unidad. La lectura la trabajo, según las Instrucciones de 21 de junio de 2023, con {{m_lectura}}; la resolución de problemas, con los problemas exprés y el concurso, según las de 18 de junio de 2024; las TIC, con {{m_tic}}; y las competencias clave, con la situación de aprendizaje.","pizarra":[{"zona":"centro","texto":"Art. 6 → actividades · maestra guía","caja":"8. Metodología"}]},{"id":"u8b2","texto":"Vinculo también la inteligencia emocional, que, según Bisquerra, Pérez y García (2015), se educa, con {{m_emocional}}; la resolución pacífica de conflictos, con {{m_conflictos}}; el desarrollo sostenible, con {{m_sostenible}}; el DUA, en cada actividad; y las peculiaridades de Andalucía, conectando con sus realidades sociales y culturales a través de {{m_andalucia}}.","pizarra":[{"zona":"normativa","texto":"Bisquerra et al. 2015"}]},{"id":"u8b3","texto":"Aplico cuatro estrategias: el aprendizaje cooperativo, con estructuras de Pujolás y Lago (2023) como el folio giratorio y roles que rotan entre niñas y niños, con perspectiva de género; la tutoría entre iguales; el aprendizaje basado en proyectos, que, según Cooper y Murphy (2024), da sentido a lo aprendido; y el aprendizaje-servicio, con «Opera prima», cuyo corto se estrena en el festival de cine de fin de curso para toda la comunidad educativa: en esta unidad aportamos {{producto_aps}}.","pizarra":[{"zona":"centro","texto":"Cooperativo · proyectos · aprendizaje-servicio","caja":"8. Metodología"},{"zona":"normativa","texto":"Pujolás y Lago 2023 · Cooper y Murphy 2024"}]},{"id":"u8b4","texto":"Mi papel es el de guía y mediadora: planteo preguntas, modelo los procesos, acompaño la lectura y ayudo a resolver los desacuerdos; y me coordino con la maestra de inglés en el enfoque AICLE. Cada agrupamiento tiene su actividad: {{m_agrupamientos}} Y cada espacio y recurso, también: {{recursos_ud}}.","pizarra":[]},{"id":"u8b5","texto":"Planteo actividades que propician la implicación, la participación y el interés y conectan con los conocimientos previos: como explica Bueno (2019), la emoción y la curiosidad activan el aprendizaje, y por eso la unidad parte de {{m_previos}}.","pizarra":[{"zona":"normativa","texto":"Bueno 2019"}]}]},{"id":"u9","titulo":"Atención a la diversidad","rubrica":["Medidas de atención a la diversidad","Bibliografía"],"minutos":3,"esquema":["DUA (art. 26 Orden 30/05/2023): representación · acción y expresión · implicación → actividades","Medidas generales (art. 27): cooperativo, tutoría entre iguales, multinivel → la de esta UD","Programas (art. 28): refuerzo (2 con dificultades, TDAH, compensatoria) · profundización → actividad","Medidas específicas (art. 33, Instr. 08/03/2017): TDAH → PT en el aula + programa específico","Vinculadas a actividades (dificultades → TDAH → compensatoria) y a las tareas de la SdA","Cauces (D. 328/2010): equipo docente · PT y AL · maestras de tercero · orientación · familias · Palacios, Marchesi y Coll (2021)"],"bloques":[{"id":"u9b1","texto":"Paso al punto nueve: las medidas de atención a la diversidad. Según el artículo 26 de la Orden de 30 de mayo de 2023, se rigen por el Diseño Universal para el Aprendizaje, cuyos principios aplico así. {{dua_ejemplos}} Como medidas generales del artículo 27, aplico el aprendizaje cooperativo, la tutoría entre iguales y actividades multinivel, como {{d_multinivel}}","pizarra":[{"zona":"centro","texto":"DUA · multinivel · refuerzo · profundización","caja":"9. Diversidad"}]},{"id":"u9b2","texto":"Como programas del artículo 28, el alumnado con NEAE sigue un programa de refuerzo del aprendizaje, y el más motivado, uno de profundización, que enriquece los saberes sin cambiar los criterios: {{d_profundizacion}}","pizarra":[]},{"id":"u9b3","texto":"Y como medida específica del artículo 33, según las Instrucciones de 8 de marzo de 2017, el alumno con TDAH recibe en el aula el apoyo de la maestra de Pedagogía Terapéutica y un programa específico de atención. Las vinculo con las actividades: {{d_vinculo}}","pizarra":[]},{"id":"u9b4","texto":"Y con las tareas de la situación de aprendizaje: {{d_sda}} Y las coordino por cauces concretos, según el Decreto 328/2010: el equipo docente sigue los programas; cada semana preparo materiales con la maestra de Pedagogía Terapéutica, y con la de Audición y Lenguaje, que refuerza la expresión oral de las exposiciones; acuerdo las medidas con las otras maestras de tercero; el equipo de orientación nos asesora; y con las familias hablo en tutoría y por iPasen. Como señalan Palacios, Marchesi y Coll (2021), partimos de las posibilidades de cada niño y niña.","pizarra":[{"zona":"centro","texto":"Coordinación: PT · AL · tercero · orientación · familias","caja":"9. Diversidad"},{"zona":"normativa","texto":"Instr. 08/03/2017 · D. 328/2010 · Palacios et al. 2021"}]}]},{"id":"u10","titulo":"Evaluación","rubrica":["Evaluación","Bibliografía"],"minutos":3.05,"esquema":["Art. 9 Orden 30/05/2023 · referente: los criterios → cada uno con instrumento y evidencia","Evaluación inicial: la actividad de partida, en el anecdotario","Art. 10: evidencia de cada fase de la SdA + el resto de criterios por instrumento","Cinco niveles · autoevaluación y coevaluación con su ejemplo","Medidas de diversidad: anexo VI, escala 1-5 + ejemplo","La UD (diana) y la práctica docente: indicadores, instrumentos, evidencias (Herrán y Paredes 2020)"],"bloques":[{"id":"u10b1","texto":"Paso al punto diez: la evaluación. Según el artículo 9 de la Orden de 30 de mayo de 2023, es continua, global, competencial, formativa e integradora, y su referente son los criterios: cada uno de los {{n_criterios}} de esta unidad tiene su instrumento y su evidencia. La evaluación inicial es {{e_inicial}}","pizarra":[{"zona":"centro","texto":"Cada criterio → instrumento + evidencia","caja":"10. Evaluación"}]},{"id":"u10b2","texto":"Uso instrumentos adecuados, coherentes y variados, como indica el artículo 10. En la situación de aprendizaje, cada fase deja su evidencia: {{e_fases}} Y el resto de criterios tiene también la suya: {{e_criterios}}","pizarra":[]},{"id":"u10b3","texto":"Califico cada criterio en cinco niveles, de «con dificultad», insuficiente, a «con dominio», sobresaliente. En la autoevaluación y la coevaluación, el alumnado reflexiona sobre cómo aprende: {{e_coevaluacion}} Y valoro las medidas de atención a la diversidad según el anexo seis de la Orden: concreto la dificultad, describo la medida y valoro su aplicación del 1 al 5. Por ejemplo, {{e_diversidad}}","pizarra":[{"zona":"centro","texto":"Fases · 5 niveles · autoevaluación · escala 1-5","caja":"10. Evaluación"}]},{"id":"u10b4","texto":"Por último, evalúo la unidad y mi práctica docente, porque, como recuerdan Herrán y Paredes (2020), evaluar la enseñanza es la base para mejorarla. De la unidad valoro si los {{dias}} días han bastado y cuántos niños y niñas superan cada criterio, y el alumnado la valora con una diana. De mi práctica, los indicadores son si los recursos, la metodología y los agrupamientos han funcionado; los instrumentos, el anecdotario, listas de cotejo y una escala del 1 al 4; y las evidencias, los resultados y las producciones del alumnado.","pizarra":[{"zona":"normativa","texto":"Herrán y Paredes 2020"}]}]},{"id":"u11","titulo":"Conclusión","rubrica":["Conclusión","Expresión oral"],"minutos":1.65,"esquema":["Síntesis: cuatro áreas integradas · SdA → {{pz_producto}} con público real","Proyectos en marcha: «{{nombre_proyecto}}» + «Opera prima»","Tres fases · cooperativo · DUA · cada criterio evaluado · mi práctica","Competencias clave que más desarrolla","Lo propio de la UD (En definitiva…) → retomo {{pz_ods}}","Siguiente UD · Vygotsky · nadie aprende solo; aprendemos juntos"],"bloques":[{"id":"u11b1","texto":"Paso al punto once: la conclusión. Sintetizo lo más relevante de la unidad didáctica número {{numero}}, «{{titulo}}». Integra cuatro áreas en una situación de aprendizaje con un producto real y con público, {{producto_sda}}, y hace avanzar «{{nombre_proyecto}}», con {{producto_proyecto}}, y «Opera prima», con {{producto_aps}}. Se desarrolla en tres fases, con aprendizaje cooperativo y DUA para que nadie se quede atrás, y evalúa cada criterio y mi práctica. Desarrolla sobre todo {{cc_principales}}.","pizarra":[{"zona":"centro","texto":"Nadie aprende solo: aprendemos juntos","caja":"11. Conclusión"}]},{"id":"u11b2","texto":"{{conclusion_ud}} Así retomo la justificación inicial, vinculada con {{ods_corto}}. Y lo aprendido aquí es el punto de partida de {{siguiente_ud}}. Como enseña Vygotsky en «Pensamiento y lenguaje» (2020), lo que hoy un niño hace con ayuda, mañana lo hará solo. Por eso termino con el lema de mi programación: nadie aprende solo; aprendemos juntos. Muchas gracias por su atención.","pizarra":[{"zona":"normativa","texto":"Vygotsky 2020"}]}]}],"guion":"UD {{numero}} «{{titulo}}» · {{dias}} días\n1. Pregunta. Once puntos. SdA → {{pz_producto}}. Saber, Coll, eje, Ausubel. {{pz_ods}}\n2. Mijas bilingüe. NEAE. Planes\n3. Escamilla. Etapa. Qué trata, descriptores, criterio, saber\n4. Art. 7. Baena, Zabala. F1 → {{pz_s1}}\n5. F2 → {{pz_s2}}. Heurísticos\n6. F3 → {{pz_s3}}. Holístico\n7. Familia, centro, Mijas, digital, inglés. Situación nueva. Público. Horario. Equipos\n8. Art. 6. Bisquerra. Pujolás, Cooper. Servicio. Guía. Bueno\n9. DUA. Arts. 27, 28, 33. Profundización. PT, AL. Palacios\n10. Cada criterio. Fases. Niveles. Diversidad. Herrán\n11. Síntesis. Competencias. Siguiente UD. Vygotsky"},"uds":[{"numero":1,"titulo":"Somos un equipo","trimestre":1,"fechas":"Del 10 al 27 de septiembre","dias":14,"valores":{"titulo":"Somos un equipo","trimestre_letra":"primer","centro_interes":"el trabajo en equipo","pz_producto":"Cartel de normas de colaboración","pz_ods":"ODS 16","pregunta_motriz":"¿Cómo podemos trabajar de forma cooperativa?","numero":"1","producto_sda":"un cartel para definir las normas de colaboración","justif_normativa":"el saber «Normas para la vida en sociedad» de Conocimiento del Medio, del anexo II de la Orden","justif_curricular":"abre el segundo ciclo y forma los equipos cooperativos de todo el curso","justif_epistemologica":"las ciencias sociales muestran que toda comunidad necesita normas acordadas, y la lengua y las matemáticas sirven para escribirlas","relevancia":"el trabajo cooperativo desarrolla las habilidades sociales, la empatía y la resolución pacífica de conflictos","ods":"el ODS 16, paz, justicia e instituciones sólidas","fechas":"del 10 al 27 de septiembre","dias":"14","contexto_significativo":"empieza el curso y el grupo debe hacerse equipo; el Plan de cultura de Paz da sentido a las normas, el de igualdad a los roles rotatorios y el programa CIMA a lo que comemos.","enlace_ud":"es la primera unidad y coincide con la evaluación inicial de los primeros días de clase.","pz_lcl":"LCL 1·4·5·6·7 → 1.3.a·4.1.a·5.1.a·6.1.a·7.1.a","pz_mat":"MAT 1·4·5·6·7 → 1.1.a·4.1.a·5.1.a·6.2.a·7.1.a","pz_cmn_ear":"CMN 1·8 → 1.1.a·8.1.a · EAR 1 → 1.1.a","objetivos_aprendizaje":"en Lengua, adivinanzas, sílaba y diccionario; en Matemáticas, números de hasta cuatro cifras y ordinales; trabajo en equipo con mediación; y arte de distintas épocas.","pz_obj_etapa":"a·d·e·g·h·j·ñ","cc_principales":"la competencia personal, social y de aprender a aprender y la ciudadana","curriculo_lcl":"la 1, valorar la diversidad lingüística, con CCL1 y CC1, criterio 1.3.a y el habla andaluza; la 4, comprender textos, con CCL2 y CD1, criterio 4.1.a y la comprensión lectora; la 5, escribir textos, con CCL3 y CCL5, criterio 5.1.a y la producción escrita; la 6, buscar información, con CD1 y CE3, criterio 6.1.a y la búsqueda guiada; y la 7, leer con autonomía, con CCL4 y CCEC1, criterio 7.1.a y la literatura infantil.","curriculo_mat":"la 1, interpretar situaciones cotidianas, con STEM1 y STEM2, criterio 1.1.a y el orden de magnitud; la 4, el pensamiento computacional, con STEM2 y CD1, criterio 4.1.a y los algoritmos sencillos; la 5, conectar ideas, con STEM1 y CC4, criterio 5.1.a y las relaciones geométricas; la 6, comunicar procesos, con CCL1 y STEM4, criterio 6.2.a y la recta numérica; y la 7, gestionar emociones, con CPSAA1 y CE2, criterio 7.1.a y la tolerancia a la frustración.","curriculo_cmn_ear":"En Conocimiento del Medio, la 1, usar recursos digitales, con CD1 y CD2, criterio 1.1.a y los dispositivos digitales; y la 8, igualdad y diversidad, con CP3 y CC1, criterio 8.1.a y las normas de convivencia. Y en Educación Artística, la 1, descubrir propuestas artísticas, con CCEC1 y CCEC2, criterio 1.1.a y su recepción activa.","pz_s1":"equipos y roles en Canva","sda_reto":"descubrir cómo podemos trabajar de forma cooperativa","s1_lcl_ej":"leemos una noticia y distinguimos la lengua oral y la escrita","s1_lcl_act":"inventamos adivinanzas de profesiones para competir por equipos, con el criterio 5.1.a, y en «La Tarara» reconocemos rasgos de nuestra habla andaluza, con el 1.3.a","s1_rel_lcl":"crear juntos es nuestro primer ensayo de equipo, y respetar cada forma de hablar será una norma","s1_mat_ej":"leemos, escribimos y representamos números de tres cifras con bloques de base 10","s1_mat_act":"resolvemos problemas cotidianos contando más allá del 999, con el criterio 1.1.a, y el viernes inventamos los nuestros en un concurso por equipos","s1_rel_mat":"inventarlos en equipo exige ponerse de acuerdo, y lo que nos ayude serán las primeras normas","s1_cmn":"el jueves vemos un vídeo sobre el método científico y esquematizamos sus pasos","s1_rel_cmn":"con ese método, las normas serán una hipótesis que comprobaremos en la fase tres","pz_f1":"Adivinanzas · concurso · método científico · letras","s1_ear":"creamos letras tridimensionales con materiales de plástica","s1_rel_ear":"serán las letras del título de nuestro cartel","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión, formamos equipos heterogéneos; cada miembro asume un rol, coordinador, secretario, portavoz o encargado del material, y el equipo diseña su tarjeta de roles en Canva, con el criterio 1.1.a de Conocimiento del Medio. Yo guío y registro cada tarjeta en una escala.","pz_s2":"normas en borrador","s2_lcl_ej":"clasificamos las palabras según su número de sílabas","s2_lcl_act":"leemos un cuento tradicional, con el criterio 7.1.a, y escribimos otro siguiendo los pasos, con el 5.1.a","s2_rel_lcl":"planificar, escribir, revisar y corregir es el proceso con el que escribiremos las normas","s2_mat_ej":"contamos números de cuatro cifras en series de diez, de cien y de mil","s2_mat_act":"el viernes, en el concurso de problemas, calculamos mentalmente y explicamos el proceso, con el criterio 6.2.a","s2_rel_mat":"explicarlo exige escuchar por turnos, una norma que el secretario anota para el borrador","s2_cmn":"el jueves cada niño y cada niña presenta a un científico o a una científica","s2_rel_cmn":"la ciencia también se hace en equipo, y su forma de colaborar inspira nuestras normas","pz_f2":"Cuento · cálculo · científicos · Meninas","s2_ear":"conocemos a Velázquez con un vídeo e identificamos «Las meninas», con el criterio 1.1.a","s2_rel_ear":"su composición nos enseña a ordenar el espacio del cartel definitivo","s2_tarea":"el viernes, en una sesión por equipos y con el folio giratorio, cada miembro propone una norma; el secretario las pasa al borrador en Classroom, y el equipo las revisa y las consensúa, con el criterio 1.1.a de Conocimiento del Medio. Yo guío y registro el proceso en el anecdotario.","pz_s3":"hipótesis comprobada + cartel definitivo","nombre_proyecto":"¡Sí, chef!","s3_lcl_ej":"trabajamos la sílaba tónica y la tilde con un dictado","s3_lcl_act":"leemos en voz alta un capítulo del libro, con el criterio 4.1.a, y localizamos en el diccionario los alimentos que hemos desayunado, con el 6.1.a","s3_rel_lcl":"con la tilde y el diccionario revisamos la ortografía del cartel definitivo","s3_mat_ej":"redondeamos números en la recta y decimos qué sentimos, con el criterio 7.1.a","s3_mat_act":"en el concurso pensamos paso a paso cómo preparar la mochila, con el criterio 4.1.a, y conectamos ideas en los problemas exprés, con el 5.1.a","s3_rel_mat":"competimos por equipos y con roles, y el secretario anota en una tabla si se cumplen las normas","s3_cmn":"el jueves elegimos nuestra comida preferida y cada equipo redacta el cuestionario de la entrevista a un familiar","s3_rel_cmn":"acordar las preguntas pone a prueba las normas y prepara nuestra aportación a «¡Sí, chef!»","pz_f3":"Dictado · mochila · entrevista · stop motion","s3_ear":"dentro de «Opera prima», elaboramos un informe sobre la animación stop motion","s3_rel_ear":"cada miembro redacta una parte según su rol, y así aplicamos las normas del borrador","s3_tarea":"el viernes, en una sesión por equipos, comprobamos la hipótesis del método científico con la tabla del secretario y corregimos la norma que falla. Después, cada equipo lee sus entrevistas de «¡Sí, chef!», que muestran familias diversas, y elabora su cartel definitivo, con sus letras tridimensionales, una norma de igualdad, que los roles roten entre niñas y niños, y otra de respeto a todas las familias y formas de hablar, con el criterio 8.1.a de Conocimiento del Medio. Lo valoro con rúbrica.","pz_compl":"Jornada gastronómica andaluza","transferencia":"en la entrevista, anotamos con cuatro cifras el año de nacimiento del familiar; en la jornada gastronómica andaluza, escribimos con tilde los platos; y en Mijas, en el parque o la playa, reconocemos normas como las nuestras.","contexto_digital":"escribimos las normas en Google Classroom, y cada equipo las comenta desde casa","contexto_bilingue":"aprendemos a nombrar los roles y las normas, como «listen», «help» o «take turns»","situacion_nueva":"cuando surge un conflicto en el patio o en el comedor, los implicados consultan el cartel, proponen una solución con la mediación aprendida y la cuentan en la asamblea.","publico_real":"el portavoz de cada equipo lo expone ante otra clase de tercero, y lo publicamos en el blog del centro para las familias.","uso_real":"el cartel queda colgado en el aula, y lo consultamos todo el curso cuando un equipo necesita ponerse de acuerdo.","reparto_dias":"de cuatro, cinco y cinco días, porque la primera coincide con el inicio del curso; y la situación de aprendizaje ocupa tres sesiones, una cada viernes.","progresion":"en Matemáticas pasamos de tres a cuatro cifras y a redondear; en Lengua, de la sílaba a la tilde; y el cartel, de los roles al borrador y a la versión final.","ajuste_realidad":"abre el curso formando los equipos del año y aprovecha la jornada gastronómica andaluza; y, en una localidad turística como Mijas Costa, la entrevista admite recetas de otros países.","m_lectura":"el cuento «Los duendes y el zapatero», con estrategias de antes, durante y después de leer","m_tic":"Canva para la tarjeta de roles, Classroom para el borrador y vídeos sobre el método científico y Velázquez","m_emocional":"la tolerancia a la frustración al redondear, con el criterio 7.1.a de Matemáticas","m_conflictos":"el cartel y la mediación, que los equipos usan para resolver sus desacuerdos","m_sostenible":"el ODS 16, que las normas acordadas llevan a la vida del aula","m_andalucia":"nuestra habla andaluza en «La Tarara», el sevillano Velázquez y la jornada gastronómica con recetas de Mijas","producto_aps":"un informe sobre la técnica de animación stop motion","m_agrupamientos":"el gran grupo para la pregunta inicial; los equipos heterogéneos para las adivinanzas y el cartel; las parejas para corregir el dictado; y el trabajo individual para los números.","recursos_ud":"la biblioteca, para los cuentos tradicionales; el patio, para aplicar las normas; la prensa, en la noticia semanal; los policubos, para representar números; y las familias, en la entrevista","m_previos":"la asamblea sobre la pregunta del inicio, donde el alumnado cuenta sus experiencias","dua_ejemplos":"Con múltiples formas de representación, presento el método científico con vídeo y esquema, y las cifras con bloques de base 10. Con múltiples formas de acción y expresión, cuentan, escriben o representan su adivinanza. Y con múltiples formas de implicación, trabajan en equipo y se dan retroalimentación.","d_multinivel":"el concurso de problemas: el refuerzo resuelve problemas de tres cifras con bloques de base 10, y la profundización inventa problemas de dos pasos.","d_profundizacion":"investiga cómo colaboran las científicas y los científicos presentados y propone al cartel una norma inspirada en ellos.","d_vinculo":"los dos alumnos con dificultades leen números con bloques de base 10 y preparan el dictado con lectura fácil; el alumno con TDAH inventa su adivinanza con una agenda visual y autoinstrucciones; y la alumna de compensatoria prepara la entrevista con un glosario visual y, si lo necesita, entrevista a la cocinera del comedor.","d_sda":"el alumno con TDAH es el encargado del material, un rol que le permite moverse, y sigue la tarea por pasos; y los alumnos con dificultades parten de una norma modelo.","n_criterios":"trece","e_inicial":"la asamblea con la pregunta del inicio, cuyas respuestas registro en el anecdotario.","e_fases":"en la primera, la tarjeta de roles, con escala del 1.1.a de Conocimiento del Medio; en la segunda, el borrador, en el anecdotario; y en la tercera, el cartel, con una rúbrica del 8.1.a.","e_criterios":"con rúbrica de fluidez, la lectura oral, 4.1.a de Lengua; con escala de observación, «La Tarara», 1.3.a, y en Matemáticas, la mochila y el cálculo, 4.1.a y 6.2.a; con lista de cotejo, el diccionario, 6.1.a de Lengua, los problemas, 1.1.a y 5.1.a de Matemáticas, y «Las meninas», 1.1.a de Educación Artística; con porfolio, el cuento, 5.1.a de Lengua; y con registro anecdótico, la lectura autónoma y la frustración, el 7.1.a de Lengua y el de Matemáticas.","e_coevaluacion":"cada equipo valora con una lista de cotejo si ha cumplido sus normas, y corregimos el dictado intercambiando los cuadernos.","e_diversidad":"si a un alumno le cuesta leer números de cuatro cifras, la medida son bloques de base 10 con un compañero tutor; si lo logra con ayuda, la valoro con un 4.","producto_proyecto":"una entrevista a un familiar para el recetario andaluz","conclusion_ud":"En definitiva, mi alumnado no solo lee números de cuatro cifras o crea adivinanzas: aprende a ser un equipo, y lo deja escrito en un cartel para todo el curso.","siguiente_ud":"la unidad 2, «¿Cómo son las plantas?», donde estos equipos elaborarán una guía de las plantas","ods_corto":"el ODS 16"}},{"numero":2,"titulo":"¿Cómo son las plantas?","trimestre":1,"fechas":"Del 30 de septiembre al 18 de octubre","dias":15,"valores":{"titulo":"¿Cómo son las plantas?","trimestre_letra":"primer","centro_interes":"el mundo de las plantas","pz_producto":"Guía de plantas que nos rodean","pz_ods":"ODS 15 y 16","pregunta_motriz":"¿Qué nos aportan las plantas del barrio?","numero":"2","producto_sda":"una guía de las plantas que nos rodean","justif_normativa":"los saberes «Plantas» y «Protección de la naturaleza» de Conocimiento del Medio, del anexo II de la Orden","justif_curricular":"abre el estudio de los seres vivos y consolida la suma y la resta","justif_epistemologica":"las ciencias naturales clasifican las plantas por sus partes y funciones; la lengua las describe y las matemáticas, sus datos","relevancia":"cuidar y proteger las plantas del entorno nos beneficia, porque nos dan alimento y oxígeno","ods":"los ODS 15, vida de ecosistemas terrestres, y 16","fechas":"del 30 de septiembre al 18 de octubre","dias":"15","contexto_significativo":"estamos al comienzo del curso, con equipos recién formados; el programa CIMA ALDEA da sentido al cuidado de las plantas, y el de hábitos de vida saludable, a sus alimentos.","enlace_ud":"sigue a «Somos un equipo» y pone a esos equipos a estudiar los seres vivos.","pz_lcl":"LCL 2·4·5·6·8 → 2.1.a·4.1.a·5.1.a·6.1.a·8.3.a","pz_mat":"MAT 2·4·5·6·8 → 2.1.a·4.2.a·5.2.a·6.2.a·8.1.a","pz_cmn_ear":"CMN 2·5·6 → 2.2.a·5.1.a·6.1.a · EAR 2 → 2.1.a","objetivos_aprendizaje":"en Lengua, exposición oral, cuento, palabras derivadas y puntuación; en Matemáticas, suma, resta y dinero; clasificación de plantas; y estilos artísticos.","pz_obj_etapa":"b·e·g·h·j·l·ñ","cc_principales":"la competencia en comunicación lingüística y la matemática y en ciencia, tecnología e ingeniería","curriculo_lcl":"la 2, comprender textos orales, con CCL2 y CPSAA3, criterio 2.1.a y el lenguaje respetuoso; la 4, leer textos, con CCL2 y CPSAA4, criterio 4.1.a y la lectura compartida; la 5, escribir textos, con CCL3 y CPSAA5, criterio 5.1.a y la narración y la exposición; la 6, buscar información, con CD1 y CE3, criterio 6.1.a y la biblioteca; y la 8, leer literatura, con CCL1 y CCEC1, criterio 8.3.a y la comprensión lectora.","curriculo_mat":"la 2, resolver problemas, con STEM1 y CPSAA4, criterio 2.1.a y las sumas y restas; la 4, el pensamiento computacional, con STEM3 y CD1, criterio 4.2.a y la organización de datos; la 5, conectar ideas, con STEM1 y CC4, criterio 5.2.a y la relación entre suma y resta; la 6, comunicar procesos, con CCL1 y STEM4, criterio 6.2.a y las operaciones simples; y la 8, trabajar en equipo, con CP3 y CPSAA3, criterio 8.1.a y el respeto a las diferencias.","curriculo_cmn_ear":"En Conocimiento del Medio, la 2, el pensamiento científico, con CCL3 y STEM4, criterio 2.2.a y los textos científicos; la 5, el medio natural, con STEM5 y CE1, criterio 5.1.a y las plantas; y la 6, la intervención humana, con STEM5 y CC4, criterio 6.1.a y la protección de la naturaleza. Y en Educación Artística, la 2, investigar el arte, con CD1 y CCEC2, criterio 2.1.a y el vocabulario artístico.","pz_s1":"fichas de plantas del barrio","sda_reto":"descubrir qué nos aportan las plantas cercanas","s1_lcl_ej":"trabajamos el vocabulario, las siglas y los puntos suspensivos","s1_lcl_act":"buscamos en equipo información sobre una ONG contra el hambre, con el criterio 6.1.a, y el viernes escuchamos exposiciones orales, con el 2.1.a","s1_rel_lcl":"aprendemos a buscar información y a exponerla, como haremos con las plantas de la guía","s1_mat_ej":"sumamos en vertical números de tres cifras, con y sin llevadas","s1_mat_act":"calculamos sumas por descomposición con policubos, con el criterio 4.2.a, y el viernes cada equipo inventa problemas en el concurso, con el 2.1.a","s1_rel_mat":"ahí ensayamos el reparto de roles con el que cada equipo hará la guía","s1_cmn":"el jueves clasificamos los seres vivos por sus características y esquematizamos sus funciones vitales","s1_rel_cmn":"clasificar nos enseña a decir en la guía qué tipo de planta es cada una","pz_f1":"Exposiciones · concurso · seres vivos · dibujos","s1_ear":"creamos dibujos esquemáticos tras ver un vídeo","s1_rel_ear":"con esa técnica dibujamos cada planta de la guía","s1_tarea":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión, cada niño y cada niña hace la ficha de una planta de su barrio: la dibuja, la clasifica, nombra sus partes y explica qué nos aporta y por qué cuidarla, con el criterio 6.1.a de Conocimiento del Medio. Yo guío y registro cada ficha en una escala.","pz_s2":"fichas de alimentos y guía terminada","s2_lcl_ej":"formamos palabras derivadas con prefijos y sufijos","s2_lcl_act":"cambiamos el final de un cuento, con el criterio 8.3.a, y escribimos los pasos para exponer, con el 5.1.a","s2_rel_lcl":"planificar y escribir con orden nos prepara para redactar las fichas de la guía","s2_mat_ej":"restamos en vertical, con y sin llevadas, y nombramos sus términos","s2_mat_act":"descomponemos restas con policubos y, en el concurso del viernes, calculamos mentalmente y explicamos cómo, con el criterio 6.2.a","s2_rel_mat":"el portavoz expone el proceso del equipo, como hará al presentar la guía","s2_cmn":"el jueves dibujamos una planta con flor y aprendemos sus partes","s2_rel_cmn":"así sabremos qué parte comemos en las fichas de alimentos de la guía","pz_f2":"Cuento · resta · partes · Meninas","s2_ear":"conocemos «Las meninas» de Velázquez con su audioguía y componemos láminas, con el criterio 2.1.a","s2_rel_ear":"la audioguía es nuestro modelo para describir cada planta de la guía","s2_tarea":"el viernes, en una sesión por equipos, hacemos fichas de los alimentos que nos dan las plantas, indicando qué parte comemos y qué nos aporta cada uno, con el criterio 5.1.a de Conocimiento del Medio. El secretario las une en Canva y queda terminada la guía. Yo guío y la valoro con una rúbrica.","pz_s3":"presentación de guía + receta","nombre_proyecto":"¡Sí, chef!","s3_lcl_ej":"practicamos la mayúscula y el punto con un dictado en parejas","s3_lcl_act":"leemos en voz alta el capítulo del libro, con el criterio 4.1.a, y cada equipo redacta y lee un cuento actual","s3_rel_lcl":"esa lectura entonada prepara al portavoz para presentar la guía","s3_mat_ej":"comprobamos las restas con la suma, con el criterio 5.2.a","s3_mat_act":"organizamos un mercadillo con objetos que ya no usamos y, en el concurso, ordenamos en equipo los pasos para comprar el pan, con el criterio 8.1.a","s3_rel_mat":"ordenar instrucciones paso a paso es justo lo que pide la receta de la tarea final","s3_cmn":"el jueves investigamos la diferencia entre fotosíntesis y respiración y esquematizamos la reproducción de las plantas","s3_rel_cmn":"con ello explicamos, al presentar la guía, por qué las plantas nos dan oxígeno y alimento","pz_f3":"Cuento · mercadillo · fotosíntesis · guion","s3_ear":"dentro de «Opera prima», escribimos el guion de «Un día en mi cole»","s3_rel_ear":"cada equipo lo acuerda dialogando, con las mismas normas y roles que en la guía","s3_tarea":"el viernes, en una sesión por equipos, primero presentamos las guías terminadas; después, para «¡Sí, chef!», cada equipo parte de sus fichas de alimentos y prepara la presentación de una receta del recetario andaluz, seleccionando la información, con el criterio 2.2.a de Conocimiento del Medio; el secretario la escribe y el portavoz la expone. Yo guío y registro su trabajo en una lista de cotejo.","pz_compl":"Día Mundial de la Alimentación","transferencia":"en casa, reconocemos con la familia qué parte de la planta comemos; en la situación de aprendizaje del Día Mundial de la Alimentación, sumamos los alimentos recogidos para la ONG; y en Mijas, identificamos plantas del parque y pagamos con monedas.","contexto_digital":"situamos en Google Maps las plantas de la guía y la compartimos en Classroom","contexto_bilingue":"aprendemos las partes de la planta, como «root», «stem», «leaf» y «flower»","situacion_nueva":"cuando en el patio alguien arranca una planta, el alumnado explica por sí mismo por qué cuidarla y propone en la asamblea cómo protegerla.","publico_real":"el portavoz de cada equipo presenta su guía a una clase de segundo, y la publicamos en el blog del centro.","uso_real":"la guía queda en la biblioteca, y la usamos para reconocer y cuidar las plantas del patio todo el curso.","reparto_dias":"de cinco días cada una, sin festivos; y la situación de aprendizaje ocupa dos viernes, acaba en la fase dos y se presenta en la tres.","progresion":"en Matemáticas,
