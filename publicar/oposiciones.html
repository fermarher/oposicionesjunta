<title>Exposición oral · Oposiciones Primaria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Concepto: cuaderno de estudio con una pizarra de aula como pieza central.
   Claro = pizarra blanca y rotuladores; oscuro = pizarra verde y tiza. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eaeef4;
  --surface-3: #dfe5ee;
  --fg: #18202d;
  --fg-2: #445064;
  --muted: #6c778a;
  --line: #d3dae5;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #e3eafc;
  --marca: #fff0a3;
  --marca-ink: #3d3200;
  --bueno: #237047;
  --aviso: #9a6200;
  --critico: #b42318;
  --bueno-soft: #dff1e6;
  --aviso-soft: #fbefd6;
  --critico-soft: #fbe2df;
  --pz-fondo: #fbfbf8;
  --pz-marco: #b9c1cc;
  --pz-rojo: #c22b2b;
  --pz-negro: #1e2533;
  --pz-azul: #1f47c8;
  --pz-verde: #17734a;
  --pz-sombra: rgba(20, 30, 50, .12);
  --sombra: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 16px rgba(20, 30, 50, .06);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mano: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radio: 10px;
  --texto-discurso: 1.12rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a17; --surface: #19231f; --surface-2: #213029; --surface-3: #2a3b33; --fg: #e9efe9; --fg-2: #bccac1;
    --muted: #8fa197; --line: #2f4239; --accent: #8db4ff; --accent-ink: #0c1530; --accent-soft: #22324f;
    --marca: #5b4a12; --marca-ink: #ffeaa0; --bueno: #79d29b; --aviso: #f0bf5a; --critico: #ff8f84;
    --bueno-soft: #1d3a2a; --aviso-soft: #3d3016; --critico-soft: #43201d;
    --pz-fondo: #23332c; --pz-marco: #5a4632; --pz-rojo: #ffa094; --pz-negro: #f3f3ec; --pz-azul: #acc9ff; --pz-verde: #a2e3b8;
    --pz-sombra: rgba(0, 0, 0, .35); --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a17; --surface: #19231f; --surface-2: #213029; --surface-3: #2a3b33; --fg: #e9efe9; --fg-2: #bccac1;
  --muted: #8fa197; --line: #2f4239; --accent: #8db4ff; --accent-ink: #0c1530; --accent-soft: #22324f;
  --marca: #5b4a12; --marca-ink: #ffeaa0; --bueno: #79d29b; --aviso: #f0bf5a; --critico: #ff8f84;
  --bueno-soft: #1d3a2a; --aviso-soft: #3d3016; --critico-soft: #43201d;
  --pz-fondo: #23332c; --pz-marco: #5a4632; --pz-rojo: #ffa094; --pz-negro: #f3f3ec; --pz-azul: #acc9ff; --pz-verde: #a2e3b8;
  --pz-sombra: rgba(0, 0, 0, .35); --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-texto); font-size: 16px; line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: clamp(1.25rem, 1.05rem + .8vw, 1.6rem); font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------ armazón */
.barra {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.barra-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.marca-app { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--fg); margin-right: auto; }
.marca-app b { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; letter-spacing: -.01em; }
.marca-app span { font-size: .8rem; color: var(--muted); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  text-decoration: none; color: var(--fg-2); padding: 6px 10px; border-radius: 999px; font-size: .93rem;
}
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--fg); color: var(--bg); }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; }
.pila { display: flex; flex-direction: column; gap: 18px; }
.fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.entre { justify-content: space-between; }
.rejilla { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.rejilla-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 16px; min-width: 0; }
.tarjeta.elevada { box-shadow: var(--sombra); border-color: transparent; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.suave { color: var(--fg-2); }
.tenue { color: var(--muted); font-size: .9rem; }
.nota-pie { color: var(--muted); font-size: .85rem; max-width: 70ch; }

/* ------------------------------------------------------------ botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: .93rem; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--fg-2); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primario:hover { filter: brightness(1.08); }
.btn.peligro { color: var(--critico); }
.btn.mini { padding: 4px 9px; font-size: .82rem; border-radius: 6px; }
.btn.redondo { width: 44px; height: 44px; padding: 0; border-radius: 50%; }
.btn.grande { width: 58px; height: 58px; border-radius: 50%; padding: 0; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.grande svg { width: 26px; height: 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--fg-2); font-size: .82rem; font-weight: 700; border: 1px solid transparent;
  cursor: default; white-space: nowrap;
}
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip.bueno { background: var(--bueno-soft); color: var(--bueno); }
.chip.aviso { background: var(--aviso-soft); color: var(--aviso); }
.chip.critico { background: var(--critico-soft); color: var(--critico); }
.chip.acento { background: var(--accent-soft); color: var(--accent); }
.punto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }

/* pestañas */
.pestanas { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.pestanas a {
  text-decoration: none; color: var(--fg-2); padding: 9px 13px; font-weight: 700; font-size: .92rem;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
.pestanas a:hover { color: var(--fg); }
.pestanas a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

/* cabecera de exposición */
.cab-expo { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.cab-expo .titulo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.migas { font-size: .85rem; color: var(--muted); }
.migas a { color: var(--muted); }

/* ------------------------------------------------------------ inicio */
.hero { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: stretch; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero h1 span { color: var(--accent); }
.linea-prueba { display: flex; flex-direction: column; gap: 10px; }
.reloj-prueba { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.reloj-prueba div { border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.reloj-prueba b { display: block; font-family: var(--f-display); font-size: 1.5rem; }
.reloj-prueba .a { border-top: 4px solid var(--pz-azul); }
.reloj-prueba .b { border-top: 4px solid var(--pz-rojo); }
.acceso { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--fg); }
.acceso:hover { border-color: var(--accent); }
.acceso .grande-num { font-family: var(--f-display); font-size: 2.1rem; font-weight: 800; line-height: 1; }

/* barras de diagnóstico (una serie: puntos perdidos) */
.barras { display: flex; flex-direction: column; gap: 9px; }
.barra-fila { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; }
.barra-fila .et { font-size: .88rem; color: var(--fg-2); min-width: 0; }
.barra-fila .et b { color: var(--fg); font-weight: 700; }
.barra-fila .val { text-align: right; font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.barra-fila .pista { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; }
.barra-fila .relleno { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; min-width: 4px; }
.barra-fila:hover .relleno { filter: brightness(1.15); }

/* rejilla de UD */
.ud-trimestre { display: flex; flex-direction: column; gap: 10px; }
.ud-tarjeta { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--fg); position: relative; }
.ud-tarjeta:hover { border-color: var(--accent); }
.ud-num { font-family: var(--f-display); font-weight: 800; font-size: .85rem; color: var(--accent); letter-spacing: .04em; }
.ud-tarjeta h3 { font-size: 1.05rem; }
.ud-tarjeta .sda { font-size: .86rem; color: var(--fg-2); }
.dominio { display: flex; gap: 3px; }
.dominio i { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-3); }
.dominio i.n1 { background: var(--critico); } .dominio i.n2 { background: var(--aviso); }
.dominio i.n3 { background: color-mix(in srgb, var(--bueno) 60%, var(--surface-3)); } .dominio i.n4 { background: var(--bueno); }

/* ------------------------------------------------------------ esquema */
.linea-tiempo { display: flex; height: 34px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--bg); }
.linea-tiempo a { display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--fg); font-size: .75rem; font-weight: 700; background: var(--surface-3); min-width: 0; overflow: hidden; white-space: nowrap; }
.linea-tiempo a:nth-child(odd) { background: var(--accent-soft); }
.marcas-tiempo { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.esq-seccion { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; }
@media (max-width: 640px) { .esq-seccion { grid-template-columns: 1fr; } }
.esq-tiempo { font-variant-numeric: tabular-nums; color: var(--fg-2); font-size: .9rem; }
.esq-tiempo b { display: block; font-family: var(--f-display); font-size: 1.4rem; color: var(--fg); }
.esq-lista { margin: 8px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.esq-lista li::marker { color: var(--accent); }

/* ------------------------------------------------------------ discurso */
.discurso { font-size: var(--texto-discurso); line-height: 1.75; max-width: 72ch; }
.discurso p { margin: 0 0 1em; }
.discurso h3 { margin: 1.6em 0 .6em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.discurso h3 .min { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-weight: 400; }
.propio { background: var(--marca); color: var(--marca-ink); border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sin-marca .propio { background: none; color: inherit; padding: 0; }
.frase { border-radius: 4px; transition: background-color .2s; cursor: pointer; }
.frase:hover { background: var(--surface-2); }
.frase.actual { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.frase.leida { color: var(--fg-2); }
.notas-pizarra { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: -.4em 0 1.1em; font-family: var(--f-mano); font-size: .95rem; line-height: 1.3; }
.notas-pizarra span { color: var(--pz-azul); }
.notas-pizarra span[data-zona="normativa"] { color: var(--pz-verde); }
.notas-pizarra span[data-zona="cabecera"] { color: var(--pz-rojo); }
.notas-pizarra span[data-zona="indice"] { color: var(--pz-negro); }
.notas-pizarra span::before { content: "✎ "; color: var(--muted); }
.indice-lateral { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 2px; font-size: .88rem; }
.indice-lateral a { text-decoration: none; color: var(--fg-2); padding: 4px 8px; border-radius: 6px; }
.indice-lateral a:hover { background: var(--surface-2); color: var(--fg); }
.con-lateral { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
@media (max-width: 900px) { .con-lateral { grid-template-columns: 1fr; } .indice-lateral { position: static; flex-direction: row; flex-wrap: wrap; } }

/* ------------------------------------------------------------ escuchar */
.escuchar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
@media (max-width: 980px) { .escuchar { grid-template-columns: 1fr; } }
.escuchar .texto-vivo { max-height: calc(100vh - 260px); min-height: 320px; overflow-y: auto; padding-right: 8px; scroll-behavior: smooth; }
@media (max-width: 980px) { .escuchar .texto-vivo { max-height: 55vh; } }
.panel-pizarra { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 8px; }

/* reproductor */
.reproductor { display: flex; flex-direction: column; gap: 10px; }
.controles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.progreso { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--fg-2); }
.progreso input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.fuente-audio { font-size: .8rem; color: var(--muted); }
.mini {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.08);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.mini-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.mini-in .info { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.mini-in .info b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .92rem; }
.mini-in .info span { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-barra { height: 3px; background: var(--surface-3); position: absolute; left: 0; right: 0; top: 0; }
.mini-barra i { display: block; height: 100%; background: var(--accent); width: 0; }

/* ------------------------------------------------------------ pizarra */
.pz-marco { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; position: relative; border-radius: 12px; background: var(--pz-marco); padding: 8px; box-shadow: var(--sombra); overflow: hidden; }
.pz-escala { position: absolute; left: 8px; top: 8px; transform-origin: 0 0; }
.pizarra {
  width: 1280px; height: 720px; background: var(--pz-fondo); border-radius: 6px; padding: 22px 26px 18px;
  display: flex; flex-direction: column; gap: 12px; font-family: var(--f-mano); color: var(--pz-negro);
  box-shadow: inset 0 0 40px var(--pz-sombra); overflow: hidden; position: relative;
  --pz-tam: 21px;
}
.pz-cabecera { color: var(--pz-rojo); font-size: 31px; font-weight: 700; line-height: 1.1; text-align: center; min-height: 36px; border-bottom: 2px solid color-mix(in srgb, var(--pz-rojo) 45%, transparent); padding-bottom: 6px; display: flex; gap: 6px 26px; justify-content: center; flex-wrap: wrap; }
.pz-cuerpo { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; gap: 18px; min-height: 0; }
.pz-col { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; font-size: var(--pz-tam); line-height: 1.25; }
.pz-indice { border-right: 2px dashed color-mix(in srgb, var(--pz-negro) 25%, transparent); padding-right: 10px; }
.pz-normativa { border-left: 2px dashed color-mix(in srgb, var(--pz-verde) 40%, transparent); padding-left: 12px; color: var(--pz-verde); }
.pz-centro { color: var(--pz-azul); display: block; columns: 2; column-gap: 20px; column-fill: auto; height: 100%; }
.pz-col h4 { font-family: var(--f-mano); font-size: calc(var(--pz-tam) * .95); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; margin: 0 0 2px; }
.pz-caja { break-inside: avoid; margin: 0 0 10px; padding: 4px 8px 6px; border: 2px solid color-mix(in srgb, var(--pz-azul) 45%, transparent); border-radius: 10px 14px 9px 12px; }
.pz-caja h4 { color: var(--pz-rojo); text-decoration: none; }
.pz-it { display: block; position: relative; }
.pz-indice .pz-it.actual { font-weight: 700; }
.pz-indice .pz-it.actual::before { content: "➜"; position: absolute; left: -2px; transform: translateX(-100%); color: var(--pz-rojo); }
.pz-it.nuevo { animation: escribir .9s steps(18, end) both; }
.pz-it.nuevo::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: color-mix(in srgb, var(--pz-rojo) 45%, transparent); border-radius: 2px; animation: subrayar 2.4s ease-out forwards; }
.pz-it .propio { background: color-mix(in srgb, var(--marca) 70%, transparent); color: inherit; }
.pz-vacia { position: absolute; inset: 0; display: grid; place-items: center; color: color-mix(in srgb, var(--pz-negro) 35%, transparent); font-size: 28px; pointer-events: none; }
@keyframes escribir { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes subrayar { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
.pz-pantalla { position: fixed; inset: 0; z-index: 60; background: #0b0f0d; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
.pz-pantalla .pz-marco { flex: 1; aspect-ratio: auto; border-radius: 6px; }
.pz-pantalla .controles { justify-content: center; color: #f2f2ec; }
.pz-pantalla .btn { background: #1d2522; color: #f2f2ec; border-color: #33403a; }

/* ------------------------------------------------------------ memorizar */
.memo-texto { font-size: var(--texto-discurso); line-height: 2; max-width: 72ch; }
.memo-texto p { margin: 0 0 1em; }
.oculta { display: inline-block; min-width: 1.6em; border-bottom: 2px solid var(--fg-2); color: transparent; cursor: pointer; border-radius: 2px; user-select: none; line-height: 1.2; }
.oculta:hover { background: var(--surface-2); }
.oculta.vista { color: var(--critico); border-bottom-color: transparent; user-select: auto; }
.inicial { letter-spacing: .02em; }
.inicial i { color: var(--muted); font-style: normal; }
.srs { display: flex; gap: 8px; flex-wrap: wrap; }
.srs .btn { flex: 1; min-width: 120px; flex-direction: column; gap: 2px; }
.srs .btn small { font-weight: 400; color: var(--muted); font-size: .76rem; }

.cronometro { font-family: var(--f-mono); font-size: clamp(3.2rem, 2rem + 6vw, 6.2rem); font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

@media (max-width: 860px) { .ensayo-panel { grid-template-columns: 1fr; } }
.tramos { position: relative; height: 30px; display: flex; gap: 2px; }

.tramos span.hecho { background: var(--bueno-soft); color: var(--bueno); }
.tramos span.actual { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.aguja { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--fg); border-radius: 2px; transition: left .3s linear; }
.tabla { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tabla th, .tabla td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.desliza { overflow-x: auto; max-width: 100%; }

/* rúbrica */
.rub-item { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 10px 18px; padding: 12px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 700px) { .rub-item { grid-template-columns: 1fr; } }
.rub-item ul { margin: 6px 0 0; padding-left: 1.1em; color: var(--fg-2); font-size: .88rem; }
.rub-item input[type=range] { width: 100%; accent-color: var(--accent); }
.rub-total { font-family: var(--f-display); font-size: 2.6rem; font-weight: 800; line-height: 1; }

/* guion A5 */
.a5 {
  width: min(100%, 420px); aspect-ratio: 148 / 210; background: var(--pz-fondo); color: var(--pz-negro);
  border-radius: 4px; box-shadow: var(--sombra); padding: 26px 26px 20px; font-family: var(--f-mano); font-size: 1.12rem; line-height: 1.45;
  border: 1px solid var(--line); white-space: pre-wrap; overflow: auto;
}
.a5 .propio { background: color-mix(in srgb, var(--marca) 75%, transparent); color: inherit; }

/* ficha */
.ficha-semanas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .ficha-semanas { grid-template-columns: 1fr; } }
.ficha-semanas dl { margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.ficha-semanas dt { font-weight: 700; color: var(--accent); font-size: .8rem; letter-spacing: .05em; }
.ficha-semanas dd { margin: 0; color: var(--fg-2); }
.lista-limpia { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* sorteo */
.bombo { display: flex; flex-wrap: wrap; gap: 10px; }
.bola {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.15rem;
  background: radial-gradient(circle at 35% 30%, var(--surface), var(--surface-3)); border: 1px solid var(--line); color: var(--fg-2);
}
.bola.sale { background: radial-gradient(circle at 35% 30%, #fff, var(--accent)); color: var(--accent-ink); border-color: var(--accent); animation: botar .5s ease-out; }
.bola.apagada { opacity: .35; }
@keyframes botar { 0% { transform: translateY(-14px) scale(.85); } 60% { transform: translateY(3px) scale(1.05); } 100% { transform: none; } }
.elegir-ud { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }

/* diferencias */
.matriz { border-collapse: separate; border-spacing: 0; font-size: .84rem; }
.matriz th, .matriz td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 8px; vertical-align: top; min-width: 190px; max-width: 280px; }
.matriz thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; }
.matriz tbody th { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; text-align: left; }
.matriz-cont { max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--radio); }

/* formularios */
.campo { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.campo select, .campo input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: .8rem; }
.interruptor { display: inline-flex; gap: 8px; align-items: center; font-size: .92rem; cursor: pointer; }
.interruptor input { width: 18px; height: 18px; accent-color: var(--accent); }
.aviso-caja { border-left: 4px solid var(--aviso); background: var(--aviso-soft); padding: 10px 14px; border-radius: 6px; font-size: .92rem; }
.info-caja { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 6px; font-size: .92rem; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 80; font-size: .92rem; box-shadow: var(--sombra); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

<script>
window.OPOS_DATOS = {"generado":"2026-10-06T07:44:38.602Z","programacion":{"id":"programacion","titulo":"Defensa de la programación didáctica «Aprendemos juntos»","objetivoMinutos":28.5,"secciones":[{"id":"p1","titulo":"Introducción y justificación","rubrica":["Introducción y justificación","Bibliografía"],"minutos":2.4,"esquema":["Saludo y presentación: «Aprendemos juntos», tercero de Primaria, cuatro áreas","Estructura: 12 UD con SdA, 3 proyectos de diseño, APS «Opera prima»","Justificación normativa: LOMLOE, LEA, RD 157/2022, D. 101/2023, Orden 30/05/2023 (art. 3)","Justificación curricular: Coll (2013), 3 niveles + 4.º de Cabrerizo, Rubio y Castillo (2014)","Justificación epistemológica: Piaget e Inhelder, Vygotsky, Ausubel","Rasgos: competencial, cooperativa, lectura, razonamiento, DUA, viable"],"bloques":[{"id":"p1b1","texto":"Buenos días, señoras y señores miembros del tribunal. Voy a defender mi programación didáctica «Aprendemos juntos», para tercero de Educación Primaria, en un colegio bilingüe de Mijas Costa, en Málaga. Es una programación interdisciplinar de cuatro áreas: Lengua Castellana y Literatura, Matemáticas, Conocimiento del Medio Natural, Social y Cultural y Educación Artística. Tiene doce unidades didácticas, cada una con su situación de aprendizaje, tres proyectos de diseño y un aprendizaje-servicio anual. Mi exposición sigue los ocho apartados que dejo escritos en la pizarra.","pizarra":[{"zona":"cabecera","texto":"«Aprendemos juntos» · 3.º EP · LCL · MAT · CMN · EAR"},{"zona":"indice","texto":"1. Introducción y justificación"},{"zona":"indice","texto":"2. Contextualización y adecuación"},{"zona":"indice","texto":"3. Marco normativo y concreción curricular"},{"zona":"indice","texto":"4. Metodología"},{"zona":"indice","texto":"5. Organización y temporalización"},{"zona":"indice","texto":"6. Atención a la diversidad"},{"zona":"indice","texto":"7. Evaluación"},{"zona":"indice","texto":"8. Conclusión"}]},{"id":"p1b2","texto":"En primer lugar, la justifico normativamente. Programar es la primera función docente según la Ley Orgánica 2/2006, de Educación, modificada por la Ley Orgánica 3/2020, la LOMLOE, y también la Ley 17/2007, de Educación de Andalucía. Mi programación concreta los elementos curriculares del Real Decreto 157/2022, el Decreto 101/2023 y la Orden de 30 de mayo de 2023, y cumple su artículo 3, que exige situaciones de aprendizaje que integren las distintas áreas.","pizarra":[{"zona":"normativa","texto":"LOMLOE · LEA 17/2007"},{"zona":"normativa","texto":"RD 157/2022 · D. 101/2023 · O. 30/05/2023"}]},{"id":"p1b3","texto":"En segundo lugar, la justifico curricularmente. Como señala Coll (2013), programar es concretar qué, cuándo y cómo enseñar y evaluar. Coll distingue tres niveles de concreción: el currículo de la Administración; la programación didáctica del equipo de ciclo, donde se sitúa esta programación; y la programación de aula, donde desarrollo mis doce unidades didácticas. Cabrerizo, Rubio y Castillo (2014) añaden un cuarto nivel: las medidas para el alumnado con necesidades específicas de apoyo educativo, imprescindibles en mi grupo.","pizarra":[{"zona":"centro","caja":"1. Justificación","texto":"Coll: 3 niveles + 4.º NEAE · constructivismo"},{"zona":"normativa","texto":"Coll (2013) · Cabrerizo et al. (2014)"}]},{"id":"p1b4","texto":"En tercer lugar, la justifico epistemológicamente desde el constructivismo: con Piaget e Inhelder (2022), ajusto la enseñanza a las operaciones concretas; con Vygotsky (2020), aprovecho la zona de desarrollo próximo cooperando; y con Ausubel (2009), parto de los conocimientos previos. De ahí su título: «Aprendemos juntos». En síntesis, es una programación competencial, cooperativa e inclusiva, que impulsa la lectura y el razonamiento matemático, integra la sostenibilidad y la igualdad, se basa en el Diseño Universal para el Aprendizaje y es coherente y viable.","pizarra":[]}]},{"id":"p2","titulo":"Contextualización y adecuación","rubrica":["Contextualización y adecuación"],"minutos":2.2,"esquema":["Centro: colegio bilingüe de Mijas Costa, tres líneas, RD 132/2010 y RD 658/2024","Plan de Centro: Paz, Igualdad, Actuación Digital, CIMA (vida saludable, ALDEA, STEAM)","Etapa y nivel: tercero, segundo ciclo; 22 alumnos de 8-9 años","Rasgos generales (Piaget e Inhelder 2022) → manipulativo y equipo","Rasgos particulares: 2 con dificultades LCL-MAT, TDAH, compensatoria","Cuatro áreas concretadas; ajustada a la realidad (calendario, horario, recursos)"],"bloques":[{"id":"p2b1","texto":"Paso al segundo apartado: la contextualización y adecuación. El centro es un colegio público bilingüe de Educación Infantil y Primaria de Mijas Costa, en Málaga, una localidad moderna, turística y comercial de unos cuarenta mil habitantes. Tiene tres líneas por nivel, y sus instalaciones cumplen el Real Decreto 132/2010, modificado por el Real Decreto 658/2024. Siguiendo a Antúnez e Imbernón (2010), parto del Proyecto Educativo y vinculo la programación con sus planes y programas: el Plan de Cultura de Paz, el Plan de Igualdad, el Plan de Actuación Digital y el programa CIMA, con hábitos de vida saludable, ALDEA y STEAM.","pizarra":[{"zona":"centro","caja":"2. Contexto","texto":"CEIP bilingüe Mijas Costa · Paz · Igualdad · CIMA"},{"zona":"normativa","texto":"RD 132/2010 – RD 658/2024 · Antúnez e Imbernón (2010)"}]},{"id":"p2b2","texto":"En cuanto a la etapa y el nivel, se dirige a tercero de Educación Primaria, primer curso del segundo ciclo: veintidós alumnos y alumnas de ocho y nueve años. Según Piaget e Inhelder (2022), están en las operaciones concretas: razonan sobre hechos concretos y combinan operaciones para resolver problemas. Además, tienen mucha energía, amplían su vocabulario, necesitan sentirse queridos, disfrutan en grupo e interiorizan mejor las normas. Por eso uso material manipulativo, como los bloques de base diez, los policubos o el tangram, y normas consensuadas, como el cartel de normas de colaboración de la primera unidad.","pizarra":[]},{"id":"p2b3","texto":"En cuanto a las características particulares, el grupo presenta diversidad: dos alumnos con dificultades en Lengua y Matemáticas, un alumno con TDAH, censado con dificultades de aprendizaje, y una alumna que necesita atención de compensación educativa. Les dedicaré el sexto apartado. La programación concreta y precisa las cuatro áreas a las que va dirigida: Lengua Castellana y Literatura, Matemáticas, Conocimiento del Medio y Educación Artística en su parte de Plástica. Y se ajusta a la realidad: respeta el calendario escolar, el horario real del grupo y los recursos del centro.","pizarra":[{"zona":"centro","caja":"2. Contexto","texto":"22 alumnos, 8-9 años · NEAE: 2 dif., TDAH, COM"}]}]},{"id":"p3","titulo":"Marco normativo y concreción curricular","rubrica":["Marco normativo y concreción curricular","Bibliografía"],"minutos":4.4,"esquema":["Nacional: LOE-LOMLOE, RD 157/2022, RD 132/2010 y 658/2024","Autonómico: LEA 17/2007, D. 101/2023, Orden 30/05/2023 + Instrucciones","Cadena: objetivos → competencias clave → descriptores → CE → CEv → saberes","31 CE: LCL 10, MAT 8, CMN 9, EAR 4 (tablas 3, 4 y 5)","LCL CE 4 → 4.1.a → 2.B.3.4 · MAT CE 2 → 2.1.a → 2.A.3.5","CMN CE 3 → 3.1.a → 2.B.2.1 · EAR CE 4 → 4.1.a → 2.B.1","SdA (art. 7 D. 101/2023, INTEF 2023): 12 UD + 3 proyectos + APS"],"bloques":[{"id":"p3b1","texto":"Paso al tercer apartado: el marco normativo y la concreción curricular. El marco legislativo vigente es, en el ámbito nacional, la Ley Orgánica 2/2006, de Educación, modificada por la LOMLOE; el Real Decreto 157/2022, de 1 de marzo, de enseñanzas mínimas de Educación Primaria; y el Real Decreto 132/2010, modificado por el Real Decreto 658/2024, de requisitos mínimos de los centros.","pizarra":[]},{"id":"p3b2","texto":"En el ámbito autonómico, la Ley 17/2007, de Educación de Andalucía; el Decreto 101/2023, de 9 de mayo, que establece el currículo de Primaria en Andalucía; y la Orden de 30 de mayo de 2023, que lo desarrolla y regula la atención a la diversidad y la evaluación. Además, las Instrucciones sobre la lectura, el razonamiento matemático y el alumnado con necesidades específicas de apoyo educativo.","pizarra":[]},{"id":"p3b3","texto":"Sobre este marco, concreto el currículo como una cadena. Los objetivos de etapa del artículo 5 del Decreto 101/2023 se vinculan con el perfil competencial, según el anexo III de la Orden. Las ocho competencias clave se concretan en descriptores operativos; de ellos parten las competencias específicas, que se evalúan con criterios de evaluación y se trabajan con saberes básicos. Así lo recojo, en las tablas 3, 4 y 5, para cada una de las treinta y una competencias específicas: diez de Lengua, ocho de Matemáticas, nueve de Conocimiento del Medio y cuatro de Educación Artística. Siguiendo a Escamilla (2018), esta vinculación es la base de una programación por competencias.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"Obj. etapa → CC → descriptores → CE → CEv → saberes"},{"zona":"centro","caja":"3. Concreción curricular","texto":"31 CE: LCL 10 · MAT 8 · CMN 9 · EAR 4"}]},{"id":"p3b4","texto":"Pongo un ejemplo por área. En Lengua Castellana y Literatura, la competencia específica 4, comprender textos escritos y multimodales, se vincula con los descriptores de comunicación lingüística 2, 3 y 5 y de competencia digital 1; se evalúa con el criterio 4.1.a, leer en silencio y en voz alta identificando el sentido global; y se trabaja con el saber 2.B.3.4, estrategias antes, durante y después de la lectura. En Matemáticas, la competencia específica 2, resolver situaciones problematizadas, se vincula con los descriptores STEM 1 y 2 y de aprender a aprender 4 y 5; se evalúa con el criterio 2.1.a, emplear estrategias para resolver problemas de forma pautada; y se trabaja con el saber 2.A.3.5, fases de resolución de un problema.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"LCL: CE 4 → CEv 4.1.a → saber 2.B.3.4"},{"zona":"centro","caja":"3. Concreción curricular","texto":"MAT: CE 2 → CEv 2.1.a → saber 2.A.3.5"}]},{"id":"p3b5","texto":"En Conocimiento del Medio, la competencia específica 3, resolver problemas mediante proyectos de diseño, se vincula con los descriptores STEM 3 y 4 y de competencia emprendedora 1 y 3; se evalúa con el criterio 3.1.a, diseñar en equipo un producto que resuelva un problema de diseño; y se trabaja con el saber 2.B.2.1, fases de los proyectos de diseño. En Educación Artística, la competencia específica 4, participar en producciones artísticas colectivas, se vincula con comunicación lingüística 5 y conciencia y expresiones culturales 3 y 4; se evalúa con el criterio 4.1.a, participar de forma guiada y cooperativa asumiendo diferentes funciones; y se trabaja con el saber 2.B.1, fases del proceso creativo.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"CMN: CE 3 → CEv 3.1.a → saber 2.B.2.1"},{"zona":"centro","caja":"3. Concreción curricular","texto":"EAR: CE 4 → CEv 4.1.a → saber 2.B.1"}]},{"id":"p3b6","texto":"Todos estos elementos se integran en situaciones de aprendizaje, que según el artículo 7 del Decreto 101/2023 son actividades articuladas para desarrollar las competencias específicas en un contexto determinado. Siguiendo al INTEF (2023), las organizo en tres niveles. Primero, cada una de las doce unidades didácticas contiene su situación de aprendizaje. Segundo, un proyecto de diseño por trimestre, ligado a los ODS 2, 15 y 4: «¡Sí, chef!», con un recetario andaluz; «¿Buceamos?», con una galería de arte sostenible; y «Huellas del pasado», con un lapbook sobre la Prehistoria. Tercero, el aprendizaje-servicio anual «Opera prima», ligado al ODS 16: un corto de animación en stop motion.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"SdA: 12 UD + 3 proyectos de diseño + APS"},{"zona":"normativa","texto":"Escamilla (2018) · INTEF (2023)"}]}]},{"id":"p4","titulo":"Principios pedagógicos y estrategias metodológicas","rubrica":["Aspectos metodológicos y principios pedagógicos","Bibliografía"],"minutos":5.8,"esquema":["Principios del artículo 6 del Decreto 101/2023 + orientaciones metodológicas","Lectura: Instrucciones 21/06/2023, 30 minutos diarios, rutina semanal (Cassany 2019)","Razonamiento: Instrucciones 18/06/2024, 3 × 30 min, pasos heurísticos","Métodos y estrategias: ABP, proyectos, cooperativo, APS, rutinas; Baena (2019): 3 fases","1 Implicación · 2 individual-cooperativo-iguales con género (Pujolás y Lago 2023)","3 Todos los criterios y CE · 4 Andalucía","5 Enfoque integrador, interdisciplinar y holístico (Zabala 2012) → resto en apartado 5"],"bloques":[{"id":"p4b1","texto":"Paso al cuarto apartado, el corazón de mi programación: los principios pedagógicos y las estrategias metodológicas. Parto de los principios y orientaciones pedagógicas que marca la normativa vigente, el artículo 6 del Decreto 101/2023. Los aplico así: la lectura como eje de todas las áreas; la integración de las TIC; la sostenibilidad; el Diseño Universal para el Aprendizaje; la educación emocional, siguiendo a Bisquerra, Pérez y García (2015); las peculiaridades de Andalucía; la resolución pacífica de conflictos; y tiempo para proyectos significativos y razonamiento matemático. De ellos derivo mis orientaciones: partir del desarrollo y los intereses del alumnado, construir aprendizajes significativos y funcionales, provocar conflictos cognitivos y enseñar a aprender a aprender.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"Principios: art. 6 D. 101/2023"},{"zona":"normativa","texto":"Bisquerra, Pérez y García (2015)"}]},{"id":"p4b2","texto":"Destaco dos medidas que exige la normativa. La primera, el fomento de la lectura. Siguiendo las Instrucciones de 21 de junio de 2023, dedicamos al menos treinta minutos diarios a leer: en mi horario, la primera media hora de cada mañana. Trabajamos los tres momentos, antes, durante y después de leer; contamos con un mediador de lecturas; leemos noticias, cuentos, poemas, carteles o recetas, y también nuestras propias producciones; y elaboramos diccionarios personales. Como plantean Cassany, Luna y Sanz (2019), la lengua se aprende usándola con sentido; por eso cada día tiene su rutina: leo una noticia, leo un cuento, capítulo del libro, cuentacuentos y dramatizaciones.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"Lectura: 30 min diarios · antes, durante, después"},{"zona":"normativa","texto":"Instr. 21/06/2023 · Cassany, Luna y Sanz (2019)"}]},{"id":"p4b3","texto":"La segunda, el fomento del razonamiento matemático. Las Instrucciones de 18 de junio de 2024 hacen de la resolución de problemas la columna vertebral del área, con tres sesiones semanales de al menos treinta minutos: en mi horario, martes, miércoles y viernes. Seguimos siempre los mismos pasos heurísticos: planteamos la situación, la comprendemos organizando los datos, subrayamos con colores los datos, las palabras clave y la pregunta, elegimos y aplicamos una estrategia, comprobamos la solución y reflexionamos juntos sobre el proceso. Lo concretamos en rutinas motivadoras, como los problemas exprés y el concurso de problemas por equipos, partiendo de lo concreto y valorando el proceso, no solo el resultado.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"Razonamiento: 3 × 30 min · pasos heurísticos"},{"zona":"normativa","texto":"Instr. 18/06/2024"}]},{"id":"p4b4","texto":"Combino tres métodos: el expositivo para explicar, el demostrativo para modelar con ejemplos y el investigativo guiado para pequeñas investigaciones. Y planteo estrategias metodológicas motivantes e innovadoras: el aprendizaje basado en problemas; el aprendizaje basado en proyectos, que según Cooper y Murphy (2024) da sentido a lo aprendido mediante un producto real; el aprendizaje cooperativo y la tutoría entre iguales; el aprendizaje-servicio; y las rutinas de pensamiento. Todo se organiza con el aprendizaje experiencial de Baena (2019): cada unidad didáctica dura unas tres semanas, y cada semana es una fase: motivar y activar, explorar y estructurar, y aplicar y concluir.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"ABP · proyectos · cooperativo · APS · rutinas"},{"zona":"centro","caja":"4. Metodología","texto":"Motivar-activar → explorar-estructurar → aplicar-concluir"},{"zona":"normativa","texto":"Cooper y Murphy (2024) · Baena (2019)"}]},{"id":"p4b5","texto":"Explico ahora qué permiten estas estrategias, indicador por indicador. Primero, propician la implicación, la participación y el interés del alumnado: como explica Bueno (2019), la emoción y la curiosidad activan el aprendizaje; por eso cada unidad parte de una pregunta cercana, como «¿Cómo llego a un lugar?», y termina en un producto real, como un plano del barrio. Segundo, combinan el trabajo individual, el cooperativo y el aprendizaje entre iguales, con perspectiva de género. Siguiendo a Pujolás y Lago (2023), formo equipos heterogéneos con roles rotatorios, para que niñas y niños sean por igual coordinadores o portavoces, sin estereotipos; y en la tutoría entre iguales, prevista en el artículo 27 de la Orden de 30 de mayo de 2023, quien domina un aprendizaje ayuda a otro compañero.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"1 Implicación · 2 Cooperativo e iguales con género"},{"zona":"normativa","texto":"Bueno (2019) · Pujolás y Lago (2023)"}]},{"id":"p4b6","texto":"Tercero, sirven para el desarrollo de todos los criterios de evaluación y todas las competencias específicas, porque los criterios se secuencian a lo largo de las doce unidades y cada situación de aprendizaje moviliza criterios de las cuatro áreas. Cuarto, fomentan conexiones con las prácticas sociales y culturales de Andalucía: la jornada gastronómica andaluza, el recetario andaluz, la visita de una bailaora en el Día del Flamenco, el desayuno andaluz del 28 de febrero, la canción popular «La Tarara», la obra de Velázquez y la modalidad lingüística andaluza, que evalúo con el criterio 1.3.a de Lengua.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"3 Todos los CEv y CE · 4 Andalucía"}]},{"id":"p4b7","texto":"Quinto, proporcionan un enfoque integrador, interdisciplinar y holístico. Como defiende Zabala (2012), un enfoque globalizador acerca la escuela a la vida. Por ejemplo, en el aprendizaje-servicio «Opera prima» el alumnado escribe el guion en Lengua, diseña el storyboard, el escenario y el cartel en Educación Artística, usa herramientas digitales para fotografiar y editar y, al final, lo comparte con la comunidad en un festival de cine. Además, estas estrategias contemplan las medidas de atención a la diversidad, facilitan la coordinación docente, incluyen la orientación y acción tutorial y utilizan recursos didácticos, espaciales, personales y materiales, como desarrollo a continuación.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"5 Integrador · interdisciplinar · holístico"},{"zona":"normativa","texto":"Zabala (2012)"}]}]},{"id":"p5","titulo":"Organización, recursos y temporalización","rubrica":["Aspectos metodológicos y principios pedagógicos"],"minutos":4.8,"esquema":["Espacios, tiempos (D. 301/2009, Orden 20/08/2010) y agrupamientos flexibles","Recursos personales, materiales, espaciales y TIC (Trujillo 2014)","Complementarias por UD y extraescolares voluntarias","Coordinación docente (D. 328/2010) y acción tutorial: 4 líneas","Temporalización: T1 UD 1-5 · T2 UD 6-9 · T3 UD 10-12","Las 12 UD contienen situación de aprendizaje"],"bloques":[{"id":"p5b1","texto":"Paso al quinto apartado: la organización, los recursos y la temporalización. Organizo el espacio para favorecer el trabajo cooperativo: el aula dispuesta en equipos, la biblioteca, el aula del futuro, el huerto escolar, el patio y el pabellón. En cuanto al tiempo, el Decreto 301/2009 fija el calendario, con 178 días lectivos, y la Orden de 20 de agosto de 2010 regula el horario: veinticinco horas semanales con dos horas y media de recreo. Los agrupamientos son flexibles: gran grupo para explicar y debatir, pequeños grupos heterogéneos para proyectos, parejas para la tutoría entre iguales y trabajo individual.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"Espacios · tiempos · agrupamientos flexibles"},{"zona":"normativa","texto":"D. 301/2009 · O. 20/08/2010"}]},{"id":"p5b2","texto":"Utilizo recursos didácticos, espaciales, personales y materiales variados. Como recursos personales, el equipo docente, las maestras de Pedagogía Terapéutica, de Audición y Lenguaje y de apoyo, las familias y expertos invitados. Como recursos materiales, material fungible, prensa, diccionarios, mapas y material manipulativo, como policubos, tangram, regletas, monedas o el reloj analógico. Y, siguiendo a Trujillo (2014), incorporo las TIC como artefactos digitales: la pizarra digital, Google Classroom, Google Maps, Canva, Moodle Centros, el blog de aula y las herramientas de animación.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"Recursos: personales · materiales · espaciales · TIC"},{"zona":"normativa","texto":"Trujillo (2014)"}]},{"id":"p5b3","texto":"Incluyo actividades complementarias interesantes, atractivas y motivadoras en cada unidad, para que promuevan un aprendizaje significativo e integrado. En el primer trimestre, la jornada gastronómica andaluza, la recogida de alimentos del Día Mundial de la Alimentación, la salida a Aventura Amazonia, la bailaora del Día del Flamenco y el debate del Día de la Constitución. En el segundo, el Bioparc de Fuengirola, la marcha por la paz, el desayuno andaluz y el mural del Día Mundial del Agua. En el tercero, el taller de refranes del Día del Libro, la visita al Centro Pompidou, que inspira la maqueta final, y la exposición de dibujos contra la guerra. Las extraescolares son voluntarias: de apoyo, deportivas, artísticas y lúdico-saludables.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"Complementarias en cada UD · extraescolares voluntarias"}]},{"id":"p5b4","texto":"Mi programación facilita la coordinación docente que establece el Decreto 328/2010. En horizontal, con el equipo de ciclo, que elabora las programaciones, y con el equipo docente, que hace el seguimiento del grupo y que coordino como tutora. En vertical, con el Equipo Técnico de Coordinación Pedagógica, que fija las directrices, y con el equipo de orientación, que asesora. Y contempla la orientación y acción tutorial, que el Decreto 101/2023 considera parte de la función docente, con cuatro líneas: enseñar a pensar, enseñar a ser persona, enseñar a convivir y enseñar a tomar decisiones, junto con la información periódica a las familias.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"Coordinación horizontal y vertical · acción tutorial"},{"zona":"normativa","texto":"D. 328/2010"}]},{"id":"p5b5","texto":"Por último, la temporalización de las doce unidades didácticas, de trece a diecisiete días lectivos cada una. Subrayo que todas y cada una de las doce unidades didácticas contienen, al menos, una situación de aprendizaje con su producto final. Primer trimestre: unidad 1, «Somos un equipo», con un cartel de normas de colaboración; unidad 2, «¿Cómo son las plantas?», con una guía de las plantas que nos rodean; unidad 3, «¿Cómo son los animales?», con el diseño de un superhéroe animal; unidad 4, «Lo que importa es la salud», con un cartel de la pirámide de hábitos de salud; y unidad 5, «Cuidamos los ecosistemas», con un mural para proteger el planeta.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"12 SdA · T1 UD 1-5 · T2 6-9 · T3 10-12"}]},{"id":"p5b6","texto":"Segundo trimestre: unidad 6, «Cuidamos la ciudad», con un informe sobre la bicicleta como medio de transporte; unidad 7, «¿Cómo llego a un lugar?», con un plano del barrio que incluye los centros sanitarios; unidad 8, «Centinelas del mar», con un cómic sobre el cuidado del medioambiente; y unidad 9, «Somos ciudadanos», con un mural sobre las tradiciones oficiales de España. Tercer trimestre: unidad 10, «¿Qué edad tienes?», con una pirámide de población; unidad 11, «¿En qué edad estamos?», con una línea del tiempo de nuestra vida; y unidad 12, «Huellas del pasado», con una maqueta del Centro Pompidou de Málaga. A ellas se suman el proyecto de diseño de cada trimestre y «Opera prima».","pizarra":[]}]},{"id":"p6","titulo":"Atención a la diversidad y a las diferencias individuales","rubrica":["Medidas de atención a la diversidad","Aspectos metodológicos y principios pedagógicos"],"minutos":3,"esquema":["Art. 17 D. 101/2023 · art. 26 Orden: DUA (representación, expresión, implicación)","Generales (art. 27): segundo docente, agrupamientos flexibles, cooperativo, tutoría","Programas (art. 28): refuerzo 30' LCL y 30' MAT · profundización","Específicas (Instr. 08/03/2017, art. 33): TDAH (refuerzo + programa específico) y compensatoria","A lo largo de la puesta en práctica: multinivel en cada UD + evaluación continua","Coordinación: equipo docente, PT, AL, apoyo, orientación, familias"],"bloques":[{"id":"p6b1","texto":"Paso al sexto apartado: la atención a la diversidad y a las diferencias individuales. El artículo 17 del Decreto 101/2023 la define como el conjunto de medidas que garantizan la mejor respuesta a todo el alumnado en un entorno inclusivo, y el artículo 26 de la Orden de 30 de mayo de 2023 establece que esas medidas se rigen por el Diseño Universal para el Aprendizaje. Lo aplico con sus tres principios: múltiples formas de representación, con vocabulario clarificado, imágenes, vídeos y esquemas; múltiples formas de expresión, oral, escrita, gráfica o digital; y múltiples formas de implicación, con trabajo cooperativo, retroalimentación y actividades multinivel.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"DUA: representación · expresión · implicación"}]},{"id":"p6b2","texto":"Como medidas generales del artículo 27 de esa Orden, aplico el apoyo de un segundo docente dentro del aula, los agrupamientos flexibles y las metodologías inclusivas de aprendizaje cooperativo y tutoría entre iguales. Como programas del artículo 28, un programa de refuerzo del aprendizaje para los dos alumnos con dificultades, con treinta minutos de refuerzo de Lengua y treinta de Matemáticas en el horario de autonomía del centro, material manipulativo, textos de lectura fácil y tareas graduadas. Y para el alumnado especialmente motivado, programas de profundización con investigaciones interdisciplinares, que enriquecen los saberes sin modificar los criterios de evaluación.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"Generales · refuerzo 30' LCL y MAT · profundización"}]},{"id":"p6b3","texto":"Como medidas específicas, según las Instrucciones de 8 de marzo de 2017 y el artículo 33 de la Orden, para el alumno con TDAH aplico un programa de refuerzo y un programa específico con la maestra de Pedagogía Terapéutica para mejorar la atención y la planificación. En el aula lo sitúo cerca de mí, fragmento las tareas, uso agendas visuales y le doy responsabilidades; en las pruebas, adapto el formato y amplío el tiempo. Para la alumna de compensatoria, un programa de refuerzo, una compañera tutora y una estrecha colaboración con la familia, porque, como señala González (2021), la escuela inclusiva convierte la diversidad en riqueza para todos.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"TDAH: refuerzo + PE · COM: refuerzo + tutora"},{"zona":"normativa","texto":"Instr. 08/03/2017 · González (2021)"}]},{"id":"p6b4","texto":"Estas medidas no son estáticas: atiendo a las diferencias individuales a lo largo de toda la puesta en práctica, porque cada unidad didáctica incluye actividades multinivel de refuerzo y profundización, y la evaluación continua me permite ajustarlas. Y establezco cauces de coordinación docente con los profesionales implicados: las reuniones del equipo docente, la coordinación periódica con las maestras de Pedagogía Terapéutica, de Audición y Lenguaje y de apoyo, el asesoramiento del equipo de orientación y las tutorías con las familias.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"Coordinación: PT · AL · apoyo · orientación · familias"}]}]},{"id":"p7","titulo":"Evaluación","rubrica":["Evaluación","Bibliografía"],"minutos":4.5,"esquema":["Art. 141 LOE · art. 11 D. 101/2023 · art. 9 Orden: características; referente = criterios","Evaluación inicial: UD 1, informes previos, sesión antes del 15 de octubre","Procedimientos, instrumentos (registro anecdótico, cotejo, escalas, porfolio, rúbricas) y evidencias","Autoevaluación y coevaluación; calificación: rúbrica 5 niveles → media CEv → CE → área","Medidas de diversidad: anexo VI, escala 1-5","Práctica docente y programación: indicadores, instrumentos, evidencias (Herrán y Paredes 2020)"],"bloques":[{"id":"p7b1","texto":"Paso al séptimo apartado: la evaluación. El artículo 141 de la Ley Orgánica de Educación y el artículo 11 del Decreto 101/2023 establecen que evaluaré tanto los aprendizajes del alumnado como los procesos de enseñanza y mi propia práctica docente. Según el artículo 9 de la Orden de 30 de mayo de 2023, la evaluación será continua, global, competencial, formativa, integradora, diferenciada y objetiva. El referente son los criterios de evaluación: su grado de superación indica el grado de consecución de cada competencia específica, y todos los criterios de una competencia tienen el mismo valor. Por eso, cada actividad de evaluación se alinea con un criterio concreto.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Referente: criterios de evaluación (mismo valor)"}]},{"id":"p7b2","texto":"En cuanto al procedimiento de evaluación inicial: durante las primeras semanas, en la unidad 1, «Somos un equipo», observo al alumnado en situaciones reales de lectura, escritura, resolución de problemas y trabajo en equipo, y reviso los informes del curso anterior y la información del tránsito. Antes del 15 de octubre, el equipo docente celebra la sesión de evaluación inicial, con carácter orientador, para adoptar las medidas de atención a la diversidad que cada alumno o alumna necesite.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Inicial: UD 1 · sesión antes del 15 de octubre"}]},{"id":"p7b3","texto":"Utilizo instrumentos adecuados, coherentes y variados, como indica el artículo 10 de la Orden. Los procedimientos son la observación sistemática, el análisis de tareas y producciones, las pruebas orales y escritas, la autoevaluación y la coevaluación. Los instrumentos, el registro anecdótico, las listas de cotejo, las escalas de observación, el porfolio y las rúbricas. Y las evidencias, las respuestas a preguntas, los desempeños, los procesos de planificación y los productos finales. Por ejemplo, el cartel de normas de colaboración de la unidad 1 se evalúa con una rúbrica del criterio 8.1.a de Conocimiento del Medio, y su exposición oral, con una escala de observación.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Observación · anecdotario · cotejo · porfolio · rúbricas"}]},{"id":"p7b4","texto":"En la autoevaluación, el alumnado reflexiona sobre cómo aprende con rúbricas sencillas, listas de cotejo y su porfolio; y en la coevaluación, por ejemplo, intercambia el cuaderno de dictado con un compañero para corregirlo. En cuanto a los criterios de calificación, cada criterio se califica con una rúbrica de cinco niveles: con dificultad, insuficiente, de 1 a 4; con ayuda, suficiente, 5; sin dificultades, bien, 6; con facilidad, notable, 7 u 8; y muestra dominio, sobresaliente, 9 o 10. La nota de cada competencia específica es la media de sus criterios, y la del área, la media de sus competencias específicas.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Auto y coevaluación · rúbrica 5 niveles → media"}]},{"id":"p7b5","texto":"Evalúo también las medidas generales y específicas de atención a la diversidad, siguiendo el anexo VI de la Orden de 30 de mayo de 2023: concreto la dificultad detectada, describo la medida aplicada y valoro su eficacia mediante la observación, en una escala del 1 al 5, de poco adecuada a excelente. Además, valoro las actividades de refuerzo y profundización y el trabajo cooperativo, y el propio alumnado se autoevalúa respecto a sus medidas. Si una medida no funciona, el equipo docente la revisa.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Medidas de diversidad: anexo VI · escala 1-5"}]},{"id":"p7b6","texto":"Por último, evalúo mi práctica docente y la programación, porque, como recuerdan Herrán y Paredes (2020), evaluar la enseñanza es la base para mejorarla. Los indicadores son, entre otros: la programación relaciona los elementos curriculares, la metodología es competencial, las actividades son multinivel, la organización del aula es adecuada y se fomentan la lectura y el aprendizaje cooperativo. Los instrumentos: listas de cotejo, una escala de autoobservación del 1 al 4, el anecdotario y el análisis del desarrollo en el aula. Y las evidencias: los resultados del alumnado, sus producciones y sus valoraciones. Lo hago al final de cada unidad y trimestre, e incorporo propuestas de mejora.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Práctica docente: indicadores · instrumentos · evidencias"},{"zona":"normativa","texto":"Herrán y Paredes (2020)"}]}]},{"id":"p8","titulo":"Conclusión","rubrica":["Conclusión","Expresión oral"],"minutos":1.5,"esquema":["Síntesis: currículo LOMLOE-Andalucía, cuatro áreas, 12 UD con SdA","Proyectos de diseño + APS; cooperativo, lectura, razonamiento","DUA y evaluación competencial del aprendizaje y de la práctica","Valoración personal: programar es acompañar (Palacios, Marchesi y Coll 2021)","Cierre: nadie aprende solo; aprendemos juntos"],"bloques":[{"id":"p8b1","texto":"Concluyo con una síntesis de los aspectos más relevantes de mi programación. «Aprendemos juntos» concreta el currículo de la LOMLOE y de Andalucía para tercero de Primaria en cuatro áreas y doce unidades didácticas, todas con su situación de aprendizaje, más tres proyectos de diseño y el aprendizaje-servicio «Opera prima». Su metodología se apoya en el aprendizaje cooperativo con perspectiva de género, la lectura diaria y el razonamiento matemático, y conecta con la cultura andaluza. Atiende a cada alumno y alumna desde el Diseño Universal para el Aprendizaje, y evalúa de forma competencial tanto el aprendizaje como mi propia práctica docente.","pizarra":[]},{"id":"p8b2","texto":"Como valoración personal, estoy convencida de que una buena programación evita la improvisación y orienta la enseñanza. Pero, sobre todo, de que, como señalan Palacios, Marchesi y Coll (2021), hay que partir de las capacidades y de los conocimientos previos de cada niño y de cada niña. Por eso, para mí, programar es acompañar: a mis veintidós alumnos y alumnas, a sus familias y al equipo docente. Termino con la idea que da nombre a mi programación y que guía mi trabajo como maestra: en el aula nadie aprende solo; aprendemos juntos. Muchas gracias por su atención.","pizarra":[{"zona":"centro","caja":"8. Conclusión","texto":"Nadie aprende solo: aprendemos juntos"},{"zona":"normativa","texto":"Palacios, Marchesi y Coll (2021)"}]}]}]},"uds":[],"fichas":[{"numero":1,"titulo":"Somos un equipo","trimestre":1,"fechas":"Del 10 al 27 de septiembre","dias":14,"centroInteres":"El trabajo en equipo.","relevanciaSocial":"Beneficios del trabajo cooperativo para desarrollar habilidades sociales, la empatía la resolución pacífica de conflictos. Decreto 101/2023.","ods":["ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Somos un equipo","producto":"Cartel para definir las normas de colaboración."},"proyecto":{"nombre":"¡Sí, chef!","producto":"Entrevista a un familiar para el recetario andaluz."},"aps":{"nombre":"Opera prima","producto":"Informe sobre la técnica de animación de Stop Motion." da en sociedad"}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"1","texto":"Descubrir propuestas artísticas de diferentes géneros, estilos, épocas."}],"criterios":[{"codigo":"1.1.a","texto":"identificar propuestas artísticas de diferentes géneros, estilos y culturas"}],"saberes":[{"codigo":"2.A.2","texto":"Recepción activa de propuestas artísticas."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho una conversación. La lengua oral y escrita. C.EV.1.3.a. (M) Leo un cuento. Los duendes y el zapatero. Antes de leer. Lee el título y observa la ilustración. Vocabulario. Comprendo la lectura. Piensa en otro final. (X) Capítulo del libro. Vocabulario. El abecedario. El diccionario. (J) Cuenta cuentos. Las adivinanzas. Inventa, crea y memoriza una adivinanza sobre una profesión. Competición por equipos. (V) Dramatizaciones. Textos tradicionales. Lee las estrofas de la canción tradicional la Tarara e inventa dos más. Leer y valorar.","MAT":"(L) Los números de tres cifras. Lectura de números. Escritura de números en cifras y en letras. (M) Problemas exprés. (X) Resolución de problemas. Contar hacia delante y hacia atrás. Contar más allá del número 999. Contar decenas y centenas. C.EV.1.1.a. (J) Identificar números con bloques base 10. Utiliza los bloques para representar los números. Identifica el valor de una cifra. Pasar de centenas a decenas y unidades. (V) Concurso de problemas. Por equipos, inventamos y resolvemos problemas.","CMN":"(J) Vídeo ¿Qué es el método científico? Realizamos un esquema con los pasos del método científico. (V) ¿Cómo podemos trabajar de forma cooperativa? División del grupo por equipos heterogéneos y asignación de roles. SdA. UD. Somos un equipo. Producto. Cartel para definir las normas de colaboración. C.EV. 1.1.a.","EAR":"(V) Los materiales de plástica. Crea a tu manera, las letras tridimensionales. C.EV.1.1.a"},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. La letra, la sílaba, la palabra y la oración. (M) Leo un cuento tradicional. C.EV.7.1.a. Preparamos un listado de los cuentos tradicionales. C.EV.5.1.a. (X) Capítulo del libro. Escribo un cuento siguiendo los pasos. (J) Cuenta cuentos. Clases de palabras según el número de sílabas. (V) Dramatizaciones de cuentos. Elaboración de un esquema sobre las clases de palabras. Jugar a palabras encadenadas.","MAT":"(L) Los números de cuatro cifras. El número mil. Lectura de números de cuatro cifras. Conteo de centenas. (M) Problemas exprés. (X) Resolución de problemas. Series de 10 en 10, de 100 en 100, de 1000 en 1000. Equivalencia entre unidades de millar, centenas, decenas y unidades. (J) Identificar números con bloques base 10. Identifica el valor de una cifra. Pasar de centenas a decenas y unidades. (V) Concurso de problemas. Cálculo mental. Sumar una cifra sin llevadas. C.EV.6.2.a.","CMN":"(J) ¿Conoces algún científico o científica? Explica a la clase quien es y lo que hace. Haz un dibujo de cómo te lo imaginas (V) SdA. UD. Somos un equipo. Producto. Cartel para definir las normas de colaboración. Escribe las normas, corrige, revisa y haz los cambios necesarios. C.EV.1.1.a.","EAR":"(V) Pintores importantes de Andalucía. Velázquez. Vídeo. Biografía. Obra las meninas."},{"numero":3,"fase":"aplicar – concluir","LCL":"Leo una noticia. Vocabulario. La oración. Escribo oraciones. (M) Leo un poema. Clases de sílabas: tónicas y átonas. (X) Capítulo del libro. C.EV.4.1.a. Tipos de palabras según la posición de la sílaba tónica. Encuentra la sílaba tónica. El alumnado cuenta qué ha desayunado e indica la sílaba tónica de los alimentos. C.EV. 6.1.a. (J) Cuenta cuentos. Cuenta las sílabas y rodea la tónica. La tilde. (V) Dramatizaciones de cuentos. Dictado. Leo y escribo el texto. Intercambio de cuadernos para corregir.","MAT":"(L) Comparo números. Ordenar de menor a mayor y de mayor a menor. (M) Problemas exprés. C.EV.5.1.a. (X) Resolución de problemas. Re ura. Escribimos los pasos para hacer una exposición oral y exponer al grupo. (J) Cuenta cuentos. Vocabulario. Debate sobre cómo se podría acabar con el hambre en el mundo. Las siglas. Los puntos suspensivos. (V) Exposiciones orales. C.EV.2.1.a.","MAT":"(L) Sumar por descomposición. Suma de números de tres cifras con y sin llevadas. Utiliza los bloques para calcular. C.EV.4.2.a. (M) Problemas exprés. (X) Resolución de problemas. Sumo en vertical. Colocación de sumandos. Propiedades de la suma. Inventa una suma y resuélvela. (J) Propiedad conmutativa. Suma de tres sumandos. Coloca los sumandos y suma. (V) Concurso de problemas. Inventamos y resolvemos problemas. C.EV.2.1.a.","CMN":"(J) Lluvia de ideas sobre las plantas. Clasificamos seres vivos según sus características. Realizamos un esquema de las funciones vitales de los seres vivos. (V) SdA. UD. SdA. UD. Guía de las plantas que nos rodean. Elabora una ficha con cada planta que has recogido de tu barrio. Dibuja la planta, escribe las partes y describela. ¿Qué tipo de planta es? ¿Qué nos aporta? C.Ev.6.1.a.","EAR":"(V) Video. Crea a tu manera. Los dibujos esquemáticos."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Exposiciones orales. (M) Leo un cuento actual. Cambia el final del cuento. C.EV.8.3.a. Los cuentos en la actualidad. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribimos los pasos para hacer una exposición oral y exponer al grupo C.EV.5.1.a. (J) Cuenta cuentos. Las palabras derivadas. Los sufijos. (V) Dramatizaciones de cuentos. Los prefijos in- y des-. Busca palabras con prefijos y escribe una oración.","MAT":"(L) Las propiedades de la suma. La propiedad conmutativa y asociativa. Realiza las sumas. (M) Problemas exprés. (X) Resolución de problemas. Restas por descomposición. Resta sin llevadas y con llevadas. Utiliza los bloques para calcular. (J) Resto en vertical. Términos de la resta. Restas con y sin llevadas. Colocar la resta en forma vertical. Propiedad del minuendo. (V) Concurso de problemas. Cálculo mental. Sumar una cifra sin llevadas. C.EV.6.2.a","CMN":"(J) ¿Cómo son las plantas? Dibuja en tu cuaderno una planta con flor, escribe y aprende sus partes. (V) SdA. UD. Guía de las plantas que nos rodean. Elaboramos fichas de alimentos que obtengamos de las plantas, hacemos el dibujo, ¿Qué parte de la planta utilizamos? ¿Qué nos aporta? Hacemos la guí de las planta. C.Ev 5.1.a.","EAR":"(V) Velázquez. Audioguía de las meninas. Láminas para colorear, componer. C.EV.2.1.a."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Los párrafos. (M) Leo un texto. La mayúscula. Tipos de punto. Coloca la mayúscula en el texto. (X) Capítulo del libro. C.EV.4.1.a. En grupos, redacta un cuento actual. (J) Leo mi cuento. Elaboración de un esquema sobre las palabras derivadas. (V) Leo el texto. Dictado en parejas. Cada niño dictará un párrafo del texto. La otra persona deberá escribirlo. Intercambio de cuadernos para corregir.","MAT":"(L) Prueba de la resta. Relación suma y resta. C.EV.5.2.a. Calcula y comprueba las restas. (M) Problemas exprés. (X) Resolución de problemas. Las monedas y los billetes. Uso del dinero. Equivalencia de monedas y billetes de una cantidad. (J) ¡El precio justo! Organizad un mercadillo en clase con objetos que ya no uses. ¡Somos compradores y vendedores! (V) Concurso de problemas. Pienso paso a paso. Ordena las instrucciones de comprar una barra de pan. C.EV.8.1.a.","CMN":"(J) Investiga y explica la diferencia entre fotosíntesis y respiración. Realiza un esquema sobre la reproducción de las plantas. Estudia el esquema. (V) SdA. Proyecto. ¡Si chef! Producto. Presentación de una receta. Recetario andaluz. C.Ev. 2.2.a.","EAR":"APS. Opera prima Producto. Guión para el corto de animación. Resolución de conflictos."}],"complementaria":"SdA 16 de octubre. Día Mundial de la alimentación. Recogida de alimentos ONG.","refuerzoProfundizacion":"Actividades multinivel siguiendo mos? C.EV.1.2.a. (V) SdA. UD. Cartel de una pirámide de hábitos de salud.","EAR":"(V) Dibujo de la figura humana para representar el esquema corporal C.EV.2.B.1."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Contamos anécdotas. Por equipos elegimos la mejor. (M) Leo un texto. El nombre. Las clases de nombres. Esquema. (X) Capítulo del libro. C.EV.4.1.a. Vocabulario. Taller de escritura. Escribo un relato según su estructura. Redactar teniendo en cuenta: comienzo, nudo y desenlace. C.EV.5.1.a. (J) Cuenta cuentos. Vocabulario. El género y número de los nombres. Copio y completo un esquema del nombre. (V) Dramatizaciones. Cuento un chiste con entonación y lenguaje corporal. Por equipos, concurso de chistes. C.EV.2.1.a.","MAT":"(L) Propiedad conmutativa. Construir la tabla del 7. Contamos de siete en siete. Calcular productos por 7. C.EV.4.2.a. (M) Problemas exprés. (X) Resolución de problemas. Calcular productos. Memorizar las tablas de multiplicar jugando con las regletas. (J) Multiplico por 10,100 y 1000. Calcular e identificar productos por 10,100 y 100. Calcula y completa la serie. (V) Concurso de problemas. Cálculo mental. Resta de una cifra con llevadas. C.EV.8.2.a.","CMN":"(J) ¿Qué aparatos del cuerpo humano expulsan sustancias de desecho al exterior? Explica las funciones vitales. Dibuja en el cuaderno nuestros aparatos para realizar la función de nutrición y muéstralo a los compañeros. C.Ev. 4.1.a. (V) SdA. UD. Cartel de una pirámide de hábitos de salud.","EAR":"(V) Velázquez. Las meninas. Con una plantilla, coloreamos el cuadro a nuestro gusto."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Contamos anécdotas. Por equipos, seleccionamos la más divertida. Elegimos la ganadora. (M) Leo un texto. Estudio y practico el esquema del nombre. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un relato según su estructura. Revisar y hacer un dibujo. C.EV.8.2.a. (J) Cuenta cuentos. Vocabulario. Los signos de interrogación y exclamación. Crea oraciones. (V) Dramatizaciones. Dictado. Repasamos ortografía. Lee, escucha y escribe. Revisa la ortografía. Intercambia el cuaderno para corregir. C.EV. 9.2.a.","MAT":"(L) Multiplico de diferentes formas. Contamos, sumamos y descomponemos. Resuelve las multiplicaciones. Uso de regletas. C.EV.5.2.a. (M) Problemas exprés. (X) Resolución de problemas. Multiplico en vertical. La multiplicación sin llevadas. Copia, calcula y resuelve las multiplicaciones. (J) La multiplicación con llevadas. Copia y resuelve sin olvidar las que te llevas. Uso de regletas. (V) Concurso de problemas. Concurso de tablas de multiplicar. C.EV.8.2.a.","CMN":"(J) ¿Qué son los sentidos? Dibuja en tu cuaderno un diagrama para representar la función de relación. Leemos y comentamos un texto sobre las etapas de la vida. C.Ev. 4.1.a. (V) SdA. Proyecto ¡Si chef! Producto. Refranes, canciones o dibujos. Recetario andaluz. C.Ev.1.2.a.","EAR":"PLA APS. Opera prima Producto. Cómic para el corto de animación. Resolución de conflictos"}],"complementaria":"16 de noviembre. Día del Flamenco. Visita de una bailaora flamenca: presentación y coreografía de pasos y ritmos flamencos.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos."},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de impli  seres vivos? Escribe una cadena alimentaria con tres animales. ¿Por qué son importantes las rocas en un ecosistema? (V) SdA. UD. Mural con medidas para proteger el planeta.","EAR":"(V) Dibujo de la simetría de los copos de nieve"},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Describir lugares y objetos. Realizar descripciones orales de diferentes lugares del colegio. C.EV.7.1.a. (M) Leo una Descripción. Elige una imagen y describe el paisaje en tu cuaderno. Lee a los compañeros. (X) Capítulo del libro. Taller de escritura. ¡Qué bonita es Andalucía! Describe tu paisaje preferido. C.EV.5.1.a. (J) Cuenta cuentos. Describo personajes principales y secundarias. (V) Dramatizaciones. Jugar al “veo, veo” haciendo descripciones de objetos. C.EV.2.1.a.","MAT":"(L) Descomponer números para dividir. En grupo resolver divisiones con bloques base 10. C.EV.6.2.a. Resolvemos divisiones descomponiendo. Uso de regletas. (M) Problemas exprés. (X) Resolución de problemas. Video. Calcular divisiones en caja. Repartir decenas y unidades. Divisiones con cero en el cociente. J) Practicamos la división. Propiedad del resto. (V) Concurso de problemas. Inventamos problemas a partir de una división. Cálculo mental de sumas con llevadas. C.EV.3.2.a.","CMN":"(J) ¿Cómo son los ecosistemas andaluces? Busca fotografías y dibuja un ecosistema de Andalucía que hayas visitado y escribe una pequeña descripción de los animales o plantas que viste. C.Ev.5.2.a. (V) 6 de diciembre. Día de la Constitución. SdA. UD. Mural con medidas para proteger el planeta.","EAR":"(V) Velázquez. Las meninas. Mural con los dibujos del grupo. C.Ev.4.2.a."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) 16 de diciembre. Día de la lectura en Andalucía. Lectura sobre curiosidades de Andalucía. (M) Leo una ficha de personajes de un libro. El adjetivo. Escribe los adjetivos del texto. Esquema del adjetivo. (X) Capítulo del libro. Taller de escritura. ¡Qué bonita es Andalucía! Describe tu paisaje preferido. Lectura al grupo. C.EV.10.2.a. (J) Cuenta cuentos. Palabras con h. (V) Dramatizaciones. Jugar al “veo, veo” haciendo descripciones de objetos. Dictado. C.EV.9.1.a.","MAT":"(L) División errónea. Propiedad del resto. Prueba de la división. (M) Problemas exprés. (X) Resolución de problemas. En grupos, inventa problemas de divisiones. Repasa las tablas de multiplicar. Calcula divisiones aplicando la prueba. Expresa emociones. C.EV.7.1.a. (J) Calcula divisiones aplicando la prueba. (V) Concurso de problemas. Pienso paso a paso. Partes de un problema para preparar el desayuno. C.Ev 4.1.a.","CMN":"(J) ¿Qué daños estamos provocando a los ecosistemas y cómo podemos protegerlos? En grupos escribimos consejos para llevar un estilo de vida sostenible. Exponemos. C.Ev.6.1.a. (V) SdA. Proyecto ¡Si chef! Producto. Elaboración y degustación en el aula. Recetario andaluz. C.Ev. 3.1.a.","EAR":"APS. Opera prima Producto. Escenario para el corto Resolución de conflictos"}],"complementaria":"6 de diciembre. Día de la Constitución. Visionado de un vídeo sobre la Constitución Española para niños. https://www.youtube.com/watch?v=ofMR4HhaqBQ 16 de diciembre. Día de la lectura en Andalucía. Lectura sobre curiosidades de Andalucía.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples for
