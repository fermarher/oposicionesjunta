<script>
window.OPOS_DATOS = {"generado":"2026-10-06T11:30:31.120Z","programacion":{"id":"programacion","titulo":"Defensa de la programación didáctica «Aprendemos juntos»","objetivoMinutos":28.5,"secciones":[{"id":"p1","titulo":"Introducción y justificación","rubrica":["Introducción y justificación","Bibliografía"],"minutos":1.8,"esquema":["Saludo: «Aprendemos juntos», tercero, Mijas Costa, cuatro áreas","12 UD, cada una con su SdA + 3 proyectos de diseño + APS","Índice de 8 apartados (escrito al empezar)","Normativa: art. 91 LOE · art. 3 Orden 30/05/2023","Curricular: Coll (2013) + Cabrerizo, Rubio y Castillo (2014) · perfil competencial del ciclo","Epistemológica, autor → práctica: Piaget manipulativo · Vygotsky tutoría · Ausubel previos · Bruner investigaciones","Control de tiempo: terminar hacia el minuto 2"],"bloques":[{"id":"p1b1","texto":"Buenos días, señoras y señores miembros del tribunal. Defiendo mi programación didáctica «Aprendemos juntos», para tercero de Primaria. Es una programación interdisciplinar de cuatro áreas: Lengua Castellana y Literatura, Matemáticas, Conocimiento del Medio y Educación Artística. Tiene doce unidades didácticas, y cada una contiene su situación de aprendizaje; además, tres proyectos de diseño y un aprendizaje-servicio anual. Mi exposición tiene ocho apartados: introducción; contexto; normativa y concreción curricular; metodología; organización y temporalización; diversidad; evaluación; y conclusión.","pizarra":[{"zona":"cabecera","texto":"«Aprendemos juntos» · 3.º EP · LCL · MAT · CMN · EAR"},{"zona":"indice","texto":"1. Introducción y justificación"},{"zona":"indice","texto":"2. Contextualización y adecuación"},{"zona":"indice","texto":"3. Normativa y concreción curricular"},{"zona":"indice","texto":"4. Principios y metodología"},{"zona":"indice","texto":"5. Organización, recursos y temporalización"},{"zona":"indice","texto":"6. Atención a la diversidad"},{"zona":"indice","texto":"7. Evaluación"},{"zona":"indice","texto":"8. Conclusión"}]},{"id":"p1b2","texto":"La justifico, primero, normativamente: según el artículo 91 de la Ley Orgánica 2/2006, programar es la primera función docente; y el artículo 3 de la Orden de 30 de mayo de 2023 exige situaciones de aprendizaje que integren las áreas. Segundo, curricularmente: Coll (2013) distingue tres niveles de concreción, y mi programación y sus unidades ocupan el segundo y el tercero; Cabrerizo, Rubio y Castillo (2014) añaden un cuarto, la atención a la diversidad.","pizarra":[{"zona":"centro","caja":"1. Justificación","texto":"Normativa · curricular · constructivista (Piaget, Vygotsky, Ausubel, Bruner)"},{"zona":"normativa","texto":"Coll (2013) · Cabrerizo et al. (2014)"}]},{"id":"p1b3","texto":"Y tercero, epistemológicamente, desde el constructivismo: con Piaget e Inhelder (2022), uso material manipulativo, propio de las operaciones concretas; con Vygotsky (2020), la tutoría entre iguales aprovecha la zona de desarrollo próximo; con Ausubel (2009), cada unidad empieza activando los conocimientos previos; y con Bruner (2018), propongo pequeñas investigaciones guiadas. Es relevante para este grupo porque tercero abre el segundo ciclo, el momento de consolidar la lectura comprensiva y el razonamiento matemático. De ahí su título: «Aprendemos juntos».","pizarra":[]}]},{"id":"p2","titulo":"Contextualización y adecuación","rubrica":["Contextualización y adecuación"],"minutos":2.1,"esquema":["Centro: CEIP bilingüe de Mijas Costa (40 000 hab.), tres líneas","Planes (Antúnez e Imbernón 2010): Paz, Igualdad, Actuación Digital, CIMA (vida saludable, ALDEA, STEAM)","Tercero: 22 alumnos de 8-9 años, operaciones concretas","Psicoevolutivo: físico-motriz · cognitivo · lingüístico · afectivo-social · moral → manipulativo, cooperativo, movimiento-calma","Instr. 08/03/2017: 2 NEAE (DIA derivadas de TDAH · compensación educativa) + 2 con programa de refuerzo","Horario: LCL 5,5 h · MAT 5,5 h · CMN 2,5 h · EAR (Plástica) 1 h · clases 10/9-23/6 (178 días)","Control de tiempo: el apartado 3 empieza hacia el minuto 4"],"bloques":[{"id":"p2b1","texto":"Paso al segundo apartado: contextualización y adecuación. El centro es un colegio público bilingüe de Infantil y Primaria de Mijas Costa, una zona turística y comercial de unos cuarenta mil habitantes, con tres líneas por nivel. Siguiendo a Antúnez e Imbernón (2010), parto del Proyecto Educativo y vinculo la programación con sus planes y programas: Cultura de Paz, Igualdad, Actuación Digital y los programas CIMA de vida saludable, ALDEA y STEAM.","pizarra":[{"zona":"centro","caja":"2. Contexto","texto":"CEIP bilingüe · Mijas Costa · 3 líneas"}]},{"id":"p2b2","texto":"El grupo tiene veintidós alumnos y alumnas de ocho y nueve años, en las operaciones concretas de Piaget. En lo físico-motriz, tienen mucha energía y precisión en los juegos; en lo cognitivo, razonan sobre hechos concretos y combinan operaciones; en lo lingüístico, amplían su vocabulario y usan oraciones más complejas; en lo afectivo-social, necesitan sentirse queridos y disfrutan en grupo; y en lo moral, interiorizan mejor las normas y los valores. Por eso mi programación es manipulativa y cooperativa y alterna el movimiento con la calma.","pizarra":[{"zona":"centro","caja":"2. Contexto","texto":"8-9 años: motriz · cognitivo · lingüístico · afectivo · moral"}]},{"id":"p2b3","texto":"Entre sus características particulares, según las Instrucciones de 8 de marzo de 2017, hay dos alumnos con necesidades específicas de apoyo educativo: un alumno con dificultades de aprendizaje derivadas de TDAH y una alumna de compensación educativa. Además, otros dos alumnos con dificultades en Lengua y Matemáticas siguen un programa de refuerzo.","pizarra":[{"zona":"centro","caja":"2. Contexto","texto":"22 alumnos · 2 NEAE (DIA-TDAH, COM) · 2 con refuerzo"}]},{"id":"p2b4","texto":"La programación concreta y precisa sus áreas con su horario semanal: cinco horas y media de Lengua, cinco y media de Matemáticas, dos y media de Conocimiento del Medio y una de Educación Artística, en su parte de Plástica. Y se ajusta al calendario real: las unidades van del 10 de septiembre al 20 de junio, y los últimos días, hasta el 23, son de evaluación final.","pizarra":[{"zona":"centro","caja":"2. Contexto","texto":"Horas: LCL 5,5 · MAT 5,5 · CMN 2,5 · EAR 1"}]}]},{"id":"p3","titulo":"Normativa y concreción curricular","rubrica":["Marco normativo y concreción curricular","Bibliografía"],"minutos":4.4,"esquema":["Nacional: LOE-LOMLOE (LO 3/2020), RD 157/2022 · Autonómico: LEA, D. 101/2023, Orden 30/05/2023, D. 328/2010 + Instrucciones 21/06/2023, 18/06/2024, 08/03/2017","Cadena (Escamilla 2018): objetivos → competencias clave → descriptores → 31 competencias específicas → 70 criterios → saberes (tablas 3, 4 y 5)","LCL 10: diversidad · comprensión oral · expresión oral · lectura · escritura · información · lectura autónoma · literatura · reflexión · uso ético","MAT 8: interpretar · resolver · plantear · computacional · conexiones · comunicar · emociones · equipo","CMN 9: digital · ciencia · diseño · cuerpo · medio · intervención humana · tiempo · igualdad · democracia · EAR 4: descubrir · investigar · expresar · participar","Cadenas: LCL 4 (CCL 2-3-5, CP 2, STEM 1, CD 1, CPSAA 4) → 4.1.a · MAT 2 (STEM 1-2, CPSAA 4-5, CE 3) → 2.1.a","CMN 3 (STEM 3-4, CD 5, CPSAA 3-4-5, CE 1-3, CCEC 4) → 3.1.a, UD 5 · EAR 3 (CCL 1, CD 2, CPSAA 5, CC 2, CE 1, CCEC 3-4) → 3.1.a, UD 8","SdA (art. 7 D. 101/2023, INTEF 2023): 12 UD + 3 proyectos (ODS 2, 15, 4) + APS (ODS 16) · Control: el apartado 4 empieza hacia el minuto 8"],"bloques":[{"id":"p3b1","texto":"Paso al tercer apartado: normativa y concreción curricular. En el ámbito nacional, el marco vigente es la Ley Orgánica 2/2006, de Educación, modificada por la Ley Orgánica 3/2020, y el Real Decreto 157/2022. En el autonómico, la Ley 17/2007, de Educación de Andalucía; el Decreto 101/2023; la Orden de 30 de mayo de 2023, que lo desarrolla; y el Decreto 328/2010, Reglamento Orgánico de los centros. Y las Instrucciones de 21 de junio de 2023, sobre la lectura; de 18 de junio de 2024, sobre el razonamiento matemático; y de 8 de marzo de 2017, sobre el alumnado con necesidades específicas.","pizarra":[{"zona":"normativa","texto":"LOE-LOMLOE · RD 157/22 · LEA 17/07"},{"zona":"normativa","texto":"D. 101/23 · O. 30/05/23 · D. 328/10"},{"zona":"normativa","texto":"Instr. lectura 2023 · razonamiento 2024 · NEAE 2017"}]},{"id":"p3b2","texto":"Siguiendo a Escamilla (2018), concreto el currículo como una cadena. Los objetivos de etapa, del artículo 5 del Decreto 101/2023, se vinculan con el perfil competencial. Las competencias clave se concretan en descriptores operativos; de ellos parten las competencias específicas, que se evalúan con criterios de evaluación y se trabajan con saberes básicos. En total, treinta y una competencias específicas y setenta criterios, recogidos en mis tablas 3, 4 y 5.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"Obj. → comp. clave → DO → 31 CEsp → 70 CEv → saberes"},{"zona":"normativa","texto":"Escamilla (2018) · INTEF (2023)"}]},{"id":"p3b3","texto":"Concreto todas las competencias específicas. Lengua, diez: 1, diversidad lingüística; 2, comprensión oral; 3, expresión oral; 4, comprensión lectora; 5, escritura; 6, búsqueda de información; 7, lectura autónoma; 8, educación literaria; 9, reflexión sobre la lengua; y 10, uso ético del lenguaje. Matemáticas, ocho: 1, interpretar situaciones cotidianas; 2, resolver problemas; 3, plantear problemas; 4, pensamiento computacional; 5, conexiones matemáticas; 6, comunicar y representar; 7, gestión emocional; y 8, trabajo en equipo.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"CEsp: LCL 10 · MAT 8 · CMN 9 · EAR 4"}]},{"id":"p3b4","texto":"Conocimiento del Medio, nueve: 1, recursos digitales; 2, indagación científica; 3, proyectos de diseño; 4, cuerpo y salud; 5, medio natural, social y cultural; 6, intervención humana en el entorno; 7, cambios en el tiempo; 8, igualdad y diversidad cultural; y 9, valores democráticos. Y Educación Artística, cuatro: 1, descubrir; 2, investigar; 3, expresar; y 4, participar en producciones colectivas. Cada una, con sus descriptores, criterios y saberes.","pizarra":[]},{"id":"p3b5","texto":"Y una cadena completa por área. Lengua 4, comprensión lectora: descriptores de comunicación lingüística 2, 3 y 5, plurilingüe 2, STEM 1, digital 1 y aprender a aprender 4; criterio 4.1.a, leer identificando el sentido global; y saber, las estrategias antes, durante y después de la lectura. Matemáticas 2, resolver problemas: descriptores STEM 1 y 2, aprender a aprender 4 y 5 y emprendedora 3; criterio 2.1.a, emplear estrategias de forma pautada; y saber, las fases de resolución de un problema.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"LCL4 → CCL2-3-5, CP2, STEM1, CD1, CPSAA4 → 4.1.a"},{"zona":"centro","caja":"3. Concreción curricular","texto":"MAT2 → STEM1-2, CPSAA4-5, CE3 → 2.1.a"}]},{"id":"p3b6","texto":"Conocimiento del Medio 3, proyectos de diseño: STEM 3 y 4, digital 5, aprender a aprender 3, 4 y 5, emprendedora 1 y 3 y cultural 4; criterio 3.1.a, diseñar en equipo un producto final; y saber, las fases de los proyectos de diseño, que aplicamos en el recetario de la unidad 5. Y Educación Artística 3, expresar: comunicación lingüística 1, digital 2, aprender a aprender 5, ciudadana 2, emprendedora 1 y cultural 3 y 4; criterio 3.1.a, producir obras propias con la imagen y los medios digitales; y saber, las técnicas de animación, con las fotografías del corto de «Ópera prima» en la unidad 8.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"CMN3 → STEM3-4, CD5, CPSAA3-4-5, CE1-3, CCEC4 → 3.1.a"},{"zona":"centro","caja":"3. Concreción curricular","texto":"EAR3 → CCL1, CD2, CPSAA5, CC2, CE1, CCEC3-4 → 3.1.a"}]},{"id":"p3b7","texto":"Todo se integra en situaciones de aprendizaje, que, según el artículo 7 del Decreto 101/2023, movilizan las competencias específicas. Siguiendo al INTEF (2023), las organizo en tres niveles: las doce unidades, cada una con su situación de aprendizaje; un proyecto de diseño por trimestre, ligado a los ODS 2, 15 y 4: «¡Sí, chef!», «¿Buceamos?» y «Huellas del pasado»; y el aprendizaje-servicio anual «Ópera prima», ligado al ODS 16.","pizarra":[{"zona":"centro","caja":"3. Concreción curricular","texto":"SdA: 12 UD + 3 proyectos de diseño + APS"}]}]},{"id":"p4","titulo":"Principios y metodología","rubrica":["Aspectos metodológicos y principios pedagógicos","Bibliografía"],"minutos":6.3,"esquema":["Principios: art. 6 D. 101/2023 (lectura, DUA, TIC, emociones: Bisquerra 2015) · orientaciones de las Instrucciones","Lectura: Instr. 21/06/2023, 30' a las 9:00 · Razonamiento: Instr. 18/06/2024, M-X-V, pasos heurísticos","Por área: LCL comunicativo (Cassany 2019) · MAT computacional (mochila, UD 1) · CMN indagación + proyectos de diseño (bloque B, CIMA STEAM) · EAR proceso creativo","Métodos y estrategias (Cooper y Murphy 2024) + «Veo, pienso, me pregunto»; Baena (2019): 3 semanas = 3 fases","a) Implicación (Bueno) · b) 1-2-4, lápices al centro, folio giratorio (Pujolás y Lago) + roles y género (CMN 8.1.a)","c) Todas las CEsp y CEv: LCL 5.1.a en las 12 UD · d) Andalucía (art. 5 D. 101/2023)","e) Holístico (Zabala): UD 2 en las cuatro áreas + APS · f) Diversidad (art. 27)","g), h), i) → apartado 5 · Control de tiempo: termina hacia el minuto 15"],"bloques":[{"id":"p4b1","texto":"Paso al cuarto apartado, el corazón de mi programación: principios y metodología. Parto de los principios pedagógicos del artículo 6 del Decreto 101/2023. Destaco cuatro: la lectura como eje de todas las áreas, el Diseño Universal para el Aprendizaje, la integración de las tecnologías y la educación emocional, siguiendo a Bisquerra, Pérez y García (2015). Y aplico las orientaciones metodológicas de las Instrucciones de lectura y de razonamiento matemático: ir de lo concreto y cercano, el modelado de la maestra y la combinación de gran grupo, pequeño grupo y trabajo individual.","pizarra":[]},{"id":"p4b2","texto":"La primera medida que exige la normativa es el fomento de la lectura. Siguiendo las Instrucciones de 21 de junio de 2023, dedicamos al menos treinta minutos diarios a leer: la primera media hora de cada mañana. Trabajamos los momentos antes, durante y después de leer, con un mediador de lecturas y diccionarios personales.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"Lectura 30' diarios · razonamiento 3 × 30'"}]},{"id":"p4b3","texto":"La segunda, el fomento del razonamiento matemático. Las Instrucciones de 18 de junio de 2024 hacen de la resolución de problemas la columna vertebral del área, con tres sesiones semanales de al menos treinta minutos: en mi horario, martes, miércoles y viernes. Seguimos siempre los mismos pasos heurísticos: comprender, subrayar con colores los datos y la pregunta, aplicar una estrategia, comprobar y reflexionar juntos.","pizarra":[]},{"id":"p4b4","texto":"Y cada área tiene su enfoque. En Lengua, el comunicativo: como plantean Cassany, Luna y Sanz (2019), la lengua se aprende usándola con sentido. En Matemáticas, además, el pensamiento computacional: en la unidad 1 pensamos paso a paso cómo preparar la mochila. En Conocimiento del Medio, la indagación científica y los proyectos de diseño del bloque B, dentro del programa CIMA STEAM. Y en Educación Artística, el proceso creativo, de la recepción y el análisis a la creación.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"Por área: comunicativo · computacional · indagación · creativo"}]},{"id":"p4b5","texto":"Combino tres métodos: el expositivo para explicar, el demostrativo para modelar y el investigativo guiado. Y estrategias motivantes e innovadoras: el aprendizaje basado en problemas; el basado en proyectos, que, según Cooper y Murphy (2024), da sentido a lo aprendido con un producto real; el cooperativo; el aprendizaje-servicio; y las rutinas de pensamiento, como «Veo, pienso, me pregunto». Todo se organiza con el aprendizaje experiencial de Baena (2019): cada unidad dura unas tres semanas, y cada semana es una fase: motivar y activar, explorar y estructurar, y aplicar y concluir.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"Problemas · proyectos · cooperativo · APS · rutinas · Baena: 3 fases"},{"zona":"normativa","texto":"Bisquerra (2015) · Cassany (2019) · Cooper y Murphy (2024)"}]},{"id":"p4b6","texto":"Explico ahora qué permiten estas estrategias. Primero, propician la implicación, la participación y el interés: como explica Bueno (2019), la emoción y la curiosidad activan el aprendizaje; por eso cada unidad parte de una pregunta cercana, como «¿Cómo llego a un lugar?», y termina en un producto real, como el plano del barrio. Segundo, combinan el trabajo individual, el cooperativo y el aprendizaje entre iguales, con técnicas del programa de Pujolás y Lago (2023): en el 1-2-4, cada alumno piensa solo, lo contrasta con su pareja y el equipo de cuatro consensúa una respuesta; y también usamos lápices al centro y el folio giratorio.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"a) Implicación · b) 1-2-4, lápices al centro + género"},{"zona":"normativa","texto":"Baena (2019) · Bueno (2019) · Pujolás y Lago (2023)"}]},{"id":"p4b7","texto":"Y todo ello con perspectiva de género. Los equipos son heterogéneos y los roles rotan, coordinador, secretario, portavoz y responsable del material, para que niñas y niños los asuman por igual, sin estereotipos. Además, aplico el Plan de Igualdad del centro con un lenguaje inclusivo; presento referentes femeninos, como cuando en la unidad 1 preguntamos «¿Conoces algún científico o científica?»; y evalúo la igualdad con el criterio 8.1.a de Conocimiento del Medio en las unidades 1 y 9.","pizarra":[]},{"id":"p4b8","texto":"Tercero, sirven para el desarrollo de todas las competencias específicas y de sus criterios de evaluación. Lo garantizo con una tabla de secuenciación de criterios por unidades, donde los básicos se repiten. Por ejemplo, el criterio 5.1.a de Lengua, producir textos escritos, se evalúa en las doce unidades, y el 4.1.a, leer, en diez. Cuarto, fomentan conexiones con las prácticas sociales y culturales de Andalucía, como pide el artículo 5 del Decreto 101/2023: el Día del Flamenco con una bailaora, el desayuno andaluz del 28 de febrero y «La Tarara», con la modalidad lingüística andaluza.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"c) Todas las CEsp y CEv · d) Andalucía"}]},{"id":"p4b9","texto":"Quinto, proporcionan un enfoque integrador, interdisciplinar y holístico. Como defiende Zabala (2012), un enfoque globalizador acerca la escuela a la vida. Por ejemplo, en la unidad 2, en Conocimiento del Medio elaboramos una guía de las plantas del barrio; en Lengua, una exposición oral; en Matemáticas, un mercadillo con monedas y billetes; y en Educación Artística descubrimos «Las meninas» de Velázquez. A la vez escribimos el guion de «Ópera prima». Responde a una necesidad real del centro, la convivencia, dentro del Plan de Cultura de Paz: el alumnado crea un corto en stop motion sobre cómo resolver conflictos y lo ofrece a toda la comunidad educativa en el festival de cine de fin de curso.","pizarra":[{"zona":"normativa","texto":"Zabala (2012)"}]},{"id":"p4b10","texto":"Sexto, contemplan medidas generales y específicas de atención a la diversidad: el cooperativo y la tutoría entre iguales son medidas generales del artículo 27 de la Orden, y cada unidad incluye actividades multinivel, que detallo en el sexto apartado. La coordinación, la tutoría y los recursos, en el quinto.","pizarra":[{"zona":"centro","caja":"4. Metodología","texto":"e) Holístico + APS · f) Diversidad"}]}]},{"id":"p5","titulo":"Organización, recursos y temporalización","rubrica":["Aspectos metodológicos y principios pedagógicos"],"minutos":4.8,"esquema":["Tiempo: D. 301/2009 (178 días) y anexo I Orden 30/05/2023 (25 h); agrupamientos flexibles","g) Coordinación: art. 78 D. 328/2010 y O. 20/08/2010, horizontal y vertical + Inglés (vocabulario de cada UD)","h) Tutoría: 4 líneas + cartel de normas y roles (UD 1) + familias · i) Recursos (Trujillo 2014)","Complementarias (Tabla 7): UD 2 recogida de alimentos ↔ «¡Sí, chef!» · UD 7 marcha por la paz · UD 11 Pompidou → maqueta UD 12","Extraescolares (O. 17/04/2017): apoyo educativo (lectura, razonamiento) · artísticas (stop motion)","T1: UD 1 10-27/9 · 2 →18/10 · 3 →8/11 · 4 →29/11 · 5 →20/12 · T2: UD 6 7-24/1 · 7 →14/2 · 8 →14/3 · 9 →4/4","T3: UD 10 7/4-7/5 · 11 →30/5 · 12 →20/6 · cada UD: SdA + proyecto + APS","Pizarra: si falta sitio, borrar las cajas 1 y 2 del centro · Control: el apartado 6 empieza hacia el minuto 19,5"],"bloques":[{"id":"p5b1","texto":"Paso al quinto apartado: organización, recursos y temporalización. En cuanto al tiempo, el Decreto 301/2009 fija el calendario, con ciento setenta y ocho días lectivos, y el anexo uno de la Orden de 30 de mayo de 2023, el horario: veinticinco horas semanales. Los agrupamientos son flexibles: gran grupo, pequeños grupos heterogéneos, parejas y trabajo individual.","pizarra":[]},{"id":"p5b2","texto":"En séptimo lugar, mis estrategias facilitan la coordinación docente, que regulan el artículo 78 del Decreto 328/2010 y la Orden de 20 de agosto de 2010. En horizontal, con el equipo de ciclo, que elabora las programaciones y donde acordamos los proyectos de diseño, y con el equipo docente, que hace el seguimiento del grupo y que coordino como tutora. Al ser un centro bilingüe, en el equipo docente acuerdo con el profesorado de Inglés el vocabulario de cada unidad, como el de las plantas en la unidad 2. En vertical, con el Equipo Técnico de Coordinación Pedagógica, que fija las directrices, y con el equipo de orientación, que asesora.","pizarra":[]},{"id":"p5b3","texto":"En octavo lugar, contemplan la orientación y acción tutorial, que el Decreto 101/2023 considera parte de la función docente. Sigo cuatro líneas: enseñar a pensar, a ser persona, a convivir y a tomar decisiones. Por ejemplo, en la unidad 1 consensuamos el cartel de normas de colaboración y repartimos los roles del equipo. Y las familias, informadas periódicamente, participan, por ejemplo, con la entrevista para el recetario andaluz.","pizarra":[]},{"id":"p5b4","texto":"En noveno lugar, utilizan recursos didácticos, espaciales, personales y materiales. Didácticos: el libro de lectura, la prensa, los diccionarios y el material manipulativo, como policubos y tangram. Espaciales: el aula, la biblioteca, el huerto, el patio y el aula del futuro. Personales: el equipo docente, las maestras de Pedagogía Terapéutica, de Audición y Lenguaje y de apoyo, y las familias. Y materiales, con las tecnologías como artefactos digitales, siguiendo a Trujillo (2014): la pizarra digital, Moodle Centros y el blog de aula.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"g) Coordinación · h) Tutoría · i) Recursos"},{"zona":"normativa","texto":"D. 301/09 · O. 20/08/10 · O. 17/04/17 · Trujillo (2014)"}]},{"id":"p5b5","texto":"Incluyo una actividad complementaria en cada unidad, interesante, atractiva y motivadora, que promueve un aprendizaje significativo e integrado porque forma parte de la situación de aprendizaje. Por ejemplo, la recogida de alimentos del Día Mundial de la Alimentación, en la unidad 2, conecta con «¡Sí, chef!»; la marcha por la paz del 30 de enero, en la unidad 7, refuerza el Plan de Cultura de Paz; y la visita al Centro Pompidou, en la unidad 11, inspira la maqueta de la unidad 12.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"Complementaria en cada UD · extraescolares vinculadas"}]},{"id":"p5b6","texto":"Las extraescolares, según el artículo 16 de la Orden de 17 de abril de 2017, son voluntarias y no se evalúan, pero también las conecto: las de apoyo educativo refuerzan la lectura y el razonamiento, y en las de expresión artística propongo continuar el stop motion de «Ópera prima».","pizarra":[]},{"id":"p5b7","texto":"Por último, la temporalización. Subrayo que todas y cada una de las doce unidades contienen, al menos, una situación de aprendizaje con su producto final; de hecho, cada unidad integra tres: la suya, una fase del proyecto de diseño del trimestre y una fase de «Ópera prima». Primer trimestre: unidad 1, del 10 al 27 de septiembre, cartel de normas; unidad 2, hasta el 18 de octubre, guía de plantas; 3, hasta el 8 de noviembre, superhéroe animal; 4, hasta el 29 de noviembre, pirámide de hábitos de salud; y 5, hasta el 20 de diciembre, mural para proteger el planeta.","pizarra":[{"zona":"centro","caja":"5. Organización","texto":"T1 (10/9-20/12) UD 1-5 · T2 (7/1-4/4) 6-9 · T3 (7/4-20/6) 10-12"}]},{"id":"p5b8","texto":"Segundo trimestre: unidad 6, del 7 al 24 de enero, informe sobre la bicicleta; 7, hasta el 14 de febrero, plano del barrio; 8, hasta el 14 de marzo, cartel para cuidar el medioambiente; y 9, hasta el 4 de abril, mural de tradiciones. Tercer trimestre: unidad 10, del 7 de abril al 7 de mayo, pirámide de población; 11, hasta el 30 de mayo, línea del tiempo; y 12, hasta el 20 de junio, maqueta del Centro Pompidou de Málaga.","pizarra":[]}]},{"id":"p6","titulo":"Atención a la diversidad","rubrica":["Medidas de atención a la diversidad","Aspectos metodológicos y principios pedagógicos"],"minutos":3.4,"esquema":["Art. 17 D. 101/2023 · art. 26 Orden: DUA (representación, expresión, implicación)","Generales (art. 27): segundo docente, agrupamientos flexibles, cooperativo, tutoría","Programa de refuerzo (art. 28): 30' LCL (CEsp 4, 4.1.a) y 30' MAT (CEsp 2, 2.1.a) · profundización","Específicas (art. 33): DIA derivadas de TDAH → refuerzo + programa específico con PT (atención, memoria, emociones); UD 7 plano en 3 pasos","Compensación educativa: refuerzo, compañera tutora, extraescolares de apoyo, familia (González 2021)","Multinivel en cada UD (guía de plantas, UD 2) · cauces: PT y AL quincenal, equipo docente (Séneca), familias, protocolo 2017","Control de tiempo: el apartado 7 empieza hacia el minuto 23"],"bloques":[{"id":"p6b1","texto":"Paso al sexto apartado: la atención a la diversidad. El artículo 17 del Decreto 101/2023 la define como el conjunto de medidas que garantizan la mejor respuesta a todo el alumnado en un entorno inclusivo. Y el artículo 26 de la Orden de 30 de mayo de 2023 establece que esas medidas se rigen por el Diseño Universal para el Aprendizaje. Con sus tres principios: múltiples formas de representación, con imágenes, vídeos y esquemas; de expresión, oral, escrita, gráfica o digital; y de implicación, con trabajo cooperativo y retroalimentación.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"DUA · generales · refuerzo · profundización"}]},{"id":"p6b2","texto":"Como medidas generales del artículo 27, aplico el apoyo de un segundo docente en el aula, los agrupamientos flexibles, el aprendizaje cooperativo y la tutoría entre iguales. Como programas del artículo 28, un programa de refuerzo del aprendizaje para los dos alumnos con dificultades: treinta minutos de Lengua y treinta de Matemáticas. Como exige la Orden, especifica qué refuerza: la competencia específica 4 de Lengua, con el criterio 4.1.a, y la 2 de Matemáticas, con el criterio 2.1.a, con material manipulativo y textos de lectura fácil. Y para el alumnado especialmente motivado, programas de profundización con investigaciones, sin modificar los criterios.","pizarra":[]},{"id":"p6b3","texto":"Como medidas específicas, según el artículo 33 de la Orden, para el alumno con dificultades de aprendizaje derivadas de TDAH aplico un programa de refuerzo y un programa específico con la maestra de Pedagogía Terapéutica, que estimula procesos como la atención, la memoria y la gestión de las emociones. En el aula lo sitúo cerca de mí, fragmento las tareas y uso agendas visuales: por ejemplo, en la unidad 7, el plano del barrio se divide en tres pasos con una lista de comprobación visual.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"Específicas: DIA-TDAH (programa específico) · COM"}]},{"id":"p6b4","texto":"Para la alumna de compensación educativa, cuya necesidad nace de una situación de desventaja sociocultural, aplico un programa de refuerzo, una compañera tutora, su participación en las extraescolares de apoyo educativo y una estrecha colaboración con la familia, porque, como señala González (2021), la escuela inclusiva convierte la diversidad en riqueza.","pizarra":[{"zona":"normativa","texto":"González (2021)"}]},{"id":"p6b5","texto":"Atiendo a las diferencias individuales a lo largo de toda la puesta en práctica, porque cada unidad incluye actividades multinivel. Por ejemplo, en la guía de las plantas de la unidad 2, unos trabajan con imágenes y frases modelo, otros con una ficha guiada y otros amplían con una pequeña investigación. Y establezco cauces de coordinación con los profesionales implicados: una reunión quincenal con las maestras de Pedagogía Terapéutica y de Audición y Lenguaje, las sesiones del equipo docente, cuyos acuerdos se registran en Séneca, y las tutorías con las familias. Si detecto nuevas dificultades, activo con el equipo de orientación el protocolo de las Instrucciones de 8 de marzo de 2017.","pizarra":[{"zona":"centro","caja":"6. Diversidad","texto":"Multinivel · cauces: PT, AL, equipo docente, familias"}]}]},{"id":"p7","titulo":"Evaluación","rubrica":["Evaluación","Bibliografía"],"minutos":5,"esquema":["Art. 20 LOE · art. 14 RD 157/2022 · art. 11 D. 101/2023 · art. 9 Orden: características; referente = criterios","Inicial: primeros días, UD 1, prueba + observación + informe → sesión inicial → coordinación antes del 15/10 → decisiones","Procedimientos, instrumentos y evidencias (art. 10); ejemplo: cartel UD 1 → rúbrica 8.1.a","Autoevaluación (metacognición) y coevaluación: no califican","Rúbrica de 5 niveles: IN 1-4 · SU 5 · BI 6 · NT 7-8 · SB 9-10; CEsp = media de sus criterios (6 y 8 → 7)","Refuerzo: criterios del curso + formato y tiempo · medidas: anexo VI, escala 1-5","Práctica docente (Herrán y Paredes 2020) en cada UD · programación: ciclo, trimestre, cotejo + escala 1-4 + análisis; evidencias: resultados por criterio y acta","Control de tiempo: la conclusión empieza hacia el minuto 28"],"bloques":[{"id":"p7b1","texto":"Paso al séptimo apartado: la evaluación. Según el artículo 20 de la Ley Orgánica de Educación, el artículo 14 del Real Decreto 157/2022 y el artículo 9 de la Orden de 30 de mayo de 2023, es continua, global, formativa, competencial, integradora, diferenciada y objetiva. Y, según el artículo 11 del Decreto 101/2023, evalúo tanto los aprendizajes como la enseñanza y mi propia práctica docente. El referente son los criterios de evaluación: su grado de superación indica el de cada competencia específica, y todos los criterios de una competencia tienen el mismo valor.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Referente: CEv · inicial (15/10) → continua → final"}]},{"id":"p7b2","texto":"El procedimiento de evaluación inicial es este. En los primeros días, en la unidad 1, aplico tres instrumentos: una prueba competencial de lectura y de resolución de problemas, con los criterios 4.1.a de Lengua y 1.1.a de Matemáticas; una escala de observación del trabajo en equipo; y el análisis del informe de final del primer ciclo. Con ellos, el equipo docente celebra la sesión de evaluación inicial; y antes del 15 de octubre, una sesión de coordinación analiza los resultados y adopta decisiones: por ejemplo, incorporar a los dos alumnos con dificultades al programa de refuerzo.","pizarra":[]},{"id":"p7b3","texto":"Después, la evaluación continua recoge información en cada unidad. Y la final, al terminar el curso, expresa los resultados en la escala de insuficiente a sobresaliente, que comunico a las familias.","pizarra":[]},{"id":"p7b4","texto":"Utilizo instrumentos adecuados, coherentes y variados, como indica el artículo 10 de la Orden. Los procedimientos son la observación sistemática, el análisis de producciones y las pruebas orales y escritas. Los instrumentos, el registro anecdótico, las listas de cotejo, las escalas de observación, el porfolio y las rúbricas. Y las evidencias, las respuestas a preguntas, los desempeños, los procesos y los productos finales. Por ejemplo, el cartel de normas de la unidad 1 se evalúa con una rúbrica del criterio 8.1.a de Conocimiento del Medio.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Anecdotario · cotejo · escalas · porfolio · rúbricas"}]},{"id":"p7b5","texto":"En la autoevaluación, el alumnado desarrolla la metacognición con rúbricas sencillas, listas de cotejo y su porfolio. En la coevaluación, por ejemplo, intercambia el cuaderno de dictado con un compañero. Ambas sirven para aprender y no afectan a la calificación. En cuanto a los criterios de calificación, cada criterio se califica con una rúbrica de cinco niveles que se corresponden con la escala oficial: «con dificultad» es insuficiente, de 1 a 4; «con ayuda», suficiente, 5; «sin dificultades», bien, 6; «con facilidad», notable, 7 u 8; y «muestra dominio», sobresaliente, 9 o 10.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Rúbrica 5 niveles: IN 1-4, SU 5, BI 6, NT 7-8, SB 9-10"}]},{"id":"p7b6","texto":"La nota de cada competencia específica es la media de sus criterios, y la del área, la media de sus competencias. Por ejemplo, un 6 en el criterio 2.1.a y un 8 en el 2.2.a de Matemáticas dan un 7, notable, en la competencia específica 2. Al alumnado con programas de refuerzo lo evalúo con los criterios de su curso, como indica el artículo 28 de la Orden, con medidas de acceso: adaptación del formato de las pruebas y ampliación del tiempo.","pizarra":[]},{"id":"p7b7","texto":"Evalúo también las medidas de atención a la diversidad, según el anexo seis de la Orden: concreto la dificultad, describo la medida y valoro su eficacia por observación, en una escala del 1 al 5, de poco adecuada a excelente. Si no funciona, el equipo docente la revisa.","pizarra":[]},{"id":"p7b8","texto":"Evalúo mi práctica docente al final de cada unidad porque, como recuerdan Herrán y Paredes (2020), evaluar la enseñanza es la base para mejorarla. Indicadores: metodología competencial, actividades multinivel y fomento de la lectura y del cooperativo. Instrumentos: listas de cotejo, una escala de autoobservación del 1 al 4 y el anecdotario. Evidencias: los resultados del alumnado y sus producciones.","pizarra":[{"zona":"normativa","texto":"Herrán y Paredes (2020)"}]},{"id":"p7b9","texto":"Y evalúo la programación en el equipo de ciclo cada trimestre. Indicadores: si relaciona los elementos curriculares y si la organización del aula es adecuada. Instrumentos: una lista de cotejo, la escala del 1 al 4 y el análisis de su desarrollo en el aula. Evidencias: los resultados por criterio y el acta del ciclo. Las mejoras pasan a la memoria de autoevaluación del centro.","pizarra":[{"zona":"centro","caja":"7. Evaluación","texto":"Evalúo medidas, práctica docente y programación"}]}]},{"id":"p8","titulo":"Conclusión","rubrica":["Conclusión","Expresión oral"],"minutos":1.4,"esquema":["Síntesis: grupo real (22 alumnos de Mijas Costa, 4 con medidas propias) · currículo LOMLOE-Andalucía, 4 áreas, 12 UD con SdA, proyectos + «Ópera prima»","Cooperativo con género, lectura, razonamiento; DUA; de la evaluación inicial a la final","Valoración personal: programar es acompañar (Palacios, Marchesi y Coll 2021)","Cierre: nadie aprende solo; aprendemos juntos"],"bloques":[{"id":"p8b1","texto":"Concluyo con una síntesis de lo más relevante. «Aprendemos juntos» concreta el currículo de la LOMLOE y de Andalucía para un grupo real: veintidós alumnos y alumnas de tercero de Mijas Costa, cuatro de ellos con medidas propias. Lo hace en cuatro áreas y doce unidades didácticas, todas con su situación de aprendizaje, más los proyectos de diseño y «Ópera prima». Se apoya en el aprendizaje cooperativo con perspectiva de género, la lectura diaria y el razonamiento matemático; atiende a cada alumno desde el Diseño Universal para el Aprendizaje; y lo acompaña desde la evaluación inicial hasta la final.","pizarra":[]},{"id":"p8b2","texto":"Como valoración personal, estoy convencida de que una buena programación evita la improvisación y orienta la enseñanza. Y, como señalan Palacios, Marchesi y Coll (2021), hay que partir de las capacidades y de los conocimientos previos de cada niño y de cada niña. Por eso, para mí, programar es acompañar: a mi alumnado, a sus familias y al equipo docente. Termino con la idea que da nombre a mi programación: en el aula nadie aprende solo; aprendemos juntos. Muchas gracias por su atención.","pizarra":[{"zona":"centro","caja":"8. Conclusión","texto":"Nadie aprende solo: aprendemos juntos"},{"zona":"normativa","texto":"Palacios, Marchesi y Coll (2021)"}]}]}]},"plantilla":{"id":"ud_plantilla","titulo":"Exposición de la unidad didáctica (plantilla común)","objetivoMinutos":29.2,"presupuesto":"Con los ejemplos (UD 1) el discurso dura unos 29,2 min. Cada UD debe quedar entre 28,8 y 29,5 min: rellena cada hueco cerca de la longitud de su ejemplo y sin pasar su máximo; las UD con cuatro competencias de Medio y Artística o con más criterios ya gastan unas 20 palabras más, así que compensa en los huecos de relación o de tarea. Comprueba con validar.mjs ud N.","huecos":[{"id":"titulo","descripcion":"Título literal de la UD, sin comillas (las comillas «» ya están en el texto común). Puede ser una pregunta con sus signos ¿?.","ejemplo":"Somos un equipo","palabras":[2,6],"etiqueta":"Título"},{"id":"trimestre_letra","descripcion":"Ordinal apocopado del trimestre, en minúscula: «primer», «segundo» o «tercer» (va delante de «trimestre»).","ejemplo":"primer","palabras":[1,1],"etiqueta":"Trimestre"},{"id":"centro_interes","descripcion":"Centro de interés de la UD (ficha: centroInteres) como sintagma nominal en minúscula CON artículo, sin punto. Va tras «se centra en» y tras «Epistemológicamente, su eje es», así que vale en singular o en plural.","ejemplo":"el trabajo en equipo","palabras":[2,5],"etiqueta":"Centro de interés"},{"id":"pz_producto","descripcion":"PIZARRA y guion. Producto de la SdA en 2-6 palabras, sin artículo, con mayúscula inicial («Guía de plantas del barrio», «Maqueta del Centro Pompidou»).","ejemplo":"Cartel de normas de colaboración","palabras":[2,6],"etiqueta":"Pizarra: producto de la SdA"},{"id":"pz_ods","descripcion":"PIZARRA, guion y conclusión (va tras «vinculada con el»). El ODS u ODS de la UD con su número: «ODS 16» o «ODS 11 y 16».","ejemplo":"ODS 16","palabras":[2,4],"etiqueta":"Pizarra: ODS"},{"id":"ods_corto","descripcion":"Los ODS de la UD con su artículo, para la conclusión («vinculada con …»): «el ODS 16» si hay uno; «los ODS 14 y 16» si hay dos. Sin punto final.","ejemplo":"el ODS 16","palabras":[3,6],"etiqueta":"ODS (conclusión)"},{"id":"pregunta_motriz","descripcion":"Pregunta con la que ARRANCA la UD (la de la actividad inicial o del reto de la SdA en la ficha), con sus signos ¿?, en segunda o primera persona del plural, sin comillas (ya van en el texto común) y sin punto tras el cierre «?». Abre la exposición para captar la atención; evita repetir literalmente el título si este ya es una pregunta.","ejemplo":"¿Cómo podemos trabajar de forma cooperativa?","palabras":[4,7],"etiqueta":"Pregunta inicial"},{"id":"numero","descripcion":"Número de la UD en cifras, sin punto (se lee «número 1»).","ejemplo":"1","palabras":[1,1],"etiqueta":"Número de la UD"},{"id":"producto_sda","descripcion":"Producto final de la situación de aprendizaje de la UD (ficha: sda.ud.producto) como sintagma nominal en minúscula, sin punto, con el artículo que pida el sentido (determinado o indeterminado); nominaliza los infinitivos y pasa los posesivos a tercera persona («un plano del barrio con sus centros sanitarios cercanos»).","ejemplo":"un cartel para definir las normas de colaboración","palabras":[3,9],"etiqueta":"Producto de la situación de aprendizaje"},{"id":"justif_normativa","descripcion":"Justificación NORMATIVA vinculada con la UD (va tras «; en concreto, desarrolla»): el saber básico (o bloque de saberes) del anexo II de la Orden de 30 de mayo de 2023 que sostiene el centro de interés, con su nombre entre «» y su área, sin código; puede añadir «y el objetivo de etapa de …» si no repite objetivo_etapa_clave. Sin artículos de normas que no estén en la programación. Empieza en minúscula, sin punto final.","ejemplo":"el saber «Normas para la vida en sociedad» de Conocimiento del Medio, del anexo II de la Orden","palabras":[10,19],"etiqueta":"Justificación normativa"},{"id":"justif_curricular","descripcion":"Justificación CURRICULAR: por qué esta UD es relevante en tercero (va tras «y es relevante en tercero porque»): qué abre, consolida o prepara dentro del curso y del segundo ciclo. No repitas los saberes que nombra justif_disciplinar. Empieza en minúscula, sin punto final.","ejemplo":"abre el segundo ciclo y forma los equipos cooperativos de todo el curso","palabras":[8,14],"etiqueta":"Justificación curricular"},{"id":"justif_epistemologica","descripcion":"Justificación EPISTEMOLÓGICA en torno al CENTRO DE INTERÉS (va tras «Epistemológicamente, se articula sobre {{centro_interes}}:»): qué dice la disciplina de referencia (ciencias naturales, ciencias sociales, historia, geografía, arte) sobre ese centro de interés y cómo lo sirven la lengua y las matemáticas. No enumeres contenidos sueltos (sílaba, tilde, cifras) ni cites autores. Oración en minúscula, SIN punto final.","ejemplo":"las ciencias sociales muestran que toda comunidad necesita normas acordadas, y la lengua y las matemáticas sirven para escribirlas","palabras":[12,20],"etiqueta":"Justificación epistemológica"},{"id":"relevancia","descripcion":"Relevancia social de la UD (ficha: relevanciaSocial) como oración enunciativa completa que empieza en minúscula y SIN punto final (va tras «Su relevancia social es clara:»). Sin citar normas.","ejemplo":"el trabajo cooperativo desarrolla las habilidades sociales, la empatía y la resolución pacífica de conflictos","palabras":[8,16],"etiqueta":"Relevancia social"},{"id":"ods","descripcion":"ODS de la UD (ficha: ods) con artículo y nombre OFICIAL completo, en minúscula salvo la sigla, sin punto. Uno: «el ODS 16, paz, justicia e instituciones sólidas». Dos: «los ODS 11, ciudades y comunidades sostenibles, y 16, paz, justicia e instituciones sólidas».","ejemplo":"el ODS 16, paz, justicia e instituciones sólidas","palabras":[4,9],"etiqueta":"ODS"},{"id":"fechas","descripcion":"Fechas de la UD en minúscula, empezando por «del», sin año y sin punto final (ficha: fechas).","ejemplo":"del 10 al 27 de septiembre","palabras":[5,9],"etiqueta":"Fechas"},{"id":"dias","descripcion":"Número de días lectivos en cifras, tal como lo da la ficha (dias), que sigue el calendario 2024-2025 de la programación (las clases empiezan el 10 de septiembre de 2024). En ningún hueco digas el día de la semana de una fecha concreta: el año que figura en algunas UD (2025) no cuadra con esos días.","ejemplo":"14","palabras":[1,1],"etiqueta":"Días lectivos"},{"id":"contexto_significativo","descripcion":"Lo más significativo del contexto para ESTA UD: el momento del curso y el plan o programa del centro que le da sentido (Plan de cultura de Paz, Plan de igualdad de hombres y mujeres (obligatorio si la UD evalúa un criterio de igualdad), CIMA hábitos de vida saludable, CIMA ALDEA, CIMA STEAM, Plan de actuación digital), o un rasgo del entorno (Mijas Costa, Málaga, la costa). Una o dos oraciones, sin dos puntos internos; empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"empieza el curso y el grupo debe hacerse equipo; el Plan de cultura de Paz da sentido a las normas, el de igualdad a los roles rotativos y el programa CIMA a lo que comemos.","palabras":[15,37],"etiqueta":"Contexto significativo para la UD"},{"id":"enlace_ud","descripcion":"Lugar de la UD en la secuencia del curso respecto a la ANTERIOR (va tras «En la secuencia del curso,»): oración que empieza en minúscula con un verbo cuyo sujeto es la unidad («sigue a «Lo que importa es la salud» y amplía el estudio de los seres vivos…») y termina en punto. La siguiente UD va en siguiente_ud.","ejemplo":"es la primera unidad y coincide con la evaluación inicial de los primeros días de clase.","palabras":[8,17],"etiqueta":"Enlace con la UD anterior"},{"id":"pz_lcl","descripcion":"PIZARRA. Cadena de Lengua sin etiquetas: «LCL n·n·n → n.n.a·n.n.a…» (competencias específicas → criterios, unidos con «·» sin espacios).","ejemplo":"LCL 1·4·5·6·7 → 1.3.a·4.1.a·5.1.a·6.1.a·7.1.a","palabras":[4,4],"etiqueta":"Pizarra: cadena de Lengua"},{"id":"pz_mat","descripcion":"PIZARRA. Cadena de Matemáticas con el mismo formato: «MAT n·n·n → n.n.a·n.n.a…».","ejemplo":"MAT 1·4·5·6·7 → 1.1.a·4.1.a·5.1.a·6.2.a·7.1.a","palabras":[4,4],"etiqueta":"Pizarra: cadena de Matemáticas"},{"id":"pz_cmn_ear","descripcion":"PIZARRA. Cadenas de Conocimiento del Medio y de Educación Artística: «CMN n·n → n.n.a·n.n.a · EAR n → n.n.a».","ejemplo":"CMN 1·8 → 1.1.a·8.1.a · EAR 1 → 1.1.a","palabras":[9,9],"etiqueta":"Pizarra: cadenas de Medio y Artística"},{"id":"objetivos_aprendizaje","descripcion":"Los SEIS objetivos de aprendizaje de la ficha, MUY abreviados (sustantivos o infinitivos cortos) y AGRUPADOS por área en una sola enumeración: «en Lengua, …; en Matemáticas, …; …; y …». Sin números. Empieza en minúscula (va tras «y los concreto en seis objetivos de aprendizaje:») y termina en punto.","ejemplo":"en Lengua, adivinanzas, sílaba y diccionario; en Matemáticas, números de cuatro cifras y ordinales; trabajo en equipo con mediación; y arte de distintas épocas.","palabras":[16,25],"etiqueta":"Objetivos de aprendizaje"},{"id":"pz_obj_etapa","descripcion":"PIZARRA. Letras de los objetivos de etapa de la ficha (objetivosEtapa) unidas con «·», sin espacios ni paréntesis.","ejemplo":"a·d·e·g·h·j·ñ","palabras":[1,1],"etiqueta":"Pizarra: objetivos de etapa"},{"id":"cc_principales","descripcion":"Las DOS (como mucho tres) competencias clave que más desarrolla la UD, con su nombre completo (en comunicación lingüística; plurilingüe; matemática y en ciencia, tecnología e ingeniería; digital; personal, social y de aprender a aprender; ciudadana; emprendedora; en conciencia y expresión culturales), sin explicar el porqué. Empieza por «la competencia» y va SIN punto final. Aparece en la concreción (tras «del Real Decreto 157/2022 y, sobre todo,») y en la conclusión (tras «Desarrolla sobre todo»).","ejemplo":"la competencia personal, social y de aprender a aprender y la ciudadana","palabras":[8,13],"etiqueta":"Competencias clave principales"},{"id":"curriculo_lcl","descripcion":"Concreción de CADA competencia específica de Lengua de la ficha. Va tras «Empiezo por Lengua:»: empieza en MINÚSCULA por «la N,» y termina en punto. Cada competencia: «la N, [de qué trata en 2-4 palabras, en infinitivo o sintagma], con X1 y X2 (dos descriptores operativos, de la Tabla 3 de la programación y presentes en ficha.competenciasClave), criterio N.N.a y [nombre corto del saber básico, sin código]» (sin artículo delante de «criterio»). Competencias separadas por «; », la última con «; y la N, …». Si la ficha empareja mal competencia y criterio (p. ej. UD 2 LCL: competencia 9 sin criterio y 8.3.a sin competencia; UD 6 EAR: competencia 1 con 4.1.a), nombra la competencia que corresponde al criterio y omite la que no tiene criterio.","ejemplo":"la 1, valorar la diversidad lingüística, con CCL1 y CC1, criterio 1.3.a y el habla andaluza; la 4, comprender textos, con CCL2 y CD1, criterio 4.1.a y la comprensión lectora; la 5, escribir textos, con CCL3 y CCL5, criterio 5.1.a y la producción escrita; la 6, buscar información, con CD1 y CE3, criterio 6.1.a y la búsqueda guiada; y la 7, leer con autonomía, con CCL4 y CCEC1, criterio 7.1.a y la literatura infantil.","palabras":[45,78],"etiqueta":"Concreción de Lengua"},{"id":"curriculo_mat","descripcion":"Igual que curriculo_lcl para Matemáticas. Va tras «Sigo con Matemáticas:»: empieza en MINÚSCULA por «la N,» y termina en punto. Cada competencia: «la N, [de qué trata en 2-4 palabras, en infinitivo o sintagma], con X1 y X2 (dos descriptores operativos, de la Tabla 3 de la programación y presentes en ficha.competenciasClave), criterio N.N.a y [nombre corto del saber básico, sin código]» (sin artículo delante de «criterio»). Competencias separadas por «; », la última con «; y la N, …». Si la ficha empareja mal competencia y criterio (p. ej. UD 2 LCL: competencia 9 sin criterio y 8.3.a sin competencia; UD 6 EAR: competencia 1 con 4.1.a), nombra la competencia que corresponde al criterio y omite la que no tiene criterio.","ejemplo":"la 1, interpretar situaciones cotidianas, con STEM1 y STEM2, criterio 1.1.a y el orden de magnitud; la 4, el pensamiento computacional, con STEM2 y CD1, criterio 4.1.a y los algoritmos sencillos; la 5, conectar ideas, con STEM1 y CC4, criterio 5.1.a y las relaciones geométricas; la 6, comunicar procesos, con CCL1 y STEM4, criterio 6.2.a y la recta numérica; y la 7, gestionar emociones, con CPSAA1 y CE2, criterio 7.1.a y la tolerancia a la frustración.","palabras":[45,80],"etiqueta":"Concreción de Matemáticas"},{"id":"curriculo_cmn_ear","descripcion":"Igual para Conocimiento del Medio y Educación Artística (va tras «Y termino con las otras dos áreas.»), en una o dos oraciones: «En Conocimiento del Medio, la N, [de qué trata], con …, el criterio … y …; y la N, …. Y en Educación Artística, la N, [de qué trata], con …». Empieza en MAYÚSCULA y termina en punto. Cada competencia: «la N, [de qué trata en 2-4 palabras, en infinitivo o sintagma], con X1 y X2 (dos descriptores operativos, de la Tabla 3 de la programación y presentes en ficha.competenciasClave), criterio N.N.a y [nombre corto del saber básico, sin código]» (sin artículo delante de «criterio»). Competencias separadas por «; », la última con «; y la N, …». Si la ficha empareja mal competencia y criterio (p. ej. UD 2 LCL: competencia 9 sin criterio y 8.3.a sin competencia; UD 6 EAR: competencia 1 con 4.1.a), nombra la competencia que corresponde al criterio y omite la que no tiene criterio.","ejemplo":"En Conocimiento del Medio, la 1, usar recursos digitales, con CD1 y CD2, criterio 1.1.a y los dispositivos digitales; y la 8, igualdad y diversidad, con CP3 y CC1, criterio 8.1.a y las normas de convivencia. Y en Educación Artística, la 1, descubrir propuestas artísticas, con CCEC1 y CCEC2, criterio 1.1.a y su recepción activa.","palabras":[35,70],"etiqueta":"Concreción de Medio y Artística"},{"id":"pz_s1","descripcion":"GUION. La tarea de la fase 1 en 3-6 palabras (siglas y abreviaturas permitidas).","ejemplo":"equipos y roles en Canva","palabras":[2,6],"etiqueta":"Guion: tarea de la fase 1"},{"id":"sda_reto","descripcion":"Reto de la situación de aprendizaje en infinitivo (qué problema real resuelve el producto), en minúscula, sin punto; va entre comas tras «plantea un reto real,».","ejemplo":"descubrir cómo podemos trabajar de forma cooperativa","palabras":[4,8],"etiqueta":"Reto de la situación de aprendizaje"},{"id":"s1_lcl_ej","descripcion":"EJERCICIO DE APLICACIÓN de LENGUA de la fase 1 (ficha: semanas[0].LCL): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Va tras «En Lengua, como ejercicio de aplicación,» / «En Matemáticas, como ejercicio,»: empieza en minúscula por un VERBO en presente, sin punto final (sigue «;»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"leemos una noticia y distinguimos la lengua oral y la escrita","palabras":[4,12],"etiqueta":"Fase 1 · Lengua: ejercicio"},{"id":"s1_lcl_act","descripcion":"ACTIVIDAD de LENGUA de la fase 1 (ficha: semanas[0].LCL): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada niño y cada niña» / «cada equipo» (evita «cada alumno»), y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Va tras «y como actividad,»: empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"inventamos adivinanzas de profesiones para competir por equipos, con el criterio 5.1.a, y en «La Tarara» reconocemos rasgos de nuestra habla andaluza, con el 1.3.a","palabras":[8,26],"etiqueta":"Fase 1 · Lengua: actividad"},{"id":"s1_rel_lcl","descripcion":"RELACIÓN de lo que hace LENGUA en la fase 1 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"crear juntos es nuestro primer ensayo de equipo, y respetar cada forma de hablar será una norma","palabras":[8,18],"etiqueta":"Fase 1 · Lengua: relación con el producto"},{"id":"s1_mat_ej","descripcion":"EJERCICIO DE APLICACIÓN de MATEMÁTICAS de la fase 1 (ficha: semanas[0].MAT): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Va tras «En Lengua, como ejercicio de aplicación,» / «En Matemáticas, como ejercicio,»: empieza en minúscula por un VERBO en presente, sin punto final (sigue «;»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"leemos, escribimos y representamos con bloques de base 10 números de tres cifras","palabras":[4,14],"etiqueta":"Fase 1 · Matemáticas: ejercicio"},{"id":"s1_mat_act","descripcion":"ACTIVIDAD de MATEMÁTICAS de la fase 1 (ficha: semanas[0].MAT): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada niño y cada niña» / «cada equipo» (evita «cada alumno»), y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Va tras «y como actividad,»: empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"resolvemos problemas cotidianos contando más allá del 999, con el criterio 1.1.a, y el viernes cada equipo inventa los suyos en el concurso","palabras":[8,24],"etiqueta":"Fase 1 · Matemáticas: actividad"},{"id":"s1_rel_mat","descripcion":"RELACIÓN de lo que hace MATEMÁTICAS en la fase 1 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"cada miembro ejerce su rol, y lo que ayuda al equipo serán nuestras primeras normas","palabras":[8,16],"etiqueta":"Fase 1 · Matemáticas: relación con el producto"},{"id":"s1_cmn","descripcion":"Actividad de CONOCIMIENTO DEL MEDIO de la fase 1 que NO es la tarea (ficha: semanas[0].CMN, el jueves), en primera persona del plural y con su criterio si lo tiene. Empieza en minúscula (va tras «En Conocimiento del Medio,»), SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"el jueves vemos un vídeo sobre el método científico y esquematizamos sus pasos","palabras":[6,14],"etiqueta":"Fase 1 · Conocimiento del Medio: actividad"},{"id":"s1_rel_cmn","descripcion":"RELACIÓN de lo que hace CONOCIMIENTO DEL MEDIO en la fase 1 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"con ese método, las normas serán una hipótesis que comprobaremos en la fase tres","palabras":[8,15],"etiqueta":"Fase 1 · Conocimiento del Medio: relación con el producto"},{"id":"pz_f1","descripcion":"PIZARRA. Caja «4. Fase 1»: las aportaciones de las áreas en esta fase, en 3-7 palabras separadas por «·», en el orden Lengua · Matemáticas · Medio · Artística, sin siglas de área (p. ej. «Receta · medidas · huerto · bodegón»). Solo actividades de ESTA fase.","ejemplo":"Adivinanzas · concurso · método científico · letras","palabras":[3,8],"etiqueta":"Pizarra: caja de la fase 1"},{"id":"s1_ear","descripcion":"Actividad de EDUCACIÓN ARTÍSTICA de la fase 1 (ficha: semanas[0].EAR); si es el APS, nombra «Opera prima». Empieza en minúscula (va tras «Y en Educación Artística,») y SIN punto final (sigue «:» y la relación). El criterio de Educación Artística debe ir con la actividad cuyo SIGNIFICADO encaja (identificar o conocer una obra o un artista → criterio de identificar propuestas; crear → criterio de producción), aunque la ficha lo ponga en otra semana; debe aparecer en al menos una fase.","ejemplo":"creamos letras tridimensionales con materiales de plástica","palabras":[4,8],"etiqueta":"Fase 1 · Educación Artística: actividad"},{"id":"s1_rel_ear","descripcion":"RELACIÓN de lo que hace EDUCACIÓN ARTÍSTICA en la fase 1 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"serán las letras del título de nuestro cartel","palabras":[6,9],"etiqueta":"Fase 1 · Educación Artística: relación con el producto"},{"id":"s1_tarea","descripcion":"TAREA de la fase 1 (ficha: semanas[0].CMN, el viernes). Empieza por «el viernes damos el primer paso de la situación de aprendizaje.» y sigue con qué se hace ese día para el producto. Si en esa fase la SdA aún no ha arrancado (UD 9), empieza por «el viernes,» + la actividad de ese día (efeméride incluida), desarróllala como tarea y di que la situación de aprendizaje arranca en la fase dos. Desarróllala con CUATRO datos: agrupamiento, duración («en una sesión», sin inventar minutos), pasos (qué hace cada miembro o rol) y evidencia o instrumento con que se recoge; di también qué hace la maestra («Yo guío… y registro…»). SIEMPRE con su criterio y el ÁREA del criterio («con el criterio 1.1.a de Conocimiento del Medio»), y que el producto muestre de forma visible lo que pide el criterio (si es de igualdad o diversidad, di qué parte del producto lo evidencia; si es de recursos digitales, hazla con un recurso digital de la UD: Canva, Google Classroom o Google Maps). Dos o tres oraciones; empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el viernes damos el primer paso de la situación de aprendizaje. En una sesión, formamos equipos heterogéneos; cada miembro asume un rol, coordinador, secretario, portavoz o encargado del material, y el equipo diseña su tarjeta de roles en Canva, con el criterio 1.1.a de Conocimiento del Medio. Yo guío y la registro en una escala.","palabras":[40,58],"etiqueta":"Fase 1 · tarea de la SdA"},{"id":"pz_s2","descripcion":"GUION. La tarea de la fase 2 en 3-6 palabras (siglas y abreviaturas permitidas).","ejemplo":"normas en borrador","palabras":[2,6],"etiqueta":"Guion: tarea de la fase 2"},{"id":"s2_lcl_ej","descripcion":"EJERCICIO DE APLICACIÓN de LENGUA de la fase 2 (ficha: semanas[1].LCL): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Va tras «para consolidar,» (Lengua y Matemáticas): empieza en minúscula por un VERBO en presente, sin punto final (sigue «;»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"clasificamos las palabras según su número de sílabas","palabras":[4,9],"etiqueta":"Fase 2 · Lengua: ejercicio"},{"id":"s2_lcl_act","descripcion":"ACTIVIDAD de LENGUA de la fase 2 (ficha: semanas[1].LCL): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada niño y cada niña» / «cada equipo» (evita «cada alumno»), y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Va tras «y, para relacionar,»: empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"leemos un cuento tradicional, con el criterio 7.1.a, y escribimos otro siguiendo los pasos, con el 5.1.a","palabras":[8,18],"etiqueta":"Fase 2 · Lengua: actividad"},{"id":"s2_rel_lcl","descripcion":"RELACIÓN de lo que hace LENGUA en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"planificar, escribir, revisar y corregir es el proceso con el que escribiremos las normas","palabras":[8,15],"etiqueta":"Fase 2 · Lengua: relación con el producto"},{"id":"s2_mat_ej","descripcion":"EJERCICIO DE APLICACIÓN de MATEMÁTICAS de la fase 2 (ficha: semanas[1].MAT): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Va tras «para consolidar,» (Lengua y Matemáticas): empieza en minúscula por un VERBO en presente, sin punto final (sigue «;»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"contamos números de cuatro cifras en series de diez, de cien y de mil","palabras":[4,15],"etiqueta":"Fase 2 · Matemáticas: ejercicio"},{"id":"s2_mat_act","descripcion":"ACTIVIDAD de MATEMÁTICAS de la fase 2 (ficha: semanas[1].MAT): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada niño y cada niña» / «cada equipo» (evita «cada alumno»), y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Va tras «y, para relacionar,»: empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"el viernes, en el concurso de problemas, calculamos mentalmente y explicamos el proceso, con el criterio 6.2.a","palabras":[8,18],"etiqueta":"Fase 2 · Matemáticas: actividad"},{"id":"s2_rel_mat","descripcion":"RELACIÓN de lo que hace MATEMÁTICAS en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», lo del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"la ciencia se hace en equipo, así que anotamos sus normas para el cartel","palabras":[8,15],"etiqueta":"Fase 2 · Conocimiento del Medio: relación con el producto"},{"id":"pz_f2","descripcion":"PIZARRA. Caja «5. Fase 2»: las aportaciones de las áreas en esta fase, en 3-7 palabras separadas por «·», en el orden Lengua · Matemáticas · Medio · Artística, sin siglas de área (p. ej. «Receta · medidas · huerto · bodegón»). Solo actividades de ESTA fase.","ejemplo":"Cuento · cálculo · científicos · Meninas","palabras":[3,8],"etiqueta":"Pizarra: caja de la fase 2"},{"id":"s2_ear","descripcion":"Actividad de EDUCACIÓN ARTÍSTICA de la fase 2 (ficha: semanas[1].EAR); si es el APS, nombra «Opera prima». Empieza en minúscula (va tras «Y en Educación Artística,») y SIN punto final (sigue «:» y la relación). El criterio de Educación Artística debe ir con la actividad cuyo SIGNIFICADO encaja (identificar o conocer una obra o un artista → criterio de identificar propuestas; crear → criterio de producción), aunque la ficha lo ponga en otra semana; debe aparecer en al menos una fase.","ejemplo":"conocemos a Velázquez con un vídeo e identificamos «Las meninas», con el criterio 1.1.a","palabras":[4,15],"etiqueta":"Fase 2 · Educación Artística: actividad"},{"id":"s2_rel_ear","descripcion":"RELACIÓN de lo que hace EDUCACIÓN ARTÍSTICA en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir qué APORTA de verdad lo hecho: una evidencia, un contenido o un paso del proceso cooperativo («el secretario anota qué norma nos ha ayudado»), NO una analogía («como la mochila, ordenamos las normas»). Si anuncia algo para más adelante («comprobaremos…»), tiene que cumplirse en una fase posterior. Solo actividades de la ficha; sin criterios, sin días y sin dos puntos internos.","ejemplo":"cada personaje tiene su papel, como cada rol en nuestros equipos","palabras":[6,12],"etiqueta":"Fase 2 · Educación Artística: relación con el producto"},{"id":"s2_tarea","descripcion":"TAREA de la fase 2 = paso de la situación de aprendizaje del viernes (ficha: semanas[1].CMN). En las UD 2-12 el producto de la SdA SE TERMINA en esta fase: dilo («y queda terminada la guía…»). Desarróllala con CUATRO datos: agrupamiento, duración («en una sesión», sin inventar minutos), pasos (qué hace cada miembro o rol) y evidencia o instrumento con que se recoge; di también qué hace la maestra («Yo guío… y registro…»). SIEMPRE con su criterio y el ÁREA del criterio («con el criterio 1.1.a de Conocimiento del Medio»), y que el producto muestre de forma visible lo que pide el criterio (si es de igualdad o diversidad, di qué parte del producto lo evidencia; si es de recursos digitales, hazla con un recurso digital de la UD: Canva, Google Classroom o Google Maps). Dos o tres oraciones; empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el viernes, en una sesión por equipos y con el folio giratorio, cada miembro propone una norma; el secretario las pasa al borrador en Classroom y el equipo decide por consenso, con el criterio 1.1.a de Conocimiento del Medio. Yo guío y registro el proceso en el anecdotario.","palabras":[40,50],"etiqueta":"Fase 2 · tarea de la SdA"},{"id":"pz_s3","descripcion":"GUION. La tarea de la fase 3 en 3-6 palabras (siglas y abreviaturas permitidas).","ejemplo":"hipótesis comprobada + cartel definitivo","palabras":[2,6],"etiqueta":"Guion: tarea de la fase 3"},{"id":"nombre_proyecto","descripcion":"Solo el nombre del proyecto de diseño del trimestre (ficha: sda.proyecto.nombre), sin comillas: «¡Sí, chef!», «¿Buceamos?» o «Huellas del pasado».","ejemplo":"¡Sí, chef!","palabras":[1,3],"etiqueta":"Proyecto de diseño"},{"id":"s3_lcl_ej","descripcion":"EJERCICIO DE APLICACIÓN de LENGUA de la fase 3 (ficha: semanas[2].LCL): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Va tras «primero, como ejercicio,»: empieza en minúscula por un VERBO en presente, sin punto final (sigue «;»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones): el criterio debe poder EVIDENCIARSE en esa actividad (p. ej., un criterio de habla andaluza va con una canción o un texto oral andaluz, no con una noticia; uno de localizar información, con una búsqueda real en el diccionario, la biblioteca o una web guiada). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"trabajamos la sílaba tónica y la tilde con un dictado","palabras":[4,11],"etiqueta":"Fase 3 · Lengua: ejercicio"},{"id":"s3_lcl_act","descripcion":"ACTIVIDAD de LENGUA de la fase 3 (ficha: semanas[2].LCL): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada niño y cada niña» / «cada equipo» (evita «cada alumno»), y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Va tras «y después, como actividad,»: empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de area
