sporte.","EAR":"(V) La geometría. Realizar un dibujo original utilizando figuras geométricas."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Las leyendas. Lee la leyenda y responde. (M) Leo un cómic. Vocabulario. En grupos, hacer una búsqueda guiada en internet sobre leyendas relacionadas con la naturaleza y el lugar donde vivís. Explicarlo a la clase. (X) Capítulo del libro. Vocabulario. C.EV.4.1.a. Taller de escritura. Escribo un cómic. SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible. Prepara un borrador. C.EV.5.1.a. (J) Cuenta cuentos. Recomienda un cómic. Título, explica el argumento y describe los personajes. (V) Dramatizaciones. Los determinantes. Los artículos. Escribimos oraciones y Clasificamos palabras. C.EV.3.2.a.","MAT":"(L) Medios, tercios y cuartos. Representación y lectura de las fracciones resultantes de dividir la unidad en 2, 3 o 4 partes. (M) Problemas exprés. (X) Resolución de problemas. (J) Representar fracciones con regletas. Equivalencias entre fracciones. C.EV.4.1.a. (V) Concurso de problemas. Cálculo mental. Suma de dos cifras con llevadas.","CMN":"(J) ¿De qué materiales están hechos los juguetes? Materiales naturales y artificiales. Propiedades de los materiales. Clasifica materiales. Hacemos un esquema de las propiedades de los materiales (V). SdA. UD. Informe sobre el uso de la bicicleta como medio de transporte. C.EV.6.1.a.","EAR":"(V) Vídeo. Biografía de Pablo Picasso. Descubriendo el cubismo guía de dibujo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Los demostrativos. Copia y completa el esquema sobre los determinantes. (M) Leo un cómic. Comprensión. Completar una tabla con los determinantes demostrativos. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un cómic. SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible. Prepara un borrador. (J) Cuenta cuentos. Palabras con m antes de b y p. Copia las oraciones y completa con mb o mp. (V) Dramatizaciones. Elaborar un esquema con las normas de ortografía estudiadas. Dictado. Lee, escucha, escribe y revisa. C.EV.8.3.a.","MAT":"(L) Comparo fracciones. Compara fracciones con el mismo denominador. (M) Problemas exprés. (X) Resolución de problemas. Encontrar fracciones mayores o menores que una dada. (J) Completa con los signos mayor que o menor que las fracciones. (V) Concurso de problemas. Pienso paso a paso. Dibuja un rectángulo. Divídelo por la mitad, una y otra vez, hasta que puedas. Colorea. C.Ev.8.1.a.","CMN":"(J) ¿Qué son las máquinas? Máquinas simples y compuestas. Elige una máquina y escribe sus características. ¿Qué es un invento? Busca información y escribe el nombre de dos inventos y para qué sirven. C.Ev.5.1.a. (V) SdA. Proyecto ¿Buceamos? Producto. Cómic. Galería de Arte sostenible.","EAR":"(V) APS. Opera prima. Producto. Fotografías para el corto de animación C.Ev.2.C.1 / 2.C.8"}],"complementaria":"SdA. Salida. Bioparc de Fuengirola. Una aventura salvaje.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL .C.7","texto":"Estrategias y técnicas de uso de historias audiovisuales."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucha el aviso y responde. Escribe un aviso para informar que tu perro se ha perdido. (M) Leo un relato. Comprendo la lectura. Las onomatopeyas. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Por equipos, escribo normas de convivencia, en una biblioteca, una piscina pública, en un cine. Exponemos. C.EV.3.2.a. (J) Día de la NO-Violencia y la Paz. ¿por qué se celebra? Corto “Cadena de favores” Reflexión y Debate. (V) Dramatizaciones. Ruta por el colegio para buscar textos cotidianos: notas, normas, listas, etc. Realiza un registro. C.EV.8.3.a.","MAT":"(L) Estudio el calendario. ¿Qué meses tienen 30 días? ¿Y 31? ¿cuántos días tiene el mes de febrero? C.EV.2.2.a. (M) Problemas exprés. (X) Resolución de problemas. Unidades de tiempo: día, semana, mes año. Número de días en una semana. Número de días en un mes. Número de días y meses en un año. Año bisiesto. Escribe la fecha de dos formas diferentes. C.EV.5.2.a. J) Día de la NO-Violencia y la Paz. Puzle de la Paz. Escribe un mensaje y construye el puzle. (V) Concurso de problemas.","CMN":"(J) Vídeo ¿Cómo se mueve la Tierra? Representamos nuestro planeta. Haz un dibujo con los movimientos de la Tierra. Cuenta cuál es tu estación del año favorita y por qué. 30 de enero. Día de la No Violencia y la Paz. Marcha por la paz. C.Ev.2.2.a (V) SdA. UD. Plano de mi barrio incluyendo centros sanitarios cercanos.","EAR":"(V) Texturas visuales. Elaboración de un collage marino."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Partes de una carta. (M) Leo una carta. Comprendo la lectura C.EV.4.1.a. Los determinantes posesivos. C.EV.6.1.a. (X) Capítulo del libro. Taller de escritura. Escribo una carta a un compañero para felicitarle por su cumpleaños. C.EV.5.1.a. (J) Cuenta cuentos. Las instrucciones. Cuento unas instrucciones. Cómo elaborar una brocheta de fruta saludable C.EV.7.1.a. (V) Dramatizaciones. Los determinantes numerales. Copio y completo un esquema.","MAT":"(L) Vídeo. El día, la hora y los minutos. Horas en un día. Recuentos de horas. ¿Cuántas horas hay en 2 días? Calcula cuantas horas hay en una semana. (M) Problemas exprés. (X) Resolución de problemas. Minutos en una hora ¿Cuántos minutos son 3 horas? Media hora y cuarto de hora. ¿Cuántos minutos son tres cuartos de hora? (J) Las horas y los minutos. ¿Cuántas horas tienen 4 días? Calcula los minutos que hay. ¿Cuántos cuartos de hora son 60 minutos? (V) Concurso de problemas. Cálculo mental. Suma de dos cifras con llevadas en unidades. C.Ev.3.2.a.","CMN":"(J) ¿Cómo podemos representar la Tierra? Escribe la diferencia entre un globo terráqueo y un planisferio. Escribe los elementos de un planisferio. Busca tu país y localízalo en un globo terráqueo. C.Ev.5.1.1.a. (V) SdA. UD. Plano de mi barrio incluyendo centros sanitarios cercanos.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Partes de un correo electrónico. (M) Leo un correo electrónico. Vocabulario. Comprendo la lectura. Completo el esquema de los determinantes. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo una carta a un compañero para felicitarle por su cumpleaños. Lectura a los compañeros. (J) Cuenta cuentos. El sonido de la r suave y fuerte. (V) Dramatizaciones. Repasamos las reglas de ortografía. Dictado. Leo, escucho, escribo, reviso e intercambio de cuadernos. C.EV. 9.2.a.","MAT":"(L) Leo la hora de un reloj. Aguja corta y aguja larga. Dibuja en tu cuaderno relojes y relaciona la hora escrita. Escribe la hora de los relojes. C.EV.4.1.a. (M) Problemas exprés. (X) Resolución de problemas. Haz una redacción explicando qué haces al salir del cole e indica las horas de cada actividad. (J) El reloj digital. Leer la hora en reloj digital. Pasar de analógico a digital. (V) Concurso de problemas. Pienso paso a paso. Recordar los días de cada mes utilizando los nudillos. C.Ev.7.2.a.","CMN":"(J) ¿Cómo nos podemos orientar? ¿Para qué usamos los mapas? ¿Qué métodos usarías para orientarte en un bosque? Busca información sobre cómo funciona una brújula. (V) SdA. Proyecto. ¿Buceamos? Producto. Máscara marina. Galería de Arte sostenible. C.Ev. 6.1.a.","EAR":"(V) APS. Opera prima Producto. Fotografías para el corto de animación. C.Ev. 2.C.7."}],"complementaria":"SdA. 30 de enero. Día de la No Violencia y la Paz. Marcha por la paz.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos, reloj analógico"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los criterios de evaluación. Orden 30/5/23","procedimientos":"Observación sistemática, corrección de tareas.","evidencias":"Evidencias-Trazabilidad. Respuestas a preguntas, producto final de tareas y proyectos. Desempeños. Presentación oral, ...","productos":"Plano","autoevaluacion":"Autoevaluación-coevaluación","criteriosEvaluados":{"LCL":["3.2.a","4.1.a","5.1.a","7.1.a","9.2.a"],"MAT":["2.2.a","3.2.a","4.1.a","5.2.a","7.2.a"],"CMN":["2.2.a","5.1.a","6.1.a"],"EAR":["2.C.7"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el original indica 'Del 27 de enero al 14 de febrero de 2025'. En 2025 (lun 27/1 - vie 14/2) salen 15 días lectivos (coincide); en 2026 el 14/2 sería sábado. Año incoherente con UD fechadas en 2025-2026.","ODS indicado como 'ODS 14-16'; se separa en ODS 14 y ODS 16. El título de sda.ud no aparece explícito: se usa el título de la UD.","SdA APS: producto 'Fotografías para el corto. Un día en el cole.' en la justificación y 'Fotografías para el corto de animación' en la semana 3.","LCL: el saber 2.B.3.4 aparece repetido con dos textos distintos ('Lectura compartida y entonada' y 'Estrategias antes, durante y después'). En las semanas aparecen C.EV.6.1.a (semanas 1 y 2) y C.EV.8.3.a (semana 1), que no son criterios de LCL en esta UD.","MAT: el criterio de la tabla es 7.1.a, pero en semana 3 y en la evaluación figura 7.2.a. Texto del criterio 7.1.a cortado ('...al abordar retos'). Semana 1 'J)' sin paréntesis de apertura. Semana 2 (V) 'Suma de dos cifras con llevadas' no encaja con la medida del tiempo.","CMN: código mal formado 'C.Ev.5.1.1.a' (semana 2; debería ser 5.1.a). Textos del criterio 5.1.a y del saber 2.C.1.1 cortados.","EAR: el criterio es 2.2.a, pero en semana 3 y en la evaluación se usa el código del saber 2.C.7 como criterio; semanas 1 y 2 sin C.EV.","LCL semana 3 (X) repite la carta de cumpleaños de la semana 2 pese a trabajarse el correo electrónico.","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción."]},{"numero":8,"titulo":"Centinelas del mar","trimestre":2,"fechas":"Del 17 de febrero al 14 de marzo","dias":15,"centroInteres":"Los paisajes de Andalucía.","relevanciaSocial":"Conocer la identidad cultural y valorar la conservación del medioambiente. Decreto 101/2023.","ods":["ODS 14. Vida submarina","ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Centinelas del mar","producto":"Cartel sobre el cuidado del medioambiente."},"proyecto":{"nombre":"¿Buceamos?","producto":"Diorama marino. Galería de Arte sostenible."},"aps":{"nombre":"Opera prima","producto":"Fotografías para el corto. Un día en el cole."}},"objetivosEtapa":["e","g","h","i","j","m","ñ"],"objetivosAprendizaje":["1. Conocer y producir textos literarios. Escuchar y contar textos periodísticos y entrevistas. Leer y escribir una noticia.","2. Utilizar los conocimientos básicos sobre la lengua: los pronombres personales, el número y el género, los gentilicios y palabras con c/q y c/z.","3. Comprender la importancia de los gráficos de líneas para representar datos.","4. Elaborar e interpretar gráficos de barras simples a partir de datos recogidos.","5. Manifestar valores de respeto hacia el medio ambiente proponiendo medidas para su conservación.","6. Desarrollar una sensibilidad propia en la investigación artística."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-4-5), CD (1-2-3-4), CPSAA (1-3-4), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"2","texto":"Comprender textos orales y multimodales para construir conocimiento."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"8","texto":"Leer, interpretar y analizar de manera acompañada obras literarias adecuados a su desarrollo."},{"num":"9","texto":"Reflexionar sobre el lenguaje a partir de procesos de producción y comprensión de textos."}],"criterios":[{"codigo":"2.1.a","texto":"Comprender el sentido de textos orales."},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"8.3.a","texto":"Conocer textos de la literatura tradicional"},{"codigo":"9.2.a","texto":"Revisar los textos propios y ajenos."}],"saberes":[{"codigo":"2.B.3.2","texto":"Interpretación del sentido global."},{"codigo":"2.B.3.4","texto":"Lectura compartida y entonada."},{"codigo":"2.B.3.5","texto":"Coherencia y cohesión textual."},{"codigo":"2.C.7","texto":"Literatura popular andaluza."},{"codigo":"2.D.6","texto":"Los signos de puntuación."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"1","texto":"Interpretar situaciones de. La vida cotidiana para analizar la información más relevante."},{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"6","texto":"Comunicar y representar de forma individual y colectiva, conceptos, procedimientos y resultados."},{"num":"8","texto":"Desarrollar destrezas sociales, participando en equipos de trabajo heterogéneos con roles asignados."}],"criterios":[{"codigo":"1.1.a","texto":"Comprender problemas de la vida."},{"codigo":"3.1.a","texto":"Realizar conjeturas matemáticas."},{"codigo":"4.2.a","texto":"Manejar herramientas adecuadas."},{"codigo":"6.2.a","texto":"Explicar procesos matemáticos sencillos."},{"codigo":"8.2.a","texto":"Respetar el reparto de tareas."}],"saberes":[{"codigo":"2.D.2.1","texto":"Representaciones matemáticas."},{"codigo":"2.E.3.1","texto":"Datos recogidos y analizados."},{"codigo":"2.A.3.4","texto":"Multiplicación de números naturales."},{"codigo":"2.E.1.3","texto":"Gráficos estadísticos y pictogramas."},{"codigo":"2.F.2.6","texto":"Colaboración en el trabajo cooperativo."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"2","texto":"Plantear y dar respuesta a cuestiones científicas sencillas, con técnicas del pensamiento científico."},{"num":"5","texto":"Identificar las características del medio natural y emprender acciones para un uso responsable."},{"num":"6","texto":"Identificar las causas y consecuencias de la intervención humana en el entorno."}],"criterios":[{"codigo":"2.2.a","texto":"Usar estrategias de selección de información."},{"codigo":"5.1.a","texto":"Reconocer características de los elementos del medio."},{"codigo":"6.1.a","texto":"Identificar problemas eco sociales."}],"saberes":[{"codigo":"2.A.1.1","texto":"Experimentos."},{"codigo":"2.C.1.3","texto":"Paisajes de España y Andalucía."},{"codigo":"2.C.4.4","texto":"Los ecosistemas naturales."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"3","texto":"Comunicar de manera creativa ideas, sentimientos y emociones."}],"criterios":[{"codigo":"3.1.a","texto":"Producir obras propias, utilizando la imagen y los medios digitales."}],"saberes":[{"codigo":"2.C.12","texto":"Aproximación a las herramientas y las técnicas de animación."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho un texto periodístico. C.EV.2.1.a. Los medios de comunicación. (M) Leo un texto periodístico. Deportes olímpicos. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Elige un deporte olímpico que se juegue en equipo. Busca información, redacta y haz una presentación (J) Cuenta cuentos. C.EV.4.1.a. Los gentilicios. Averigua de qué país es cada deportista y su gentilicio. (V) 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno.","MAT":"(L) Análisis de datos en tabla. Recogida de datos en tabla. (M) Problemas exprés. (X) Resolución de problemas. La moda, dato que más se repite. Nos colocamos en fila en el patio y jugamos a lanzar tiros libres, dobles y triples en la cancha de baloncesto. Anotamos el resultado en una tabla de datos. C.EV.1.1.a. J) Encuesta a la clase de 3º. ¿Cuál es el último médico especialista que has visitado este año? Recoge los datos y completa la tabla. Cuenta a la clase tu última experiencia en el especialista. C.EV.3.1.a. (V) 28 de febrero. Día de Andalucía. Preparación y degustación de un desayuno.","CMN":"(J) Vídeo ¿Conoces paisajes de costa y de interior? ¿Qué elementos naturales y humanos tienen? ¿Qué es un paisaje? Realizamos un esquema. ¿Qué causas humanas y artificiales puede modificar un paisaje? Escribe en tu cuaderno. C.Ev.6.1.a. (V) SdA. UD. Cartel sobre el cuidado del medioambiente","EAR":"(V) El bodegón de frutas."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Debate. Comprendo la lectura. (M) Leo un texto periodístico. Deportes olímpicos. Vocabulario. Comprendo la lectura. C.EV.6.1.a. (X) Capítulo del libro. Vocabulario. Taller de escritura. Investiga sobre los juegos paralímpicos. Redacta y lee a los compañeros. C.EV.5.1.a. (J) Cuenta cuentos. La entrevista. Inventa y ensaya con tu compañero/a una entrevista que harías a un deportista en la radio. (V) Dramatizaciones. Dramatizamos la entrevista a los compañeros.","MAT":"(L) Gráfico de barras. ¿Cómo llega al colegio el alumnado de 3º? Recogida de datos, llegan en bici, coche, autobús o a pie. Representación gráfica y análisis. ¿Cuántos van caminando al colegio? (M) Problemas exprés. C.Ev.8.2.a. (X) Resolución de problemas. Recogida de datos, representación gráfica y análisis de lo que toma en el recreo el alumnado de 3º, fruta, bocadillo o galletas. (J) Recogida de datos, representación gráfica y análisis de las mascotas del alumnado de 3º, perro, gato, otros. (V) Concurso de problemas. Cálculo mental. Multiplica por la unidad seguida de ceros. C.Ev.4.2.a.","CMN":"(J) Los paisajes de costa. Dibuja dos paisajes uno de interior y otro de costa. Escribe los elementos. Busca fotografías de un paisaje y describe a la clase. (V) Experimento. Plástico ecológico. Método científico. C.Ev2.2.a. SdA. UD. Cartel sobre el cuidado del medioambiente.","EAR":"(V) Pablo Picasso. Descubriendo el cubismo, guía de dibujo. Colorea como quieras."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Comprendo la lectura. Partes de una notica. Cambia el título y la entradilla. (M) Leo un texto periodístico. Los pronombres personales. El número y el género. Esquema. (X) Capítulo del libro. Taller de escritura. En grupos, escribimos una noticia sobre el deporte en equipo, siguiendo un esquema. Borrador, redactar, revisar la ortografía, pasar a limpio y hacer un dibujo. (J) Cuenta cuentos. C.EV.8.3.a. Palabras con c/q y c/z. (V) Dramatizaciones. Dictado. C.EV.9.2.a.","MAT":"(L) Representa un pictograma sobre el tipo de libro preferido del alumnado de 3º, animales, dinosaurios o cómic. Analiza los datos. C.EV.6.2.a. (M) Problemas exprés. (X) Resolución de problemas. Elabora un pictograma con los cumpleaños de cada mes. Analiza los datos. (J) Gráfico de líneas. Temperaturas máximas y mínimas. Busca información del tiempo atmosférico en tu localidad y anota la temperatura. (V) Concurso de problemas. Pienso paso a paso. ¿Qué cesto es el intruso?","CMN":"(J) Los paisajes de interior y de costa. Busca los sistemas montañosos de España y escribe sus nombres. Identifica las provincias que tienen un paisaje de costa. Dibuja un mapa de los archi a. Vocabulario. C.EV.2.1.a. Consejos para participar en un debate. (M) Leo un diálogo. Vocabulario. Comprendo la lectura. Uso de las rayas en el texto. (X) Capítulo del libro. Taller de escritura. Escribo un diálogo entre personajes de un cuento. C.EV.5.1.a. (J) Cuenta cuentos. C.EV.4.1.a. Busca en la biblioteca un cuento donde se reproduzca un diálogo y se utilicen rayas. Lee y escribe un resumen. C.EV.6.1.a. (V) Dramatizaciones. Improvisar una conversación telefónica. Ejemplo: llamar a tus padres al trabajo para pedirles que vayan a buscarte al colegio.","MAT":"(L) Dibuja un ángulo y marca sus partes. Rectas perpendiculares. Indica si las rectas son perpendiculares o no. Escribe una lista de objetos del aula que contengan ángulos rectos. (M) Problemas exprés. (X) Resolución de problemas. Dibuja tres ángulos rectos con la ayuda de la escuadra. Gira la escuadra para que los ángulos estén en diferentes posiciones. C.EV.2.1.a. (J) Calca el plano y completa el nombre de las calles, siguiendo las instrucciones. (V) Concurso de problemas. Cálculo mental. Doble de dos cifras sin llevadas. C.EV.7.1.a.","CMN":"(J) Investiga sobre los avances e inventos de la Edad moderna y realiza una ficha de uno de ellos, el que creas más importante. Ponla en común con el resto de la clase. (V) SdA. UD. Línea del tiempo de nuestra vida.","EAR":"(V) Murillo. Copia la obra. Niños comiendo melón y uvas."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. C.EV.2.1.a. Clases de oraciones. Copio y completo el esquema C.EV.9.1.a. (M) Salida al Centro Pompidou en Málaga. (X) Capítulo del libro. Taller de escritura. Escribo un diálogo entre personajes de un cuento. Lectura a los compañeros. (J) Cuenta cuentos. C.EV.4.1.a. Vocabulario. Palabras terminadas en d y z (V) Dramatizaciones. Repasamos la ortografía de la unidad. Inventamos un dictado en grupo. Por equipos, formamos oraciones, escribimos y entregamos al maestro/a. Escucha, escribe, revisa y corrige.","MAT":"(L) Esquema tipo de ángulos. En grupos, representa ángulos de diferente amplitud, con el cuerpo. (M) Salida al Centro Pompidou en Málaga. (X) Resolución de problemas. Situación en un plano. Dibuja el plano de tu clase. Fíjate en la forma de tu clase, donde están las puertas y las ventanas. Dibuja primero los objetos grandes y después el resto. C.EV.5.1.a. (J) Construimos un geoplano para conocer mejor las rectas los ángulos y el plano. (V) Concurso de problemas. Pienso paso a paso. Utiliza un muñequito para indicar los pasos a seguir para llegar hasta la casa en el plano. C.EV.4.1.a.","CMN":"(J) Investiga y escribe algunos avances de la Edad Contemporánea, comparte el resultado con el grupo. (V) SdA. Proyecto. Huellas del pasado. Producto. Escribir el contenido del Lapbook.","EAR":"(V) APS. Opera prima. Producto. Diseño de un cartel para el evento de fin de curso. C.EV.2.B.11"}],"complementaria":"Salida al Centro Pompidou en Málaga.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos."},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los criterios de evaluación. Orden 30/5/23","procedimientos":"Observación sistemática, corrección de tareas.","evidencias":"Evidencias-Trazabilidad. Respuestas a preguntas, producto final de tareas y proyectos. Desempeños. Presentación oral, ...","productos":"Cartel","autoevaluacion":"Autoevaluación-coevaluación","criteriosEvaluados":{"LCL":["3.2.a","4.1.a","5.1.a","6.1.a","9.1.a"],"MAT":["2.1.a","3.2.a","4.1.a","5.4.a","7.1.a"],"CMN":["2.2.a","5.1.a","6.1.a"],"EAR":["2.B.11"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el original indica 'Del 8 al 30 de mayo de 2025'. En 2025 el 8/5 es jueves y el 30/5 viernes: salen 17 días lectivos (coincide), pero son 3 semanas y media y la secuenciación solo tiene 3 semanas con (L)-(V).","ODS indicado como 'ODS 4-16'; se separa en ODS 4 y ODS 16. El título de sda.ud no aparece explícito: se usa el título de la UD.","LCL: en las semanas 2 y 3 se usa 'C.EV.2.1.a', criterio que no existe en LCL en esta UD (sí 3.2.a, 4.1.a, 5.1.a, 6.1.a, 9.1.a). La actividad (X) 'Escribo un diálogo entre personajes de un cuento' se repite en semanas 2 y 3. La semana 1 (ciudades del futuro, robots) casa poco con el centro de interés (la historia). Falta punto antes de '(V)' en semana 3 y tras 'Participo en un debate' en semana 1.","MAT: errata 'restas paralelas' (rectas) en semana 1; 'Identifica ángulos Los elementos' sin punto. El criterio 7.1.a empieza en minúscula. En la evaluación aparece 'MAT. 5.4.a', pero el criterio de la UD es 5.1.a. El saber 2.E.1.1 'Gráficos estadísticos cotidianos' no se trabaja en ninguna actividad.","CMN: en semana 1 se usa 'C.Ev 5.1.a.' y en la evaluación 'CMN. 2.2.a. / 5.1.a. / 6.1.a.', que no coinciden con los criterios de la UD (2.2.a, 7.1.a, 9.1.a); 5.1.a y 6.1.a parecen copiados de otra UD. Semanas 2 y 3 sin C.EV. Competencia 9: 'Participar la vida social' (falta 'en') y 'dialogo' sin tilde. La SdA UD 'Línea del tiempo de nuestra vida' figura en (V) de las semanas 1 y 2.","EAR: el criterio es 3.3.a, pero en semana 3 y en la evaluación se usa el código del saber 2.B.11 como criterio. El saber 'Características del lenguaje audiovisual' casa poco con esgrafiado, copia de Murillo y diseño de un cartel. En el original falta espacio en 'curso.C.EV.2.B.11'.","Complementaria: la salida al Centro Pompidou ocupa el (M) de la semana 3 en LCL y MAT.","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción."]},{"numero":12,"titulo":"Huellas del pasado","trimestre":3,"fechas":"Del 2 al 20 de junio","dias":15,"centroInteres":"Las edades de la historia, los museos y monumentos.","relevanciaSocial":"Comprender la evolución de las sociedades a lo largo del tiempo. Decreto 101/2023.","ods":["ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Huellas del pasado","producto":"Maqueta del Centro Pompidou."},"proyecto":{"nombre":"Huellas del pasado","producto":"Decorar y presentar el Lapbook."},"aps":{"nombre":"Opera prima","producto":"Festival de cine fin de curso."}},"objetivosEtapa":["d","e","g","h","i","j","o"],"objetivosAprendizaje":["1. Conocer y producir textos literarios: escuchar y dramatizar una obra de teatro y leer y escribir un texto teatral.","2. Utilizar los conocimientos de la lengua: las lenguas de España, palabras con bl y br.","3. Identificar y clasificar los triángulos según sus lados y sus ángulos y los cuadriláteros en paralelogramos y no paralelogramos.","4. Aprender a dibujar una circunferencia con el compás y sus elementos: centro, radio y diámetro.","5. Identificar el patrimonio cultural como algo que hay que cuidar y valorar los museos.","6. Producir obras propias tanto de forma individual como colectiva."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-4), CD (1-2-3-4-5), CPSAA (1-2-3), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"1","texto":"Reconocer la diversidad lingüística para valorarla como fuente de riqueza cultural."},{"num":"3","texto":"Producir textos orales y multimodales para expresar ideas y sentimientos."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"8","texto":"Leer, interpretar y analizar de manera acompañada obras literarias adecuados a su desarrollo."},{"num":"10","texto":"Poner las prácticas comunicativas al servicio de la convivencia democrática."}],"criterios":[{"codigo":"1.2.a","texto":"Identificar la pluralidad lingüística."},{"codigo":"3.2.a","texto":"Participar en interacciones orales."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"8.3.a","texto":"Conocer textos de la literatura tradicional."},{"codigo":"10.2.a","texto":"Iniciar la gestión dialogada de conflictos."}],"saberes":[{"codigo":"2.A.2","texto":"La diversidad lingüística andaluza."},{"codigo":"2.B.3.2","texto":"Comprensión oral. Sentido global."},{"codigo":"2.B.3.5","texto":"Producción escrita. Ortografía reglada."},{"codigo":"2.C.1","texto":"Lectura de obras de la literatura infantil."},{"codigo":"2.B.1.1","texto":"Incidencia en el acto comunicativo."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"3","texto":"Plantear problemas de tipo matemático en situaciones basadas en la vida cotidiana."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"5","texto":"Reconocer y utilizar conexiones entre diferentes ideas matemáticas."},{"num":"6","texto":"Comunicar situaciones matemáticas, utilizando el lenguaje oral, escrito, gráfico."},{"num":"8","texto":"Participar activamente en equipos de trabajo heterogéneos con roles asignados."}],"criterios":[{"codigo":"3.2.a","texto":"Ejemplificar situaciones problema."},{"codigo":"4.1.a","texto":"Utilizar el pensamiento computacional."},{"codigo":"5.1.a","texto":"Realizar conexiones matemáticas."},{"codigo":"6.1.a","texto":"Utilizar vocabulario específico."},{"codigo":"8.1.a","texto":"Colaborar en el trabajo en equipo."}],"saberes":[{"codigo":"2.B.1.1","texto":"Amplitud del ángulo."},{"codigo":"2C.1.4","texto":"Propiedades de figuras geométricas."},{"codigo":"2.C.4.1","texto":"Cálculo de perímetros de figuras planas."},{"codigo":"2.D.1.1","texto":"Descripción verbal a partir de figuras."},{"codigo":"2.F.2.4","texto":"Formulación de conjeturas a partir de datos."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"3","texto":"Resolver problemas cooperativamente para generar productos creativos e innovadores."},{"num":"7","texto":"Comprender cambios del medio social y cultural para explicar los diferentes acontecimientos."},{"num":"9","texto":"Participar en la vida social desde el respeto para generar interacciones positivas de dialogo."}],"criterios":[{"codigo":"3.1.a","texto":"Diseñar en equipo un producto final sencillo."},{"codigo":"7.2.a","texto":"Conocer las principales características de las personas."},{"codigo":"9.1.a","texto":"Emplear un lenguaje inclusivo y no violento."}],"saberes":[{"codigo":"2.B.2.3","texto":"Técnicas cooperativas sencillas."},{"codigo":"2.A.1.5","texto":"Avances en el pasado."},{"codigo":"2.C.3.2","texto":"Normas para la vida en sociedad."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"4","texto":"Participar de la elaboración y la difusión de producciones artísticas."}],"criterios":[{"codigo":"4.3.a","texto":"Compartir los proyectos creativos, explicando el proceso y el resultado."}],"saberes":[{"codigo":"2.C.1","texto":"Materiales de expresión plástica y visual."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho un ensayo teatral. Respondo a las preguntas. Las obras de teatro. C.EV.3.2.a. (M) Leo una obra de teatro. Vocabulario. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Crear un cartel publicitario con un eslogan sobre un medio de transporte. (J) Cuenta cuentos. El campo semántico. En grupos, escribir todas las palabras que pertenezcan al campo semántico deportes. (V) Dramatizo una obra de teatro. Escribe los consejos para dramatizar una obra de teatro.","MAT":"(L) Los polígonos. Identifica los polígonos. Dibuja polígonos en tu cuaderno. Elementos de un polígono. (M) Problemas exprés. (X) Resolución de problemas. El nombre de los polígonos según su número de lados. Dibuja tres polígonos y escribe cómo se llaman. ¿cuántos lados tienen? Dibuja tres figuras que no sean polígonos. (J) Identifica los lados, vértices y ángulos de los polígonos. C.EV.3.2.a. Juega con bloques geométricos, forma polígonos e indica su nombre. Haz series o forma figuras. Busca polígonos en los objetos que hay a tu alrededor y dibuja alguno. C.EV.6.1.a. (V) Concurso de problemas.","CMN":"(J) ¿Qué son las fuentes históricas? Busca en internet y escribe el titular de una noticia histórica de tu localidad. (V) SdA. UD. Maqueta del Centro Pompidou. C.Ev.3.1.a.","EAR":"(V) Crea como quieras una invitación para el evento de final de curso."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Respondo a las preguntas. Las lenguas de España. C.EV.1.2.a. (M) Leo un texto. Vocabulario. C.EV.8.3.a. Comprendo la lectura. El andaluz. (X) Capítulo del libro. Taller de escritura. Escribo un texto teatral. En grupos, decidís argumento, personajes y lugar. Como empieza y acaba la historia. Los diálogos, la vestimenta, el decorado y como se va a llamar vuestra obra. (J) Cuenta cuentos. Copio y completo el esquema de las lenguas de España. (V) Dramatizo una obra de teatro.","MAT":"(L) El perímetro. Calcula el perímetro de los polígonos dados. Dibuja un cuadrilátero que tenga todos sus lados iguales y cuyo perímetro mida 12 cm. Calcula el perímetro en centímetros de tu mesa. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Clases de triángulos. Esquema. Clasifica según sus lados. (J) Clase de triángulos según sus ángulos. Esquema. Clasifica los triángulos que hay en el tangram. Recorta un cuadrado y divídelo en dos triángulos iguales. C.EV.3.2.a. (V) Concurso de problemas. Cálculo mental. Mitad de cifras pares. C.EV.8.1.a.","CMN":"(J) ¿Qué son los museos? ¿Has visitado alguno? Redacta y expón al grupo normas sobre cómo comportarse en un museo. 14 de junio. Día de la Memoria Histórica. Exposición de dibujos contra la guerra C.Ev.9.1.a. (V) SdA. UD. Maqueta del Centro Pompidou","EAR":"(V) Murillo. Copia la obra Niños comiendo melón y uvas. Mural de las obras del grupo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Respondo a las preguntas. Participo en un debate. ¿Qué pasaría si tuvieras que irte a vivir a otro país? C.EV.10.1.a (M) Leo un texto. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Escribo un texto teatral. En grupos, decidís argumento, personajes y lugar. Como empieza y acaba la historia. Los diálogos, la vestimenta, el decorado y como se va a llamar vuestra obra. (J) Cuenta cuentos. C.EV.5.1.a Palabras con bl y br. (V) Dramatizo una obra de teatro. Dictado.","MAT":"(L) Clases de cuadriláteros. Esq <script>

    leer(clave, defecto) {

      } catch (e) { return defecto; }

    escribir(clave, valor) {

    borrarTodo() {

        Object.keys(window.localStorage).filter((k) => k.startsWith(PREFIJO)).forEach((k) => window.localStorage.removeItem(k));

    exportar() {

        Object.keys(window.localStorage).filter((k) => k.startsWith(PREFIJO)).forEach((k) => { out[k.slice(PREFIJO.length)] = JSON.parse(window.localStorage.getItem(k)); });

  // ---------------------------------------------------------------- tiempo y números
  const mmss = (seg) => {

    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  const coma = (n, dec = 1) => Number(n).toFixed(dec).replace('.', ',');
  const contarPalabras = (t) => { const s = String(t || '').trim(); return s ? s.split(/\s+/).length : 0; };
  const PPM = 130;

  // ---------------------------------------------------------------- huecos {{id}}
  const HUECO_RE = /\{\{\s*([a-z0-9_]+)\s*\}\}/g;
  /** Divide un texto con huecos en partes [{t, h}] (h = id de hueco o null). */
  function partes(texto, valores) {
    const out = [];
    let ultimo = 0;
    const s = String(texto || '');
    HUECO_RE.lastIndex = 0;
    let m;
    while ((m = HUECO_RE.exec(s))) {
      if (m.index > ultimo) out.push({ t: s.slice(ultimo, m.index), h: null });
      const v = valores ? (Object.prototype.hasOwnProperty.call(valores, m[1]) ? String(valores[m[1]]) : '') : null;
      out.push({ t: v == null ? m[0] : v, h: m[1] });
      ultimo = m.index + m[0].length;
    }
    if (ultimo < s.length) out.push({ t: s.slice(ultimo), h: null });
    return out;
  }
  const textoDe = (ps) => ps.map((p) => p.t).join('');
  function htmlPartes(ps, { etiquetas = null } = {}) {
    return ps.map((p) => {
      if (!p.h) return esc(p.t);
      const contenido = etiquetas ? `⟨${esc(etiquetas[p.h] || p.h)}⟩` : esc(p.t);
      return `<span class="propio" data-hueco="${esc(p.h)}">${contenido}</span>`;
    }).join('');
  }

  // ---------------------------------------------------------------- frases (mismo criterio que herramientas/audio/generar_audio.py)
  const FIN_FRASE = /[.!?…:;]["»”)]*\s+(?=[¿¡«"“(]?[A-ZÁÉÍÓÚÑ0-9])/g;
  function frases(texto) {
    const res = [];
    let inicio = 0;
    FIN_FRASE.lastIndex = 0;
    let m;
    while ((m = FIN_FRASE.exec(texto))) {
      const corte = m.index + 1;
      const trozo = texto.slice(inicio, corte).trim();
      const previo = texto.slice(Math.max(0, corte - 6), corte);
      if (/\b(art|Sr|Sra|núm|pág|etc|p\. ej|ej)\.$/.test(previo) || trozo.length < 12) continue;
      res.push([inicio, corte]);
      inicio = m.index + m[0].length;
    }
    if (texto.slice(inicio).trim()) res.push([inicio, texto.length]);
    return res.map(([a, b]) => {
      while (a < b && /\s/.test(texto[a])) a++;
      while (b > a && /\s/.test(texto[b - 1])) b--;
      return [a, b];

  }

  /** Corta las partes (con huecos) en trozos por frase: [{frase, trozos:[{t,h}]}] y "entre" (huecos de texto sueltos). */
  function partesPorFrase(ps, cortes) {
    const texto = textoDe(ps);
    // posiciones de partes
    const segs = [];
    let pos = 0;
    ps.forEach((p) => { segs.push({ a: pos, b: pos + p.t.length, h: p.h }); pos += p.t.length; });
    const res = [];
    let cursor = 0;
    const tomar = (a, b, frase) => {
      if (b <= a) return;
      const trozos = [];
      segs.forEach((s) => {
        const x = Math.max(a, s.a);
        const y = Math.min(b, s.b);
        if (y > x) trozos.push({ t: texto.slice(x, y), h: s.h });
      });
      res.push({ frase, trozos });
    };
    cortes.forEach(([a, b], i) => {
      tomar(cursor, a, null);
      tomar(a, b, i);
      cursor = b;
    });
    tomar(cursor, texto.length, null);
    return res;
  }

  // ---------------------------------------------------------------- aleatorio con semilla
  function aleatorio(semilla) {
    let s = semilla >>> 0 || 1;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashTexto(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---------------------------------------------------------------- texto para la voz del navegador
  const SIGLAS = {

  function paraVoz(t) {
    return String(t)
      .replace(/[«»“”"]/g, '')
      .replace(/\s*[—–]\s*/g, ', ')

      .replace(/(\d+)\/(\d+)\/(\d{4})/g, (m, d, mes, a) => (MESES[+mes - 1] ? `${d} de ${MESES[+mes - 1]} de ${a}` : m))
      .replace(/(\d+)\/(\d{4})/g, '$1 de $2')
      .replace(/\b(\d)\.º/g, (m, d) => ({ 1: 'primero', 2: 'segundo', 3: 'tercero', 4: 'cuarto', 5: 'quinto', 6: 'sexto' }[d] || d))

        aviso('Texto seleccionado: cópialo con Ctrl+C');

  }

  // ---------------------------------------------------------------- iconos
  const ICONOS = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    pausa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
    atras: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>',
    adelante: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 6h2v12h-2zM14.5 12 6 18V6z"/></svg>',
    menos10: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">10</text></svg>',
    mas10: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" font-family="sans-serif" font-weight="700">10</text></svg>',
    pantalla: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    cerrar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>',
    micro: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 11.5a6 6 0 0 0 12 0M12 17.5V21"/></svg>',

<script>
/* Modelo de datos (exposiciones), progreso del estudio y reproductor de audio. */
(function () {
  'use strict';
  const Opo = window.Opo;
  const { partes, textoDe, frases, contarPalabras, PPM, Almacen } = Opo;

  // =============================================================== MODELO
  const DATOS = window.OPOS_DATOS || {};
  const AUDIO = window.OPOS_AUDIO || {};

  const pad2 = (n) => String(n).padStart(2, '0');

  function construirExposicion({ id, tipo, doc, valores, audioClave, titulo, corto, ud, ficha }) {
    const secciones = [];
    const bloques = [];
    const lista = [];
    const pizarra = [];
    let minAcum = 0;
    let palabrasAcum = 0;
    (doc.secciones || []).forEach((s, si) => {
      const sec = {
        id: s.id, idx: si, titulo: textoDe(partes(s.titulo, valores)), rubrica: s.rubrica || [],
        minutos: Number(s.minutos) || 0, esquema: (s.esquema || []).map((e) => partes(e, valores)),
        bloques: [], palabras: 0, iniMin: minAcum, finMin: minAcum + (Number(s.minutos) || 0),
      };
      minAcum = sec.finMin;
      (s.bloques || []).forEach((b) => {
        const ps = partes(b.texto, valores);
        const texto = textoDe(ps);
        const cortes = frases(texto);
        const bl = { id: b.id, seccion: si, partes: ps, texto, cortes, primeraFrase: lista.length, nFrases: cortes.length, palabras: contarPalabras(texto) };
        cortes.forEach(([a, z], k) => {
          const t = texto.slice(a, z);
          const w = contarPalabras(t);
          lista.push({ idx: lista.length, bloque: bloques.length, seccion: si, k, a, z, texto: t, palabras: w, est0: (palabrasAcum / PPM) * 60, est1: ((palabrasAcum + w) / PPM) * 60 });
          palabrasAcum += w;
        });
        const items = b.pizarra || [];
        items.forEach((p, j) => {
          const k = cortes.length ? Math.min(cortes.length - 1, Math.floor((j * cortes.length) / Math.max(1, items.length))) : 0;
          pizarra.push({
            id: `${b.id}-${j}`, zona: p.zona, caja: p.caja ? textoDe(partes(p.caja, valores)) : '', partes: partes(p.texto, valores),
            seccion: si, bloque: bloques.length, frase: bl.primeraFrase + k,
          });
        });
        sec.palabras += bl.palabras;
        sec.bloques.push(bl);
        bloques.push(bl);
      });
      secciones.push(sec);
    });
    // tiempos de audio
    let audio = null;
    const a = AUDIO[audioClave];
    if (a && Array.isArray(a.frases)) {
      const porBloque = {};
      a.frases.forEach((f) => { (porBloque[f.b] = porBloque[f.b] || []).push(f); });
      let encaja = true;
      bloques.forEach((bl) => {
        const fs = porBloque[bl.id] || [];
        if (fs.length !== bl.nFrases) { encaja = false; return; }
        fs.forEach((f, k) => { const fr = lista[bl.primeraFrase + k]; fr.t0 = f.t0; fr.t1 = f.t1; });
      });
      if (encaja) audio = { src: `audio/${audioClave}.mp3`, duracion: a.duracion, voz: a.voz };
      else console.warn(`[audio] ${audioClave}: las frases no coinciden con el texto; se usará la voz del navegador.`);
    }
    const guion = doc.guion ? partes(doc.guion, valores) : null;
    return {
      id, tipo, titulo, corto, audioClave, secciones, bloques, frases: lista, pizarra, guion, audio, ud, ficha,
      palabras: palabrasAcum, minutosTexto: palabrasAcum / PPM, objetivoMinutos: doc.objetivoMinutos || minAcum,
      duracionEst: (palabrasAcum / PPM) * 60,
    };
  }

  const expos = {};
  const uds = (DATOS.uds || []).slice().sort((x, y) => x.numero - y.numero);
  const fichas = {};
  (DATOS.fichas || []).forEach((f) => { if (f && f.numero) fichas[f.numero] = f; });

  if (DATOS.programacion) {
    expos.pd = construirExposicion({
      id: 'pd', tipo: 'pd', doc: DATOS.programacion, valores: null, audioClave: 'programacion',
      titulo: DATOS.programacion.titulo || 'Defensa de la programación', corto: 'Programación',
    });
  }
  if (DATOS.plantilla) {
    uds.forEach((u) => {
      const id = `ud${pad2(u.numero)}`;
      expos[id] = construirExposicion({
        id, tipo: 'ud', doc: DATOS.plantilla, valores: u.valores || {}, audioClave: id,
        titulo: `UD ${u.numero}. ${u.titulo}`, corto: `UD ${u.numero}`, ud: u, ficha: fichas[u.numero] || null,
      });
    });
  }
  const etiquetasHuecos = {};
  ((DATOS.plantilla && DATOS.plantilla.huecos) || []).forEach((h) => {
    etiquetasHuecos[h.id] = h.etiqueta || h.id.replace(/_/g, ' ');
  });

  Opo.Modelo = {
    DATOS, expos, uds, fichas, etiquetasHuecos,
    rubricas: DATOS.rubricas || null,
    plantilla: DATOS.plantilla || null,
    idUD: (n) => `ud${pad2(n)}`,
    expo: (id) => expos[id] || null,
  };

  // =============================================================== PROGRESO
  const DIA = 86400000;
  const INTERVALOS = [0, 1, 3, 7, 16];
  const Progreso = {
    srs() { return Almacen.leer('srs', {}); },
    nivel(expoId, secId) { const s = this.srs(); return (s[expoId] && s[expoId][secId] && s[expoId][secId].n) || 0; },
    calificar(expoId, secId, nota) {
      const s = this.srs();
      s[expoId] = s[expoId] || {};
      const prev = s[expoId][secId] || { n: 0, veces: 0 };
      let n = prev.n;
      if (nota === 'otra') n = 0;
      else if (nota === 'dificil') n = Math.max(1, Math.min(n, 2));
      else if (nota === 'bien') n = Math.min(4, n + 1);
      else if (nota === 'facil') n = Math.min(4, n + 2);
      const ahora = Date.now();
      const prox = nota === 'otra' ? ahora + 10 * 60000 : ahora + INTERVALOS[n] * DIA;
      s[expoId][secId] = { n, veces: (prev.veces || 0) + 1, prox, ult: ahora };
      Almacen.escribir('srs', s);
      return s[expoId][secId];
    },
    dominio(expo) {
      if (!expo) return 0;
      const s = this.srs()[expo.id] || {};
      const total = expo.secciones.length * 4;
      return total ? expo.secciones.reduce((a, sec) => a + ((s[sec.id] && s[sec.id].n) || 0), 0) / total : 0;
    },
    pendientes() {
      const s = this.srs();
      const ahora = Date.now();
      const out = [];
      Object.entries(s).forEach(([eid, secs]) => Object.entries(secs).forEach(([sid, v]) => { if (v.prox && v.prox <= ahora) out.push({ expo: eid, seccion: sid, ...v }); }));
      return out.sort((a, b) => a.prox - b.prox);
    },
    ensayos() { return Almacen.leer('ensayos', []); },
    guardarEnsayo(e) { const l = this.ensayos(); l.unshift(e); Almacen.escribir('ensayos', l.slice(0, 200)); },
    autoevaluaciones() { return Almacen.leer('rubricas', []); },
    guardarAutoevaluacion(r) { const l = this.autoevaluaciones(); l.unshift(r); Almacen.escribir('rubricas', l.slice(0, 200)); },
    tarjetas() { return Almacen.leer('tarjetas', {}); },
    marcarTarjeta(clave, bien) {
      const t = this.tarjetas();
      const v = t[clave] || { ok: 0, ko: 0 };
      if (bien) v.ok++; else v.ko++;
      v.ult = Date.now();
      t[clave] = v;
      Almacen.escribir('tarjetas', t);
    },
    sorteos() { return Almacen.leer('sorteos', []); },
    guardarSorteo(s) { const l = this.sorteos(); l.unshift(s); Almacen.escribir('sorteos', l.slice(0, 100)); },
    escuchado(expoId, segundos) {
      const e = Almacen.leer('escuchado', {});
      e[expoId] = Math.max(e[expoId] || 0, segundos);
      Almacen.escribir('escuchado', e);
    },
  };
  Opo.Progreso = Progreso;

  // =============================================================== AJUSTES
  const AJ_DEF = { tema: 'sistema', tamTexto: 1.12, voz: '', velocidad: 1, fuente: 'auto', marcaPropio: true, notasPizarra: false };
  Opo.Ajustes = {
    leer() { return { ...AJ_DEF, ...Almacen.leer('ajustes', {}) }; },
    poner(k, v) { const a = this.leer(); a[k] = v; Almacen.escribir('ajustes', a); this.aplicar(); return a; },
    aplicar() {
      const a = this.leer();
      const r = document.documentElement;
      if (a.tema === 'claro') r.setAttribute('data-theme', 'light');
      else if (a.tema === 'oscuro') r.setAttribute('data-theme', 'dark');
      else r.removeAttribute('data-theme');
      r.style.setProperty('--texto-discurso', `${a.tamTexto}rem`);
    },
  };

  // =============================================================== REPRODUCTOR
  function buscarFrase(lista, t) {
    let lo = 0;
    let hi = lista.length - 1;
    let res = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if ((lista[mid].t0 ?? 0) <= t + 0.05) { res = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return res;
  }

  function vozPreferida() {
    if (!('speechSynthesis' in window)) return null;
    const voces = window.speechSynthesis.getVoices().filter((v) => /^es(-|_|$)/i.test(v.lang));
    if (!voces.length) return null;
    const elegida = Opo.Ajustes.leer().voz;
    const exacta = voces.find((v) => v.name === elegida);
    if (exacta) return exacta;
    const puntuar = (v) => (/es-ES/i.test(v.lang) ? 4 : 0) + (/natural|online|neural/i.test(v.name) ? 3 : 0) + (/google|elvira|alvaro|álvaro|lucia|lucía|mónica|monica|paulina|helena|laura/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
    return voces.slice().sort((x, y) => puntuar(y) - puntuar(x))[0];
  }

  class Reproductor {
    constructor() {
      this.expo = null;
      this.modo = 'voz';
      this.frase = 0;
      this.reproduciendo = false;
      this.velocidad = Opo.Ajustes.leer().velocidad || 1;
      this.subs = new Set();
      this.audio = null;
      this.token = 0;
      this.errorAudio = '';
      this.blobUrls = {};
    }
    suscribir(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
    emitir() { const e = this.estado(); this.subs.forEach((fn) => { try { fn(e); } catch (err) { console.error(err); } }); }
    estado() {
      const ex = this.expo;
      const total = ex ? (this.modo === 'mp3' ? ex.audio.duracion : ex.duracionEst / this.velocidad) : 0;
      const fr = ex ? ex.frases[this.frase] : null;
      let t = 0;
      if (ex && this.modo === 'mp3' && this.audio) t = this.audio.currentTime;
      else if (fr) t = fr.est0 / this.velocidad;
      return { expo: ex, frase: this.frase, seccion: fr ? fr.seccion : 0, bloque: fr ? fr.bloque : 0, reproduciendo: this.reproduciendo, tiempo: t, duracion: total, modo: this.modo, velocidad: this.velocidad, error: this.errorAudio };
    }
    usarMp3(expo) {
      const pref = Opo.Ajustes.leer().fuente;
      return !!(expo && expo.audio && pref !== 'voz' && !this.fallidos?.has(expo.id));
    }
    cargar(expo) {
      if (this.expo && expo && this.expo.id === expo.id) return;
      this.detener();
      this.expo = expo;
      this.frase = 0;
      this.errorAudio = '';
      this.modo = this.usarMp3(expo) ? 'mp3' : 'voz';
      if (this.modo === 'mp3') this.prepararAudio();
      this.emitir();
    }
    prepararAudio() {
      if (!this.audio) {
        this.audio = new Audio();
        this.audio.preload = 'metadata';
        this.audio.addEventListener('timeupdate', () => this.alTiempo());
        this.audio.addEventListener('ended', () => { this.reproduciendo = false; this.emitir(); });
        this.audio.addEventListener('pause', () => { if (this.reproduciendo && !this.audio.ended && !this._cambiando) { this.reproduciendo = false; this.emitir(); } });
        this.audio.addEventListener('play', () => { if (!this.reproduciendo) { this.reproduciendo = true; this.emitir(); } });
        this.audio.addEventListener('error', () => this.alError());
      }
      const ex = this.expo;
      this.audio.src = this.blobUrls[ex.id] || ex.audio.src;
      this.audio.playbackRate = this.velocidad;
    }
    async alError() {
      const ex = this.expo;
      if (!ex || this.modo !== 'mp3') return;
      if (!this.blobUrls[ex.id] && !this._intentoBlob) {
        // algunas plataformas bloquean <audio src> pero permiten fetch del mismo fichero
        this._intentoBlob = true;
        try {
          const r = await fetch(ex.audio.src);
          if (!r.ok) throw new Error(r.status);
          const b = await r.blob();
          this.blobUrls[ex.id] = URL.createObjectURL(b);
          this._intentoBlob = false;
          const seguir = this.reproduciendo;
          this.audio.src = this.blobUrls[ex.id];
          this.irAFrase(this.frase, { reproducir: seguir });
          return;
        } catch (e) { this._intentoBlob = false; }
      }
      this.fallidos = this.fallidos || new Set();
      this.fallidos.add(ex.id);
      this.errorAudio = 'No se pudo cargar el audio grabado; se usa la voz del navegador.';
      const seguir = this.reproduciendo;
      this.reproduciendo = false;
      this.modo = 'voz';
      this.emitir();
      if (seguir) this.play();
    }
    alTiempo() {
      if (this.modo !== 'mp3' || !this.expo) return;
      const t = this.audio.currentTime;
      const i = buscarFrase(this.expo.frases, t);
      if (i !== this.frase || this.reproduciendo) {
        const cambio = i !== this.frase;
        this.frase = i;
        if (cambio) Opo.Progreso.escuchado(this.expo.id, t);
        this.emitir();
      }
    }
    play() {
      if (!this.expo) return;
      if (this.modo === 'mp3') {
        this.audio.playbackRate = this.velocidad;
        const p = this.audio.play();
        this.reproduciendo = true;
        if (p && p.catch) p.catch((e) => { if (e && e.name === 'NotAllowedError') { this.reproduciendo = false; this.emitir(); } });
      } else {
        if (!('speechSynthesis' in window)) { Opo.aviso('Este navegador no tiene voz sintética.'); return; }
        this.reproduciendo = true;
        this.hablar(this.frase);
      }
      this.metadatos();
      this.emitir();
    }
    pausa() {
      this.reproduciendo = false;
      if (this.modo === 'mp3' && this.audio) this.audio.pause();
      else { this.token++; try { window.speechSynthesis.cancel(); } catch (e) { /* nada */ } }
      this.emitir();
    }
    alternar() { if (this.reproduciendo) this.pausa(); else this.play(); }
    detener() {
      this.token++;
      this.reproduciendo = false;
      if (this.audio) { this._cambiando = true; this.audio.pause(); this._cambiando = false; }
      try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) { /* nada */ }
    }
    hablar(i) {
      const ex = this.expo;
      if (!ex || i >= ex.frases.length) { this.reproduciendo = false; this.emitir(); return; }
      const tok = ++this.token;
      this.frase = i;
      this.emitir();
      const fr = ex.frases[i];
      const u = new SpeechSynthesisUtterance(Opo.paraVoz(fr.texto));
      const v = vozPreferida();
      if (v) u.voice = v;
      u.lang = (v && v.lang) || 'es-ES';
      u.rate = this.velocidad;
      u.onend = () => {
        if (tok !== this.token || !this.reproduciendo) return;
        const sig = ex.frases[i + 1];
        const pausa = !sig ? 0 : sig.seccion !== fr.seccion ? 900 : sig.bloque !== fr.bloque ? 450 : 120;
        setTimeout(() => { if (tok === this.token && this.reproduciendo) this.hablar(i + 1); }, pausa / this.velocidad);
      };
      u.onerror = (e) => { if (tok === this.token && e.error !== 'interrupted' && e.error !== 'canceled') { this.reproduciendo = false; this.emitir(); } };
      try { window.speechSynthesis.cancel(); } catch (e) { /* nada */ }
      window.speechSynthesis.speak(u);
    }
    irAFrase(i, { reproducir = null } = {}) {
      const ex = this.expo;
      if (!ex) return;
      i = Math.max(0, Math.min(ex.frases.length - 1, i));
      const seguir = reproducir == null ? this.reproduciendo : reproducir;

        const t0 = ex.frases[i].t0 || 0;
