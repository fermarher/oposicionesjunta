aje. En una sesión, nos preguntamos en gran grupo cómo trabajar de forma cooperativa; después formamos equipos heterogéneos, cada miembro asume un rol, coordinador, secretario, portavoz o encargado del material, y el equipo diseña en Canva su tarjeta de roles, usando los recursos digitales de forma segura, con el criterio 1.1.a de Conocimiento del Medio. Yo guío y anoto lo que observo en una escala de observación.","palabras":[40,85]},{"id":"pz_s1","descripcion":"GUION. La tarea de la fase 1 en 3-6 palabras (siglas y abreviaturas permitidas).","ejemplo":"equipos y roles en Canva","palabras":[2,6]},{"id":"s2_lcl_ej","descripcion":"EJERCICIO DE APLICACIÓN de LENGUA de la fase 2 (ficha: semanas[1].LCL): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Empieza en minúscula (va tras «como ejercicio de aplicación,» o «como ejercicio,»), sin punto final (sigue «; y como actividad,»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"clasificamos las palabras según su número de sílabas","palabras":[4,16]},{"id":"s2_lcl_act","descripcion":"ACTIVIDAD de LENGUA de la fase 2 (ficha: semanas[1].LCL): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada alumno/equipo», y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"leemos un cuento tradicional, con el criterio 7.1.a, y escribimos otro siguiendo los pasos, con el 5.1.a","palabras":[8,30]},{"id":"s2_rel_lcl","descripcion":"RELACIÓN de lo que hace Lengua en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"planificar, escribir, revisar y corregir es el mismo proceso con el que escribiremos las normas del cartel","palabras":[8,22]},{"id":"s2_mat_ej","descripcion":"EJERCICIO DE APLICACIÓN de MATEMÁTICAS de la fase 2 (ficha: semanas[1].MAT): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Empieza en minúscula (va tras «como ejercicio de aplicación,» o «como ejercicio,»), sin punto final (sigue «; y como actividad,»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"contamos números de cuatro cifras en series de diez, de cien y de mil","palabras":[4,16]},{"id":"s2_mat_act","descripcion":"ACTIVIDAD de MATEMÁTICAS de la fase 2 (ficha: semanas[1].MAT): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada alumno/equipo», y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"el viernes, en el concurso de problemas, calculamos mentalmente y explicamos el proceso, con el criterio 6.2.a","palabras":[8,30]},{"id":"s2_rel_mat","descripcion":"RELACIÓN de lo que hace Matemáticas en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"explicar el cálculo en voz alta entrena la exposición oral del cartel","palabras":[8,24]},{"id":"s2_cmn","descripcion":"Actividad de CONOCIMIENTO DEL MEDIO de la fase 2 que NO es la tarea (ficha: semanas[1].CMN, el jueves), en primera persona del plural y con su criterio si lo tiene. Empieza en minúscula (va tras «En Conocimiento del Medio,»), SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"el jueves cada alumno presenta a un científico o una científica","palabras":[6,26]},{"id":"s2_rel_cmn","descripcion":"RELACIÓN de lo que hace Conocimiento del Medio en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"como la ciencia se hace en equipo, anotamos qué normas siguen y las llevamos al cartel","palabras":[8,22]},{"id":"s2_ear","descripcion":"Actividad de EDUCACIÓN ARTÍSTICA de la fase 2 (ficha: semanas[1].EAR); si es el APS, nombra «Opera prima». Empieza en minúscula (va tras «Y en Educación Artística,») y SIN punto final (sigue «:» y la relación). El criterio de Educación Artística debe ir con la actividad cuyo SIGNIFICADO encaja (identificar o conocer una obra o un artista → criterio de identificar propuestas; crear → criterio de producción), aunque la ficha lo ponga en otra semana; debe aparecer en al menos una fase. ","ejemplo":"conocemos a Velázquez con un vídeo e identificamos «Las meninas», con el criterio 1.1.a","palabras":[4,16]},{"id":"s2_rel_ear","descripcion":"RELACIÓN de lo que hace Educación Artística en la fase 2 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"Velázquez organiza un grupo en el que cada personaje tiene su papel, como en nuestros equipos","palabras":[6,26]},{"id":"s2_tarea","descripcion":"TAREA de la fase 2 = paso de la situación de aprendizaje del viernes (ficha: semanas[1].CMN). En las UD 2-12 el producto de la SdA SE TERMINA en esta fase: dilo («y queda terminada la guía…»). Desarróllala con CUATRO datos: agrupamiento, duración («en una sesión», sin inventar minutos), pasos (qué hace cada miembro o rol) y evidencia o instrumento con que se recoge; di también qué hace la maestra («Yo guío… y registro…»). SIEMPRE con su criterio y el ÁREA del criterio («con el criterio 1.1.a de Conocimiento del Medio»), y que la actividad encaje con el significado del criterio (si es de recursos digitales, hazla con un recurso digital de la UD: Canva, Google Classroom o Google Maps). Dos o tres oraciones; empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el viernes, en una sesión por equipos y con el folio giratorio, cada miembro propone una norma; el secretario las pasa al borrador del cartel en Google Classroom, el portavoz las lee y el equipo las revisa y decide por consenso, con el criterio 1.1.a de Conocimiento del Medio. Yo guío con preguntas y registro el proceso en la escala de observación.","palabras":[40,85]},{"id":"pz_s2","descripcion":"GUION. La tarea de la fase 2 en 3-6 palabras (siglas y abreviaturas permitidas).","ejemplo":"normas en borrador","palabras":[2,6]},{"id":"s3_lcl_ej","descripcion":"EJERCICIO DE APLICACIÓN de LENGUA de la fase 3 (ficha: semanas[2].LCL): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Empieza en minúscula (va tras «como ejercicio de aplicación,» o «como ejercicio,»), sin punto final (sigue «; y como actividad,»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"trabajamos la sílaba tónica y la tilde con un dictado","palabras":[4,16]},{"id":"s3_lcl_act","descripcion":"ACTIVIDAD de LENGUA de la fase 3 (ficha: semanas[2].LCL): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada alumno/equipo», y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"leemos el capítulo del libro, con el criterio 4.1.a, y buscamos la sílaba tónica de lo que desayunamos, con el 6.1.a","palabras":[8,30]},{"id":"s3_rel_lcl","descripcion":"RELACIÓN de lo que hace Lengua en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"con la tilde y el dictado escribimos el cartel definitivo sin faltas","palabras":[8,22]},{"id":"s3_mat_ej","descripcion":"EJERCICIO DE APLICACIÓN de MATEMÁTICAS de la fase 3 (ficha: semanas[2].MAT): automatismo o práctica que consolida (vocabulario, diccionario, sílabas, lectura y escritura de números, tablas, cálculo…), en primera persona del plural. Puede llevar «, con el criterio N.N.a». Empieza en minúscula (va tras «como ejercicio de aplicación,» o «como ejercicio,»), sin punto final (sigue «; y como actividad,»). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"redondeamos números en la recta numérica gestionando el error, con el criterio 7.1.a","palabras":[4,16]},{"id":"s3_mat_act","descripcion":"ACTIVIDAD de MATEMÁTICAS de la fase 3 (ficha: semanas[2].MAT): la que relaciona conocimientos y mejor se conecta con el producto, en primera persona del plural o con «cada alumno/equipo», y SIEMPRE con su criterio («, con el criterio N.N.a»; el segundo, «con el N.N.a»). Puede sumar una segunda actividad breve de la semana. Sin días de la semana salvo «el viernes». Empieza en minúscula y SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"pensamos paso a paso cómo preparar la mochila, con el criterio 4.1.a, y conectamos ideas en los problemas exprés, con el 5.1.a","palabras":[8,30]},{"id":"s3_rel_mat","descripcion":"RELACIÓN de lo que hace Matemáticas en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"ordenar por pasos, como la mochila, nos sirve para ordenar las normas del cartel","palabras":[8,24]},{"id":"s3_cmn","descripcion":"Actividad de CONOCIMIENTO DEL MEDIO de la fase 3 que NO es la tarea (ficha: semanas[2].CMN, el jueves), en primera persona del plural y con su criterio si lo tiene. Empieza en minúscula (va tras «En Conocimiento del Medio,»), SIN punto final (sigue «:» y la relación). Usa SOLO criterios de areas[].criterios de la ficha; si la semana cita un criterio ajeno o un código de saber (p. ej. 2.C.7), sustitúyelo por el criterio de la UD de esa área que mejor encaje por su SIGNIFICADO (consulta las observaciones). Entre las tres fases, cada criterio de la UD de esa área debe aparecer al menos una vez.","ejemplo":"el jueves escribimos el cuestionario de una entrevista sobre lo que comemos en casa, y esa tarde cada alumno entrevista a un familiar","palabras":[6,26]},{"id":"s3_rel_cmn","descripcion":"RELACIÓN de lo que hace Conocimiento del Medio en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"las preguntas se redactan en equipo con las normas acordadas, y la entrevista es el paso de «¡Sí, chef!»","palabras":[8,22]},{"id":"s3_ear","descripcion":"Actividad de EDUCACIÓN ARTÍSTICA de la fase 3 (ficha: semanas[2].EAR); si es el APS, nombra «Opera prima». Empieza en minúscula (va tras «Y en Educación Artística,») y SIN punto final (sigue «:» y la relación). El criterio de Educación Artística debe ir con la actividad cuyo SIGNIFICADO encaja (identificar o conocer una obra o un artista → criterio de identificar propuestas; crear → criterio de producción), aunque la ficha lo ponga en otra semana; debe aparecer en al menos una fase. ","ejemplo":"dentro de «Opera prima», elaboramos un informe sobre la animación stop motion","palabras":[4,16]},{"id":"s3_rel_ear","descripcion":"RELACIÓN de lo que hace Educación Artística en la fase 3 con el PRODUCTO (o con un paso del producto o de la tarea): cláusula que empieza en minúscula (va tras dos puntos, justo después de la actividad del área) y SIN punto final. Debe nombrar el producto o su paso («el cartel», «la guía», «las normas», «el título del cartel»…) y decir para qué sirve lo que se ha hecho. Solo relaciones verosímiles con actividades de la ficha; sin criterios, sin días y sin dos puntos internos (ya va tras dos puntos).","ejemplo":"el stop motion también se hace en equipo y con roles, así que aplicamos las normas del cartel","palabras":[6,26]},{"id":"s3_tarea","descripcion":"TAREA FINAL de la fase 3 (ficha: semanas[2].CMN, el viernes). En la UD 1 se leen las entrevistas de «¡Sí, chef!» y se elabora y expone el cartel. En las UD 2-12 es el paso del proyecto de diseño (nómbralo: «¡Sí, chef!», «¿Buceamos?», «Huellas del pasado») con su criterio; añade cómo se presenta o se usa el producto de la SdA, ya terminado, sin inventar actividades nuevas. Desarróllala con CUATRO datos: agrupamiento, duración («en una sesión», sin inventar minutos), pasos (qué hace cada miembro o rol) y evidencia o instrumento con que se recoge; di también qué hace la maestra («Yo guío… y registro…»). SIEMPRE con su criterio y el ÁREA del criterio («con el criterio 1.1.a de Conocimiento del Medio»), y que la actividad encaje con el significado del criterio (si es de recursos digitales, hazla con un recurso digital de la UD: Canva, Google Classroom o Google Maps). Dos o tres oraciones; empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el viernes leemos las entrevistas para el recetario andaluz de «¡Sí, chef!», y cada equipo elabora su cartel definitivo y lo expone a la clase, con el criterio 8.1.a de Conocimiento del Medio: el portavoz presenta las normas y todos responden a las preguntas. La evidencia es el propio cartel.","palabras":[40,85]},{"id":"pz_s3","descripcion":"GUION. La tarea de la fase 3 en 3-6 palabras (siglas y abreviaturas permitidas).","ejemplo":"cartel expuesto + entrevistas","palabras":[2,6]},{"id":"pz_rel_lcl","descripcion":"PIZARRA. Flecha del esquema de la secuencia para Lengua: la relación más representativa de las tres fases en 2-5 palabras, «qué se hizo → para qué sirve en el producto» (se escribe tras «LCL:»).","ejemplo":"escritura por pasos → normas","palabras":[2,6]},{"id":"pz_rel_mat","descripcion":"PIZARRA. Flecha del esquema de la secuencia para Matemáticas: la relación más representativa de las tres fases en 2-5 palabras, «qué se hizo → para qué sirve en el producto» (se escribe tras «MAT:»).","ejemplo":"cálculo explicado → exposición","palabras":[2,6]},{"id":"pz_rel_cmn","descripcion":"PIZARRA. Flecha del esquema de la secuencia para Conocimiento del Medio: la relación más representativa de las tres fases en 2-5 palabras, «qué se hizo → para qué sirve en el producto» (se escribe tras «CMN:»).","ejemplo":"científicos → normas","palabras":[2,6]},{"id":"pz_rel_ear","descripcion":"PIZARRA. Flecha del esquema de la secuencia para Educación Artística: la relación más representativa de las tres fases en 2-5 palabras, «qué se hizo → para qué sirve en el producto» (se escribe tras «EAR:»).","ejemplo":"letras → título · Meninas → roles","palabras":[2,8]},{"id":"transferencia","descripcion":"TRANSFERENCIA: dos o tres usos de lo APRENDIDO en esta UD (contenidos concretos: números, ortografía, medidas, vocabulario, normas…) en contextos DISTINTOS del aula: la familia, el centro (patio, comedor, la actividad complementaria o la salida de la Tabla 7; si la ficha la marca «SdA», dila como situación de aprendizaje), la localidad o Andalucía. Cada uso con su contexto y lo que se aplica («en la entrevista, … y lo escribe con sus cuatro cifras»). No pongas actitudes como uso. Los contextos digital y bilingüe ya están en el texto común. Empieza en minúscula (va tras dos puntos), separa con punto y coma y termina en punto.","ejemplo":"en la entrevista, el alumnado pregunta el año de nacimiento del familiar y lo escribe con sus cuatro cifras; en la jornada gastronómica andaluza, escribimos con tilde los nombres de los platos y redondeamos sus precios; y en el patio y el comedor aplicamos las normas del cartel, que llevamos al Plan de cultura de Paz.","palabras":[30,62]},{"id":"uso_real","descripcion":"Uso real y efectivo del producto de la SdA después de la unidad (dónde queda, quién lo usa, para qué). Oración que empieza en minúscula (va tras dos puntos) y termina en punto. Coherente con la ficha.","ejemplo":"el cartel queda colgado en el aula y lo consultamos cada vez que un equipo tiene un conflicto, durante todo el curso.","palabras":[10,24]},{"id":"reparto_dias","descripcion":"Cómo se reparten de verdad los días lectivos entre las tres fases (va tras «en tres fases de unos cinco días;»): semanas incompletas, festivos (Inmaculada, 28 de febrero, 1 de mayo), Semana Blanca, Semana Santa, salidas. Sin decir el día de la semana de una fecha. Empieza en minúscula y termina en punto.","ejemplo":"la primera tiene cuatro días, porque coincide con la semana de inicio del curso.","palabras":[8,22]},{"id":"progresion","descripcion":"Por qué la secuencia es coherente: de qué a qué se progresa en Lengua y en Matemáticas y cómo avanza el producto (va tras «La progresión es coherente:»). Empieza en minúscula y termina en punto.","ejemplo":"en Matemáticas pasamos de tres a cuatro cifras y después a comparar y redondear; en Lengua, de la sílaba a la sílaba tónica y la tilde; y el cartel avanza de los roles al borrador y a la exposición.","palabras":[20,42]},{"id":"ajuste_realidad","descripcion":"Por qué la secuencia de ESTA UD se ajusta a la realidad del grupo y del ENTORNO REAL: momento del curso, festividades o salidas de la UD, vivencias del alumnado y, al menos, un rasgo concreto de Mijas Costa o de Málaga (localidad turística, costa, patrimonio, servicios del barrio). Empieza en minúscula con verbos en tercera persona cuyo sujeto es «la secuencia» («abre…», «aprovecha…», «se apoya en…»; no «parte de», que ya está en el texto común) y termina en punto.","ejemplo":"abre el curso formando los equipos de todo el año y aprovecha la jornada gastronómica andaluza; y, en una localidad turística como Mijas Costa, la entrevista admite recetas del país de origen de cada familia.","palabras":[15,50]},{"id":"m_lectura","descripcion":"Un texto concreto que se lee en la UD y cómo se lee, como sintagma nominal en minúscula con artículo, sin punto y SIN empezar por «la lectura» (va tras «La lectura, eje de todas las áreas, con»).","ejemplo":"el cuento «Los duendes y el zapatero», con estrategias de antes, durante y después de leer","palabras":[8,18]},{"id":"m_tic","descripcion":"Recursos digitales de ESTA UD, cada uno con la actividad en que se usa: Canva, Google Classroom y Google Maps (están en todas las fichas) y los vídeos o búsquedas de la ficha. Sintagma en minúscula sin punto (va tras «Las TIC, con»). No nombres herramientas que la UD no use.","ejemplo":"Canva para la tarjeta de equipo, Google Classroom para el borrador del cartel y los vídeos del método científico y de Velázquez","palabras":[8,26]},{"id":"m_andalucia","descripcion":"Dos o tres elementos de la UD que conectan con las realidades sociales y culturales de Andalucía (textos, autores, fiestas, paisajes, gastronomía, modalidad lingüística), como enumeración en minúscula con artículos, sin punto.","ejemplo":"la canción popular «La Tarara», el pintor sevillano Velázquez y la jornada gastronómica andaluza","palabras":[6,16]},{"id":"m_agrupamientos","descripcion":"Los cuatro agrupamientos, cada uno ligado a una actividad CONCRETA de la UD, en este orden: «el gran grupo para …; los equipos heterogéneos para …; las parejas para …; y el trabajo individual para ….». Empieza en minúscula (va tras dos puntos) y termina en punto.","ejemplo":"el gran grupo para la pregunta inicial; los equipos heterogéneos para las adivinanzas y el cartel; las parejas para corregir el dictado; y el trabajo individual para escribir números.","palabras":[20,35]},{"id":"recursos_ud","descripcion":"Espacios y recursos de la UD (ficha: recursos), CADA UNO LIGADO A SU ACTIVIDAD: «la biblioteca, para …; el patio, …; los policubos y el tangram, en …; las familias, en …». Primero los espacios (aula, biblioteca, patio y, si la hay, la salida de la Tabla 7), después el material manipulativo y los recursos personales. Sin herramientas digitales (van en m_tic). Empieza en minúscula (va tras «Y cada espacio y recurso, también:») y SIN punto final.","ejemplo":"la biblioteca, para el listado de cuentos tradicionales; el patio, donde también aplicamos las normas; los bloques de base 10 y el tangram, en los problemas; la prensa, en las noticias; y las familias, en la entrevista","palabras":[15,48]},{"id":"m_previos","descripcion":"Actividad inicial de la fase 1 que activa los conocimientos previos (pregunta, vídeo, diálogo) como sintagma nominal en minúscula con artículo, sin punto. Va tras «la unidad parte de».","ejemplo":"la pregunta «¿Cómo podemos trabajar de forma cooperativa?», en la que cada alumno cuenta sus experiencias","palabras":[8,18]},{"id":"dua_ejemplos","descripcion":"Los tres principios DUA aplicados a actividades CONCRETAS de la UD, en tres oraciones con este arranque fijo: «Con múltiples formas de representación, …. Con múltiples formas de acción y expresión, …. Y con múltiples formas de implicación, ….». Empieza en mayúscula y termina en punto.","ejemplo":"Con múltiples formas de representación, presento el método científico con vídeo y esquema, y las cifras con bloques de base 10. Con múltiples formas de acción y expresión, el alumnado cuenta, escribe o dramatiza sus adivinanzas. Y con múltiples formas de implicación, trabajamos en equipo y nos damos retroalimentación al revisar el cartel.","palabras":[40,62]},{"id":"d_multinivel","descripcion":"Una actividad CONCRETA de la UD planteada como multinivel: «[actividad]: el refuerzo …, y la profundización …». Empieza en minúscula (va tras «la actividad multinivel es») y termina en punto.","ejemplo":"el concurso de problemas: el refuerzo resuelve problemas de tres cifras con bloques de base 10, y la profundización inventa problemas de dos pasos con cuatro cifras.","palabras":[15,30]},{"id":"d_vinculo","descripcion":"Vinculación de las medidas con actividades CONCRETAS de esta UD, en este orden: «los dos alumnos con dificultades …; el alumno con TDAH …; y la alumna de compensatoria …». Coherente con la programación: dificultades → material manipulativo, lectura fácil, tareas graduadas; TDAH → cerca de la maestra, tareas fragmentadas, agenda visual, autoinstrucciones, responsabilidades; compensatoria → vocabulario con pictogramas o imágenes, préstamo de material, compañera tutora y, si la actividad depende de la familia, una alternativa en el centro. Empieza en minúscula y termina en punto.","ejemplo":"los dos alumnos con dificultades leen números de cuatro cifras con bloques de base 10 y preparan el dictado con lectura fácil; el alumno con TDAH sigue la adivinanza con una agenda visual y usa autoinstrucciones en el concurso; y la alumna de compensatoria trabaja el vocabulario de la entrevista con pictogramas y, si su familia no puede, entrevista a la cocinera del comedor.","palabras":[40,82]},{"id":"e_inicial","descripcion":"La actividad CONCRETA de evaluación inicial de la UD (la de m_previos u otra de la fase 1) y dónde se registra (anecdotario, escala de observación). Sintagma que empieza en minúscula con artículo (va tras «La evaluación inicial es») y termina en punto.","ejemplo":"la asamblea «¿Cómo podemos trabajar de forma cooperativa?», cuyas respuestas registro en el anecdotario.","palabras":[8,22]},{"id":"e_rubrica","descripcion":"Producto final de la situación de aprendizaje evaluado con rúbrica y su criterio: «el/la + producto se evalúa con una rúbrica del criterio N.N.a de + área, y su exposición oral, con una escala de observación.». Empieza en minúscula (va tras «Por ejemplo,») y termina en punto.","ejemplo":"el cartel de normas de colaboración se evalúa con una rúbrica del criterio 8.1.a de Conocimiento del Medio, y su exposición oral, con una escala de observación.","palabras":[18,30]},{"id":"e_observacion","descripcion":"Dos actividades concretas de la UD con su instrumento y su criterio (lista de cotejo, escala de observación o registro anecdótico), de áreas distintas a la del producto. Empieza en minúscula (va tras «Además,») y termina en punto.","ejemplo":"la lectura del capítulo se registra con una lista de cotejo del criterio 4.1.a de Lengua, y el razonamiento de la mochila, con una escala de observación del 4.1.a de Matemáticas.","palabras":[18,35]},{"id":"e_porfolio","descripcion":"Qué producciones CONCRETAS de la UD recoge el porfolio (dos o tres, de áreas distintas), enumeración en minúscula con artículos (va tras «Y el porfolio recoge») y terminada en punto.","ejemplo":"la adivinanza, el cuento escrito por pasos y el dictado corregido.","palabras":[6,20]},{"id":"e_coevaluacion","descripcion":"Una o dos actividades concretas de autoevaluación o coevaluación de la UD (intercambio de cuadernos, valoración del trabajo en equipo, revisión del producto), en primera persona del plural o con «cada equipo/alumno» como sujeto. Empieza en minúscula (va tras «por ejemplo,») y termina en punto.","ejemplo":"nos intercambiamos los cuadernos para corregir el dictado, y cada equipo valora con una lista de cotejo si ha cumplido sus normas.","palabras":[12,26]},{"id":"e_diversidad","descripcion":"Ejemplo del anexo VI aplicado a una medida de ESTA UD: dificultad, medida y cómo se valora en la escala 1-5. Empieza en minúscula (va tras «Por ejemplo,») y termina en punto.","ejemplo":"si cuesta leer números de cuatro cifras, la medida son los bloques de base 10 con un compañero tutor, y si ya los leen con ayuda, la valoro con un 4, buena.","palabras":[18,32]},{"id":"conclusion_ud","descripcion":"Síntesis propia de la UD: qué aprende el alumnado (dos o tres contenidos clave de distintas áreas) y qué significa el producto final, vinculado al título o al centro de interés. Empieza por «En definitiva,» y termina en punto.","ejemplo":"En definitiva, con esta unidad mi alumnado no solo lee números de cuatro cifras, crea adivinanzas o distingue la sílaba tónica: aprende a ser un equipo, y lo deja escrito en un cartel que nos acompañará todo el curso.","palabras":[25,42]},{"id":"siguiente_ud","descripcion":"Unidad siguiente y qué retoma de esta, como sintagma en minúscula sin punto (va tras «es el punto de partida de»): «la unidad N, «Título», en la que …». En la UD 12: «cuarto de Primaria, donde …».","ejemplo":"la unidad 2, «¿Cómo son las plantas?», donde estos equipos elaborarán una guía de las plantas","palabras":[6,18]},{"id":"pz_compl","descripcion":"GUION. Actividad complementaria o salida de la UD (Tabla 7) en 2-5 palabras («Bioparc Fuengirola», «Día de Andalucía»).","ejemplo":"Jornada gastronómica andaluza","palabras":[2,5]}],"secciones":[{"id":"u1","titulo":"Presentación, introducción y justificación","rubrica":["Presentación, introducción y justificación","Bibliografía","Uso adecuado de la pizarra"],"minutos":2.1,"esquema":["Saludo · UD {{numero}} «{{titulo}}» · {{trimestre_letra}} trimestre · {{centro_interes}}","Una SdA con el mismo título → {{pz_producto}} · y avanzan los dos proyectos","Índice en voz alta, once puntos, mientras lo escribo","Normativa: RD 157/2022 · D. 101/2023 · Orden 30/05/2023","Curricular: Coll (2013) + por qué en 3.º","Epistemológica: las disciplinas + Ausubel (2009)","Relevancia social → ODS"],"bloques":[{"id":"u1b1","texto":"Buenos días a la presidencia y a todos los miembros del tribunal. De las tres unidades extraídas, he elegido la unidad didáctica número {{numero}} de mi programación «Aprendemos juntos»: «{{titulo}}». Se desarrolla en el {{trimestre_letra}} trimestre de tercero de Primaria y se centra en {{centro_interes}}. Contiene una situación de aprendizaje, con su mismo título, cuyo producto final es {{producto_sda}}, y hace avanzar los dos proyectos del curso. Seguiré once puntos, que escribo en la pizarra: presentación, contexto, concreción curricular, la secuencia en tres fases, contextos y tiempos, metodología, diversidad, evaluación y conclusión.","pizarra":[{"zona":"cabecera","texto":"UD {{numero}} «{{titulo}}» · 3.º EP"},{"zona":"cabecera","texto":"SdA → {{pz_producto}}"},{"zona":"indice","texto":"1. Presentación"},{"zona":"indice","texto":"2. Contexto"},{"zona":"indice","texto":"3. Concreción"},{"zona":"indice","texto":"4. Fase 1"},{"zona":"indice","texto":"5. Fase 2"},{"zona":"indice","texto":"6. Fase 3"},{"zona":"indice","texto":"7. Contextos y tiempo"},{"zona":"indice","texto":"8. Metodología"},{"zona":"indice","texto":"9. Diversidad"},{"zona":"indice","texto":"10. Evaluación"},{"zona":"indice","texto":"11. Conclusión"}]},{"id":"u1b2","texto":"Justifico su importancia y su relevancia en tres planos. Normativamente, concreta el currículo del Real Decreto 157/2022, del Decreto 101/2023 y de la Orden de 30 de mayo de 2023. Curricularmente, como explica Coll (2013), es el tercer nivel de concreción, y es relevante en tercero porque {{justif_curricular}}. Epistemológicamente, {{justif_disciplinar}}; y, como defiende Ausubel (2009), parto de lo que el alumnado ya sabe. Su relevancia social es clara: {{relevancia}}. Por eso la vinculo con {{ods}}.","pizarra":[{"zona":"centro","texto":"Normativa · curricular · epistemológica → ODS","caja":"1. Justificación"},{"zona":"normativa","texto":"RD 157/2022 · D. 101/2023 · Orden 30/05/2023"},{"zona":"normativa","texto":"Coll 2013 · Ausubel 2009"}]}]},{"id":"u2","titulo":"Contextualización","rubrica":["Contextualización","Bibliografía"],"minutos":1.6,"esquema":["CEIP bilingüe de Mijas Costa (Málaga), localidad turística, tres líneas","22 alumnos/as de 8-9 años: Piaget e Inhelder, «Psicología del niño» (2022)","NEAE: 2 con dificultades en Lengua y Matemáticas · TDAH · compensatoria","Lo significativo para esta UD: momento del curso + plan o programa (Paz, CIMA…)","{{fechas}} · {{trimestre_letra}} trimestre · {{dias}} días (D. 301/2009)","Lugar en el curso respecto a la UD anterior","Cuatro áreas con su nombre completo"],"bloques":[{"id":"u2b1","texto":"Paso al punto dos: la contextualización. Desarrollo la unidad en un colegio público bilingüe de Infantil y Primaria de Mijas Costa, en Málaga, una localidad turística, con tres líneas por nivel. Mi grupo de tercero tiene veintidós alumnos y alumnas de ocho y nueve años que, como explican Piaget e Inhelder en «Psicología del niño» (2022), razonan sobre hechos concretos. Entre ellos hay dos alumnos con dificultades en Lengua y Matemáticas, un alumno con TDAH y una alumna de compensatoria. Para esta unidad, lo más significativo del contexto es esto: {{contexto_significativo}}","pizarra":[{"zona":"centro","texto":"Mijas Costa bilingüe · 22 · 4 NEAE","caja":"2. Contexto"},{"zona":"normativa","texto":"Piaget e Inhelder 2022 · D. 301/2009"}]},{"id":"u2b2","texto":"Ubico la unidad en el tiempo: se desarrolla {{fechas}}, en el {{trimestre_letra}} trimestre, con {{dias}} días lectivos según el calendario del Decreto 301/2009. En la secuencia del curso, {{enlace_ud}} Y va dirigida a las cuatro áreas de mi programación: Lengua Castellana y Literatura, Matemáticas, Conocimiento del Medio Natural, Social y Cultural y Educación Artística.","pizarra":[]}]},{"id":"u3","titulo":"Concreción curricular","rubrica":["Concreción curricular y vinculación con los aprendizajes","Bibliografía"],"minutos":3.2,"esquema":["Escamilla (2018): encadenar los elementos del currículo","Objetivos de etapa (art. 5 D. 101/2023) → los 6 objetivos, por áreas","8 competencias clave (RD 157/2022) · sobre todo, las de esta UD","Cada competencia: de qué trata + 2 descriptores + criterio + saber","{{pz_lcl}}","{{pz_mat}}","{{pz_cmn_ear}}"],"bloques":[{"id":"u3b1","texto":"Paso al punto tres: la concreción curricular y la vinculación con los aprendizajes. Como señala Escamilla (2018), programar por competencias es encadenar los elementos del currículo. La unidad contribuye a los objetivos de etapa {{objetivos_etapa}} del Decreto 101/2023, que concreto en seis objetivos de aprendizaje: {{objetivos_aprendizaje}}","pizarra":[{"zona":"normativa","texto":"Escamilla 2018"}]},{"id":"u3b2","texto":"Estos objetivos desarrollan las ocho competencias clave del Real Decreto 157/2022, a través de sus descriptores operativos, y sobre todo {{cc_principales}}. Concreto ahora cada competencia específica. Empiezo por Lengua Castellana y Literatura: {{curriculo_lcl}}","pizarra":[{"zona":"centro","texto":"{{pz_lcl}}","caja":"3. Concreción"}]},{"id":"u3b3","texto":"Sigo con Matemáticas, siempre en el mismo orden: de qué trata cada competencia, sus descriptores operativos, su criterio de evaluación y su saber básico: {{curriculo_mat}}","pizarra":[{"zona":"centro","texto":"{{pz_mat}}","caja":"3. Concreción"}]},{"id":"u3b4","texto":"Y termino con las otras dos áreas. {{curriculo_cmn_ear}} Así, cada criterio tiene su actividad en la secuencia y su instrumento en la evaluación, como muestro a continuación.","pizarra":[{"zona":"centro","texto":"{{pz_cmn_ear}}","caja":"3. Concreción"}]}]},{"id":"u4","titulo":"Secuencia y SdA: fase 1, motivar y activar","rubrica":["Secuencia didáctica 1: actividades y relación entre ellas","Bibliografía"],"minutos":3.3,"esquema":["SdA: actividades articuladas en un contexto (art. 7 D. 101/2023)","Reto real → {{pz_producto}}","Tres fases de Baena (2019) · enfoque globalizador (Zabala 2012)","Ejercicio de aplicación → actividad → tarea (Bloom)","Fase 1: cada área y cómo PREPARA el producto (Lengua, Matemáticas, Medio, Artística)","«Todo esto prepara la tarea…»: {{pz_s1}} (agrupamiento, sesión, pasos, evidencia)"],"bloques":[{"id":"u4b1","texto":"Paso al punto cuatro, el núcleo de mi exposición: la secuencia didáctica y su situación de aprendizaje. Según el artículo 7 del Decreto 101/2023, una situación de aprendizaje es un conjunto de actividades articuladas en un contexto determinado. La de esta unidad plantea un reto real, {{sda_reto}}, y su producto es {{producto_sda}}. Se organiza en las tres fases del aprendizaje experiencial de Baena (2019), con el enfoque globalizador que defiende Zabala (2012). En cada fase distingo ejercicios de aplicación, que consolidan; actividades, que relacionan; y una tarea, que integra, de lo sencillo a lo complejo, según la taxonomía de Bloom.","pizarra":[{"zona":"centro","texto":"Ejercicio → actividad → tarea (Bloom)","caja":"4-6. Secuencia y SdA"},{"zona":"normativa","texto":"Art. 7 D. 101/2023 · Baena 2019 · Zabala 2012"}]},{"id":"u4b2","texto":"Primera fase: motivar y activar los conocimientos previos sobre {{centro_interes}}. Cada área prepara el producto. En Lengua, como ejercicio de aplicación, {{s1_lcl_ej}}; y como actividad, {{s1_lcl_act}}: {{s1_rel_lcl}}.","pizarra":[]},{"id":"u4b3","texto":"Son ejercicios que parten de lo concreto y lo manipulativo. En Matemáticas, como ejercicio, {{s1_mat_ej}}; y como actividad, {{s1_mat_act}}: {{s1_rel_mat}}. En Conocimiento del Medio, {{s1_cmn}}: {{s1_rel_cmn}}.","pizarra":[]},{"id":"u4b4","texto":"Y en Educación Artística, {{s1_ear}}: {{s1_rel_ear}}. Todo esto prepara la tarea de la fase, en la que se integran los ejercicios y las actividades de las cuatro áreas: {{s1_tarea}}","pizarra":[{"zona":"centro","texto":"{{pz_producto}} ← 4 áreas","caja":"4-6. Secuencia y SdA"}]}]},{"id":"u5","titulo":"Secuencia y SdA: fase 2, explorar y estructurar","rubrica":["Secuencia didáctica 1: actividades y relación entre ellas"],"minutos":2.3,"esquema":["Explorar y estructurar: investigar, comparar, organizar","«Gracias a lo anterior…» cada área APORTA contenido al producto","Lengua y Matemáticas: ejercicio + actividad con criterio + relación","Medio + Artística: actividad + relación","«Gracias a todo ello…» tarea: {{pz_s2}}","Pasos heurísticos comunes en los problemas","Pizarra: flechas LCL y MAT"],"bloques":[{"id":"u5b1","texto":"Paso al punto cinco: la segunda fase, explorar y estructurar. Gracias a lo anterior, el alumnado ya investiga, compara y organiza, y cada área aporta contenido al producto. En Lengua, como ejercicio de aplicación, {{s2_lcl_ej}}; y como actividad, {{s2_lcl_act}}: {{s2_rel_lcl}}.","pizarra":[{"zona":"centro","texto":"LCL: {{pz_rel_lcl}}","caja":"4-6. Secuencia y SdA"}]},{"id":"u5b2","texto":"En Matemáticas, como ejercicio, {{s2_mat_ej}}; y como actividad, {{s2_mat_act}}: {{s2_rel_mat}}. Y todos los problemas siguen los mismos pasos: comprender, planificar, resolver y comprobar. En Conocimiento del Medio, {{s2_cmn}}: {{s2_rel_cmn}}.","pizarra":[{"zona":"centro","texto":"MAT: {{pz_rel_mat}}","caja":"4-6. Secuencia y SdA"}]},{"id":"u5b3","texto":"Y en Educación Artística, {{s2_ear}}: {{s2_rel_ear}}. Gracias a todo ello, llegamos a la tarea de esta fase, que integra lo que han aportado las cuatro áreas: {{s2_tarea}}","pizarra":[]}]},{"id":"u6","titulo":"Secuencia y SdA: fase 3, aplicar y concluir","rubrica":["Secuencia didáctica 1: actividades y relación entre ellas"],"minutos":2.7,"esquema":["Aplicar y concluir: situaciones nuevas, productos y reflexión","«Todo culmina…»: cada área CULMINA su aportación al producto","Lengua y Matemáticas: ejercicio + actividad con criterio + relación","Medio (jueves) + Artística («Opera prima»): actividad + relación","Tarea final del viernes: {{pz_s3}} · paso de «{{nombre_proyecto}}»","Integrador, interdisciplinar y holístico: cada área, una pieza","Pizarra: flechas CMN y EAR"],"bloques":[{"id":"u6b1","texto":"Paso al punto seis: la tercera fase, aplicar y concluir. Ahora todo culmina: el alumnado aplica lo aprendido a situaciones nuevas, termina sus productos y reflexiona. En Lengua, como ejercicio de aplicación, {{s3_lcl_ej}}; y como actividad, {{s3_lcl_act}}: {{s3_rel_lcl}}.","pizarra":[]},{"id":"u6b2","texto":"En Matemáticas, como ejercicio, {{s3_mat_ej}}; y como actividad, {{s3_mat_act}}: {{s3_rel_mat}}. En esta fase, el alumnado ya explica cómo lo ha resuelto. En Conocimiento del Medio, {{s3_cmn}}: {{s3_rel_cmn}}.","pizarra":[]},{"id":"u6b3","texto":"Y en Educación Artística, {{s3_ear}}: {{s3_rel_ear}}. Y todo culmina en la tarea final de la unidad, que reúne el trabajo de las tres fases: {{s3_tarea}}","pizarra":[]},{"id":"u6b4","texto":"Por eso afirmo que la secuencia tiene un enfoque integrador, interdisciplinar y holístico: el alumnado no aprende las cuatro áreas por separado, sino que cada una aporta una pieza a tareas reales: {{producto_sda}}, el paso del proyecto «{{nombre_proyecto}}» y la aportación a «Opera prima».","pizarra":[{"zona":"centro","texto":"CMN: {{pz_rel_cmn}}","caja":"4-6. Secuencia y SdA"},{"zona":"centro","texto":"EAR: {{pz_rel_ear}}","caja":"4-6. Secuencia y SdA"}]}]},{"id":"u7","titulo":"Contextos, temporalización y ajuste a la realidad","rubrica":["Secuencia didáctica 2: integración en diferentes situaciones y contextos","Secuencia didáctica 3: secuenciación y temporalización","Secuencia didáctica 4: ajuste a la realidad y al alumnado","Bibliografía"],"minutos":3.3,"esquema":["SD2: lo aprendido sale del cuaderno: familia · centro · entorno (transferencia)","Contexto digital (Google Classroom) y bilingüe (maestra de inglés)","Uso real del producto → «el mismo aprendizaje en contextos distintos»","SD3: {{dias}} días · tres fases · reparto real · progresión","Horario: Lengua y Matemáticas diarias · CMN J-V · Plástica V · lectura diaria · razonamiento M-X-V · refuerzo en la franja de autonomía","SD4: evaluación inicial · ajuste a Mijas y al grupo · si una familia no puede · NEAE (punto 9)","Pizarra: si falta sitio, borro las cajas 1-3"],"bloques":[{"id":"u7b1","texto":"Paso al punto siete: cómo integro los aprendizajes y los utilizo de manera efectiva en diferentes situaciones y contextos. Lo que se aprende en la unidad sale del cuaderno: {{transferencia}} En el contexto digital, compartimos el producto con las familias en Google Classroom; y, como somos un centro bilingüe, con la maestra de inglés trabajamos su vocabulario en inglés.","pizarra":[{"zona":"centro","texto":"Familia · centro · digital · inglés","caja":"7. Contextos y tiempo"}]},{"id":"u7b2","texto":"Y el producto tiene un uso real y efectivo: {{uso_real}} Así, el mismo aprendizaje funciona en contextos distintos: eso es integrarlo y utilizarlo de manera efectiva.","pizarra":[]},{"id":"u7b3","texto":"En cuanto a la secuenciación y la temporalización, la unidad es completa y coherente a lo largo de su periodo: {{dias}} días lectivos en tres fases de unos cinco días; {{reparto_dias}} La progresión es coherente: {{progresion}}","pizarra":[{"zona":"centro","texto":"{{dias}} días · 3 fases · horario","caja":"7. Contextos y tiempo"}]},{"id":"u7b4","texto":"Lengua y Matemáticas se trabajan a diario, Conocimiento del Medio el jueves y el viernes, y la Plástica el viernes. Cada día empieza con media hora de lectura, según las Instrucciones de 21 de junio de 2023; martes, miércoles y viernes hay treinta minutos de razonamiento matemático, según las de 18 de junio de 2024; y el refuerzo ocupa la franja de autonomía del centro.","pizarra":[{"zona":"normativa","texto":"Instr. 21/06/2023 · Instr. 18/06/2024"}]},{"id":"u7b5","texto":"Por último, la secuencia se ajusta a la realidad y se adecúa al contexto y al alumnado al que va dirigida. Parte de la evaluación inicial y, además, {{ajuste_realidad}} Si una familia no puede colaborar, un miembro de la comunidad educativa ocupa su lugar; y las actividades se adaptan a los cuatro alumnos con NEAE, como detallo en el punto nueve.","pizarra":[{"zona":"centro","texto":"Ajuste: Mijas · familias · NEAE","caja":"7. Contextos y tiempo"}]}]},{"id":"u8","titulo":"Metodología","rubrica":["Metodología","Bibliografía"],"minutos":2.7,"esquema":["Art. 6 D. 101/2023 → actividad de la secuencia: lectura · problemas · TIC · Andalucía · proyectos","Cooperativo (Pujolás y Lago 2023) · ABP (Cooper y Murphy 2024) · tutoría entre iguales","Roles rotativos con perspectiva de género · AICLE con la maestra de inglés","Cuatro agrupamientos, cada uno con su actividad","Cada espacio y recurso, con su actividad","Implicación y conocimientos previos (Bueno 2019) · educación emocional (Bisquerra, Pérez y García 2015)"],"bloques":[{"id":"u8b1","texto":"Paso al punto ocho: la metodología. Vinculo los principios pedagógicos del artículo 6 del Decreto 101/2023 con la secuencia que he presentado. La lectura, con {{m_lectura}}. El razonamiento matemático, con los problemas exprés y el concurso de problemas. Las TIC, con {{m_tic}}. La realidad social y cultural de Andalucía, con {{m_andalucia}}. Y los proyectos significativos, con la situación de aprendizaje y los dos proyectos del curso.","pizarra":[{"zona":"centro","texto":"Art. 6 · cooperativo · ABP · AICLE","caja":"8. Metodología"}]},{"id":"u8b2","texto":"Aplico tres estrategias metodológicas: el aprendizaje cooperativo, con estructuras de Pujolás y Lago (2023) como el folio giratorio; el aprendizaje basado en proyectos, que, según Cooper y Murphy (2024), da sentido a lo aprendido; y la tutoría entre iguales. Los roles rotan para que niñas y niños sean por igual coordinadores o portavoces, con perspectiva de género; y, como centro bilingüe, me coordino con la maestra de inglés en el enfoque AICLE. Cada agrupamiento tiene su actividad: {{m_agrupamientos}}","pizarra":[{"zona":"normativa","texto":"Pujolás y Lago 2023 · Cooper y Murphy 2024"}]},{"id":"u8b3","texto":"Y cada espacio y recurso, también: {{recursos_ud}}. Planteo actividades que propician la implicación, la participación y el interés y conectan con los conocimientos previos: como explica Bueno (2019), la emoción y la curiosidad activan el aprendizaje, y por eso la unidad parte de {{m_previos}}. Y cuido la educación emocional, como proponen Bisquerra, Pérez y García (2015).","pizarra":[{"zona":"normativa","texto":"Bueno 2019 · Bisquerra et al. 2015"}]}]},{"id":"u9","titulo":"Atención a la diversidad","rubrica":["Medidas de atención a la diversidad","Bibliografía"],"minutos":2.8,"esquema":["DUA (art. 26 Orden 30/05/2023): representación · acción y expresión · implicación → actividades","Medidas generales (art. 27): cooperativo, tutoría entre iguales, multinivel → la de esta UD","Programas (art. 28): refuerzo para los 2 con dificultades, el alumno con TDAH y la alumna de compensatoria","Medidas específicas (art. 33, Instr. 08/03/2017): TDAH → PT en el aula + programa específico de atención y autorregulación","Vinculadas a actividades: dificultades → TDAH → compensatoria","Cauces (D. 328/2010): equipo docente · PT semanal · EOE · familias · Palacios, Marchesi y Coll (2021)"],"bloques":[{"id":"u9b1","texto":"Paso al punto nueve: las medidas de atención a la diversidad. Según el artículo 26 de la Orden de 30 de mayo de 2023, todas se rigen por el Diseño Universal para el Aprendizaje, cuyos tres principios aplico a actividades concretas. {{dua_ejemplos}}","pizarra":[{"zona":"centro","texto":"DUA · multinivel · refuerzo · PT + PE","caja":"9. Diversidad"}]},{"id":"u9b2","texto":"Como medidas generales del artículo 27, aplico el aprendizaje cooperativo, la tutoría entre iguales y actividades multinivel. En esta unidad, la actividad multinivel es {{d_multinivel}}","pizarra":[]},{"id":"u9b3","texto":"Como programas de atención a la diversidad del artículo 28, los dos alumnos con dificultades, el alumno con TDAH y la alumna de compensatoria siguen un programa de refuerzo del aprendizaje. Y como medidas específicas del artículo 33, según las Instrucciones de 8 de marzo de 2017, el alumno con TDAH recibe el apoyo de la maestra de Pedagogía Terapéutica dentro del aula y un programa específico de atención y autorregulación.","pizarra":[]},{"id":"u9b4","texto":"Las vinculo con esta unidad: {{d_vinculo}} Y las coordino por cauces concretos, según el Decreto 328/2010: el equipo docente planifica y sigue los programas; cada semana preparo los materiales con la maestra de Pedagogía Terapéutica; el equipo de orientación nos asesora; y con las familias me coordino en tutoría y por iPasen. Como señalan Palacios, Marchesi y Coll (2021), partimos de las posibilidades de cada niño y niña.","pizarra":[{"zona":"normativa","texto":"Instr. 08/03/2017 · D. 328/2010 · Palacios et al. 2021"}]}]},{"id":"u10","titulo":"Evaluación","rubrica":["Evaluación","Bibliografía"],"minutos":3,"esquema":["Art. 9 Orden 30/05/2023 · referente: los criterios de evaluación","Evaluación inicial: la actividad de partida, en el anecdotario","Instrumentos (art. 10): rúbrica del producto · cotejo · escala · porfolio con su contenido","Cinco niveles con su nota · autoevaluación y coevaluación","Medidas de diversidad: anexo VI, escala 1-5 + ejemplo","La UD (diana) y la práctica docente: indicadores, instrumentos, evidencias (Herrán y Paredes 2020)"],"bloques":[{"id":"u10b1","texto":"Paso al punto diez: la evaluación. Según el artículo 9 de la Orden de 30 de mayo de 2023, es continua, global, competencial, formativa e integradora, y su referente son los criterios de evaluación. La evaluación inicial es {{e_inicial}} Después, uso instrumentos adecuados, coherentes y variados, como indica el artículo 10. Por ejemplo, {{e_rubrica}}","pizarra":[{"zona":"centro","texto":"Inicial · rúbrica · porfolio · 1-10 · diana","caja":"10. Evaluación"}]},{"id":"u10b2","texto":"Además, {{e_observacion}} Y el porfolio recoge {{e_porfolio}} Califico cada criterio con una rúbrica de cinco niveles: con dificultad, insuficiente, menos de cinco; con ayuda, suficiente, cinco; sin dificultades, bien, seis; con facilidad, notable, siete u ocho; y con dominio, sobresaliente, nueve o diez.","pizarra":[]},{"id":"u10b3","texto":"En la autoevaluación y la coevaluación, el alumnado reflexiona sobre cómo aprende; por ejemplo, {{e_coevaluacion}} Y evalúo las medidas de atención a la diversidad según el anexo seis de la Orden: concreto la dificultad, describo la medida y valoro su aplicación en una escala del 1 al 5, de poco adecuada a excelente. Por ejemplo, {{e_diversidad}}","pizarra":[]},{"id":"u10b4","texto":"Por último, evalúo la unidad y mi práctica docente, porque, como recuerdan Herrán y Paredes (2020), evaluar la enseñanza es la base para mejorarla. De la unidad valoro si los {{dias}} días han bastado y cuántos alumnos han superado cada criterio, y el alumnado la valora con una diana. De mi práctica, los indicadores son si los recursos, la metodología y los agrupamientos han funcionado; los instrumentos, el anecdotario, las listas de cotejo y una escala del 1 al 4; y las evidencias, los resultados y las producciones del alumnado.","pizarra":[{"zona":"normativa","texto":"Herrán y Paredes 2020"}]}]},{"id":"u11","titulo":"Conclusión","rubrica":["Conclusión","Expresión oral"],"minutos":1.7,"esquema":["Síntesis: cuatro áreas integradas · SdA → {{pz_producto}}","Proyectos en marcha: «{{nombre_proyecto}}» + «Opera prima»","Tres fases · cooperativo · DUA · evaluación del aprendizaje y de mi práctica","Lo propio de la UD (En definitiva…) → retomo el ODS","Siguiente UD · Vygotsky · nadie aprende solo; aprendemos juntos"],"bloques":[{"id":"u11b1","texto":"Paso al punto once: la conclusión. Sintetizo lo más relevante de la unidad didáctica número {{numero}}, «{{titulo}}». Integra cuatro áreas en una situación de aprendizaje con un producto real, {{producto_sda}}, y hace avanzar «{{nombre_proyecto}}», con {{producto_proyecto}}, y «Opera prima», con {{producto_aps}}. Se desarrolla en tres fases, con aprendizaje cooperativo y DUA para que nadie se quede atrás, y evalúa tanto el aprendizaje como mi práctica.","pizarra":[{"zona":"centro","texto":"Nadie aprende solo: aprendemos juntos","caja":"11. Conclusión"}]},{"id":"u11b2","texto":"{{conclusion_ud}} Así retomo la justificación inicial, vinculada con {{ods}}. Y lo aprendido aquí es el punto de partida de {{siguiente_ud}}. Como enseña Vygotsky en «Pensamiento y lenguaje» (2020), lo que hoy un niño hace con ayuda, mañana lo hará solo. Por eso termino con el lema de mi programación: nadie aprende solo; aprendemos juntos. Muchas gracias por su atención.","pizarra":[{"zona":"normativa","texto":"Vygotsky 2020"}]}]}],"guion":"UD {{numero}} «{{titulo}}» · {{dias}} días\n1. Once puntos. SdA → {{pz_producto}}. Coll, Ausubel. ODS\n2. Mijas bilingüe. NEAE. {{pz_compl}}\n3. Escamilla. Qué trata, descriptores, criterio, saber\n4. Art. 7. Baena, Zabala, Bloom. F1 → {{pz_s1}}\n5. F2 → {{pz_s2}}. Heurísticos\n6. F3 → {{pz_s3}}. Holístico\n7. Familia, centro, digital, inglés. Horario. Ajuste\n8. Art. 6. Pujolás, Cooper, AICLE. Bueno, Bisquerra\n9. DUA. Arts. 27, 28, 33. Cauces. Palacios\n10. Inicial. Instrumentos. Niveles. Diversidad. Herrán\n11. Síntesis. ODS. Siguiente UD. Vygotsky"},"uds":[],"fichas":[{"numero":1,"titulo":"Somos un equipo","trimestre":1,"fechas":"Del 10 al 27 de septiembre","dias":14,"centroInteres":"El trabajo en equipo.","relevanciaSocial":"Beneficios del trabajo cooperativo para desarrollar habilidades sociales, la empatía la resolución pacífica de conflictos. Decreto 101/2023.","ods":["ODS 16. Paz, justicia e instituciones sólidas"],"sda":{"ud":{"titulo":"Somos un equipo","producto":"Cartel para definir las normas de colaboración."},"proyecto":{"nombre":"¡Sí, chef!","producto":"Entrevista a un familiar para el recetario andaluz."},"aps":{"nombre":"Opera prima","producto":"Informe sobre la técnica de animación de Stop Motion."}},"objetivosEtapa":["a","d","e","g","h","j","ñ"],"objetivosAprendizaje":["1. Conocer y producir textos literarios. Contar y escribir adivinanzas.","2. Utilizar los conocimientos básicos sobre la lengua: la letra, la sílaba, la palabra y la oración, el abecedario y el diccionario.","3. Descomponer, componer y redondear números de tres y cuatro cifras.","4. Identificar y nombrar los números ordinales para ordenar elementos en diferentes contextos.","5. Utilizar estrategias para realizar trabajos de forma individual y en equipo con mediación.","6. Conocer las manifestaciones artísticas más importantes de las distintas épocas, lugares y estilos."],"competenciasClave":"CCL (1-2-3-4-5), CP (2-3), STEM (1-2-4), CD (1-2-5), CPSAA (1-2-3), CC (1-2-3-4), CE (1-2-3), CCEC (1-2-3-4)","areas":[{"area":"Lengua Castellana y Literatura","sigla":"LCL","competencias":[{"num":"1","texto":"Reconocer y valorar la diversidad lingüística del mundo como fuente de riqueza cultural."},{"num":"4","texto":"Comprender e interpretar textos escritos y multimodales, su sentido global e ideas principales."},{"num":"5","texto":"Producir textos escritos y multimodales con corrección gramatical y ortográfica."},{"num":"6","texto":"Buscar información procedente de dos o más fuentes para transformarla en conocimiento."},{"num":"7","texto":"Leer de manera autónoma para iniciar el gusto y la construcción de la identidad lectora."}],"criterios":[{"codigo":"1.3.a","texto":"Reconocer rasgos de la lingüística andaluza"},{"codigo":"4.1.a","texto":"Leer de manera silenciosa y en voz alta."},{"codigo":"5.1.a","texto":"Producir textos escritos sencillos."},{"codigo":"6.1.a","texto":"Localizar información para la investigación"},{"codigo":"7.1.a","texto":"Leer de manera autónoma o acompañada."}],"saberes":[{"codigo":"2.A.2","texto":"La diversidad lingüística andaluza."},{"codigo":"2.B.3.4","texto":"Comprensión lectora: ideas principales."},{"codigo":"2.B.3.5","texto":"Producción escrita."},{"codigo":"2.B.3.6","texto":"Alfabetización mediática: búsqueda guiada."},{"codigo":"2.C.1","texto":"Fragmentos de la literatura infantil y popular."}]},{"area":"Matemáticas","sigla":"MAT","competencias":[{"num":"1","texto":"Interpretar situaciones de la vida cotidiana para analizar la información más relevante."},{"num":"4","texto":"Utilizar el pensamiento computacional, organizando datos, descomponiendo en partes."},{"num":"5","texto":"Reconocer y utilizar conexiones entre diferentes ideas matemáticas."},{"num":"6","texto":"Comunicar de forma individual y colectiva procedimientos y resultados matemáticos."},{"num":"7","texto":"Gestionar emociones al enfrentarse a retos matemáticos para disfrutar del aprendizaje."}],"criterios":[{"codigo":"1.1.a","texto":"Comprender problemas de la vida cotidiana"},{"codigo":"4.1.a","texto":"Utilizar el pensamiento computacional."},{"codigo":"5.1.a","texto":"Realizar conexiones matemáticas."},{"codigo":"6.2.a","texto":"Explicar procesos matemáticos sencillos."},{"codigo":"7.1.a","texto":"Identificar las emociones al abordar retos."}],"saberes":[{"codigo":"2.A.2.1","texto":"Orden de magnitud de los números."},{"codigo":"2.D.4.1","texto":"Interpretación de algoritmos sencillos."},{"codigo":"2.C.4.3","texto":"Relaciones geométricas matemáticas."},{"codigo":"2.A.2.3","texto":"Representación de la recta numérica."},{"codigo":"2.E.1.1","texto":"Tolerancia ante la frustración."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"1","texto":"Utilizar recursos digitales para buscar información de manera individual y en equipo."},{"num":"8","texto":"Reconocer la igualdad de género para contribuir al bienestar individual y colectivo."}],"criterios":[{"codigo":"1.1.a","texto":"Utilizar recursos digitales de forma segura."},{"codigo":"8.1.a","texto":"Valorar la diversidad cultural y la igualdad de género."}],"saberes":[{"codigo":"2.C.1.3","texto":"Dispositivos digitales."},{"codigo":"2.C.3.1","texto":"Normas para la vida en sociedad"}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"1","texto":"Descubrir propuestas artísticas de diferentes géneros, estilos, épocas."}],"criterios":[{"codigo":"1.1.a","texto":"identificar propuestas artísticas de diferentes géneros, estilos y culturas"}],"saberes":[{"codigo":"2.A.2","texto":"Recepción activa de propuestas artísticas."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho una conversación. La lengua oral y escrita. C.EV.1.3.a. (M) Leo un cuento. Los duendes y el zapatero. Antes de leer. Lee el título y observa la ilustración. Vocabulario. Comprendo la lectura. Piensa en otro final. (X) Capítulo del libro. Vocabulario. El abecedario. El diccionario. (J) Cuenta cuentos. Las adivinanzas. Inventa, crea y memoriza una adivinanza sobre una profesión. Competición por equipos. (V) Dramatizaciones. Textos tradicionales. Lee las estrofas de la canción tradicional la Tarara e inventa dos más. Leer y valorar.","MAT":"(L) Los números de tres cifras. Lectura de números. Escritura de números en cifras y en letras. (M) Problemas exprés. (X) Resolución de problemas. Contar hacia delante y hacia atrás. Contar más allá del número 999. Contar decenas y centenas. C.EV.1.1.a. (J) Identificar números con bloques base 10. Utiliza los bloques para representar los números. Identifica el valor de una cifra. Pasar de centenas a decenas y unidades. (V) Concurso de problemas. Por equipos, inventamos y resolvemos problemas.","CMN":"(J) Vídeo ¿Qué es el método científico? Realizamos un esquema con los pasos del método científico. (V) ¿Cómo podemos trabajar de forma cooperativa? División del grupo por equipos heterogéneos y asignación de roles. SdA. UD. Somos un equipo. Producto. Cartel para definir las normas de colaboración. C.EV. 1.1.a.","EAR":"(V) Los materiales de plástica. Crea a tu manera, las letras tridimensionales. C.EV.1.1.a"},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. La letra, la sílaba, la palabra y la oración. (M) Leo un cuento tradicional. C.EV.7.1.a. Preparamos un listado de los cuentos tradicionales. C.EV.5.1.a. (X) Capítulo del libro. Escribo un cuento siguiendo los pasos. (J) Cuenta cuentos. Clases de palabras según el número de sílabas. (V) Dramatizaciones de cuentos. Elaboración de un esquema sobre las clases de palabras. Jugar a palabras encadenadas.","MAT":"(L) Los números de cuatro cifras. El número mil. Lectura de números de cuatro cifras. Conteo de centenas. (M) Problemas exprés. (X) Resolución de problemas. Series de 10 en 10, de 100 en 100, de 1000 en 1000. Equivalencia entre unidades de millar, centenas, decenas y unidades. (J) Identificar números con bloques base 10. Identifica el valor de una cifra. Pasar de centenas a decenas y unidades. (V) Concurso de problemas. Cálculo mental. Sumar una cifra sin llevadas. C.EV.6.2.a.","CMN":"(J) ¿Conoces algún científico o científica? Explica a la clase quien es y lo que hace. Haz un dibujo de cómo te lo imaginas (V) SdA. UD. Somos un equipo. Producto. Cartel para definir las normas de colaboración. Escribe las normas, corrige, revisa y haz los cambios necesarios. C.EV.1.1.a.","EAR":"(V) Pintores importantes de Andalucía. Velázquez. Vídeo. Biografía. Obra las meninas."},{"numero":3,"fase":"aplicar – concluir","LCL":"Leo una noticia. Vocabulario. La oración. Escribo oraciones. (M) Leo un poema. Clases de sílabas: tónicas y átonas. (X) Capítulo del libro. C.EV.4.1.a. Tipos de palabras según la posición de la sílaba tónica. Encuentra la sílaba tónica. El alumnado cuenta qué ha desayunado e indica la sílaba tónica de los alimentos. C.EV. 6.1.a. (J) Cuenta cuentos. Cuenta las sílabas y rodea la tónica. La tilde. (V) Dramatizaciones de cuentos. Dictado. Leo y escribo el texto. Intercambio de cuadernos para corregir.","MAT":"(L) Comparo números. Ordenar de menor a mayor y de mayor a menor. (M) P licar por cero. Construir la tabla del 2. Contamos de dos en dos. (V) Concurso de problemas. Inventamos y resolvemos problemas.","CMN":"(J) Leemos el texto ¿qué es un animal? ¿cómo se adaptan en su entorno? Elaboramos un esquema de la función de nutrición. Clasificamos animales y comparamos con los compañeros. (V) SdA. UD. Diseño de un superhéroe animal. C.EV.2.4.a.","EAR":"(V) Vídeo. La simetría axial por recorte. Crea a tu manera. Hacemos un Kirigami en papel."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Escribo un resumen. (M) Leo un texto. Vocabulario. Comprendo la lectura. La coma y los dos puntos. (X) Capítulo del libro. Vocabulario. Taller de escritura. Los valores de las fábulas. Crea una fábula siguiendo los pasos. C.EV.5.1.a. (J) Cuenta cuentos. Los diminutivos y aumentativos. Escribe oraciones con diminutivos o aumentativos. (V) Dramatizaciones. Las palabras compuestas. Esquema de los diminutivos, aumentativos y palabras compuestas. C.EV.2.1.a.","MAT":"(L) Las tablas de multiplicar. Construir la tabla del 5 y del 10. Contamos de cinco en cinco y de diez en diez. Relación entre multiplicar por 10 y por 5. (M) Problemas exprés. C.EV.3.1.a. (X) Resolución de problemas. Las tablas de multiplicar. Construir la tabla del 4. Contamos de cuatro en cuatro. Relación entre la tabla del 2 y la del 4. (J) Las tablas de multiplicar. Construir la tabla del 8. Relación entre la tabla del 4 y la del 8. (V) Concurso de problemas. Cálculo mental. Suma con llevadas. C.EV.7.2.a.","CMN":"(J) Video los insectos. Hacemos un esquema de algunos grupos de invertebrados. Clasificamos invertebrados. (V). C.Ev.2.2.a. SdA. UD. Diseño de un superhéroe animal. C.EV. 6.1.a.","EAR":"(V) Velázquez. Las meninas. Con una plantilla, coloreamos el cuadro a nuestro gusto."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Salida. Aventura Amazonia. Parque de aventuras y tirolinas en Marbella. (M) Leo un Texto. Vocabulario. Comprendo la lectura. (X) Cap ciones y los sentimientos."},{"num":"6","texto":"Identificar las causas y consecuencias de la intervención humana en el entorno."}],"criterios":[{"codigo":"1.2.a","texto":"Utilizar dispositivos y recursos digitales."},{"codigo":"4.1.a","texto":"Fomentar el bienestar emocional y social."},{"codigo":"6.1.a","texto":"Identificar problemas ecosociales."}],"saberes":[{"codigo":"2.B.1.1","texto":"Dispositivos y recursos digitales."},{"codigo":"2.C.1.3","texto":"El cuerpo humano y su funcionamiento."},{"codigo":"2.C.4.3","texto":"Estilos de vida sostenible."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"4","texto":"Participar de la elaboración y la difusión de producciones artísticas."}],"criterios":[{"codigo":"4.1.a","texto":"Participar en el diseño de producciones artísticas de forma cooperativa."}],"saberes":[{"codigo":"2.B.1","texto":"Fases del proceso creativo."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Vocabulario. Escucho una anécdota. Comprensión. (M) Leo un relato divertido. Vocabulario. Comprendo la lectura. Dibujo la secuencia de una anécdota. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un relato según su estructura. Prepara un guion. (J) Cuenta cuentos. Vocabulario. Las palabras sinónimas. (V) Dramatizaciones. Cuento un chiste con entonación y lenguaje corporal. Por equipos, concurso de chistes. C.EV.2.1.a.","MAT":"(L) Las tablas de multiplicar. Construir la tabla del 3 y del 6. Calcular productos por 3 y por 6. (M) Problemas exprés. C.EV.1.2.a. (X) Resolución de problemas. Relación entre la tabla del 3 y del 6. El triple. Calcular productos por 3 y por 6. C.EV.6.2.a. (J) Construir la tabla del 9. Contamos de nueve en nueve. Calcular productos por 9. Relación entre la tabla del 3 y del 9. (V) Concurso de problemas. Inventamos y resolvemos problemas.","CMN":"(J) ¿Qué tipo de animales somos? Investiga y escribe en tu cuaderno actividades humanas de soy un primate porque tengo... Según los alimentos que tomamos ¿a qué animales nos parecemos? C.EV.1.2.a. (V) SdA. UD. Cartel de una pirámide de hábitos de salud.","EAR":"(V) Dibujo de la figura humana para representar el esquema corporal C.EV.2.B.1."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Vocabulario. Contamos anécdotas. Por equipos elegimos la mejor. (M) Leo un texto. El nombre. Las clases de nombres. Esquema. (X) Capítulo del libro. C.EV.4.1.a. Vocabulario. Taller de escritura. Escribo un relato según su estructura. Redactar teniendo en cuenta: comienzo, nudo y desenlace. C.EV.5.1.a. (J) Cuenta cuentos. Vocabulario. El género y número de los nombres. Copio y completo un esquema del nombre. (V) Dramatizaciones. Cuento un chiste con entonación y lenguaje corporal. Por equipos, concurso de chistes. C.EV.2.1.a.","MAT":"(L) Propiedad conmutativa. Construir la tabla del 7. Contamos de siete en siete. Calcular productos por 7. C.EV.4.2.a. (M) Problemas exprés. (X) Resolución de problemas. Calcular productos. Memorizar las tablas de multiplicar jugando con las regletas. (J) Multiplico por 10,100 y 1000. Calcular e identificar productos por 10,100 y 100. Calcula y completa la serie. (V) Concurso de problemas. Cálculo mental. Resta de una cifra con llevadas. C.EV.8.2.a.","CMN":"(J) ¿Qué aparatos del cuerpo humano expulsan sustancias de desecho al exterior? Explica las funciones vitales. Dibuja en el cuaderno nuestros aparatos para realizar la función de nutrición y muéstralo a los compañeros. C.Ev. 4.1.a. (V) SdA. UD. Cartel de una pirámide de hábitos de salud.","EAR":"(V) Velázquez. Las meninas. Con una plantilla, coloreamos el cuadro a nuestro gusto."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Vocabulario. Contamos anécdotas. Por equipos, seleccionamos la más divertida. Elegimos la ganadora. (M) Leo un texto. Estudio y practico el esquema del nombre. (X) Capítulo del libro. Vocabulario. Taller de escritura. Escribo un relato según su estructura. Revisar y hacer un dibujo. C.EV.8.2.a. (J) Cuenta cuentos. Vocabulario. Los signos de interrogación y exclamación. Crea oraciones. (V) Dramatizaciones. Dictado. Repasamos ortografía. Lee, escucha y escribe. Revisa la ortografía. Intercambia el cuaderno para corregir. C.EV. 9.2.a.","MAT":"(L) Multiplico de diferentes formas. Contamos, sumamos y descomponemos. Resuelve las multiplicaciones. Uso de regletas. C.EV.5.2.a. (M) Problemas exprés. (X) Resolución de problemas. Multiplico en vertical. La multiplicación sin llevadas. Copia, calcula y resuelve las multiplicaciones. (J) La multiplicación con llevadas. Copia y resuelve sin olvidar las que te llevas. Uso de regletas. (V) Concurso de problemas. Concurso de tablas de multiplicar. C.EV.8.2.a.","CMN":"(J) ¿Qué son los sentidos? Dibuja en tu cuaderno un diagrama para representar la función de relación. Leemos y comentamos un texto sobre las etapas de la vida. C.Ev. 4.1.a. (V) SdA. Proyecto ¡Si chef! Producto. Refranes, canciones o dibujos. Recetario andaluz. C.Ev.1.2.a.","EAR":"PLA APS. Opera prima Producto. Cómic para el corto de animación. Resolución de conflictos"}],"complementaria":"16 de noviembre. Día del Flamenco. Visita de una bailaora flamenca: presentación y coreografía de pasos y ritmos flamencos.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase.","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos."},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los criterios de evaluación. Orden 30/5/23","procedimientos":"Observación sistemática, corrección de tareas.","evidencias":"Evidencias-Trazabilidad. Respuestas a preguntas, producto final de tareas y proyectos. Desempeños. Presentación oral, ...","productos":"Cartel","autoevaluacion":"Autoevaluación-coevaluación","criteriosEvaluados":{"LCL":["2.1.a","4.1.a","5.1.a","8.2.a","9.2.a"],"MAT":["1.2.a","4.1.a","5.1.a","6.2.a","8.2.a"],"CMN":["2.2.a","5.1.a","6.1.a"],"EAR":["2.B.1"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el 11/11/2025 es martes y el 29/11/2025 sábado; del 11 al 28/11 hay 14 días lectivos, no los 15 indicados. La semana 1 programa actividades (L) aunque empieza en martes.","A. complementaria el 16 de noviembre (domingo en 2025), Día del Flamenco: no cae en día lectivo.","El original escribe el proyecto como '¡Si chef!'; se normaliza a '¡Sí, chef!' en sda.proyecto.nombre (en las semanas se copia literal). ODS indicado como 'ODS 3-16'; se separa en dos entradas.","Evaluación: la tabla de criterios evaluados no coincide con los criterios de la UD: LCL 8.2.a (la UD tiene 8.1.a); MAT 4.1.a y 5.1.a (la UD tiene 4.2.a y 5.2.a); CMN 2.2.a y 5.1.a (la UD tiene 1.2.a y 4.1.a); EAR 2.B.1 es un saber, no un criterio (la UD tiene 4.1.a).","C.EV. de las semanas que no son criterios de la UD: LCL 8.2.a (semana 3); EAR 'C.EV.2.B.1' (semana 1, es un saber). LCL 2.1.a se evalúa dos veces (semanas 1 y 2) y MAT 8.2.a también (semanas 2 y 3); LCL 8.1.a, CMN 6.1.a y EAR 4.1.a no se evalúan en ninguna semana.","Saberes que no casan: MAT 2.C.4.3 'Relaciones geométricas matemáticas' y 2.B.1.2 'Clasificación y organización de datos' no se trabajan (UD de multiplicación); el código 2.C.4.3 se repite en CMN con otro texto ('Estilos de vida sostenible').","MAT semana 2: 'productos por 10,100 y 100' (debería ser 1000) y '(V) Resta de una cifra con llevadas' no encaja con la multiplicación. EAR semana 2 repite literalmente la actividad de Las meninas de la UD 3.","Erratas literales: 'CP(2)' sin espacio, objetivo 4 sin punto final, 'obras literarias adecuados', 'Opera prima' sin tilde, EAR semana 3 rotulada 'EAR/PLA APS' sin marca de día ni C.EV.; CMN semana 3 (V) con C.Ev.1.2.a sobre el proyecto.","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción. La escala de UD 4 usa descriptores breves ('Con dificultad', 'Con ayuda'...)."]},{"numero":5,"titulo":"Cuidamos los ecosistemas","trimestre":1,"fechas":"Del 2 al 20 de diciembre","dias":13,"centroInteres":"Los ecosistemas en Andalucía.","relevanciaSocial":"Cuidar y proteger los ecosistemas para mitigar los efectos del cambio climático. Decreto 101/2023","ods":["ODS 15. Vida de ecosistemas terrestres","ODS 16. Paz, justicia e instituciones sólidas"],"sda":{" en los seres vivos vivir aislados sin relacionarse con otros seres vivos? Escribe una cadena alimentaria con tres animales. ¿Por qué son importantes las rocas en un ecosistema? (V) SdA. UD. Mural con medidas para proteger el planeta.","EAR":"(V) Dibujo de la simetría de los copos de nieve"},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Describir lugares y objetos. Realizar descripciones orales de diferentes lugares del colegio. C.EV.7.1.a. (M) Leo una Descripción. Elige una imagen y describe el paisaje en tu cuaderno. Lee a los compañeros. (X) Capítulo del libro. Taller de escritura. ¡Qué bonita es Andalucía! Describe tu paisaje preferido. C.EV.5.1.a. (J) Cuenta cuentos. Describo personajes principales y secundarias. (V) Dramatizaciones. Jugar al “veo, veo” haciendo descripciones de objetos. C.EV.2.1.a.","MAT":"(L) Descomponer números para dividir. En grupo resolver divisiones con bloques base 10. C.EV.6.2.a. Resolvemos divisiones descomponiendo. Uso de regletas. (M) Problemas exprés. (X) Resolución de problemas. Video. Calcular divisiones en caja. Repartir decenas y unidades. Divisiones con cero en el cociente. J) Practicamos la división. Propiedad del resto. (V) Concurso de problemas. Inventamos problemas a partir de una división. Cálculo mental de sumas con llevadas. C.EV.3.2.a.","CMN":"(J) ¿Cómo son los ecosistemas andaluces? Busca fotografías y dibuja un ecosistema de Andalucía que hayas visitado y escribe una pequeña descripción de los animales o plantas que viste. C.Ev.5.2.a. (V) 6 de diciembre. Día de la Constitución. SdA. UD. Mural con medidas para proteger el planeta.","EAR":"(V) Velázquez. Las meninas. Mural con los dibujos del grupo. C.Ev.4.2.a."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) 16 de diciembre. Día de la lectura en Andalucía. Lectura sobre curiosidades de Andalucía. (M) Leo una ficha de personajes de un libro. El adjetivo. Escribe los adjetivos del texto. Esquema del adjetivo. (X) Capítulo del libro. Taller de escritura. ¡Qué bonita es Andalucía! Describe tu paisaje preferido. Lectura al grupo. C.EV.10.2.a. (J) Cuenta cuentos. Palabras con h. (V) Dramatizaciones. Jugar al “veo, veo” haciendo descripciones de objetos. Dictado. C.EV.9.1.a.","MAT":"(L) División errónea. Propiedad del resto. Prueba de la división. (M) Problemas exprés. (X) Resolución de problemas. En grupos, inventa problemas de divisiones. Repasa las tablas de multiplicar. Calcula divisiones aplicando la prueba. Expresa emociones. C.EV.7.1.a. (J) Calcula divisiones aplicando la prueba. (V) Concurso de problemas. Pienso paso a paso. Partes de un problema para preparar el desayuno. C.Ev 4.1.a.","CMN":"(J) ¿Qué daños estamos provocando a los ecosistemas y cómo podemos protegerlos? En grupos escribimos consejos para llevar un estilo de vida sostenible. Exponemos. C.Ev.6.1.a. (V) SdA. Proyecto ¡Si chef! Producto. Elaboración y degustación en el aula. Recetario andaluz. C.Ev. 3.1.a.","EAR":"APS. Opera prima Producto. Escenario para el corto Resolución de conflictos"}],"complementaria":"6 de diciembre. Día de la Constitución. Visionado de un vídeo sobre la Constitución Española para niños. https://www.youtube.com/watch?v=ofMR4HhaqBQ 16 de diciembre. Día de la lectura en Andalucía. Lectura sobre curiosidades de Andalucía.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distint
