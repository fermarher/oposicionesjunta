":"Formulación de conjeturas a partir de datos."}]},{"area":"Conocimiento del Medio Natural, Social y Cultural","sigla":"CMN","competencias":[{"num":"3","texto":"Resolver problemas cooperativamente para generar productos creativos e innovadores."},{"num":"7","texto":"Comprender cambios del medio social y cultural para explicar los diferentes acontecimientos."},{"num":"9","texto":"Participar en la vida social desde el respeto para generar interacciones positivas de dialogo."}],"criterios":[{"codigo":"3.1.a","texto":"Diseñar en equipo un producto final sencillo."},{"codigo":"7.2.a","texto":"Conocer las principales características de las personas."},{"codigo":"9.1.a","texto":"Emplear un lenguaje inclusivo y no violento."}],"saberes":[{"codigo":"2.B.2.3","texto":"Técnicas cooperativas sencillas."},{"codigo":"2.A.1.5","texto":"Avances en el pasado."},{"codigo":"2.C.3.2","texto":"Normas para la vida en sociedad."}]},{"area":"Educación Artística","sigla":"EAR","competencias":[{"num":"4","texto":"Participar de la elaboración y la difusión de producciones artísticas."}],"criterios":[{"codigo":"4.3.a","texto":"Compartir los proyectos creativos, explicando el proceso y el resultado."}],"saberes":[{"codigo":"2.C.1","texto":"Materiales de expresión plástica y visual."}]}],"semanas":[{"numero":1,"fase":"motivar – activar","LCL":"(L) Leo una noticia. Escucho un ensayo teatral. Respondo a las preguntas. Las obras de teatro. C.EV.3.2.a. (M) Leo una obra de teatro. Vocabulario. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Crear un cartel publicitario con un eslogan sobre un medio de transporte. (J) Cuenta cuentos. El campo semántico. En grupos, escribir todas las palabras que pertenezcan al campo semántico deportes. (V) Dramatizo una obra de teatro. Escribe los consejos para dramatizar una obra de teatro.","MAT":"(L) Los polígonos. Identifica los polígonos. Dibuja polígonos en tu cuaderno. Elementos de un polígono. (M) Problemas exprés. (X) Resolución de problemas. El nombre de los polígonos según su número de lados. Dibuja tres polígonos y escribe cómo se llaman. ¿cuántos lados tienen? Dibuja tres figuras que no sean polígonos. (J) Identifica los lados, vértices y ángulos de los polígonos. C.EV.3.2.a. Juega con bloques geométricos, forma polígonos e indica su nombre. Haz series o forma figuras. Busca polígonos en los objetos que hay a tu alrededor y dibuja alguno. C.EV.6.1.a. (V) Concurso de problemas.","CMN":"(J) ¿Qué son las fuentes históricas? Busca en internet y escribe el titular de una noticia histórica de tu localidad. (V) SdA. UD. Maqueta del Centro Pompidou. C.Ev.3.1.a.","EAR":"(V) Crea como quieras una invitación para el evento de final de curso."},{"numero":2,"fase":"explorar - estructurar","LCL":"(L) Leo una noticia. Respondo a las preguntas. Las lenguas de España. C.EV.1.2.a. (M) Leo un texto. Vocabulario. C.EV.8.3.a. Comprendo la lectura. El andaluz. (X) Capítulo del libro. Taller de escritura. Escribo un texto teatral. En grupos, decidís argumento, personajes y lugar. Como empieza y acaba la historia. Los diálogos, la vestimenta, el decorado y como se va a llamar vuestra obra. (J) Cuenta cuentos. Copio y completo el esquema de las lenguas de España. (V) Dramatizo una obra de teatro.","MAT":"(L) El perímetro. Calcula el perímetro de los polígonos dados. Dibuja un cuadrilátero que tenga todos sus lados iguales y cuyo perímetro mida 12 cm. Calcula el perímetro en centímetros de tu mesa. C.EV.5.1.a. (M) Problemas exprés. (X) Resolución de problemas. Clases de triángulos. Esquema. Clasifica según sus lados. (J) Clase de triángulos según sus ángulos. Esquema. Clasifica los triángulos que hay en el tangram. Recorta un cuadrado y divídelo en dos triángulos iguales. C.EV.3.2.a. (V) Concurso de problemas. Cálculo mental. Mitad de cifras pares. C.EV.8.1.a.","CMN":"(J) ¿Qué son los museos? ¿Has visitado alguno? Redacta y expón al grupo normas sobre cómo comportarse en un museo. 14 de junio. Día de la Memoria Histórica. Exposición de dibujos contra la guerra C.Ev.9.1.a. (V) SdA. UD. Maqueta del Centro Pompidou","EAR":"(V) Murillo. Copia la obra Niños comiendo melón y uvas. Mural de las obras del grupo."},{"numero":3,"fase":"aplicar – concluir","LCL":"(L) Leo una noticia. Respondo a las preguntas. Participo en un debate. ¿Qué pasaría si tuvieras que irte a vivir a otro país? C.EV.10.1.a (M) Leo un texto. Comprendo la lectura. (X) Capítulo del libro. Taller de escritura. Escribo un texto teatral. En grupos, decidís argumento, personajes y lugar. Como empieza y acaba la historia. Los diálogos, la vestimenta, el decorado y como se va a llamar vuestra obra. (J) Cuenta cuentos. C.EV.5.1.a Palabras con bl y br. (V) Dramatizo una obra de teatro. Dictado.","MAT":"(L) Clases de cuadriláteros. Esquema. Características. Describir cuadriláteros. (M) Problemas exprés. (X) Resolución de problemas. Juega con los bloques geométricos para formar figuras. Describe las figuras con vocabulario geométrico. Dibuja un robot utilizando cuadriláteros. (J) Circunferencia y círculo. Identifica objetos con forma de círculo. Dibuja un círculo y una circunferencia y señala el centro, radio y diámetro. Aprende a dibujar una circunferencia con el compás. C.EV.3.2.a. (V) Concurso de problemas. Pienso paso a paso. Encuentra la figura geométrica a través de su descripción. C.EV.4.1.a.","CMN":"(J) Busca fotografías antiguas que muestren lugares de tu localidad en el pasado. Busca algún personaje histórico de Andalucía e investiga sobre su vida, a qué se dedicaba y por qué era importante. C.Ev. 7.2.a. (V) SdA. Proyecto. Huellas del pasado. Producto F. Decorar y presentar el Lapbook.","EAR":"APS. Opera prima. Producto. Festival de cine fin de curso C.Ev. 2.C.1."}],"complementaria":"14 de junio. Día de la Memoria Histórica. Exposición de dibujos contra la guerra.","refuerzoProfundizacion":"Actividades multinivel siguiendo los principios DUA.","metodologia":"Trabajo individual y cooperativo con perspectiva de género. Tutoría entre iguales.","principiosPedagogicos":"Art. 6 del Decreto 101/2023 a-j","agrupamientos":"Trabajo individual, pequeños grupos heterogéneos, grupo clase","recursos":{"espaciales":"Aula, patio, biblioteca.","digitales":"Google Classroom, Google Maps, Canva.","personales":"Familias, expertos.","materiales":"Material fungible, prensa, textos cotidianos, reglas, compás"},"diversidad":{"dua":["1. Múltiples formas de representación. Clarificación de vocabulario y símbolos. Imágenes, vídeos...","2. Múltiples formas de expresión. Diferentes opciones y distintos lenguajes (oral, escrito, esquemas...)","3. Múltiples formas de implicación. Trabajo cooperativo, utilización del feedback"],"medidasGenerales":"Aprendizaje cooperativo. Metodología por proyectos.","medidasEspecificas":"NEE. Programa de refuerzo. Autonomía del centro 30´ LCL y 30´ MAT. DIA: PRA y PE. COM: PRA","evaluacionMedidas":"Orden 30/5/2023. Observación y valoración cualitativa de las medidas DUA aplicadas, en la escala 1. Poco adecuado. 2. Aceptable, pero requiere revisión. 3. Adecuada. 4. Buena. 5. Excelente. Valoración de las actividades de refuerzo y/o profundización. Observación y valoración cualitativa del trabajo cooperativo. Autoevaluación del alumnado respecto a las medidas específicas."},"evaluacion":{"instrumentos":"Listas de cotejo, escalas de observación, portfolio, registro anecdótico, rúbrica. Rúbrica de todos los criterios de evaluación. Orden 30/5/23","procedimientos":"Observación sistemática, corrección de tareas.","evidencias":"Evidencias-Trazabilidad. Respuestas a preguntas, producto final de tareas y proyectos. Desempeños. Presentación oral","productos":"Maqueta","autoevaluacion":"Autoevaluación-coevaluación","criteriosEvaluados":{"LCL":["1.2.a","3.2.a","5.1.a","8.3.a","10.2.a"],"MAT":["3.2.a","4.1.a","5.1.a","6.1.a","8.1.a"],"CMN":["2.2.a","5.1.a","6.1.a"],"EAR":["2.C.1"]},"escala":"IN 1-4,9 (Con dificultad); SU 5-5,9 (Con ayuda); BI 6-6,9 (Sin dificultades); NT 7-8,9 (Con facilidad); SB 9-10 (Muestra dominio)"},"autoevaluacionDocente":{"indicadores":"Los materiales y recursos didácticos han sido adecuados, la metodología tiene un enfoque competencial, etc.","instrumentos":"Listas de cotejo, escala de valoración 1- 4"},"observaciones":["Fechas: el original indica 'Del 2 al 20 de junio de 2025', 15 días lectivos (cuadra con 3 semanas completas); el año 2025 no casa con un curso 2025-2026. El 14 de junio (Día de la Memoria Histórica, actividad complementaria) cae en sábado en 2025 y se sitúa en la semana 2.","El título de sda.ud no aparece explícito: se usa el título de la UD. El proyecto se llama igual que la UD ('Huellas del pasado'). En la semana 3 aparece 'Producto F.' (posible 'Producto final').","LCL: las actividades de la semana 1 (cartel publicitario sobre un medio de transporte, campo semántico 'deportes') no casan con el centro de interés. La semana 3 evalúa 'C.EV.10.1.a', pero el criterio de la UD es 10.2.a. El criterio 8.3.a (literatura tradicional) se empareja con el saber 2.C.1 (literatura infantil).","MAT: el saber '2C.1.4' carece de punto (2.C.1.4). Los saberes 2.B.1.1 (amplitud del ángulo) y 2.F.2.4 (conjeturas a partir de datos) apenas casan con las actividades (polígonos, perímetro, triángulos, cuadriláteros, circunferencia). El objetivo 3 menciona paralelogramos y no paralelogramos, que no aparecen explícitamente en las semanas.","CMN: la evaluación lista 2.2.a, 5.1.a y 6.1.a, que no son criterios de esta UD, y omite 3.1.a, 7.2.a y 9.1.a, que sí se usan en las semanas. El criterio 7.2.a ('características de las personas') casa mal con el saber 2.A.1.5 (avances en el pasado).","EAR: el criterio es 4.3.a, pero en la semana 3 y en la evaluación se usa el código del saber 2.C.1 como criterio; semanas 1 y 2 sin C.EV. La entrada EAR de la semana 3 no lleva marca de día.","Evaluación: la tabla de instrumentos/procedimientos/evidencias está en columnas mezcladas en el PDF; el reparto entre campos es una reconstrucción. Producto de la e <script>
/* Modelo de datos (exposiciones), progreso del estudio y reproductor de audio. */
(function () {
  'use strict';
  const Opo = window.Opo;
  const { partes, textoDe, frases, contarPalabras, PPM, Almacen } = Opo;

  // =============================================================== MODELO
  const DATOS = window.OPOS_DATOS || {};
  const AUDIO = window.OPOS_AUDIO || {};

  const pad2 = (n) => String(n).padStart(2, '0');

  function construirExposicion({ id, tipo, doc, valores, audioClave, titulo, corto, ud, ficha }) {
    const secciones = [];
    const bloques = [];
    const lista = [];
    const pizarra = [];
    let minAcum = 0;
    let palabrasAcum = 0;
    (doc.secciones || []).forEach((s, si) => {
      const sec = {
        id: s.id, idx: si, titulo: textoDe(partes(s.titulo, valores)), rubrica: s.rubrica || [],
        minutos: Number(s.minutos) || 0, esquema: (s.esquema || []).map((e) => partes(e, valores)),
        bloques: [], palabras: 0, iniMin: minAcum, finMin: minAcum + (Number(s.minutos) || 0),
      };
      minAcum = sec.finMin;
      (s.bloques || []).forEach((b) => {
        const ps = partes(b.texto, valores);
        const texto = textoDe(ps);
        const cortes = frases(texto);
        const bl = { id: b.id, seccion: si, partes: ps, texto, cortes, primeraFrase: lista.length, nFrases: cortes.length, palabras: contarPalabras(texto) };
        const rangos = [];
        let pos = 0;
        ps.forEach((p) => { if (p.h && p.t.trim()) rangos.push([pos, pos + p.t.length]); pos += p.t.length; });
        cortes.forEach(([a, z], k) => {
          const t = texto.slice(a, z);
          const w = contarPalabras(t);
          const propia = rangos.some(([x, y]) => x < z && y > a);
          lista.push({ idx: lista.length, bloque: bloques.length, seccion: si, k, a, z, texto: t, palabras: w, propia, est0: (palabrasAcum / PPM) * 60, est1: ((palabrasAcum + w) / PPM) * 60 });
          palabrasAcum += w;
        });
        const items = b.pizarra || [];
        items.forEach((p, j) => {
          const k = cortes.length ? Math.min(cortes.length - 1, Math.floor((j * cortes.length) / Math.max(1, items.length))) : 0;
          pizarra.push({
            id: `${b.id}-${j}`, zona: p.zona, caja: p.caja ? textoDe(partes(p.caja, valores)) : '', partes: partes(p.texto, valores),
            seccion: si, bloque: bloques.length, frase: bl.primeraFrase + k,
          });
        });
        sec.palabras += bl.palabras;
        sec.bloques.push(bl);
        bloques.push(bl);
      });
      secciones.push(sec);
    });
    // tiempos de audio
    let audio = null;
    const a = AUDIO[audioClave];
    if (a && Array.isArray(a.frases)) {
      const porBloque = {};
      a.frases.forEach((f) => { (porBloque[f.b] = porBloque[f.b] || []).push(f); });
      let encaja = true;
      bloques.forEach((bl) => {
        const fs = porBloque[bl.id] || [];
        if (fs.length !== bl.nFrases) { encaja = false; return; }
        fs.forEach((f, k) => { const fr = lista[bl.primeraFrase + k]; fr.t0 = f.t0; fr.t1 = f.t1; });
      });
      if (encaja) audio = { src: `audio/${audioClave}.mp3`, duracion: a.duracion, voz: a.voz };
      else console.warn(`[audio] ${audioClave}: las frases no coinciden con el texto; se usará la voz del navegador.`);
    }
    // Cada línea del índice se refiere a una sección (por orden o por su número inicial).
    const indice = pizarra.filter((p) => p.zona === 'indice');
    indice.forEach((p, k) => {
      const m = textoDe(p.partes).match(/^\s*(\d{1,2})[.)]/);
      p.ref = indice.length === secciones.length ? k : m ? Number(m[1]) - 1 : p.seccion;
    });

    return {
      id, tipo, titulo, corto, audioClave, secciones, bloques, frases: lista, pizarra, guion, audio, ud, ficha,
      palabras: palabrasAcum, minutosTexto: palabrasAcum / PPM, objetivoMinutos: doc.objetivoMinutos || minAcum,
      duracionEst: (palabrasAcum / PPM) * 60,

  }

  const expos = {};
  const uds = (DATOS.uds || []).slice().sort((x, y) => x.numero - y.numero);
  const fichas = {};
  (DATOS.fichas || []).forEach((f) => { if (f && f.numero) fichas[f.numero] = f; });

  if (DATOS.programacion) {
    expos.pd = construirExposicion({
      id: 'pd', tipo: 'pd', doc: DATOS.programacion, valores: null, audioClave: 'programacion',
      titulo: DATOS.programacion.titulo || 'Defensa de la programación', corto: 'Programación',
    });
  }
  if (DATOS.plantilla) {
    uds.forEach((u) => {
      const id = `ud${pad2(u.numero)}`;
      expos[id] = construirExposicion({
        id, tipo: 'ud', doc: DATOS.plantilla, valores: u.valores || {}, audioClave: id,
        titulo: `UD ${u.numero}. ${u.titulo}`, corto: `UD ${u.numero}`, ud: u, ficha: fichas[u.numero] || null,
      });
    });
  }
  const etiquetasHuecos = {};
  ((DATOS.plantilla && DATOS.plantilla.huecos) || []).forEach((h) => {
    etiquetasHuecos[h.id] = h.etiqueta || h.id.replace(/_/g, ' ');
  });

  Opo.Modelo = {
    DATOS, expos, uds, fichas, etiquetasHuecos,
    rubricas: DATOS.rubricas || null,
    plantilla: DATOS.plantilla || null,
    idUD: (n) => `ud${pad2(n)}`,
    expo: (id) => expos[id] || null,
  };

  // =============================================================== PROGRESO
  const DIA = 86400000;
  const INTERVALOS = [0, 1, 3, 7, 16];
  const Progreso = {
    srs() { return Almacen.leer('srs', {}); },
    nivel(expoId, secId) { const s = this.srs(); return (s[expoId] && s[expoId][secId] && s[expoId][secId].n) || 0; },
    calificar(expoId, secId, nota) {
      const s = this.srs();
      s[expoId] = s[expoId] || {};
      const prev = s[expoId][secId] || { n: 0, veces: 0 };
      let n = prev.n;
      if (nota === 'otra') n = 0;
      else if (nota === 'dificil') n = Math.max(1, Math.min(n, 2));
      else if (nota === 'bien') n = Math.min(4, n + 1);
      else if (nota === 'facil') n = Math.min(4, n + 2);
      const ahora = Date.now();
      const prox = nota === 'otra' ? ahora + 10 * 60000 : ahora + INTERVALOS[n] * DIA;
      s[expoId][secId] = { n, veces: (prev.veces || 0) + 1, prox, ult: ahora };
      const guardado = Almacen.escribir('srs', s);
      return { ...s[expoId][secId], guardado };
    },
    dominio(expo) {
      if (!expo) return 0;
      const s = this.srs()[expo.id] || {};
      const total = expo.secciones.length * 4;
      return total ? expo.secciones.reduce((a, sec) => a + ((s[sec.id] && s[sec.id].n) || 0), 0) / total : 0;
    },
    pendientes() {
      const s = this.srs();
      const ahora = Date.now();
      const out = [];
      Object.entries(s).forEach(([eid, secs]) => Object.entries(secs).forEach(([sid, v]) => { if (v.prox && v.prox <= ahora) out.push({ expo: eid, seccion: sid, ...v }); }));
      return out.sort((a, b) => a.prox - b.prox);
    },
    ensayos() { return Almacen.leer('ensayos', []); },
    guardarEnsayo(e) { const l = this.ensayos(); l.unshift(e); return Almacen.escribir('ensayos', l.slice(0, 200)); },
    autoevaluaciones() { return Almacen.leer('rubricas', []); },
    guardarAutoevaluacion(r) { const l = this.autoevaluaciones(); l.unshift(r); return Almacen.escribir('rubricas', l.slice(0, 200)); },
    tarjetas() { return Almacen.leer('tarjetas', {}); },
    marcarTarjeta(clave, bien) {
      const t = this.tarjetas();
      const v = t[clave] || { ok: 0, ko: 0 };
      if (bien) v.ok++; else v.ko++;
      v.ult = Date.now();
      t[clave] = v;
      Almacen.escribir('tarjetas', t);
    },
    sorteos() { return Almacen.leer('sorteos', []); },
    guardarSorteo(s) { const l = this.sorteos(); l.unshift(s); Almacen.escribir('sorteos', l.slice(0, 100)); },
    escuchado(expoId, segundos) {
      const e = Almacen.leer('escuchado', {});
      e[expoId] = Math.max(e[expoId] || 0, segundos);
      Almacen.escribir('escuchado', e);
    },
  };

  // =============================================================== AJUSTES
  const AJ_DEF = { tema: 'sistema', tamTexto: 1.12, voz: '', velocidad: 1, fuente: 'auto', marcaPropio: true, notasPizarra: false };
  Opo.Ajustes = {
    leer() { return { ...AJ_DEF, ...Almacen.leer('ajustes', {}) }; },
    poner(k, v) { const a = this.leer(); a[k] = v; Almacen.escribir('ajustes', a); this.aplicar(); return a; },
    aplicar() {
      const a = this.leer();
      const r = document.documentElement;
      if (a.tema === 'claro') r.setAttribute('data-theme', 'light');
      else if (a.tema === 'oscuro') r.setAttribute('data-theme', 'dark');
      else r.removeAttribute('data-theme');
      r.style.setProperty('--texto-discurso', `${a.tamTexto}rem`);
    },
  };

  // =============================================================== REPRODUCTOR
  function buscarFrase(lista, t) {
    let lo = 0;
    let hi = lista.length - 1;
    let res = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if ((lista[mid].t0 ?? 0) <= t + 0.05) { res = mid; lo = mid + 1; } else hi = mid - 1;
    }

  }

  function trocearParaVoz(texto, max) {
    const palabras = texto.split(/\s+/).filter(Boolean);
    if (palabras.length <= max) return [texto];
    const out = [];
    let actual = [];
    palabras.forEach((w, k) => {
      actual.push(w);
      const quedan = palabras.length - k - 1;
      const corteNatural = /[,;:]$/.test(w) && actual.length >= max * 0.5;
      if ((corteNatural || actual.length >= max) && quedan > 3) { out.push(actual.join(' ')); actual = []; }

  function vozPreferida() {
    if (!('speechSynthesis' in window)) return null;

    if (exacta) return exacta;
    const puntuar = (v) => (/es-ES/i.test(v.lang) ? 4 : 0) + (/natural|online|neural/i.test(v.name) ? 3 : 0) + (/google|elvira|alvaro|álvaro|lucia|lucía|mónica|monica|paulina|helena|laura/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0);

  }

  class Reproductor {
    constructor() {

      this.modo = 'voz';
      this.frase = 0;
      this.reproduciendo = false;
      this.velocidad = Opo.Ajustes.leer().velocidad || 1;
      this.subs = new Set();
      this.audio = null;
      this.token = 0;
      this.errorAudio = '';

      this.soloPropias = false;
    }
    siguientePermitida(i) {

      if (!ex || !this.soloPropias) return i;

    estado() {
      const ex = this.expo;
      const total = ex ? (this.modo === 'mp3' ? ex.audio.duracion : ex.duracionEst / this.velocidad) : 0;
      const fr = ex ? ex.frases[this.frase] : null;

    }

      const pref = Opo.Ajustes.leer().fuente;
      return !!(expo && expo.audio && pref !== 'voz' && !this.fallidos?.has(expo.id));
    }

      if (this.expo && expo && this.expo.id === expo.id) return;
      this.detener();
      this.soloPropias = false;
      this.expo = expo;
      this.frase = 0;
      this.errorAudio = '';
      this.modo = this.usarMp3(expo) ? 'mp3' : 'voz';

    }
    prepararAudio() {
      if (!this.audio) {

        this.audio.addEventListener('timeupdate', () => this.alTiempo());
        this.audio.addEventListener('ended', () => { this.reproduciendo = false; this.emitir(); });
        this.audio.addEventListener('pause', () => { if (this.reproduciendo && !this.audio.ended && !this._cambiando) { this.reproduciendo = false; this.emitir(); } });
        this.audio.addEventListener('play', () => { if (!this.reproduciendo) { this.reproduciendo = true; this.emitir(); } });
        this.audio.addEventListener('error', () => this.alError());
      }
      const ex = this.expo;
      this.audio.src = this.blobUrls[ex.id] || ex.audio.src;
      this.audio.playbackRate = this.velocidad;
    }
    async alError() {
      const ex = this.expo;
      if (!ex || this.modo !== 'mp3') return;
      this._intentoBlob = this._intentoBlob || new Set();
      if (!this.blobUrls[ex.id] && !this._intentoBlob.has(ex.id)) {
        // algunas plataformas bloquean <audio src> pero permiten fetch del mismo fichero
        this._intentoBlob.add(ex.id);
        try {
          const r = await fetch(ex.audio.src);
          if (!r.ok) throw new Error(r.status);
          const b = await r.blob();
          this.blobUrls[ex.id] = URL.createObjectURL(b);
          this._intentoBlob.delete(ex.id);
          if (this.expo !== ex || this.modo !== 'mp3') return;
          const seguir = this.reproduciendo;
          this.audio.src = this.blobUrls[ex.id];
          this.irAFrase(this.frase, { reproducir: seguir });
          return;
        } catch (e) { this._intentoBlob.delete(ex.id); }
        if (this.expo !== ex) return;
      }
      this.fallidos = this.fallidos || new Set();
      this.fallidos.add(ex.id);
      this.errorAudio = 'No se pudo cargar el audio grabado; se usa la voz del navegador.';

      this.reproduciendo = false;
      this.modo = 'voz';

      const ex = this.expo;
      const aplicar = () => {
        const s = a.seekable;
        let ok = false;
        for (let k = 0; k < s.length; k++) if (t >= s.start(k) - 0.05 && t <= s.end(k) + 0.05) ok = true;

      const ex = this.expo;
      if (this._descargando) { this._tPendiente = t; return; }
      this._descargando = true;
      this._tPendiente = t;
      this.errorAudio = 'Preparando el audio para poder saltar…';
      this.emitir();
      try {
        const r = await fetch(ex.audio.src);
        if (!r.ok) throw new Error(String(r.status));
        this.blobUrls[ex.id] = URL.createObjectURL(await r.blob());
      } catch (e) {
        this._descargando = false;
        this.errorAudio = '';
        try { this.audio.currentTime = this._tPendiente; } catch (err) { /* nada */ }
        this.emitir();
        return;
      }
      this._descargando = false;
      this.errorAudio = '';
      if (this.expo !== ex) return;
      const seguir = this.reproduciendo;
      this.audio.src = this.blobUrls[ex.id];
      this.audio.playbackRate = this.velocidad;
      this.audio.addEventListener('loadedmetadata', () => {
        try { this.audio.currentTime = this._tPendiente; } catch (e) { /* nada */ }
        if (seguir) { this.reproduciendo = true; const p = this.audio.play(); if (p && p.catch) p.catch(() => {}); }
        this.emitir();
      }, { once: true });
    }
    alTiempo() {
      if (this.modo !== 'mp3' || !this.expo) return;
      const t = this.audio.currentTime;
      let i = buscarFrase(this.expo.frases, t);
      if (this.soloPropias && this.reproduciendo && !this.expo.frases[i].propia) {
        const j = this.siguientePermitida(i);
        if (j >= this.expo.frases.length) { this.pausa(); return; }
        this.fijarTiempo(this.expo.frases[j].t0 + 0.01);
        i = j;
      }
      if (i !== this.frase || this.reproduciendo) {
        const cambio = i !== this.frase;
        this.frase = i;
        if (cambio) Opo.Progreso.escuchado(this.expo.id, t);
        this.emitir();
      }
    }
    play() {
      if (!this.expo) return;
      if (this.modo === 'mp3') {
        this.audio.playbackRate = this.velocidad;
        const p = this.audio.play();
        this.reproduciendo = true;
        if (p && p.catch) p.catch((e) => { if (e && e.name === 'NotAllowedError') { this.reproduciendo = false; this.emitir(); } });
      } else {
        if (!('speechSynthesis' in window)) { Opo.aviso('Este navegador no tiene voz sintética.'); return; }
        this.reproduciendo = true;
        this.hablar(this.frase);
      }
      this.metadatos();
      this.emitir();
    }
    pausa() {
      this.reproduciendo = false;
      if (this.modo === 'mp3' && this.audio) this.audio.pause();
      else { this.token++; try { window.speechSynthesis.cancel(); } catch (e) { /* nada */ } }
      this.emitir();
    }
    alternar() { if (this.reproduciendo) this.pausa(); else this.play(); }
    detener() {
      this.token++;
      this.reproduciendo = false;
      if (this.audio) { this._cambiando = true; this.audio.pause(); this._cambiando = false; }
      try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) { /* nada */ }
    }
    hablar(i) {
      const ex = this.expo;
      i = this.siguientePermitida(i);
      if (!ex || i >= ex.frases.length) { this.reproduciendo = false; this.emitir(); return; }
      const tok = ++this.token;
      this.frase = i;
      this.emitir();
      const fr = ex.frases[i];
      const v = vozPreferida();
      // Trozos de unas 22 palabras como máximo: algunas voces en red de Chrome se cortan a los ~15 s.
      const trozos = trocearParaVoz(Opo.paraVoz(fr.texto), 22);
      const decir = (k) => {
        if (tok !== this.token || !this.reproduciendo) return;
        if (k >= trozos.length) {
          const sig = ex.frases[i + 1];
          const pausa = !sig ? 0 : sig.seccion !== fr.seccion ? 900 : sig.bloque !== fr.bloque ? 450 : 120;
          setTimeout(() => { if (tok === this.token && this.reproduciendo) this.hablar(i + 1); }, pausa / this.velocidad);
          return;
        }
        const u = new SpeechSynthesisUtterance(trozos[k]);
        if (v) u.voice = v;
        u.lang = (v && v.lang) || 'es-ES';
        u.rate = this.velocidad;
        u.onend = () => decir(k + 1);
        u.onerror = (e) => { if (tok === this.token && e.error !== 'interrupted' && e.error !== 'canceled') { this.reproduciendo = false; this.emitir(); } };
        window.speechSynthesis.speak(u);
      };
      try { window.speechSynthesis.cancel(); } catch (e) { /* nada */ }
      decir(0);
    }
    irAFrase(i, { reproducir = null } = {}) {
      const ex = this.expo;
      if (!ex) return;
      i = Math.max(0, Math.min(ex.frases.length - 1, i));
      if (this.soloPropias) { const j = this.siguientePermitida(i); if (j < ex.frases.length) i = j; }
      const seguir = reproducir == null ? this.reproduciendo : reproducir;
      if (!seguir && this.reproduciendo) this.pausa();
      this.frase = i;
      if (this.modo === 'mp3') {
        this.fijarTiempo((ex.frases[i].t0 || 0) + 0.01);
        if (seguir) this.play(); else this.emitir();
      } else if (seguir) { this.reproduciendo = true; this.hablar(i); } else { this.emitir(); }
    }
    saltarSeg(d) {
      if (this.modo === 'mp3' && this.audio) { this.fijarTiempo(Math.max(0, Math.min(this.audio.duration || 1e9, this.audio.currentTime + d))); this.alTiempo(); return; }
      const ex = this.expo; if (!ex) return;
      const objetivo = (ex.frases[this.frase].est0 / this.velocidad) + d;
      let i = this.frase;
      while (d > 0 && i < ex.frases.length - 1 && ex.frases[i + 1].est0 / this.velocidad <= objetivo) i++;
      while (d < 0 && i > 0 && ex.frases[i].est0 / this.velocidad > objetivo) i--;
      if (d > 0 && i === this.frase && i < ex.frases.length - 1) i++;
      this.irAFrase(i);
    }
    irATiempo(t) {
      const ex = this.expo; if (!ex) return;
      if (this.modo === 'mp3') { this.fijarTiempo(t); this.alTiempo(); return; }
      let i = 0;
      while (i < ex.frases.length - 1 && ex.frases[i + 1].est0 / this.velocidad <= t) i++;
      this.irAFrase(i);
    }
    seccionRelativa(d) {
      const ex = this.expo; if (!ex) return;
      const actual = ex.frases[this.frase].seccion;
      const objetivo = Math.max(0, Math.min(ex.secciones.length - 1, actual + d));
      const sec = ex.secciones[objetivo];
      this.irAFrase(sec.bloques[0].primeraFrase);
    }
    irASeccion(si) { const sec = this.expo && this.expo.secciones[si]; if (sec) this.irAFrase(sec.bloques[0].primeraFrase); }
    ponerVelocidad(v) {
      this.velocidad = v;
      Opo.Ajustes.poner('velocidad', v);
      if (this.modo === 'mp3' && this.audio) this.audio.playbackRate = v;
      else if (this.reproduciendo) this.hablar(this.frase);
      this.emitir();
    }
    cambiarFuente() {
      const ex = this.expo;
      this.detener();
      this.modo = this.usarMp3(ex) ? 'mp3' : 'voz';
      if (this.modo === 'mp3') this.prepararAudio();
      this.irAFrase(this.frase, { reproducir: false });
    }
    metadatos() {
      if (!('mediaSession' in navigator) || !this.expo) return;
      try {
        navigator.mediaSession.metadata = new window.MediaMetadata({ title: this.expo.titulo, artist: 'Oposiciones · segunda prueba', album: this.expo.tipo === 'pd' ? 'Programación didáctica' : 'Unidades didácticas' });
        navigator.mediaSession.setActionHandler('play', () => this.play());
        navigator.mediaSession.setActionHandler('pause', () => this.pausa());
        navigator.mediaSession.setActionHandler('previoustrack', () => this.seccionRelativa(-1));
        navigator.mediaSession.setActionHandler('nexttrack', () => this.seccionRelativa(1));
      } catch (e) { /* opcional */ }
    }
  }
  Opo.reproductor = new Reproductor();
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => {}; } catch (e) { /* nada */ }
  }
  Opo.vozPreferida = vozPreferida;
})();

<script>
/* Pizarra: se dibuja entera (con lo no escrito invisible, para que el reparto del espacio no salte)
   y se van "escribiendo" los elementos según avanza el discurso.
   En pantallas estrechas se muestra como lista legible (mismas zonas, de arriba abajo). */
(function () {
  'use strict';
  const Opo = window.Opo;
  const { esc, htmlPartes } = Opo;

  const ANCHO = 1280;
  const ALTO = 720;
  const ANCHO_MIN_PIZARRA = 760;

  function htmlPizarra(expo) {
    const cab = [];
    const ind = [];
    const norm = [];
    const cajas = new Map();
    expo.pizarra.forEach((p) => {
      const ref = p.zona === 'indice' && p.ref != null ? ` data-ref="${p.ref}"` : '';
      const span = `<span class="pz-it" data-pz="${esc(p.id)}" data-frase="${p.frase}"${ref}>${htmlPartes(p.partes)}</span>`;
      if (p.zona === 'cabecera') cab.push(span);
      else if (p.zona === 'indice') ind.push(span);
      else if (p.zona === 'normativa') norm.push(span);
      else {
        const c = p.caja || 'Ideas clave';
        if (!cajas.has(c)) cajas.set(c, { frase: p.frase, items: [] });
        cajas.get(c).items.push(span);
      }
    });
    const htmlCajas = Array.from(cajas.entries()).map(([titulo, c]) =>
      `<section class="pz-caja"><h4 class="pz-it" data-pz="caja-${esc(titulo)}" data-frase="${c.frase}">${esc(titulo)}</h4>${c.items.join('')}</section>`).join('');
    return `<div class="pizarra" role="img" aria-label="Pizarra de la exposición">
      <div class="pz-cabecera">${cab.join('')}</div>
      <div class="pz-cuerpo">
        <div class="pz-col pz-indice">${ind.join('')}</div>
        <div class="pz-col pz-centro">${htmlCajas}</div>
        <div class="pz-col pz-normativa">${norm.join('')}</div>
      </div>
      <div class="pz-vacia" hidden>La pizarra está en blanco</div>
    </div>`;
  }

  function ajustarLetra(piz) {
    // reduce el tamaño de letra hasta que todo cabe (con todos los elementos ocupando su sitio)
    let tam = 21;
    const cols = Array.from(piz.querySelectorAll('.pz-col'));
    const cabe = () => cols.every((c) => c.scrollHeight <= c.clientHeight + 1 && c.scrollWidth <= c.clientWidth + 2);
    piz.style.setProperty('--pz-tam', tam + 'px');
    let guard = 0;
    while (!cabe() && tam > 11 && guard++ < 20) { tam -= 1; piz.style.setProperty('--pz-tam', tam + 'px'); }
  }

  class VistaPizarra {
    /** modo: 'auto' (lista si el hueco es estrecho), 'pizarra' o 'lista'. */
    constructor(marco, expo, { modo = 'auto' } = {}) {
      this.marco = marco;
      this.expo = expo;
      this.modo = modo;
      this.vistos = new Set();
      this.todo = false;
      this.seccionActual = -1;
      marco.classList.add('pz-marco');
      marco.innerHTML = `<div class="pz-escala">${htmlPizarra(expo)}</div>`;
      this.escala = marco.firstElementChild;
      this.piz = this.escala.firstElementChild;
      this.items = Array.from(this.piz.querySelectorAll('.pz-it'));
      this.cajas = Array.from(this.piz.querySelectorAll('.pz-caja'));
      this.vacia = this.piz.querySelector('.pz-vacia');
      this.hasta = -1;
      this.aplicarModo();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!this.lista) ajustarLetra(this.piz); this.reescalar(); });
      if ('ResizeObserver' in window) { this.ro = new ResizeObserver(() => { this.aplicarModo(); this.reescalar(); }); this.ro.observe(marco); } else { this.alRedim = () => { this.aplicarModo(); this.reescalar(); }; window.addEventListener('resize', this.alRedim); }
      this.mostrarHasta(-1, -1, false);
    }
    get lista() { return this.marco.classList.contains('pz-lista'); }
    aplicarModo() {
      const ancho = this.marco.clientWidth || window.innerWidth;
      const lista = this.modo === 'lista' || (this.modo === 'auto' && ancho < ANCHO_MIN_PIZARRA && !this.marco.closest('.pz-pantalla'));
      if (lista === this.lista && this._modoAplicado) return;
      this._modoAplicado = true;
      this.marco.classList.toggle('pz-lista', lista);
      if (lista) { this.escala.style.transform = 'none'; this.escala.style.left = ''; this.escala.style.top = ''; this.piz.style.removeProperty('--pz-tam'); } else {
        this.items.forEach((it) => { it.hidden = false; });
        this.cajas.forEach((c) => { c.hidden = false; });
        ajustarLetra(this.piz);
      }
      this.mostrarHasta(this.hasta, this.seccionActual, false);
    }
    ponerModo(m) { this.modo = m; this._modoAplicado = false; this.aplicarModo(); this.reescalar(); }
    reescalar() {
      if (this.lista) return;
      const w = this.marco.clientWidth - 16;
      const h = this.marco.clientHeight - 16;
      if (w <= 0) return;
      let s = w / ANCHO;
      if (h > 0 && this.marco.closest('.pz-pantalla')) s = Math.min(s, h / ALTO);
      this.escala.style.transform = `scale(${s})`;
      const usadoW = ANCHO * s;
      const usadoH = ALTO * s;
      this.escala.style.left = `${8 + Math.max(0, (w - usadoW) / 2)}px`;
      this.escala.style.top = `${8 + Math.max(0, (h - usadoH) / 2)}px`;
    }
    /** Muestra lo escrito hasta la frase global "frase"; seccionActual marca el índice. */
    mostrarHasta(frase, seccionActual, animar = true) {
      this.hasta = frase;
      this.seccionActual = seccionActual;
      const lista = this.lista;
      let visibles = 0;
      let ultimo = null;
      this.items.forEach((it) => {
        const f = Number(it.dataset.frase);
        const ver = this.todo || f <= frase;
        // En la pizarra lo no escrito ocupa su sitio (invisible); en la lista simplemente no aparece.
        it.style.visibility = ver || lista ? 'visible' : 'hidden';
        it.hidden = lista && !ver;
        const id = it.dataset.pz;
        if (ver) {
          visibles++;
          if (!this.vistos.has(id)) {
            this.vistos.add(id);
            if (animar && !this.todo) { it.classList.remove('nuevo'); void it.offsetWidth; it.classList.add('nuevo'); ultimo = it; }
          }
        } else if (this.vistos.has(id)) { this.vistos.delete(id); it.classList.remove('nuevo'); }
        if (it.dataset.ref !== undefined) it.classList.toggle('actual', Number(it.dataset.ref) === seccionActual);
      });
      this.cajas.forEach((c) => {
        const h = c.querySelector('h4');
        const escrita = !!h && (this.todo || Number(h.dataset.frase) <= frase);
        c.classList.toggle('sin-escribir', !escrita);
        c.hidden = lista && !escrita;
      });
      this.vacia.hidden = visibles > 0;
      if (lista && ultimo && this.marco.scrollHeight > this.marco.clientHeight) {
        const r = ultimo.getBoundingClientRect();
        const rm = this.marco.getBoundingClientRect();
        if (r.bottom > rm.bottom || r.top < rm.top) this.marco.scrollTop += r.top - rm.top - rm.height / 2;
      }
    }
    ponerTodo(v) { this.todo = v; this.mostrarHasta(this.hasta, this.seccionActual, false); }
    destruir() { if (this.ro) this.ro.disconnect(); if (this.alRedim) window.removeEventListener('resize', this.alRedim); }
  }

  Opo.VistaPizarra = VistaPizarra;
})();

</script>
<script>
/* Vistas de una exposición (programación o una UD). */
(function () {
  'use strict';
  const Opo = window.Opo;
  const { esc, $, $$, mmss, coma, htmlPartes, partesPorFrase, textoDe, contarPalabras, aleatorio, hashTexto, ICONOS, Modelo, Progreso, reproductor } = Opo;

  const PESTANAS = [
    ['esquema', 'Esquema'], ['discurso', 'Discurso'], ['escuchar', 'Escuchar'], ['pizarra', 'Pizarra'],
    ['memorizar', 'Memorizar'], ['ensayo', 'Ensayo'], ['guion', 'Guion A5', 'ud'], ['ficha', 'Ficha', 'ud'], ['rubrica', 'Rúbrica'],
  ];

  const normalizar = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\s+/g, ' ').trim();

  function itemRubrica(tipo, nombre) {
    const items = (Modelo.rubricas && Modelo.rubricas[tipo] && Modelo.rubricas[tipo].items) || [];
    const n = normalizar(nombre);
    if (!n) return null;
    return items.find((it) => normalizar(it.titulo) === n)
      || items.find((it) => normalizar(it.titulo).startsWith(n) || n.startsWith(normalizar(it.titulo)))
      || items.find((it) => normalizar(it.titulo).includes(n) || n.includes(normalizar(it.titulo)))
      || items.find((it) => n.split(' ').filter((w) => w.length > 5).some((w) => normalizar(it.titulo).includes(w)));
  }
  function claseNota(m) { return m < 5 ? 'critico' : m < 7 ? 'aviso' : 'bueno'; }
  function chipsRubrica(expo, sec) {
    const vistos = new Set();
    return sec.rubrica.map((r) => {
      const it = itemRubrica(expo.tipo, r);
      if (!it) return `<span class="chip">${esc(r)}</span>`;
      if (vistos.has(it.id)) return '';
      vistos.add(it.id);
      return `<span class="chip ${claseNota(it.media2025)}" title="Peso ${coma(it.peso, 1)} % · media 2025: ${coma(it.media2025, 2)}">${esc(it.titulo.replace(/:.*/, ''))} · ${coma(it.peso, 1)} %<span class="sr"> (nota media 2025 ${coma(it.media2025, 2)})</span></span>`;
    }).join(' ');
  }
  function puntosDominio(expo) {
    const s = Progreso.srs()[expo.id] || {};
    return `<span class="dominio" title="Dominio por secciones" style="min-width:120px">${expo.secciones.map((sec) => `<i class="n${(s[sec.id] && s[sec.id].n) || 0}"></i>`).join('')}</span>`;
  }

  function htmlBloque(bl) {
    return partesPorFrase(bl.partes, bl.cortes).map((tr) => {
      const inner = htmlPartes(tr.trozos);
      if (tr.frase == null) return inner;
      const propia = tr.trozos.some((x) => x.h && x.t.trim());
      return `<span class="frase${propia ? ' con-propio' : ''}" data-f="${bl.primeraFrase + tr.frase}">${inner}</span>`;
    }).join('');
  }
  function htmlNotas(expo, bl) {
    const items = expo.pizarra.filter((p) => p.bloque === expo.bloques.indexOf(bl));
    if (!items.length) return '';
    return `<div class="notas-pizarra" aria-label="Pizarra">${items.map((p) => `<span data-zona="${esc(p.zona)}">${p.caja && p.zona === 'centro' ? `<b>${esc(p.caja)}:</b> ` : ''}${htmlPartes(p.partes)}</span>`).join('')}</div>`;
  }
  function htmlDiscurso(expo, { notas = false } = {}) {
    return expo.secciones.map((sec, si) => `
      <section data-sec="${si}" id="sec-${esc(expo.id)}-${si}">
        <h3>${si + 1}. ${esc(sec.titulo)} <span class="min">${mmss(sec.iniMin * 60)}–${mmss(sec.finMin * 60)}</span></h3>
        ${sec.bloques.map((bl) => `<p>${htmlBloque(bl)}</p>${notas ? htmlNotas(expo, bl) : ''}`).join('')}
      </section>`).join('');
  }

  // Resalta la frase en curso dentro de un contenedor y la mantiene a la vista.
  function seguidorFrases(cont, expo, { desplazar = 'contenedor' } = {}) {
    let ultima = -1;
    const pintar = (e) => {
      if (!e.expo || e.expo.id !== expo.id) return;
      if (e.frase === ultima) return;
      const prev = cont.querySelector('.frase.actual');
      if (prev) prev.classList.remove('actual');
      $$('.frase', cont).forEach((n) => n.classList.toggle('leida', Number(n.dataset.f) < e.frase));
      const act = cont.querySelector(`.frase[data-f="${e.frase}"]`);
      if (act) {
        act.classList.add('actual');
        if (ultima !== -1 || e.reproduciendo) {
          if (desplazar === 'contenedor') {
            const r = act.getBoundingClientRect();
            const rc = cont.getBoundingClientRect();
            if (r.top < rc.top + 40 || r.bottom > rc.bottom - 40) cont.scrollTop += r.top - rc.top - rc.height / 3;
          } else if (desplazar === 'pagina' && e.reproduciendo) {
            const r = act.getBoundingClientRect();
            if (r.top < 90 || r.bottom > window.innerHeight - 110) window.scrollBy({ top: r.top - window.innerHeight / 3, behavior: 'smooth' });
          }
        }
      }
      ultima = e.frase;
    };
    const alClic = (ev) => {
      const f = ev.target.closest('.frase');
      if (!f) return;
      reproductor.cargar(expo);
      reproductor.irAFrase(Number(f.dataset.f), { reproducir: true });
    };
    cont.addEventListener('click', alClic);
    const quitar = reproductor.suscribir(pintar);
    pintar(reproductor.estado());
    return () => { quitar(); cont.removeEventListener('click', alClic); };
  }

  function montarBotonModo(boton, pz) {
    if (!boton) return;
    const rotular = () => { boton.textContent = pz.lista ? 'Ver como pizarra' : 'Ver como lista'; };
    boton.addEventListener('click', () => { pz.ponerModo(pz.lista ? 'pizarra' : 'lista'); rotular(); });
    rotular();
    if ('ResizeObserver' in window) new ResizeObserver(rotular).observe(pz.marco);
  }

  // ---------------------------------------------------------------- controles del reproductor
  function htmlControles(expo, { grande = true } = {}) {
    const vels = [0.75, 0.9, 1, 1.1, 1.25, 1.5];
    return `<div class="reproductor" data-rep>
      <div class="controles">
        <button class="btn redondo" data-acc="sec-ant" title="Sección anterior" aria-label="Sección anterior">${ICONOS.atras}</button>
        <button class="btn redondo" data-acc="menos10" title="Retroceder 10 segundos" aria-label="Retroceder 10 segundos">${ICONOS.menos10}</button>
        <button class="btn ${grande ? 'grande' : 'redondo'} primario" data-acc="play" aria-label="Reproducir">${ICONOS.play}</button>
        <button class="btn redondo" data-acc="mas10" title="Avanzar 10 segundos" aria-label="Avanzar 10 segundos">${ICONOS.mas10}</button>
        <button class="btn redondo" data-acc="sec-sig" title="Sección siguiente" aria-label="Sección siguiente">${ICONOS.adelante}</button>
        <label class="campo" style="margin-left:auto"><span class="sr">Velocidad</span>
          <select data-acc="vel" aria-label="Velocidad">${vels.map((v) => `<option value="${v}">${coma(v, 2).replace(/,?0+$/, '')}×</option>`).join('')}</select>
        </label>
        <label class="campo"><span class="sr">Ir a la sección</span>
          <select data-acc="ir-sec" aria-label="Ir a la sección">${expo.secciones.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.titulo)}</option>`).join('')}</select>
        </label>
      </div>
      <div class="progreso"><span data-t>00:00</span><input type="range" min="0" max="1000" value="0" data-acc="barra" aria-label="Posición"><span data-d>00:00</span></div>
      <div class="fuente-audio" data-fuente></div>
    </div>`;
  }
  function montarControles(raiz, expo) {
    const r = raiz.querySelector('[data-rep]');
    if (!r) return () => {};
    let arrastrando = false;
    r.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-acc]');
      if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
      reproductor.cargar(expo);
      const a = b.dataset.acc;
      if (a === 'play') reproductor.alternar();
      else if (a === 'sec-ant') reproductor.seccionRelativa(-1);
      else if (a === 'sec-sig') reproductor.seccionRelativa(1);
      else if (a === 'menos10') reproductor.saltarSeg(-10);
      else if (a === 'mas10') reproductor.saltarSeg(10);
      else if (a === 'fuente') { Opo.Ajustes.poner('fuente', Opo.Ajustes.leer().fuente === 'voz' ? 'auto' : 'voz'); reproductor.cambiarFuente(); }
    });
    r.querySelector('[data-acc=vel]').addEventListener('change', (ev) => { reproductor.cargar(expo); reproductor.ponerVelocidad(Number(ev.target.value)); });
    r.querySelector('[data-acc=ir-sec]').addEventListener('change', (ev) => { reproductor.cargar(expo); reproductor.irASeccion(Number(ev.target.value)); });
    const barra = r.querySelector('[data-acc=barra]');
    barra.addEventListener('input', () => { arrastrando = true; });
    barra.addEventListener('change', () => {
      reproductor.cargar(expo);
      const e = reproductor.estado();
      reproductor.irATiempo((Number(barra.value) / 1000) * e.duracion);
      arrastrando = false;
    });
    const pintar = (e) => {
      const propio = e.expo && e.expo.id === expo.id;
      const playBtn = r.querySelector('[data-acc=play]');
      playBtn.innerHTML = propio && e.reproduciendo ? ICONOS.pausa : ICONOS.play;
      playBtn.setAttribute('aria-label', propio && e.reproduciendo ? 'Pausa' : 'Reproducir');
      const dur = propio ? e.duracion : (expo.audio ? expo.audio.duracion : expo.duracionEst);
      r.querySelector('[data-t]').textContent = mmss(propio ? e.tiempo : 0);
      r.querySelector('[data-d]').textContent = mmss(dur);
      if (!arrastrando) barra.value = propio && dur ? Math.round((e.tiempo / dur) * 1000) : 0;
      r.querySelector('[data-acc=vel]').value = String(e.velocidad);
      if (propio) r.querySelector('[data-acc=ir-sec]').value = String(e.seccion);
      const modo = propio ? e.modo : (expo.audio && Opo.Ajustes.leer().fuente !== 'voz' ? 'mp3' : 'voz');
      const v = Opo.vozPreferida && Opo.vozPreferida();
      r.querySelector('[data-fuente]').innerHTML = (modo === 'mp3'
        ? 'Audio grabado con voz neuronal'
        : `Voz del navegador${v ? `: ${esc(v.name)}` : ''}${expo.audio ? '' : ' (esta exposición aún no tiene audio grabado)'}`)
        + (expo.audio ? ` · <button class="btn mini" data-acc="fuente">${modo === 'mp3' ? 'Usar la voz del navegador' : 'Usar el audio grabado'}</button>` : '')
        + (propio && e.error ? ` · <span style="color:var(--aviso)">${esc(e.error)}</span>` : '');
    };
    const quitar = reproductor.suscribir(pintar);
    pintar(reproductor.estado());
    return quitar;
  }

  // ================================================================ PESTAÑAS
  const Pest = {};

  Pest.esquema = (expo) => {
    const total = expo.secciones.reduce((a, s) => a + s.minutos, 0) || 30;
    const html = `
      <div class="pila">
        ${expo.tipo === 'ud' ? '<p class="info-caja">Lo <span class="propio">resaltado</span> es lo propio de esta unidad; todo lo demás es idéntico en las 12 unidades didácticas.</p>' : ''}
        <div class="tarjeta pila" style="gap:8px">
          <div class="fila entre"><h3>Reparto del tiempo</h3><span class="tenue num">Texto: ${expo.palabras} palabras ≈ ${coma(expo.minutosTexto)} min a 130 palabras/min</span></div>
          <div class="linea-tiempo" role="list">${expo.secciones.map((s, i) => `<a role="listitem" href="#${expo.id}-discurso" data-ir-sec="${i}" style="flex:${s.minutos}" title="${esc(s.titulo)} · ${coma(s.minutos)} min">${i + 1}</a>`).join('')}</div>
          <div class="marcas-tiempo"><span>00:00</span><span>${mmss((total / 2) * 60)}</span><span>${mmss(total * 60)}</span></div>
        </div>
        ${expo.secciones.map((s, i) => `
          <article class="tarjeta esq-seccion">
            <div class="esq-tiempo"><b>${i + 1}</b>${mmss(s.iniMin * 60)}–${mmss(s.finMin * 60)}<br>${coma(s.minutos)} min</div>
            <div class="pila" style="gap:8px">
              <div class="fila entre"><h3>${esc(s.titulo)}</h3><span class="tenue">${s.palabras} palabras</span></div>
              <div class="fila" style="gap:6px">${chipsRubrica(expo, s)}</div>
              <ul class="esq-lista">${s.esquema.map((e) => `<li>${htmlPartes(e)}</li>`).join('')}</ul>
              <div class="fila"><a class="btn mini" href="#${expo.id}-discurso" data-ir-sec="${i}">Leer</a><button class="btn mini" data-escuchar-sec="${i}">Escuchar</button><a class="btn mini" href="#${expo.id}-memorizar" data-memo-sec="${i}">Memorizar</a></div>
            </div>
          </article>`).join('')}

    return {
      html,
      montar(raiz) {
        raiz.addEventListener('click', (ev) => {
          const a = ev.target.closest('[data-ir-sec]');

          const m = ev.target.closest('[data-memo-sec]');
          if (m) Opo.App.pendiente = { seccion: Number(m.dataset.memoSec) };
          const e = ev.target.closest('[data-escuchar-sec]');
          if (e) { reproductor.cargar(expo); reproductor.irASeccion(Number(e.dataset.escucharSec)); reproductor.play(); Opo.App.ir(`${expo.id}-escuchar`); }
        });
      },
    };
  };

  Pest.discurso = (expo) => {
    const aj = Opo.Ajustes.leer();
    const html = `
      <div class="fila entre">
        <div class="fila">
          ${expo.tipo === 'ud' ? `<label class="interruptor"><input type="checkbox" id="op-marca" ${aj.marcaPropio ? 'checked' : ''}> Resaltar lo propio de la UD</label>` : ''}
          <label class="interruptor"><input type="checkbox" id="op-notas" ${aj.notasPizarra ? 'checked' : ''}> Ver lo que va en la pizarra</label>
        </div>
        <div class="fila"><span class="tenue">Tamaño</span><button class="btn mini" data-tam="-1" aria-label="Letra más pequeña">A−</button><button class="btn mini" data-tam="1" aria-label="Letra más grande">A+</button></div>
